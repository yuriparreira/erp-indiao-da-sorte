    const lista = (App.sessao.campanhas || []).filter((c) => !op.status || op.status.indexOf(c.status) >= 0 || c.id === valor);
    return Comp.campo({ rotulo: op.rotulo || 'Campanha', nome: op.nome || 'campanha', tipo: 'select', valor: valor,
      opcoes: [{ valor: '', rotulo: 'Escolha a campanha' }].concat(lista.map((c) => ({
        valor: c.id, rotulo: c.nome + (c.status !== 'Ativa' ? ' (' + String(c.status).toLowerCase() + ')' : '') }))) });
  },

  /** Arquivo (foto ou PDF) ou link do comprovante. ler() devolve { arquivo } ou { comprovante }. */
  campoComprovante(op) {
    op = op || {};
    const arq = Comp.arquivo({ rotulo: op.rotulo || 'Comprovante', opcional: !op.obrigatorio, aceita: 'image/*,application/pdf',
      dica: 'Foto ou PDF, até 10 MB. Fica na pasta Comprovantes da campanha, no Drive.' });
    const link = Comp.campo({ rotulo: 'Link do comprovante', nome: 'linkComprovante', tipo: 'url', opcional: true, atributos: { placeholder: 'https://' } });
    return {
      el: h('div.form', arq, h('details.ajustes', h('summary', 'Usar um link em vez do arquivo'), h('div', { style: { marginTop: '10px' } }, link))),
      async ler() {
        const a = await Comp.lerArquivo(arq, { limiteMb: 10 });
        if (a) return { arquivo: a };
        const url = link.querySelector('input').value.trim();
        return url ? { comprovante: url } : {};
      }
    };
  },

  /**
   * "Quem pagou" um custo, com a opção de as duas partes terem pago (3.2.7). op: { valor, valorIndiao, dividir (mostra
   * "As duas partes"), total (função que devolve o valor do custo), dica }. ler() devolve { parte }, { dividir, valorIndiao }
   * ou { erro }. permitirDividir(false) esconde "As duas partes" (custo a pagar).
   */
  campoQuemPagou(partes, op) {
    const DUAS = 'duas';
    const ind = TelaCaixa.curto(partes.indiao), pri = TelaCaixa.curto(partes.prime);
    const opcoes = [partes.prime, partes.indiao];
    if (op.dividir) opcoes.push({ valor: DUAS, rotulo: 'As duas partes' });
    const escolha = Comp.campo({ rotulo: 'Quem pagou', nome: 'parte', tipo: 'escolha', largo: true, opcoes: opcoes,
      valor: op.dividir && op.valorIndiao ? DUAS : op.valor || partes.prime, dica: op.dica });
    const quanto = Comp.campo({ rotulo: 'Quanto a ' + ind + ' pagou', nome: 'valorIndiao', tipo: 'moeda', valor: op.valorIndiao });
    const resto = h('.dica');
    quanto.appendChild(resto);
    const input = quanto.querySelector('input');
    const rotulo = escolha.querySelector('.rotulo');
    const dica = escolha.querySelector('.dica');
    const marcado = () => { const r = escolha.querySelector('input:checked'); return r ? r.value : ''; };
    const total = () => lerNumero(op.total ? op.total() : 0) || 0;
    const atualizar = () => {
      const duas = marcado() === DUAS;
      quanto.hidden = !duas;
      input.disabled = !duas;
      if (!duas) return;
      const t = total(), vi = lerNumero(input.value);
      const passou = t > 0 && vi > t - 0.005;
      resto.classList.toggle('neg', passou);
      resto.textContent = !(t > 0) ? 'Informe o valor do custo.'
        : passou ? 'Precisa ser menos que o custo inteiro (' + F.moeda(t) + '). Se uma parte pagou tudo, escolha só ela.'
          : vi > 0 ? 'A ' + pri + ' pagou o resto: ' + F.moeda(t - vi) + '.' : 'A ' + pri + ' pagou o resto.';
    };
    escolha.addEventListener('change', atualizar);
    input.addEventListener('input', atualizar);
    atualizar();
    return {
      escolha: escolha, quanto: quanto, atualizar: atualizar,
      /** Custo a pagar fica com uma parte só: divide-se ao registrar o pagamento. */
      permitirDividir(sim, textos) {
        const duas = escolha.querySelector('input[value="' + DUAS + '"]');
        if (duas) {
          duas.closest('label').hidden = !sim;
          if (!sim && duas.checked) escolha.querySelector('input[value="' + CSS.escape(partes.prime) + '"]').checked = true;
        }
        if (textos && rotulo) rotulo.firstChild.textContent = textos.rotulo;
        if (textos && dica) dica.textContent = textos.dica;
        atualizar();
      },
      ler() {
        const v = marcado();
        if (v !== DUAS) return { parte: v || partes.prime };
        const t = total(), vi = lerNumero(input.value);
        if (!(vi > 0) || vi > t - 0.005) {
          return { erro: 'Informe quanto a ' + ind + ' pagou: mais que zero e menos que o custo inteiro (' + F.moeda(t) + '). Se uma parte pagou tudo, escolha só ela.' };
        }
        return { dividir: true, valorIndiao: input.value };
      }
    };
  },

  /** Texto do custo pago pelas duas partes: "Indião R$ 6.000,00 e Prime R$ 12.000,00". */
  textoDivisao(dv) {
    const partes = App.sessao.partes;
    return TelaCaixa.curto(partes.indiao) + ' ' + F.moeda(dv.indiao) + ' e ' + TelaCaixa.curto(partes.prime) + ' ' + F.moeda(dv.prime);
  },

  erro(el, msg) { trocar(el, Comp.aviso('perigo', msg)); el.scrollIntoView && el.scrollIntoView({ block: 'nearest' }); return null; },

  /** Folha com formulário, área de erro e botões Voltar / salvar. */
  folhaForm(titulo, campos, rotulo, op) {
    op = op || {};
    const form = h('form.form', { onsubmit: (ev) => ev.preventDefault() }, campos);
    const erro = h('div.erro-form');
    const salvar = h('button.btn.primario', { type: 'button' }, rotulo);
    const f = Comp.folha({ titulo: titulo, corpo: [erro, form], larga: op.larga,
      rodape: [h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Voltar'), salvar] });
    return { form: form, erro: erro, salvar: salvar, f: f };
  },

  // ----- escolher o que lançar -----
  escolher(d, op) {
    const ind = TelaCaixa.curto(d.partes.indiao), pri = TelaCaixa.curto(d.partes.prime);
    const itens = [
      { rotulo: 'Custo (saída)', detalhe: 'Prêmio, mídia, logística, taxas e outros gastos', icone: 'caixa', acao: () => TelaCaixa.lancar('Saída', d, op) },
      { rotulo: 'Receita (entrada)', detalhe: 'Venda fora do portal, estorno de um custo ou outro dinheiro que entrou', icone: 'vendas', acao: () => TelaCaixa.lancar('Entrada', d, op) },
      { rotulo: 'Abatimento da dívida', detalhe: 'A ' + ind + ' abate o que deve à ' + pri, icone: 'abater',
        oculto: !(d.divida.valor > 0.004) || !App.pode('caixa.abatimento'), acao: () => TelaCaixa.abatimento(d, op) },
      { rotulo: 'Aporte de uma parte', detalhe: 'Dinheiro que uma parte põe na campanha para pagar os custos', icone: 'upload',
        oculto: !App.pode('caixa.aporte'), acao: () => TelaCaixa.aporte(d, op) },
      { rotulo: 'Repasse da ' + pri + ' à ' + ind, detalhe: 'Avulso. O repasse do resultado sai pela Distribuição.', icone: 'enviar',
        oculto: !App.pode('caixa.repasse'), acao: () => TelaCaixa.repasse(d, op) }
    ].filter((i) => !i.oculto);
    const f = Comp.folha({ titulo: 'O que você quer lançar?', corpo: h('ul.lista.dentro', itens.map((i) => h('li.clicavel', {
      role: 'button', tabindex: '0',
      onclick: () => { f.fechar(); i.acao(); },
      onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); f.fechar(); i.acao(); } }
    }, icone(i.icone), h('.principal', h('.t', i.rotulo), h('.d', i.detalhe)), icone('avancar', 'seta')))) });
  },

  // ----- custo ou receita -----
  lancar(tipo, d, op) {
    const cat = App.sessao.listas.cat;
    const saida = tipo === 'Saída';
    const partes = d.partes;
    const categorias = App.sessao.listas.categorias.filter((c) => !saida || (c !== cat.vendas && c !== cat.naoDistribuido));
    const dicas = {};
    dicas[cat.vendas] = 'As vendas do portal entram sozinhas pelo relatório diário. Lance aqui só uma venda feita fora do portal.';
    dicas[cat.plataforma] = 'A taxa da plataforma entra sozinha a partir das vendas. Lance aqui só um ajuste.';
    dicas[cat.comissoes] = 'As comissões dos links entram sozinhas a partir das vendas por link. Lance aqui só um ajuste.';
    dicas[cat.dinamicas] = 'O prêmio de uma dinâmica entra sozinho quando ele é lançado em Prêmios. Lance aqui só gastos fora disso.';
    dicas[cat.naoDistribuido] = 'Prêmio não distribuído tem lançamento próprio em Prêmios, que devolve também o IR.';
    dicas[cat.premio] = 'Custo real de compra do prêmio principal. Se as duas partes pagaram, escolha As duas partes em Quem pagou e informe quanto a ' +
      TelaCaixa.curto(partes.indiao) + ' pagou.';
    const dica = h('p.suave.pequeno', { style: { margin: 0 } });
    const comprovante = TelaCaixa.campoComprovante();
    const ind = TelaCaixa.curto(partes.indiao);
    const textosPago = { rotulo: 'Quem pagou', dica: 'O que a ' + ind + ' pagou volta para ela no acerto, no fim da apuração; como o custo sai do resultado, cada parte arca com a sua porcentagem dele.' };
    const textosAPagar = { rotulo: 'Quem vai pagar', dica: 'Dá para dividir entre as partes quando o pagamento for registrado.' };
    let valorCampo = null;
    const quem = saida ? TelaCaixa.campoQuemPagou(partes, { dividir: true, total: () => valorCampo ? valorCampo.value : 0, dica: textosPago.dica }) : null;
    const x = TelaCaixa.folhaForm(saida ? 'Novo custo' : 'Nova entrada', [
      h('.grade.duas',
        TelaCaixa.campoCampanha(op.campanha || Comp.campanhaPadrao()),
        Comp.campo({ rotulo: 'Categoria', nome: 'categoria', tipo: 'select', valor: saida ? '' : cat.vendas,
          opcoes: [{ valor: '', rotulo: 'Escolha a categoria' }].concat(categorias) }),
        Comp.campo({ rotulo: 'Descrição', nome: 'descricao', largo: true,
          atributos: { placeholder: saida ? 'Ex.: tráfego pago da semana' : 'Ex.: venda no PIX fora do portal', maxlength: '200' } }),
        Comp.campo({ rotulo: 'Valor', nome: 'valor', tipo: 'moeda' }),
        Comp.campo({ rotulo: 'Data', nome: 'data', tipo: 'data', valor: App.hoje() }),
        Comp.campo({ rotulo: saida ? 'Já foi pago?' : 'Já foi recebido?', nome: 'pago', tipo: 'simnao', valor: true,
          dica: saida ? 'Não: fica como comprometido, entra no projetado e aparece em A pagar.' : '' }),
        saida ? quem.escolha : Comp.campo({ rotulo: 'Quem recebeu', nome: 'parte', tipo: 'escolha', largo: true, valor: partes.prime,
          opcoes: [partes.prime, partes.indiao] }),
        saida ? quem.quanto : null),
      dica,
      comprovante.el
    ], saida ? 'Lançar custo' : 'Lançar entrada', { larga: true });
    const atualizar = () => { dica.textContent = dicas[x.form.elements.categoria.value] || ''; dica.hidden = !dica.textContent; };
    x.form.elements.categoria.addEventListener('change', atualizar);
    atualizar();
    if (quem) {
      valorCampo = x.form.elements.valor;
      valorCampo.addEventListener('input', quem.atualizar);
      // Custo a pagar fica com uma parte só; a divisão entre as partes se faz ao registrar o pagamento.
      const pago = () => { const sim = Comp.lerForm(x.form).pago !== 'Não'; quem.permitirDividir(sim, sim ? textosPago : textosAPagar); };
      x.form.querySelectorAll('input[name="pago"]').forEach((r) => r.addEventListener('change', pago));
      pago();
    }
    x.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(x.form);
      if (!v.campanha) return TelaCaixa.erro(x.erro, 'Escolha a campanha.');
      if (!v.categoria) return TelaCaixa.erro(x.erro, 'Escolha a categoria.');
      if (!v.descricao) return TelaCaixa.erro(x.erro, 'Descreva o lançamento.');
      if (!(lerNumero(v.valor) > 0)) return TelaCaixa.erro(x.erro, 'Informe um valor maior que zero.');
      const pagou = quem ? quem.ler() : { parte: v.parte };
      if (pagou.erro) return TelaCaixa.erro(x.erro, pagou.erro);
      let anexo;
      try { anexo = await comprovante.ler(); } catch (e) { return TelaCaixa.erro(x.erro, e.message); }
      const params = Object.assign({ campanha: v.campanha, tipo: tipo, categoria: v.categoria, descricao: v.descricao, valor: v.valor,
        data: v.data, status: v.pago === 'Não' ? 'Comprometido' : 'Pago' }, pagou, anexo);
      const r = await App.executar('caixa.lancar', params, { botao: x.salvar, erroEm: x.erro, sucesso: saida ? 'Custo lançado.' : 'Entrada lançada.' });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  },

  // ----- abatimento da dívida -----
  abatimento(d, op) {
    const formas = App.sessao.listas.formasAbatimento;
    const ind = TelaCaixa.curto(d.partes.indiao), pri = TelaCaixa.curto(d.partes.prime);
    const dv = d.divida;
    const porCampanha = d.porCampanha || [];
    const devendo = porCampanha.filter((x) => x.saldoIndiao < -0.004);
    const explicacao = {};
    explicacao[formas[0]] = 'A ' + ind + ' transfere dinheiro à ' + pri + '. Anexe o comprovante da transferência.';
    explicacao[formas[1]] = 'A ' + ind + ' pagou um custo de outra campanha que caberia à ' + pri + '. Lance antes o custo naquela campanha, como pago pela ' + ind + '; aqui ele vira abatimento.';
    explicacao[formas[2]] = 'Parte do lucro da ' + ind + ' numa campanha vai para a dívida. O caminho normal é a Distribuição dessa campanha, que já calcula o máximo.';
    const escolhas = h('fieldset.escolhas', h('legend', 'Como a ' + ind + ' vai abater'), formas.map((f, i) => h('label.check',
      h('input', { type: 'radio', name: 'forma', value: f, checked: i === 0 }),
      h('div', h('strong', TelaCaixa.rotuloForma(f)), h('div.suave.pequeno', explicacao[f])))));
    const origem = TelaCaixa.campoCampanha('', { nome: 'campanhaOrigem', rotulo: 'Campanha em que a ' + ind + ' pagou o custo ou teve o lucro' });
    const dicaValor = h('.dica');
    const previa = h('p.forte', { style: { margin: 0 } });
    const irDistribuicao = h('button.btn.pequeno', { type: 'button' }, icone('caixa'), 'Abrir a distribuição dessa campanha');
    const comprovante = TelaCaixa.campoComprovante();
    const valor = Comp.campo({ rotulo: 'Valor', nome: 'valor', tipo: 'moeda' });
    valor.appendChild(dicaValor);
    const x = TelaCaixa.folhaForm('Abatimento da dívida', [
      h('p.suave', { style: { margin: 0 } }, 'A ' + ind + ' deve hoje ' + F.moeda(dv.valor) + ' à ' + pri + '.'),
      escolhas,
      h('.grade.duas',
        Comp.campo({ rotulo: 'Campanha da dívida', nome: 'campanhaDivida', tipo: 'select', valor: dv.campanhaDivida || '',
          opcoes: devendo.map((c) => ({ valor: c.campanha, rotulo: TelaCaixa.nomeCampanha(c.campanha) + ' · deve ' + F.moeda(-c.saldoIndiao) })) }),
        valor,
        Comp.campo({ rotulo: 'Data', nome: 'data', tipo: 'data', valor: App.hoje() }),
        Comp.campo({ rotulo: 'Descrição', nome: 'descricao', opcional: true })),
      origem,
      h('div', irDistribuicao),
      previa,
      comprovante.el
    ], 'Registrar abatimento', { larga: true });
    const linhaDe = (id) => porCampanha.filter((c) => c.campanha === id)[0];
    const atualizar = () => {
      const v = Comp.lerForm(x.form);
      const pagamento = v.forma === formas[0];
      origem.hidden = pagamento;
      irDistribuicao.parentNode.hidden = v.forma !== formas[2] || !v.campanhaOrigem || !App.pode('distribuicao.simular');
      // Opções da campanha de origem: todas menos a da dívida, com o crédito que a Indião tem em cada uma.
      const sel = x.form.elements.campanhaOrigem;
      Array.prototype.forEach.call(sel.options, (o) => {
        if (!o.value) return;
        const l = linhaDe(o.value);
        o.hidden = o.value === v.campanhaDivida;
        o.textContent = TelaCaixa.nomeCampanha(o.value) + (l && l.saldoIndiao > 0.004 ? ' · ' + ind + ' tem ' + F.moeda(l.saldoIndiao, { semCentavos: true }) + ' a receber' : '');
      });
      if (sel.value === v.campanhaDivida) sel.value = '';
      const ld = linhaDe(v.campanhaDivida);
      const devido = ld ? Math.max(0, -ld.saldoIndiao) : 0;
      dicaValor.textContent = 'Até ' + F.moeda(devido) + ', o que a ' + ind + ' deve nessa campanha.';
      const n = lerNumero(v.valor);
      previa.textContent = n > 0 ? 'Dívida total: ' + F.moeda(dv.valor) + ' → ' + F.moeda(Math.max(0, dv.valor - n)) : '';
    };
    irDistribuicao.addEventListener('click', () => { const id = x.form.elements.campanhaOrigem.value; x.f.fechar(); App.ir('distribuicao/' + encodeURIComponent(id)); });
    x.form.addEventListener('input', atualizar);
    x.form.addEventListener('change', atualizar);
    atualizar();
    x.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(x.form);
      const n = lerNumero(v.valor);
      if (!v.campanhaDivida) return TelaCaixa.erro(x.erro, 'Escolha a campanha da dívida.');
      if (!(n > 0)) return TelaCaixa.erro(x.erro, 'Informe um valor maior que zero.');
      if (v.forma !== formas[0] && !v.campanhaOrigem) return TelaCaixa.erro(x.erro, 'Escolha a campanha em que a ' + ind + ' pagou o custo ou teve o lucro.');
      let anexo;
      try { anexo = await comprovante.ler(); } catch (e) { return TelaCaixa.erro(x.erro, e.message); }
      const params = Object.assign(TelaCaixa.semVazios({ forma: v.forma, valor: v.valor, data: v.data, campanhaDivida: v.campanhaDivida,
        campanhaOrigem: v.forma === formas[0] ? '' : v.campanhaOrigem, descricao: v.descricao }), anexo);
      const r = await App.executar('caixa.abatimento', params, { botao: x.salvar, erroEm: x.erro,
        sucesso: (res) => 'Abatimento registrado. Dívida: ' + F.moeda(res.dividaAntes) + ' → ' + F.moeda(res.dividaDepois) + '.' });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  },

  // ----- aporte -----
  aporte(d, op) {
    const partes = d.partes;
    const a = d.aportes;
    const sugestao = h('div');
    const comprovante = TelaCaixa.campoComprovante();
    const x = TelaCaixa.folhaForm('Aporte', [
      h('.grade.duas',
        TelaCaixa.campoCampanha(op.campanha || (a && a.campanha) || Comp.campanhaPadrao()),
        Comp.campo({ rotulo: 'Quem pôs o dinheiro', nome: 'de', tipo: 'select', valor: partes.indiao, opcoes: [partes.indiao, partes.prime],
          dica: 'A outra parte recebe. Normalmente a ' + TelaCaixa.curto(partes.indiao) + ' aporta e a ' + TelaCaixa.curto(partes.prime) + ', que opera a campanha, recebe.' }),
        Comp.campo({ rotulo: 'Valor', nome: 'valor', tipo: 'moeda' }),
        Comp.campo({ rotulo: 'Data', nome: 'data', tipo: 'data', valor: App.hoje() }),
        Comp.campo({ rotulo: 'Descrição', nome: 'descricao', opcional: true, largo: true })),
      sugestao,
      comprovante.el
    ], 'Registrar aporte', { larga: true });
    const atualizar = () => {
      const v = Comp.lerForm(x.form);
      const linha = a && a.campanha === v.campanha ? a.partes.filter((p) => p.parte === v.de)[0] : null;
      if (!linha) { trocar(sugestao, []); return; }
      const falta = Math.max(0, -linha.diferenca);
      if (falta < 1) {
        trocar(sugestao, Comp.aviso('sucesso', 'A ' + TelaCaixa.curto(v.de) + ' está em dia com o combinado (' + F.pct(linha.pctAporte, 0) + ' dos custos já pagos).'));
        return;
      }
      const usar = h('button.btn.pequeno', { type: 'button', onclick: () => { x.form.elements.valor.value = F.campoMoeda(Math.round(falta * 100) / 100); } }, 'Usar ' + F.moeda(falta));
      trocar(sugestao, Comp.aviso('info', 'Para ficar no combinado (' + F.pct(linha.pctAporte, 0) + ' dos custos já pagos), faltam ' + F.moeda(falta) +
        '. É opcional: sem o aporte, a diferença entra no acerto da campanha. ', usar));
    };
    x.form.addEventListener('change', atualizar);
    atualizar();
    x.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(x.form);
      if (!v.campanha) return TelaCaixa.erro(x.erro, 'Escolha a campanha.');
      if (!(lerNumero(v.valor) > 0)) return TelaCaixa.erro(x.erro, 'Informe um valor maior que zero.');
      let anexo;
      try { anexo = await comprovante.ler(); } catch (e) { return TelaCaixa.erro(x.erro, e.message); }
      const r = await App.executar('caixa.aporte', Object.assign(TelaCaixa.semVazios({ campanha: v.campanha, de: v.de, valor: v.valor, data: v.data, descricao: v.descricao }), anexo),
        { botao: x.salvar, erroEm: x.erro, sucesso: 'Aporte registrado.' });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  },

  // ----- repasse avulso -----
  repasse(d, op) {
    const ind = TelaCaixa.curto(d.partes.indiao), pri = TelaCaixa.curto(d.partes.prime);
    const comprovante = TelaCaixa.campoComprovante();
    const x = TelaCaixa.folhaForm('Repasse da ' + pri + ' à ' + ind, [
      Comp.aviso('info', 'O repasse do resultado de uma campanha sai pela Distribuição, que também calcula o Simples. Use este só para um repasse avulso.'),
      h('.grade.duas',
        TelaCaixa.campoCampanha(op.campanha || Comp.campanhaPadrao()),
        Comp.campo({ rotulo: 'Valor', nome: 'valor', tipo: 'moeda' }),
        Comp.campo({ rotulo: 'Data', nome: 'data', tipo: 'data', valor: App.hoje() }),
        Comp.campo({ rotulo: 'Descrição', nome: 'descricao', opcional: true })),
      comprovante.el
    ], 'Registrar repasse', { larga: true });
    x.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(x.form);
      if (!v.campanha) return TelaCaixa.erro(x.erro, 'Escolha a campanha.');
      if (!(lerNumero(v.valor) > 0)) return TelaCaixa.erro(x.erro, 'Informe um valor maior que zero.');
      let anexo;
      try { anexo = await comprovante.ler(); } catch (e) { return TelaCaixa.erro(x.erro, e.message); }
      const r = await App.executar('caixa.repasse', Object.assign(TelaCaixa.semVazios({ campanha: v.campanha, valor: v.valor, data: v.data, descricao: v.descricao }), anexo),
        { botao: x.salvar, erroEm: x.erro, sucesso: 'Repasse registrado.' });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  },

  // ----- pagar um comprometido -----
  pagar(l, op) {
    const partes = App.sessao.partes;
    const entrada = l.tipo === 'Entrada';
    const comprovante = TelaCaixa.campoComprovante();
    // Custo lançado à mão pode ser pago pelas duas partes; comissão e disparo ficam com uma parte só.
    let valorCampo = null;
    const quem = entrada ? null : TelaCaixa.campoQuemPagou(partes, { valor: l.parte, dividir: l.classe === 'manual',
      total: () => valorCampo ? valorCampo.value : l.valor,
      dica: 'O que a ' + TelaCaixa.curto(partes.indiao) + ' pagou volta para ela no acerto, no fim da apuração; como o custo sai do resultado, cada parte arca com a sua porcentagem dele.' });
    const x = TelaCaixa.folhaForm(entrada ? 'Registrar recebimento' : 'Registrar pagamento', [
      h('p', { style: { margin: 0 } }, h('strong', l.descricao), h('span.suave', ' · ' + F.moeda(l.valor) + ' comprometido')),
      h('.grade.duas',
        Comp.campo({ rotulo: entrada ? 'Valor recebido' : 'Valor pago', nome: 'valor', tipo: 'moeda', valor: l.valor,
          dica: entrada ? '' : 'Pode ser menor (pagamento parcial): o resto continua a pagar.' }),
        Comp.campo({ rotulo: 'Data', nome: 'data', tipo: 'data', valor: App.hoje() }),
        entrada ? Comp.campo({ rotulo: 'Quem recebeu', nome: 'parte', tipo: 'escolha', largo: true, valor: l.parte || partes.prime,
          opcoes: [partes.prime, partes.indiao] }) : quem.escolha,
        entrada ? null : quem.quanto),
      comprovante.el
    ], entrada ? 'Registrar recebimento' : 'Registrar pagamento', { larga: !entrada });
    if (quem) {
      valorCampo = x.form.elements.valor;
      valorCampo.addEventListener('input', quem.atualizar);
      quem.atualizar();
    }
    x.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(x.form);
      if (!(lerNumero(v.valor) > 0)) return TelaCaixa.erro(x.erro, 'Informe um valor maior que zero.');
      const pagou = quem ? quem.ler() : { parte: v.parte };
      if (pagou.erro) return TelaCaixa.erro(x.erro, pagou.erro);
      let anexo;
      try { anexo = await comprovante.ler(); } catch (e) { return TelaCaixa.erro(x.erro, e.message); }
      const r = await App.executar('caixa.pagar', Object.assign({ id: l.id, valor: v.valor, data: v.data }, pagou, anexo),
        { botao: x.salvar, erroEm: x.erro, sucesso: entrada ? 'Recebimento registrado.' : 'Pagamento registrado.' });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  },

  // ----- editar -----
  editar(l, op) {
    const listas = App.sessao.listas;
    const partes = App.sessao.partes;
    const transferencia = !!l.para;
    const dv = l.divisao;
    const campos = transferencia ? [
      Comp.campo({ rotulo: 'Descrição', nome: 'descricao', valor: l.descricao, largo: true }),
      Comp.campo({ rotulo: 'Valor', nome: 'valor', tipo: 'moeda', valor: l.valor }),
      Comp.campo({ rotulo: 'Data', nome: 'data', tipo: 'data', valor: l.data }),
      l.tipo === 'Abatimento' ? Comp.campo({ rotulo: 'Forma', nome: 'forma', tipo: 'select', valor: l.forma, opcoes: listas.formasAbatimento }) : null,
      Comp.campo({ rotulo: 'Link do comprovante', nome: 'comprovante', tipo: 'url', valor: l.comprovante, opcional: true, largo: true })
    ] : dv ? [
      // Metade de um custo pago pelas duas partes: quem pagou e quanto cada uma pagou mudam em "Quem pagou".
      Comp.campo({ rotulo: 'Descrição', nome: 'descricao', valor: l.descricao, largo: true }),
      Comp.campo({ rotulo: 'Categoria', nome: 'categoria', tipo: 'select', valor: l.categoria, opcoes: listas.categorias }),
      Comp.campo({ rotulo: 'Data', nome: 'data', tipo: 'data', valor: l.data }),
      Comp.campo({ rotulo: 'Valor pago pela ' + TelaCaixa.curto(l.parte), nome: 'valor', tipo: 'moeda', valor: l.valor,
        dica: 'Muda só a parte da ' + TelaCaixa.curto(l.parte) + ' e, com ela, o custo inteiro.' }),
      Comp.campo({ rotulo: 'Link do comprovante', nome: 'comprovante', tipo: 'url', valor: l.comprovante, opcional: true, largo: true })
    ] : [
      Comp.campo({ rotulo: 'Descrição', nome: 'descricao', valor: l.descricao, largo: true }),
      Comp.campo({ rotulo: 'Tipo', nome: 'tipo', tipo: 'select', valor: l.tipo, opcoes: ['Saída', 'Entrada'] }),
      Comp.campo({ rotulo: 'Categoria', nome: 'categoria', tipo: 'select', valor: l.categoria, opcoes: listas.categorias }),
      Comp.campo({ rotulo: 'Valor', nome: 'valor', tipo: 'moeda', valor: l.valor }),
      Comp.campo({ rotulo: 'Data', nome: 'data', tipo: 'data', valor: l.data }),
      Comp.campo({ rotulo: l.tipo === 'Entrada' ? 'Quem recebeu' : 'Quem pagou', nome: 'parte', tipo: 'select', valor: l.parte, opcoes: [partes.prime, partes.indiao] }),
      Comp.campo({ rotulo: 'Situação', nome: 'status', tipo: 'select', valor: l.status,
        opcoes: [{ valor: 'Pago', rotulo: 'Pago' }, { valor: 'Comprometido', rotulo: 'A pagar (comprometido)' }] }),
      Comp.campo({ rotulo: 'Link do comprovante', nome: 'comprovante', tipo: 'url', valor: l.comprovante, opcional: true, largo: true })
    ];
    const x = TelaCaixa.folhaForm('Editar lançamento', [
      transferencia ? h('p.suave.pequeno', { style: { margin: 0 } }, 'Em transferências entre as partes só dá para mudar descrição, valor, data, forma e comprovante.') : null,
      dv ? h('p.suave.pequeno', { style: { margin: 0 } }, 'Custo pago pelas duas partes (' + TelaCaixa.textoDivisao(dv) + '). Descrição, categoria, data e comprovante mudam nas duas. ' +
        'Para mudar quanto cada parte pagou ou juntar numa parte só, use Quem pagou.') : null,
      h('.grade.duas', campos)
    ], 'Salvar', { larga: true });
    const inicial = Comp.lerForm(x.form);
    x.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(x.form), mudou = {};
      Object.keys(v).forEach((k) => { if (v[k] !== inicial[k]) mudou[k] = v[k]; });
      if (!Object.keys(mudou).length) { x.f.fechar(); return; }
      if (mudou.valor !== undefined && !(lerNumero(mudou.valor) > 0)) return TelaCaixa.erro(x.erro, 'Informe um valor maior que zero.');
      if (mudou.descricao !== undefined && !mudou.descricao) return TelaCaixa.erro(x.erro, 'A descrição não pode ficar vazia.');
      const r = await App.executar('caixa.editar', { id: l.id, campos: mudou }, { botao: x.salvar, erroEm: x.erro, sucesso: 'Lançamento atualizado.' });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  },

  // ----- quem pagou um custo já pago: uma parte ou as duas -----
  quemPagou(l, op) {
    const partes = App.sessao.partes;
    const dv = l.divisao;
    const total = dv ? dv.total : l.valor;
    const quem = TelaCaixa.campoQuemPagou(partes, { valor: l.parte, valorIndiao: dv ? dv.indiao : '', dividir: true, total: () => total,
      dica: 'O que a ' + TelaCaixa.curto(partes.indiao) + ' pagou volta para ela no acerto, no fim da apuração; como o custo sai do resultado, cada parte arca com a sua porcentagem dele.' });
    const x = TelaCaixa.folhaForm('Quem pagou', [
      h('p', { style: { margin: 0 } }, h('strong', l.descricao || l.categoria), h('span.suave', ' · ' + F.moeda(total) + ' · ' + F.data(l.data))),
      h('.grade.duas', quem.escolha, quem.quanto)
    ], 'Salvar', { larga: true });
    x.salvar.addEventListener('click', async () => {
      const pagou = quem.ler();
      if (pagou.erro) return TelaCaixa.erro(x.erro, pagou.erro);
      const r = await App.executar('caixa.quemPagou', Object.assign({ id: l.id }, pagou), { botao: x.salvar, erroEm: x.erro, sucesso: 'Quem pagou atualizado.' });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  },

  /** Prêmio lançado em Prêmios: uma parte só paga o prêmio, então a troca passa para a outra (como no menu do prêmio). */
  async quemPagouPremio(l, op) {
    const partes = App.sessao.partes;
    const nova = l.parte === partes.indiao ? partes.prime : partes.indiao;
    const sim = await Comp.confirmar({
      titulo: 'Mudar quem pagou o prêmio?',
      texto: 'O prêmio (' + String(l.descricao || '').replace(/^Prêmio pago: /, '') + ', ' + F.moeda(l.valor) + ') passa a ser pago pela ' + nova + '.' +
        (nova === partes.indiao ? ' Ele volta para a ' + TelaCaixa.curto(partes.indiao) + ' no acerto, no fim da apuração; como sai do resultado, cada parte arca com a sua porcentagem dele.' : '') +
        ' O IR, se houver, continua com a ' + TelaCaixa.curto(partes.prime) + ', que recolhe o DARF.',
      botao: 'Pago pela ' + TelaCaixa.curto(nova)
    });
    if (!sim) return;
    const r = await App.executar('premios.quemPagou', { id: String(l.origem).split(':')[1], pagoPor: nova }, { sucesso: 'Agora o prêmio está como pago pela ' + nova + '.' });
    if (r) op.aoMudar();
  },

  // ----- anexar comprovante -----
  anexar(l, op) {
    const comprovante = TelaCaixa.campoComprovante({ obrigatorio: true });
    const x = TelaCaixa.folhaForm('Anexar comprovante', [
      h('p', { style: { margin: 0 } }, h('strong', l.descricao), h('span.suave', ' · ' + F.moeda(l.valor) + ' · ' + F.data(l.data))),
      comprovante.el
    ], 'Anexar');
    x.salvar.addEventListener('click', async () => {
      let anexo;
      try { anexo = await comprovante.ler(); } catch (e) { return TelaCaixa.erro(x.erro, e.message); }
      if (!anexo.arquivo && !anexo.comprovante) return TelaCaixa.erro(x.erro, 'Escolha o arquivo ou cole o link do comprovante.');
      const r = await App.executar('caixa.anexarComprovante', Object.assign({ id: l.id }, anexo), { botao: x.salvar, erroEm: x.erro, sucesso: 'Comprovante anexado.' });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  }
};

// ---------------------------------------------------------------------
// Distribuição do resultado
// ---------------------------------------------------------------------

App.telas.distribuicao = {
  area: 'caixa',
  titulo: 'Distribuição',
  pode: () => App.pode('distribuicao.simular'),
  render(ctx) { return TelaDistribuicao.render(ctx); }
};

const TelaDistribuicao = {
  async render(ctx) {
    const id = ctx.partes[0] || ctx.query.campanha || '';
    if (!id) { TelaDistribuicao.escolherCampanha(ctx); return; }
    let info = App.campanha(id);
    if (!info) { await App.atualizarCampanhas(); info = App.campanha(id); }
    if (!info) throw new ErroApi({ erro: 'Campanha não encontrada: ' + id + '.' });
    const [sim, versoes] = await Promise.all([
      App.ler('distribuicao.simular', { campanha: id }),
      App.ler('distribuicao.listar', { campanha: id })
    ]);
    if (!ctx.ativo()) return;
    ctx.topo({ titulo: 'Distribuição', sub: info.nome + ' · ' + String(info.status).toLowerCase(), voltar: 'caixa' });

    const gestor = App.ehGestor();
    const partes = sim.partes;
    const ind = TelaCaixa.curto(partes.indiao), pri = TelaCaixa.curto(partes.prime);
    const pctCadastrado = sim.distribuicao.pctIndiao;
    // Campanha encerrada: só o realizado vale (os cenários de venda não têm mais o que projetar) e os
    // percentuais ficam travados nos cadastrados em Partes.
    const encerrada = sim.campanha.status === 'Encerrada';
    const estado = { cenario: encerrada ? 'Realizado' : sim.cenario, sim: sim };
    const quadro = h('.quadro-dist');
    const comparacao = h('div');
    const erro = h('div');
    const explicacao = h('div');
    const cenarios = h('.filtros.quebra', { role: 'group', 'aria-label': 'Cenário' });
    const reserva = Comp.campo({ rotulo: 'Reserva para a próxima campanha', nome: 'reserva', tipo: 'pct', opcional: true,
      dica: '% do resultado que fica com a ' + pri + ' como caixa.' });
    const dicaAbat = h('.dica');
    const abatimento = Comp.campo({ rotulo: 'Abatimento da dívida nesta campanha', nome: 'abatimento', tipo: 'moeda',
      atributos: { placeholder: '0' } });
    abatimento.classList.add('largo');
    abatimento.appendChild(dicaAbat);
    const botoesAbat = h('.acoes', { style: { gap: '6px' } });
    abatimento.appendChild(botoesAbat);
    const editaPct = gestor && !encerrada;
    // Duas colunas no computador (as dicas cabem numa linha) e o abatimento, com os botões, na largura toda.
    const form = h('form.form', { onsubmit: (ev) => ev.preventDefault() },
      encerrada ? null : h('div', h('.rotulo.suave.pequeno.forte', { style: { marginBottom: '6px' } }, 'Cenário'), cenarios,
        h('.dica', { style: { marginTop: '6px', fontSize: '.8rem', color: 'var(--texto-3)' } },
          'Realizado: só o que já foi pago e recebido, bate com o Caixa. Projetado: as vendas no ritmo dos últimos 3 dias, como o saldo ' +
            'projetado da campanha. Os outros: a venda de cada cenário. As projeções usam os custos planejados.')),
      h('.grade.duas',
        reserva,
        editaPct ? Comp.campo({ rotulo: '% da ' + ind, nome: 'pctIndiao', tipo: 'pct', valor: pctCadastrado,
          dica: 'Cadastrado: ' + F.pct(pctCadastrado) + '. A ' + pri + ' fica com o resto.' }) : null,
        abatimento));
    const cartaoSimulacao = h('.cartao', h('h2', encerrada ? 'Reserva e abatimento' : 'Simulação'), form, erro);

    const params = () => {
      const v = Comp.lerForm(form);
      const p = { campanha: id, cenario: estado.cenario };
      if (v.reserva) p.reservaPct = /%/.test(v.reserva) ? v.reserva : v.reserva + '%';
      if (editaPct && v.pctIndiao) {
        const pct = lerNumero(/%/.test(v.pctIndiao) ? v.pctIndiao : v.pctIndiao + '%');
        if (pct !== null && !isNaN(pct) && Math.abs(pct - pctCadastrado) > 0.00001) p.pctIndiao = /%/.test(v.pctIndiao) ? v.pctIndiao : v.pctIndiao + '%';
      }
      if (v.abatimento) p.abatimento = v.abatimento;
      return p;
    };

    const desenhar = () => {
      const s = estado.sim, dd = s.distribuicao;
      trocar(cenarios, App.sessao.listas.cenarios.map((c) => h('button.filtro', { type: 'button', 'aria-pressed': String(c === estado.cenario),
        onclick: () => { estado.cenario = c; simular(0); } }, c)));
      // Reserva só sai de resultado positivo; abatimento só existe com dívida de outras campanhas.
      reserva.hidden = dd.resultado <= 0.004 && !form.elements.reserva.value;
      abatimento.hidden = dd.dividaAntes <= 0.004 && !form.elements.abatimento.value;
      const maximo = Math.max(0, Math.min(dd.devido, dd.dividaAntes));
      form.elements.abatimento.disabled = maximo <= 0.004 && !form.elements.abatimento.value;
      dicaAbat.textContent = maximo > 0.004
        ? 'De R$ 0 até ' + F.moeda(maximo) + '. Padrão: zero, nada é retido automaticamente.'
        : 'Neste cenário a ' + ind + ' não tem nada a receber, então não há o que abater.';
      trocar(botoesAbat, maximo > 0.004 ? [
        h('button.btn.pequeno', { type: 'button', onclick: () => { form.elements.abatimento.value = ''; simular(0); } }, 'Zero'),
        h('button.btn.pequeno', { type: 'button', onclick: () => { form.elements.abatimento.value = F.campoMoeda(Math.floor(maximo * 100) / 100); simular(0); } }, 'O máximo')
      ] : []);
      // Encerrada sem reserva nem abatimento a decidir (prejuízo, sem dívida de outra campanha): não sobra nada a ajustar.
      cartaoSimulacao.hidden = encerrada && reserva.hidden && abatimento.hidden;
      trocar(quadro, TelaDistribuicao.quadro(s, ind, pri));
      const oQue = TelaDistribuicao.oQueSalvarFaz(s, ind, pri);
      trocar(explicacao, oQue ? h('p.suave.pequeno', { style: { margin: 0 } }, oQue) : []);
      explicacao.hidden = !oQue;
      if (!encerrada) trocar(comparacao, TelaDistribuicao.comparar(s, estado.cenario, (c) => { estado.cenario = c; simular(0); }, ind, pri));
    };

    let versao = 0, espera = null;
    const simular = (atraso) => {
      clearTimeout(espera);
      espera = setTimeout(async () => {
        const minha = ++versao;
        quadro.style.opacity = '.55';
        try {
          const s = await App.chamar('distribuicao.simular', params());
          if (minha !== versao || !ctx.ativo()) return;
          estado.sim = s;
          trocar(erro, []);
          desenhar();
        } catch (e) {
          if (minha === versao) App.mostrarErro(e, erro);
        } finally {
          if (minha === versao) quadro.style.opacity = '';
        }
      }, atraso === undefined ? 450 : atraso);
    };
    form.addEventListener('input', () => simular());

    const acoes = [];
    if (App.pode('distribuicao.salvar')) {
      const salvar = h('button.btn.primario', { type: 'button', onclick: async () => {
        const r = await App.executar('distribuicao.salvar', params(), { botao: salvar, semAvisos: true,
          sucesso: (x) => TelaDistribuicao.nomeVersao(x.distribuicao) + ' salva (' + x.distribuicao.cenario.toLowerCase() + ').' });
        if (r) ctx.recarregar();
      } }, 'Salvar esta versão');
      acoes.push(salvar);
    }
    if (App.pode('distribuicao.relatorio')) {
      acoes.push(h('button.btn', { type: 'button', onclick: () => TelaDistribuicao.relatorio(id, versoes) }, icone('relatorio'), 'Gerar relatório para a ' + pri));
    }

    desenhar();
    ctx.mostrar([
      h('.colunas.principal-lado',
        h('div.pilha',
          cartaoSimulacao,
          h('.cartao', quadro, explicacao, acoes.length ? h('.acoes', acoes) : null)),
        h('div.pilha',
          encerrada ? null : h('.cartao', h('h2', 'Cenários lado a lado'), comparacao),
          TelaDistribuicao.versoes(versoes, { campanha: id, ind: ind, pri: pri, aoMudar: () => ctx.recarregar() })))
    ]);
  },

  escolherCampanha(ctx) {
    ctx.topo({ titulo: 'Distribuição', voltar: 'caixa' });
    const lista = (App.sessao.campanhas || []).slice().sort((a, b) => (a.status === 'Encerrada' ? 0 : 1) - (b.status === 'Encerrada' ? 0 : 1));
    ctx.mostrar([
      h('p.suave', 'Escolha a campanha para dividir o resultado entre as partes.'),
      lista.length ? h('ul.lista', lista.map((c) => h('li.clicavel', { role: 'button', tabindex: '0',
        onclick: () => App.ir('distribuicao/' + encodeURIComponent(c.id)),
        onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); App.ir('distribuicao/' + encodeURIComponent(c.id)); } } },
        h('.principal', h('.t', c.nome), h('.d', c.sorteio ? 'sorteio ' + F.data(c.sorteio) : '')), Comp.chipStatus(c.status), icone('avancar', 'seta'))))
        : h('.cartao', Comp.vazio('Nenhuma campanha', 'Crie uma campanha primeiro.'))
    ]);
  },

  /** Título do quadro: deixa claro se é o resultado final, o realizado até hoje ou uma projeção. */
  tituloQuadro(s) {
    if (s.cenario === 'Projetado') {
      return [h('h2', 'Projeção · no ritmo atual (não é o acerto de hoje)'),
        h('.sub', 'Vendas no ritmo dos últimos 3 dias até o sorteio, com os custos planejados: o saldo projetado da campanha.')];
    }
    if (s.cenario !== 'Realizado') {
      return [h('h2', 'Projeção · cenário ' + s.cenario + ' (não é o acerto de hoje)'), h('.sub', 'A venda do cenário com os custos planejados.')];
    }
    if (s.campanha.status === 'Encerrada') return [h('h2', 'Resultado final'), h('.sub', 'Quanto fica com cada parte, com o que foi pago e recebido.')];
    return [h('h2', 'Realizado até hoje'), h('.sub', 'Só o que já foi pago e recebido; bate com o Caixa.')];
  },

  /** O quadro da distribuição, linha a linha, como no combinado entre as partes. */
  quadro(s, ind, pri) {
    const d = s.distribuicao;
    const linhas = [];
    // A nota ocupa a linha inteira embaixo do rótulo, para o rótulo não espremer em colunas estreitas no celular.
    const linha = (rotulo, valor, op) => {
      op = op || {};
      const cls = op.classe ? '.' + op.classe : '';
      linhas.push(h('dt' + cls, rotulo), h('dd' + cls, h('span.num' + (op.cor ? '.' + op.cor : ''), valor)));
      if (op.nota) linhas.push(h('dd.nota', op.nota));
    };
    linha('Resultado da campanha', F.moeda(d.resultado), { classe: 'total', cor: F.cls(d.resultado) || 'x',
      nota: [F.vazio(d.pctVendido) ? null : F.pct(d.pctVendido) + ' vendido', F.vazio(d.vendas) ? null : 'vendas de ' + F.moeda(d.vendas)].filter(Boolean).join(' · ') || null });
    if (d.reserva > 0.004) {
      linha('(−) Reserva para a próxima campanha', F.moeda(d.reserva), { nota: F.pct(d.reservaPct) + ' do resultado, fica com a ' + pri });
      linha('A dividir', F.moeda(d.dividir), { classe: 'total' });
    }
    linha(ind + ' (' + F.pct(d.pctIndiao) + ')', F.moeda(d.parteIndiao), { cor: F.cls(d.parteIndiao) || 'x' });
    linha(pri + ' (' + F.pct(d.pctPrime) + ')', F.moeda(d.partePrime), { nota: d.partePrime > 0.004 ? 'fica com a ' + pri : null, cor: F.cls(d.partePrime) || 'x' });
    if (Math.abs(d.acerto) > 0.004) {
      linha(d.acerto > 0 ? '(+) Devolução do que a ' + ind + ' bancou' : '(−) O que a ' + ind + ' já recebeu', F.moeda(Math.abs(d.acerto)),
        { nota: d.acerto > 0 ? 'aportes e custos pagos pela ' + ind + ' nesta campanha' : 'repasses já feitos nesta campanha' });
    }
    if (d.devido < -0.004) {
      // No realizado, sem nada pago pela Indião, foi a Prime quem cobriu o prejuízo inteiro: diz de onde vem a dívida.
      const cobriu = s.cenario === 'Realizado' && s.posicao && Math.abs(Number(s.posicao.fluxoIndiao) || 0) < 0.005;
      linha('A ' + ind + ' deve à ' + pri, F.moeda(-d.devido), { classe: 'total', cor: 'neg',
        nota: d.resultado < -0.004 ? 'Houve prejuízo: não há lucro para dividir. ' + (cobriu
          ? 'A ' + pri + ' cobriu os ' + F.moeda(-d.resultado) + ' do prejuízo; a parte da ' + ind + ' (' + F.pct(d.pctIndiao) + ') vira dívida com ela.'
          : 'A parte da ' + ind + ' no prejuízo' + (d.acerto > 0.004 ? ', menos o que ela já bancou,' : '') + ' vira dívida com a ' + pri + '.')
          : 'A ' + ind + ' já recebeu mais do que a parte dela nesta campanha.' });
    } else {
      linha('A ' + ind + ' tem a receber', F.moeda(d.devido), { classe: 'total' });
      if (d.dividaAntes > 0.004 || d.abatimento > 0.004) {
        linha('(−) Abatimento da dívida', F.moeda(d.abatimento), { nota: d.abatimento > 0.004 ? 'decidido nesta campanha' : 'nenhum nesta campanha' });
      }
      // Sem a alíquota do Simples cadastrada, o repasse sai sem o imposto: diz isso ao lado e leva a quem pode resolver.
      const semAliquota = d.baseSimples > 0.004 && (F.vazio(s.aliquotaSimples) || d.simples === null);
      const resolver = App.pode('config.ler')
        ? [' · ', h('a.pequeno', { href: '#config/parametros?editar=simples', onclick: App.cliqueNav('config/parametros?editar=simples') }, 'Resolver')]
        : ' (falta a alíquota em Configurações)';
      linha('Repasse à ' + ind, F.moeda(d.repasse), { classe: 'destaque', nota: semAliquota ? ['sem o Simples descontado', resolver] : null });
      // Simples só sobre o lucro que chega com NF: devolução de aporte não é receita, então sem lucro não há imposto.
      if (d.baseSimples > 0.004 && !semAliquota) {
        linha('(−) Simples', F.moeda(d.simples), { nota: F.pct(s.aliquotaSimples, 2) + ' sobre ' + F.moeda(d.baseSimples) + ', o lucro que chega com NF (a devolução do que a ' + ind + ' bancou não entra)' });
        linha('Líquido da ' + ind, F.moeda(d.liquidoIndiao), { classe: 'total', cor: F.cls(d.liquidoIndiao) || 'x' });
      }
    }
    const blocos = [h('.cabeca', h('.titulo', TelaDistribuicao.tituloQuadro(s))), h('dl.valores.quadro', linhas)];
    if (d.dividaAntes > 0.004 || d.dividaDepois > 0.004) {
      blocos.push(h('.cartao.compacto.divida', { style: { background: 'var(--superficie-2)', boxShadow: 'none' } },
        h('div.suave.pequeno.forte', 'Dívida da ' + ind + ' com a ' + pri + (s.cenario !== 'Realizado' ? ', se o cenário se confirmar' : '')),
        h('div.forte.num', { style: { fontSize: '1.1rem' } }, F.moeda(d.dividaAntes) + ' → ' + F.moeda(d.dividaDepois)),
        h('div.suave.pequeno', 'Antes e depois desta campanha.' + ((s.abatimentoNasCampanhas || []).length ? ' O abatimento vai para: ' + s.abatimentoNasCampanhas.map((a) =>
          TelaCaixa.nomeCampanha(a.campanha) + ' (' + F.moeda(a.valor) + ')').join(', ') + '.' : ''))));
    }
    if ((s.avisos || []).length) blocos.push(Comp.aviso('alerta', h('ul', { style: { margin: 0, paddingLeft: '18px' } }, s.avisos.map((a) => h('li', a)))));
    return blocos;
  },

  /** O que "Salvar esta versão" grava e o que depois entra no Livro caixa, para quem pode salvar. */
  oQueSalvarFaz(s, ind, pri) {
    if (!App.pode('distribuicao.salvar')) return null;
    const d = s.distribuicao;
    if (s.cenario !== 'Realizado') {
      return 'Salvar guarda esta projeção em Versões salvas, para consulta e para o relatório da ' + pri +
        '. Nada entra no Livro caixa: só uma versão do cenário Realizado pode ter o acerto registrado.';
    }
    if (d.devido < -0.004) {
      return 'Salvar guarda esta divisão em Versões salvas, para o relatório da ' + pri + '. Nada entra no Livro caixa: a dívida de ' +
        F.moeda(-d.devido) + ' já aparece no Caixa e é abatida lá, em Registrar abatimento.';
    }
    const lancamentos = [d.repasse > 0.004 ? 'o repasse de ' + F.moeda(d.repasse) + ' da ' + pri + ' à ' + ind : null,
      d.abatimento > 0.004 ? 'o abatimento de ' + F.moeda(d.abatimento) + ' na dívida' : null].filter(Boolean);
    if (!lancamentos.length) return 'Salvar guarda esta divisão em Versões salvas. Não há repasse nem abatimento a lançar no Livro caixa.';
    return 'Salvar guarda esta divisão em Versões salvas; o Livro caixa ainda não muda. Depois, "Registrar o acerto", no menu da versão salva, lança ' +
      lancamentos.join(' e ') + '.';
  },

  /** O acerto de um cenário: quem deve, quem repassa e a conta do abatimento, se houver. Quebra antes do valor (a coluna é estreita ao lado). */
  acertoCenario(c, ind, pri, semAliquota) {
    const m = (v) => F.moeda(v, { semCentavos: true });
    if (c.devido < -0.004) return h('div.num.neg', h('div', 'A ' + ind + ' deve'), h('div.forte', m(-c.devido)));
    if (!(c.devido > 0.004)) return h('span.suave', 'Nada a acertar');
    return h('div', h('div.num.pos', h('div', 'A ' + pri + ' repassa'), h('div.forte', m(c.repasse))),
      c.abatimento > 0.004 ? h('div.suave.pequeno', m(c.devido) + ' a receber − abatimento ' + m(c.abatimento)) : null,
      semAliquota && c.baseSimples > 0.004 ? h('div.suave.pequeno', 'sem o Simples descontado') : null);
  },

  comparar(s, atual, escolher, ind, pri) {
    const semAliquota = F.vazio(s.aliquotaSimples);
    return Comp.tabela([
      { titulo: 'Cenário', valor: (c) => [c.cenario, h('div.suave.pequeno', F.vazio(c.pctVendido) ? '' : F.pct(c.pctVendido) + ' vendido')] },
      { titulo: 'Resultado', dir: true, valor: (c) => h('span.num.' + (F.cls(c.resultado) || 'x'), F.moeda(c.resultado, { semCentavos: true })) },
      { titulo: 'Acerto', dir: true, valor: (c) => TelaDistribuicao.acertoCenario(c, ind, pri, semAliquota) }
    ], s.comparacao || [], { clicavel: (c) => escolher(c.cenario), classeLinha: (c) => c.cenario === atual ? 'destaque' : '' });
  },

  /** Nome da versão para as pessoas: o número dela (DS002 vira "Versão 2"). */
  nomeVersao(x) {
    const n = Number(String(x.id || '').replace(/\D/g, ''));
    return n ? 'Versão ' + n : 'Versão';
  },

  /** A conta da versão por extenso: quem deve, ou o que a Indião tem a receber menos o abatimento, igual ao repasse. */
  contaVersao(x, ind, pri) {
    const devido = (Number(x.parteIndiao) || 0) + (Number(x.acerto) || 0);
    if (devido < -0.004) return 'A ' + ind + ' deve ' + F.moeda(-devido) + ' à ' + pri;
    if (Number(x.abatimento) > 0.004) return F.moeda(devido) + ' a receber − abatimento ' + F.moeda(x.abatimento) + ' = repasse de ' + F.moeda(x.repasse);
    return 'Repasse de ' + F.moeda(x.repasse) + ' à ' + ind;
  },

  versoes(lista, op) {
    const gestor = App.ehGestor();
    const temPaga = lista.some((x) => x.status === 'Pago');
    // O sócio só vê o que virou pagamento: as versões simuladas são rascunho da gestão.
    const visiveis = gestor ? lista : lista.filter((x) => x.status === 'Pago');
    if (!gestor && !visiveis.length) return null;
    const itens = visiveis.map((x) => {
      const menu = gestor ? Comp.menu(TelaDistribuicao.nomeVersao(x), [
        { rotulo: 'Registrar o acerto', icone: 'ok', detalhe: 'Lança o repasse e o abatimento no Livro caixa',
          oculto: x.status === 'Pago' || x.cenario !== 'Realizado' || temPaga || !App.pode('distribuicao.registrarPagamento'),
          acao: () => TelaDistribuicao.pagar(x, op) },
        { rotulo: 'Relatório com esta versão', icone: 'relatorio', oculto: !App.pode('distribuicao.relatorio'),
          acao: () => TelaDistribuicao.relatorio(op.campanha, lista, x.id) },
        { rotulo: 'Estornar o pagamento', icone: 'voltar', perigo: true, oculto: x.status !== 'Pago' || !App.pode('distribuicao.estornar'),
          acao: async () => {
            const r = await App.executar('distribuicao.estornar', { id: x.id }, { sucesso: 'Pagamento estornado.' });
            if (r) op.aoMudar();
          } },
        { rotulo: 'Excluir esta versão', icone: 'lixo', perigo: true, oculto: x.status === 'Pago' || !App.pode('distribuicao.excluir'),
          acao: async () => {
            const r = await App.executar('distribuicao.excluir', { id: x.id }, { sucesso: 'Versão excluída.' });
            if (r) op.aoMudar();
          } }
      ]) : null;
      return h('li',
        h('.principal',
          h('.t', TelaDistribuicao.nomeVersao(x) + ' · ' + (x.cenario === 'Realizado' ? 'Realizado' : 'cenário ' + String(x.cenario).toLowerCase())),
          h('.d', { style: { color: 'var(--texto)' } }, TelaDistribuicao.contaVersao(x, op.ind, op.pri)),
          h('.d', 'Resultado ' + F.moeda(x.resultado) + ' · ' + op.ind + ' ' + F.pct(x.pctIndiao) + ' · ' + op.pri + ' ' + F.pct(x.pctPrime) +
            ' · ' + F.data(x.data) + (x.registradoPor ? ' por ' + x.registradoPor : ''))),
        h('.lado', Comp.chipStatus(x.status), menu));
    });
    return h('section',
      h('.secao-titulo', h('h2', gestor ? 'Versões salvas' : 'Pagamento registrado'),
        gestor && lista.length ? h('span.suave', F.plural(lista.length, 'versão', 'versões')) : null),
      visiveis.length ? h('ul.lista', { style: { marginTop: '12px' } }, itens)
        : h('.cartao', { style: { marginTop: '12px' } }, h('p.suave', { style: { margin: 0 } },
          'Nenhuma versão salva. Salve a divisão acordada para guardá-la e usá-la no relatório da ' + op.pri + '.')));
  },

  pagar(x, op) {
    const comprovante = TelaCaixa.campoComprovante({ rotulo: 'Comprovante do repasse' });
    const repasse = Number(x.repasse) > 0.004, abat = Number(x.abatimento) > 0.004;
    const t = TelaCaixa.folhaForm('Registrar o acerto', [
      h('p', { style: { margin: 0 } }, repasse && abat ? 'Entram no Livro caixa ' : 'Entra no Livro caixa ',
        repasse ? ['o repasse de ', h('strong', F.moeda(x.repasse)), ' da ' + op.pri + ' à ' + op.ind] : null,
        repasse && abat ? ' e ' : null,
        abat ? ['o abatimento de ', h('strong', F.moeda(x.abatimento)), ' na dívida'] : null, '.'),
      Comp.campo({ rotulo: 'Data do pagamento', nome: 'data', tipo: 'data', valor: App.hoje() }),
      comprovante.el
    ], 'Registrar acerto');
    t.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(t.form);
      let anexo;
      try { anexo = await comprovante.ler(); } catch (e) { return TelaCaixa.erro(t.erro, e.message); }
      const r = await App.executar('distribuicao.registrarPagamento', Object.assign({ id: x.id, data: v.data }, anexo), { botao: t.salvar, erroEm: t.erro,
        sucesso: (res) => 'Acerto registrado. Dívida: ' + F.moeda(res.dividaAntes) + ' → ' + F.moeda(res.dividaDepois) + '.' });
      if (r) { t.f.fechar(); op.aoMudar(); }
    });
  },

  /** PDF da campanha para a Prime, com acesso de leitura só para o e-mail informado. */
  relatorio(campanha, versoes, versao) {
    const pri = TelaCaixa.curto(App.sessao.partes.prime);
    let lembrado = '';
    try { lembrado = localStorage.getItem('rifas.emailRelatorio') || ''; } catch (e) { lembrado = ''; }
    const opcoes = [{ valor: '', rotulo: 'Só a distribuição paga (sem simulações)' }].concat((versoes || []).map((x) => ({
      valor: x.id, rotulo: TelaDistribuicao.nomeVersao(x) + ' · ' + x.cenario + ' · ' + F.data(x.data) + (x.status === 'Pago' ? ' (paga)' : '') })));
    const t = TelaCaixa.folhaForm('Relatório para a ' + pri, [
      h('p.suave', { style: { margin: 0 } }, 'Gera o PDF da campanha (vendas, custos por categoria, distribuição, dívida e dinâmicas) na pasta Relatórios do Drive. Dados de ganhadores não entram.'),
      Comp.campo({ rotulo: 'Compartilhar com o e-mail', nome: 'email', tipo: 'email', valor: lembrado, opcional: true,
        dica: 'Só essa pessoa recebe acesso de leitura. O arquivo não fica aberto para quem tiver o link.' }),
      (versoes || []).length ? Comp.campo({ rotulo: 'Distribuição no relatório', nome: 'distribuicao', tipo: 'select', valor: versao || '', opcoes: opcoes }) : null
    ], 'Gerar PDF');
    t.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(t.form);
      if (v.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return TelaCaixa.erro(t.erro, 'Confira o e-mail.');
      const r = await App.executar('distribuicao.relatorio', TelaCaixa.semVazios({ campanha: campanha, email: v.email, distribuicao: v.distribuicao }),
        { botao: t.salvar, erroEm: t.erro });
      if (!r) return;
      try { if (v.email) localStorage.setItem('rifas.emailRelatorio', v.email); } catch (e) { /* sem memória neste navegador */ }
      t.f.renomear('PDF pronto');
      t.f.mostrar([
        Comp.aviso('sucesso', [h('strong', r.nome), h('div', r.compartilhadoCom ? 'Compartilhado só com ' + r.compartilhadoCom + '.' : 'Salvo na pasta Relatórios da campanha.')]),
        h('a.btn.primario', { href: r.url, target: '_blank', rel: 'noopener' }, icone('externo'), 'Abrir o PDF')
      ], [h('button.btn', { type: 'button', onclick: () => t.f.fechar() }, 'Fechar')]);
    });
  }
};
</script>
  <script>
/* =====================================================================
   Operação: Vendas (resumo do portal, totais por link, vendas por
   dia e links de venda), Prêmios (lançar prêmios pagos e o não
   distribuído) e Documentos (autorização LOTEP, regulamento e outros).
   Para a operação são áreas próprias; para a gestão são abas do cockpit
   e as telas que as pendências de Hoje abrem.
   ===================================================================== */

/** A operação tem as áreas Vendas, Prêmios e Documentos; os outros perfis chegam aqui pela campanha. */
function areaDaOperacao(nome) { return () => (App.perfil() === 'Operação' ? nome : 'campanhas'); }

/** Topo das telas da operação: com campanha escolhida no seletor e, fora da operação, botão de voltar. */
function topoOperacao(ctx, titulo) {
  ctx.topo({ titulo: titulo, voltar: App.perfil() === 'Operação' ? null : 'hoje' });
}

App.telas.vendas = {
  area: areaDaOperacao('vendas'),
  titulo: 'Vendas',
  pode: () => App.pode('vendas.listar'),
  async render(ctx) {
    topoOperacao(ctx, 'Vendas');
    const campanha = ctx.query.campanha || Comp.campanhaPadrao();
    const conteudo = h('div.pilha');
    ctx.mostrar([
      Comp.seletorCampanha(campanha, (v) => App.ir('vendas?campanha=' + encodeURIComponent(v), { substituir: true })),
      conteudo
    ]);
    if (!campanha) { trocar(conteudo, h('.cartao', Comp.vazio('Nenhuma campanha', 'As vendas aparecem aqui quando houver uma campanha.'))); return; }
    await TelaVendas.montar(conteudo, campanha, ctx);
  }
};

App.telas.premios = {
  area: areaDaOperacao('premios'),
  titulo: 'Prêmios',
  pode: () => App.pode('premios.listar'),
  async render(ctx) {
    topoOperacao(ctx, 'Prêmios');
    const campanha = ctx.query.campanha || '';
    const conteudo = h('div.pilha');
    ctx.mostrar([
      Comp.seletorCampanha(campanha, (v) => App.ir('premios' + (v ? '?campanha=' + encodeURIComponent(v) : ''), { substituir: true }), { todas: 'Todas as campanhas' }),
      conteudo
    ]);
    await TelaPremios.montar(conteudo, campanha, ctx);
  }
};

App.telas.documentos = {
  area: areaDaOperacao('documentos'),
  titulo: 'Documentos',
  pode: () => App.pode('legalizacao.listar'),
  async render(ctx) {
    topoOperacao(ctx, 'Documentos');
    const conteudo = h('div.pilha');
    ctx.mostrar(conteudo);
    await TelaDocumentos.montar(conteudo, ctx.query.campanha || '', ctx);
  }
};

// ---------------------------------------------------------------------
// Vendas
// ---------------------------------------------------------------------

const TelaVendas = {
  async montar(el, campanha, ctx) {
    trocar(el, Comp.esqueleto(2));
    const verLinks = App.pode('afiliados.listar');
    // Webhook do portal ligado: a venda de hoje, ao vivo, para campanha ativa. Se a planilha dos pedidos falhar, a tela abre sem ele.
    const c0 = App.campanha(campanha);
    const comWebhook = !!(App.sessao.portal && App.sessao.portal.ligado);
    let dias, links, afiliados, vivo;
    try {
      [dias, links, afiliados, vivo] = await Promise.all([
        App.ler('vendas.listar', { campanha: campanha }),
        App.ler('vendas.links', { campanha: campanha }),
        verLinks ? App.ler('afiliados.listar', { campanha: campanha }) : null,
        comWebhook && App.pode('portal.aoVivo') && c0 && c0.status === 'Ativa'
          ? App.ler('portal.aoVivo', { campanha: campanha }, 20).catch(() => null) : null
      ]);
    } catch (e) {
      if (ctx.ativo()) trocar(el, Comp.falha(e, () => TelaVendas.montar(el, campanha, ctx)));
      return;
    }
    if (!ctx.ativo()) return;
    const c = App.campanha(campanha) || { id: campanha, nome: campanha, status: '' };
    // O código do link só para quem cadastra ou digita os totais; o sócio vê o nome.
    const op = { campanha: campanha, ativa: c.status === 'Ativa', codigos: App.pode('afiliados.salvar') || App.pode('vendas.lancarAcumulado'),
      aoMudar: () => { App.esquecer(); TelaVendas.montar(el, campanha, ctx); } };
    const ativos = links.filter((l) => l.ativo);

    // Os três jeitos de atualizar, na ordem de uso: o resumo do portal todo dia; a venda de cada link pelo arquivo do portal ou, sem ele, digitada.
    const acoes = [];
    if (App.pode('vendas.importarOverview')) {
      acoes.push(h('button.btn.primario', { type: 'button', onclick: () => Acoes.importarVendas(campanha, { aoMudar: op.aoMudar }) }, icone('upload'), 'Enviar resumo do portal'));
    }
    if (App.pode('vendas.importarAfiliados')) {
      acoes.push(h('button.btn', { type: 'button', onclick: () => TelaVendas.importarLinks(c, op) }, icone('upload'), 'Enviar relatório por link'));
    }
    if (App.pode('vendas.lancarAcumulado') && ativos.length) {
      acoes.push(h('button.btn', { type: 'button', onclick: () => TelaVendas.lancarAcumulado(c, dias, ativos, op) }, icone('vendas'), 'Digitar totais por link'));
    }

    const comTotal = dias.filter((d) => d.total);
    const vendido = comTotal.reduce((s, d) => s + Number(d.total.faturamento || 0), 0);
    const pedidos = comTotal.reduce((s, d) => s + Number(d.total.pedidos || 0), 0);
    const expirados = comTotal.reduce((s, d) => s + Number(d.total.expirados || 0), 0);
    // Os dias do webhook são provisórios: o que está em dia (e a hora da última importação) conta só o que veio do resumo.
    const confirmados = comTotal.filter((d) => !d.provisorio);
    const ultimo = confirmados.length ? confirmados[0].dia : null;
    const importado = confirmados.map((d) => lerData(d.total.importadoEm)).filter(Boolean).sort((a, b) => b - a)[0] || null;
    const parcial = op.ativa && !!ultimo && mesmoDia(ultimo, App.hoje());
    const ontem = somarDias(App.hoje(), -1);
    const atrasado = c.status === 'Ativa' && (!ultimo || lerData(ultimo) < ontem);
    const blocos = [];
    const aoVivo = TelaPortal.cartaoAoVivo(vivo, op);
    if (aoVivo) blocos.push(aoVivo);
    if (acoes.length) {
      blocos.push(h('section.cartao', h('h2', 'Atualizar vendas'), h('.opcoes-importar', acoes.map((b) => h('.opcao-importar', b))),
        h('p.suave.pequeno', { style: { margin: '12px 0 0' } }, (comWebhook
          ? 'Os pedidos do portal entram sozinhos a cada 5 minutos. Todo dia, envie o resumo do portal: ele confirma os dias anteriores. '
          : 'Todo dia, envie o resumo do portal: ele traz as vendas pagas e os pedidos expirados. ') +
          'Para a venda de cada link, envie o relatório por link, se o portal exportar; se não, digite o total de cada link.')));
    }
    if (atrasado) {
      blocos.push(Comp.aviso('alerta', comWebhook
        ? (ultimo ? 'O resumo do portal confirmou até ' + F.diaLongo(ultimo) + '. ' : 'Nenhum resumo do portal enviado ainda. ') +
          'Envie o resumo para confirmar os dias que vieram do webhook.'
        : ultimo
          ? 'O último dia importado é ' + F.diaLongo(ultimo) + '. Envie o resumo do portal para o ritmo e o caixa ficarem em dia.'
          : 'Nenhuma venda importada ainda. Envie o resumo do portal (pode ser o período todo).'));
    }
    const feitos = pedidos + expirados;
    blocos.push(h('.kpis',
      Comp.kpi('Vendido', F.moeda(vendido, { compacto: true }), F.plural(comTotal.length, 'dia com venda', 'dias com venda')),
      Comp.kpi('Pedidos pagos', F.int(pedidos), feitos ? 'de ' + F.plural(feitos, 'pedido feito', 'pedidos feitos') : null),
      Comp.kpi('Expirados sem pagar', feitos ? F.pct(expirados / feitos) : '–', feitos ? F.int(expirados) + ' de ' + F.plural(feitos, 'pedido', 'pedidos') : 'sem pedidos importados'),
      // Quando foi a última importação e até que dia ela traz: o dia de hoje ainda está vendendo.
      comWebhook
        ? Comp.kpi('Resumo do portal', importado ? F.quando(importado) : '–',
          ultimo ? 'confirmou até ' + (parcial ? 'hoje (parcial)' : F.dia(ultimo)) : 'nenhum enviado', atrasado ? 'neg' : '')
        : Comp.kpi('Última importação', importado ? F.quando(importado) : ultimo ? F.dia(ultimo) : '–',
          ultimo ? 'vendas até ' + (parcial ? 'hoje (parcial)' : F.dia(ultimo)) : 'nada importado', atrasado ? 'neg' : '')));
    blocos.push(TelaVendas.cartaoDias(dias, links, op));
    if (afiliados) blocos.push(TelaVendas.cartaoLinks(afiliados, c, op));
    else if (links.length) {
      const situacao = ativos.length === links.length ? (links.length === 1 ? ', ativo' : ', todos ativos') : ', ' + F.int(ativos.length) + (ativos.length === 1 ? ' ativo' : ' ativos');
      blocos.push(h('p.suave.pequeno', F.plural(links.length, 'link de venda cadastrado', 'links de venda cadastrados') + ' nesta campanha' + situacao + '.'));
    }
    trocar(el, blocos);
  },

  cartaoDias(dias, links, op) {
    const nomes = {};
    links.forEach((l) => { nomes[l.codigo] = l.nome; });
    if (!dias.length) {
      return h('.cartao', h('h2', 'Vendas por dia'), Comp.vazio('Nenhuma venda registrada', 'Envie o resumo do portal: ele traz as vendas pagas e os pedidos expirados de cada dia.'));
    }
    const hoje = App.hoje();
    return h('section.cartao',
      h('.cabeca', h('h2', 'Vendas por dia'), h('span.suave.pequeno', F.plural(dias.length, 'dia', 'dias'))),
      h('ul.lista.dentro', dias.map((d) => {
        const t = d.total;
        const detalhe = [];
        if (t) detalhe.push(F.plural(t.pedidos || 0, 'pedido pago', 'pedidos pagos'), F.plural(t.expirados || 0, 'expirado', 'expirados'));
        // O primeiro acumulado de um link traz os dias anteriores: vai à parte, e o dia fica sem a conta do sem link.
        const primeiros = d.links.filter((l) => l.primeiro).length;
        if (d.links.length > primeiros) detalhe.push('links ' + F.moeda(d.somaLinks));
        if (primeiros) detalhe.push((d.links.length > primeiros ? '1º acumulado ' : '1º acumulado dos links ') + F.moeda(d.primeiros));
        if (!F.vazio(d.semLink)) detalhe.push(d.semLink < -0.004 ? 'links acima do total ' + F.moeda(-d.semLink) : 'sem link ' + F.moeda(d.semLink));
        const abrir = () => TelaVendas.detalheDia(d, nomes, op);
        // O dia de hoje ainda está vendendo: o valor baixo não é queda de venda. Do webhook, hoje é "ao vivo" e os outros dias, provisórios.
        const deHoje = op.ativa && mesmoDia(d.dia, hoje);
        const marca = d.provisorio ? (deHoje ? h('span.chip.verde', 'ao vivo') : h('span.chip.amarelo', 'provisório')) : deHoje ? h('span.chip', 'parcial') : null;
        return h('li.clicavel', { role: 'button', tabindex: '0', onclick: abrir, onkeydown: chaveTecla(abrir) },
          h('.principal', h('.t', F.diaLongo(d.dia)), detalhe.length ? h('.d.seps', detalhe.map((x) => h('span', x))) : null,
            !t ? h('.chips', { style: { marginTop: '6px' } }, h('span.chip.amarelo', 'Falta o resumo do portal')) : null),
          h('.lado', h('span.num.forte', t ? F.moeda(t.faturamento) : '–'), marca));
      })));
  },

  detalheDia(d, nomes, op) {
    const t = d.total;
    const corpo = [];
    const comWebhook = !!(App.sessao.portal && App.sessao.portal.ligado);
    if (t && d.provisorio) {
      corpo.push(Comp.aviso('info', mesmoDia(d.dia, App.hoje())
        ? 'Venda de hoje pelo webhook do portal: atualiza a cada 5 minutos. O resumo do portal de amanhã confirma o dia.'
        : 'Este dia veio só do webhook do portal (provisório). Envie o resumo do portal: ele confirma ou corrige os números do dia.'));
      corpo.push(h('dl.valores',
        h('dt', 'Faturamento'), h('dd', F.moeda(t.faturamento)),
        h('dt', 'Pedidos pagos'), h('dd', F.int(t.pedidos)),
        h('dt', 'Expirados'), h('dd', F.int(t.expirados)),
        h('dt', 'Origem'), h('dd', 'Webhook do portal'),
        h('dt', 'Atualizado'), h('dd', t.importadoEm ? F.dataHora(t.importadoEm) : '–')));
    } else if (t) {
      corpo.push(h('dl.valores',
        h('dt', 'Faturamento'), h('dd', F.moeda(t.faturamento)),
        h('dt', 'Pedidos pagos'), h('dd', F.int(t.pedidos)),
        h('dt', 'Expirados'), h('dd', F.int(t.expirados)),
        h('dt', 'Participantes'), h('dd', F.int(t.participantes)),
        h('dt', 'Arquivo'), h('dd', t.arquivo || '–'),
        h('dt', 'Enviado por'), h('dd', [t.enviadoPor, t.importadoEm ? F.dataHora(t.importadoEm) : null].filter(Boolean).join(' · ') || '–'),
        // O que o webhook tinha somado no dia, para conferir com o resumo.
        d.portal ? [h('dt', 'Pelo webhook'), h('dd', F.moeda(d.portal.vendido)),
          h('dt', 'Diferença'), h('dd.' + (Math.abs(t.faturamento - d.portal.vendido) < 0.005 ? 'x' : F.cls(t.faturamento - d.portal.vendido) || 'x'),
            Math.abs(t.faturamento - d.portal.vendido) < 0.005 ? 'nenhuma' : F.moeda(t.faturamento - d.portal.vendido))] : null));
    } else {
      corpo.push(Comp.aviso('alerta', 'Este dia ainda não tem o total do resumo do portal.'));
    }
    if (d.links.length) {
      corpo.push(h('h3', { style: { margin: '6px 0 0' } }, 'Por link'), Comp.tabela([
        { titulo: 'Link', valor: (l) => [nomes[l.codigo] || l.codigo, op.codigos && nomes[l.codigo] ? h('div.suave.pequeno', l.codigo) : null] },
        { titulo: 'Venda do dia', dir: true, valor: (l) => l.primeiro ? h('span.suave', '1º acumulado') : h('span.num', F.moeda(l.faturamento)) },
        { titulo: 'Acumulado', dir: true, valor: (l) => h('span.num', F.vazio(l.acumulado) ? '–' : F.moeda(l.acumulado)) }
      ], d.links));
      if (d.links.some((l) => l.primeiro)) {
        corpo.push(h('p.suave.pequeno', '1º acumulado é o primeiro valor do link no app: ele soma as vendas dos dias anteriores, e não só as deste dia. ' +
          'Por isso este dia fica sem a conta da venda sem link. Do próximo lançamento em diante, a venda do dia é a diferença para o acumulado anterior.'));
      }
      if (!F.vazio(d.semLink)) {
        corpo.push(h('p.suave.pequeno', d.semLink < -0.004
          ? 'Os links somam ' + F.moeda(-d.semLink) + ' a mais que o total do dia. Acontece quando o acumulado é copiado depois do fim do dia, ' +
            'com vendas do dia seguinte, ou quando o total do dia ainda não está completo.'
          : 'Venda sem link neste dia (total menos a soma dos links): ' + F.moeda(d.semLink) + '.'));
      }
    }
    const botoes = [];
    const f = Comp.folha({ titulo: F.diaLongo(d.dia), corpo: corpo });
    // Dia do webhook não se apaga com ele ligado: a próxima soma o traria de volta (o servidor também recusa).
    if (App.pode('vendas.excluirDia') && !(d.provisorio && comWebhook)) {
      const b = h('button.btn.perigo', { type: 'button', onclick: async () => {
        const r = await App.executar('vendas.excluirDia', { campanha: op.campanha, dia: d.dia }, { botao: b, sucesso: 'Vendas do dia apagadas. Envie o relatório de novo.' });
        if (r) { f.fechar(); op.aoMudar(); }
      } }, icone('lixo'), 'Apagar as vendas deste dia');
      botoes.push(b);
    }
    botoes.push(h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Fechar'));
    f.mostrar(corpo, botoes);
  },

  /** Resultado de um lançamento de acumulados. O primeiro acumulado de um link vai à parte: ele traz os dias anteriores. */
  textoAcumulado(r) {
    const partes = [];
    if (r.linksDoDia || !r.primeiros) partes.push('Venda do dia: ' + F.moeda(r.vendaDoDia) + ' em ' + F.plural(r.linksDoDia, 'link', 'links') + '.');
    if (r.primeiros) partes.push('Primeiro acumulado de ' + F.plural(r.primeiros, 'link', 'links') + ': ' + F.moeda(r.acumuladoPrimeiros) + ', com os dias anteriores.');
    return partes.join(' ');
  },

  /** Acumulado de cada link copiado do portal, uma vez por dia: o app calcula a venda do dia pela diferença. */
  lancarAcumulado(c, dias, links, op) {
    const porLink = {};
    dias.forEach((d) => d.links.forEach((l) => { (porLink[l.codigo] = porLink[l.codigo] || []).push({ dia: d.dia, faturamento: Number(l.faturamento) || 0 }); }));
    const linhas = h('div.form');
    const dataCampo = Comp.campo({ rotulo: 'Dia das vendas', nome: 'data', tipo: 'data', valor: somarDias(App.hoje(), -1),
      atributos: { max: chaveDia(App.hoje()) }, dica: 'Normalmente ontem. O app tira o que já foi lançado nos dias anteriores e fica com a venda do dia.' });
    const resumo = h('p.forte', { style: { margin: 0 } });
    const avisoDia = h('div');
    const x = TelaCaixa.folhaForm('Totais por link · ' + c.nome, [
      h('p.suave', { style: { margin: 0 } }, 'Copie do portal o total vendido em cada link até o fim do dia escolhido (o acumulado desde o início da campanha). ' +
        'Deixe em branco os links que você não vai atualizar.'),
      dataCampo, avisoDia, linhas, resumo
    ], 'Lançar', { larga: true });
    const base = {};
    const desenhar = () => {
      const dia = x.form.elements.data.value;
      const jaLancado = links.some((l) => (porLink[l.codigo] || []).some((r) => r.dia === dia));
      trocar(avisoDia, jaLancado ? Comp.aviso('info', 'Este dia já foi lançado. Mude só o link que estiver errado.') : []);
      trocar(linhas, links.map((l) => {
        const lista = porLink[l.codigo] || [];
        const antes = lista.filter((r) => r.dia < dia).reduce((s, r) => s + r.faturamento, 0);
        const doDia = lista.filter((r) => r.dia === dia)[0];
        base[l.codigo] = antes;
        const campo = Comp.campo({ rotulo: l.nome + (l.nome !== l.codigo ? ' · ' + l.codigo : ''), nome: 'ac_' + l.codigo, tipo: 'moeda',
          valor: doDia ? antes + doDia.faturamento : '',
          dica: doDia ? 'Venda lançada no dia: ' + F.moeda(doDia.faturamento) + '.' : antes > 0 ? 'Até o dia anterior: ' + F.moeda(antes) + '.' : 'Primeiro lançamento deste link.' });
        campo.setAttribute('data-codigo', l.codigo);
        return campo;
      }));
      atualizar();
    };
    const atualizar = () => {
      let total = 0, n = 0, primeiros = 0, nPrimeiros = 0, erro = '';
      const dia = x.form.elements.data.value;
      links.forEach((l) => {
        const v = lerNumero(x.form.elements['ac_' + l.codigo].value);
        const campo = linhas.querySelector('[data-codigo="' + l.codigo + '"]');
        campo.classList.remove('erro');
        if (v === null) return;
        if (isNaN(v) || v < base[l.codigo] - 0.004) {
          campo.classList.add('erro');
          erro = erro || 'O acumulado de ' + l.nome + ' está menor que o já registrado (' + F.moeda(base[l.codigo]) + ').';
          return;
        }
        // Link sem lançamento antes deste dia: o valor é o total até aqui, não a venda do dia.
        if (!(porLink[l.codigo] || []).some((r) => r.dia < dia)) { primeiros += v; nPrimeiros += 1; return; }
        total += v - base[l.codigo];
        n += 1;
      });
      const partes = [];
      if (n) partes.push('Venda do dia: ' + F.moeda(total) + ' em ' + F.plural(n, 'link', 'links') + '.');
      if (nPrimeiros) partes.push('Primeiro lançamento de ' + F.plural(nPrimeiros, 'link', 'links') + ': ' + F.moeda(primeiros) + ' até este dia.');
      resumo.textContent = erro || partes.join(' ');
      resumo.className = erro ? 'forte neg' : 'forte';
      return erro;
    };
    x.form.elements.data.addEventListener('change', desenhar);
    x.form.addEventListener('input', (ev) => { if (ev.target.name !== 'data') atualizar(); });
    desenhar();
    x.salvar.addEventListener('click', async () => {
      const problema = atualizar();
      if (problema) return TelaCaixa.erro(x.erro, problema);
      const dia = x.form.elements.data.value;
      if (!dia) return TelaCaixa.erro(x.erro, 'Escolha o dia.');
      const lista = links.map((l) => ({ codigo: l.codigo, acumulado: x.form.elements['ac_' + l.codigo].value.trim() })).filter((l) => l.acumulado !== '');
      if (!lista.length) return TelaCaixa.erro(x.erro, 'Preencha o acumulado de pelo menos um link.');
      const r = await App.executar('vendas.lancarAcumulado', { campanha: c.id, data: dia, links: lista }, { botao: x.salvar, erroEm: x.erro,
        sucesso: (res) => TelaVendas.textoAcumulado(res) });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  },

  /** Relatório por afiliado do portal (por dia, ou o acumulado de cada link num dia). */
  importarLinks(c, op) {
    const arq = Comp.arquivo({ rotulo: 'Relatório por link (afiliados)', aceita: '.csv,text/csv,text/plain',
      dica: 'CSV com o código do link e a venda. Links que ainda não existem são cadastrados como Canal, sem comissão.' });
    const x = TelaCaixa.folhaForm('Relatório por link · ' + c.nome, [
      arq,
      Comp.campo({ rotulo: 'Dia das vendas', nome: 'data', tipo: 'data', valor: somarDias(App.hoje(), -1), atributos: { max: chaveDia(App.hoje()) },
        dica: 'Normalmente ontem. Só vale se o arquivo trouxer o total de cada link, sem coluna de data.' })
    ], 'Enviar');
    x.salvar.addEventListener('click', async () => {
      let arquivo;
      try { arquivo = await Comp.lerArquivo(arq, { texto: true, limiteMb: 5 }); } catch (e) { return TelaCaixa.erro(x.erro, e.message); }
      if (!arquivo) return TelaCaixa.erro(x.erro, 'Escolha o arquivo do portal.');
      const r = await App.executar('vendas.importarAfiliados', { campanha: c.id, arquivo: arquivo, data: x.form.elements.data.value }, { botao: x.salvar, erroEm: x.erro });
      if (!r) return;
      const itens = r.linhas !== undefined
        ? [h('dt', 'Linhas por dia'), h('dd', F.int(r.linhas)), h('dt', 'Novas'), h('dd', F.int(r.novos)), h('dt', 'Atualizadas'), h('dd', F.int(r.substituidos))]
        : [h('dt', 'Dia'), h('dd', F.data(r.dia)), h('dt', 'Links'), h('dd', F.int(r.links)),
          r.linksDoDia || !r.primeiros ? [h('dt', 'Venda do dia'), h('dd', F.moeda(r.vendaDoDia))] : null,
          r.primeiros ? [h('dt', 'Primeiro acumulado'), h('dd', F.moeda(r.acumuladoPrimeiros) + ' em ' + F.plural(r.primeiros, 'link', 'links') + ', com os dias anteriores')] : null];
      x.f.mostrar([
        Comp.aviso('sucesso', 'Vendas por link importadas. Comissões e retorno dos disparos já estão atualizados.'),
        h('dl.valores', itens),
        (r.cadastrados || []).length ? Comp.aviso('info', 'Links novos cadastrados como Canal: ' + r.cadastrados.join(', ') + '. Ajuste o tipo e a comissão em Links de venda.') : null,
        (r.erros || []).length ? Comp.aviso('alerta', [h('strong', 'Linhas que não entraram:'), h('ul', r.erros.slice(0, 8).map((e) => h('li', e)))]) : null
      ], [h('button.btn.primario', { type: 'button', onclick: () => x.f.fechar() }, 'Pronto')]);
      op.aoMudar();
    });
  },

  cartaoLinks(a, c, op) {
    const gestor = App.pode('afiliados.salvar');
    const novo = gestor ? h('button.btn.pequeno', { type: 'button', onclick: () => TelaVendas.editarLink(null, c, op) }, icone('mais'), 'Novo link') : null;
    if (!a.links.length) {
      return h('.cartao', h('.cabeca', h('h2', 'Links de venda'), novo),
        h('p.suave', { style: { margin: 0 } }, 'Cada disparo, canal e influenciador tem um link próprio. Cadastre os links para o app somar as comissões e mostrar se cada disparo cobre o custo.'));
    }
    return h('section.cartao',
      h('.cabeca', h('h2', 'Links de venda'), novo),
      h('ul.lista.dentro', TelaVendas.linhasLinks(a, c, { codigos: op.codigos, aoClicar: gestor ? (l) => TelaVendas.editarLink(l, c, op) : null })),
      h('p.suave.pequeno', { style: { margin: 0 } }, TelaVendas.notaLinks));
  },

  notaLinks: 'O custo de cada link é a comissão do influenciador ou o custo do disparo. Um disparo cobre o custo quando a venda do link paga o disparo e as taxas sobre essa venda.',

  /**
   * Links de venda em linhas curtas (aba Vendas e Relatório): só os campos que têm valor, o disparo agendado sem
   * resultado, e no fim o total dos links e a venda sem link. op: { codigos (mostra o código do link), aoClicar(l) }
   */
  linhasLinks(a, c, op) {
    op = op || {};
    const encerrada = !!c && c.status === 'Encerrada';
    const linhas = a.links.map((l) => {
      const itens = [l.tipo, op.codigos ? l.codigo : null];
      if (l.comissaoPct) itens.push('comissão de ' + F.pct(l.comissaoPct) + ': ' + F.moeda(l.comissao));
      if (lerData(l.dataDisparo)) itens.push((l.agendado ? 'agendado para ' : 'disparado em ') + F.dataCurta(l.dataDisparo) + ' às ' + F.hora(l.dataDisparo));
      if (l.custo) itens.push('custo ' + F.moeda(l.custo));
      if (!l.agendado && !F.vazio(l.retorno)) itens.push('vendeu ' + F.retorno(l.retorno) + ' o custo');
      if (l.ativo === 'Não') itens.push('inativo');
      const abrir = op.aoClicar ? () => op.aoClicar(l) : null;
      return h('li' + (abrir ? '.clicavel' : ''), abrir ? { role: 'button', tabindex: '0', onclick: abrir, onkeydown: chaveTecla(abrir) } : null,
