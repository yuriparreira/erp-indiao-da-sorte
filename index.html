      { id: 'e-variacao', t: 'No menu ⋮ de uma mensagem, troque o texto pela outra variação ou edite o texto.' }
    ]
  },

  /** O que a pessoa já marcou e se fechou o cartão, guardado neste aparelho. */
  chave() { return 'roteiro-teste:' + App.perfil(); },
  ler() {
    try {
      const v = JSON.parse(localStorage.getItem(Roteiro.chave()) || 'null');
      if (v && typeof v === 'object' && !Array.isArray(v)) return { feitos: Array.isArray(v.feitos) ? v.feitos : [], fechado: !!v.fechado };
    } catch (e) { /* sem nada guardado */ }
    return { feitos: [], fechado: false };
  },
  gravar(estado) {
    try { localStorage.setItem(Roteiro.chave(), JSON.stringify(estado)); } catch (e) { /* o navegador não guarda: vale só nesta tela */ }
  },

  /**
   * Cartão do alto de Hoje (ou de Mensagens): dados de teste, para o gestor, e os próximos passos com caixinhas.
   * Mostra só os 3 próximos passos (o cartão não empurra a tela para baixo); "Ver todos" abre a lista inteira.
   */
  cartao(ctx) {
    if (!App.emTeste()) return null;
    const passos = Roteiro.PASSOS[App.perfil()] || [];
    if (!passos.length) return null;
    const PROXIMOS = 3;
    const camp = App.sessao.ambiente.campanha || null;
    const estado = Roteiro.ler();
    estado.feitos = estado.feitos.filter((id) => passos.some((p) => p.id === id));
    let todos = false;
    const contagem = h('span.chip');
    const lista = h('ul.lista.dentro.passos');
    const depois = h('div');

    const contar = () => {
      const fim = estado.feitos.length === passos.length;
      contagem.textContent = fim ? 'Concluído' : estado.feitos.length + ' de ' + passos.length;
      contagem.className = 'chip' + (fim ? ' verde' : '');
      return fim;
    };
    const item = (p) => {
      const i = passos.indexOf(p);
      const rota = p.rota && p.rota.indexOf('{c}') >= 0 ? (camp ? p.rota.replace('{c}', encodeURIComponent(camp.id)) : null) : p.rota;
      const feito = estado.feitos.indexOf(p.id) >= 0;
      const caixa = h('input', { type: 'checkbox', checked: feito, 'aria-label': 'Passo ' + (i + 1) + ' feito' });
      const li = h('li' + (feito ? '.feito' : ''),
        h('label.check.principal', caixa, h('span', h('strong', (i + 1) + '. '), p.t)),
        rota ? h('.lado', h('a.btn.pequeno', { href: '#' + rota, onclick: App.cliqueNav(rota) }, 'Abrir')) : null);
      caixa.addEventListener('change', () => {
        estado.feitos = estado.feitos.filter((x) => x !== p.id);
        if (caixa.checked) estado.feitos.push(p.id);
        li.classList.toggle('feito', caixa.checked);
        Roteiro.gravar(estado);
        contar();
        // Com só os próximos na tela, o passo feito sai depois de um instante (dá para ver a marca) e entra o seguinte.
        if (!todos) setTimeout(desenhar, 450);
      });
      return li;
    };
    const desenhar = () => {
      const fim = contar();
      const pendentes = passos.filter((p) => estado.feitos.indexOf(p.id) < 0);
      const visiveis = todos ? passos : pendentes.slice(0, PROXIMOS);
      trocar(lista, visiveis.map(item));
      lista.hidden = !visiveis.length;
      const fora = passos.length - visiveis.length;
      trocar(depois, [
        fim && !todos ? h('p.pequeno', 'Você fez todos os passos. Obrigado!') : null,
        fora > 0 || todos ? h('button.btn.discreto.pequeno', { type: 'button', onclick: () => { todos = !todos; desenhar(); } },
          todos ? 'Mostrar só os próximos' : 'Ver todos os ' + passos.length + ' passos') : null
      ]);
    };
    desenhar();

    const gestor = App.ehGestor();
    const dados = gestor ? Roteiro.dadosDeTeste(camp, ctx)
      : !camp ? Comp.aviso('info', 'O gestor ainda não preparou os dados de teste. Os passos com a campanha Moto de teste ficam para depois.') : null;
    const ajuda = gestor
      ? 'Achou algo estranho ou confuso? Anote o que fez antes, tire um print e mande no projeto do app.'
      : 'Achou algo estranho ou confuso? Tire um print e mande para o gestor do app, dizendo o que você fez antes.';
    const cartao = h('details.cartao.roteiro', { open: !estado.fechado },
      h('summary', h('span.titulo-roteiro', '🧪 Roteiro de teste'), contagem),
      h('p.suave.pequeno', 'Esta é a cópia de teste: pode mexer à vontade, nada aqui vale de verdade. Faça os passos com calma e marque o que já fez.'),
      dados, lista, depois,
      h('p.suave.pequeno', ajuda));
    cartao.addEventListener('toggle', () => { estado.fechado = !cartao.open; Roteiro.gravar(estado); });
    return cartao;
  },

  /** Para o gestor: cria a campanha de teste (ou completa o que faltou, sem duplicar nada). */
  dadosDeTeste(camp, ctx) {
    const preparar = async (botao) => {
      const r = await App.executar('teste.preparar', {}, { botao: botao, semAvisos: true });
      if (!r) return;
      App.sessao.ambiente.campanha = { id: r.campanha.id, nome: r.campanha.nome, status: r.campanha.status };
      await App.atualizarCampanhas();
      const f = Comp.folha({
        titulo: 'Dados de teste prontos',
        corpo: [
          h('ul.erros', r.feito.map((x) => h('li', x))),
          (r.avisos || []).length ? Comp.aviso('alerta', h('div', h('strong', 'Avisos'), h('ul.erros', r.avisos.map((x) => h('li', x))))) : null
        ],
        rodape: [h('button.btn.primario', { type: 'button', onclick: () => f.fechar() }, 'Ok')],
        aoFechar: () => ctx.recarregar()
      });
    };
    if (!camp) {
      const b = h('button.btn.primario', { type: 'button', onclick: () => preparar(b) }, icone('mais'), 'Preparar dados de teste');
      return Comp.aviso('info', 'Primeiro, prepare os dados de teste: a campanha Moto de teste, no ar desde a semana passada, com vendas, links, grupos, documentos, dinâmicas, um prêmio pago e as mensagens de hoje.',
        h('div', { style: { marginTop: '10px' } }, b));
    }
    const rota = 'campanha/' + encodeURIComponent(camp.id);
    const b = h('button.btn.pequeno.discreto', { type: 'button', title: 'Completa o que faltar (sem duplicar), põe uma dinâmica hoje e atualiza as sugestões e as mensagens.',
      onclick: () => preparar(b) }, icone('atualizar'), 'Atualizar');
    return h('.dados-teste',
      h('div', h('div.forte', camp.nome + ' · ' + camp.id), h('div.suave.pequeno', 'Campanha de teste · ' + camp.status)),
      h('.acoes', b, h('a.btn.pequeno', { href: '#' + rota, onclick: App.cliqueNav(rota) }, 'Abrir')));
  }
};
</script>
  <script>
/* =====================================================================
   Hoje: o que cada perfil precisa fazer agora, em ordem de urgência.
   Gestor: campanhas ativas, pendências e próximos 7 dias.
   Sócio: presenças a confirmar, campanhas e agenda de ações.
   Operação: prêmios a lançar, documentos e dinâmicas do dia.
   ===================================================================== */

App.telas.hoje = {
  area: 'hoje',
  titulo: 'Hoje',
  pode: () => App.perfil() !== 'Responsável pelos envios',

  async render(ctx) {
    const d = await (App.usarAntecipado('hoje') || App.chamar('hoje', {}));
    if (!ctx.ativo()) return;
    const perfil = App.perfil();
    const primeiroNome = String(d.usuario.nome || '').split(' ')[0];
    ctx.topo({
      titulo: 'Hoje',
      sub: (primeiroNome ? 'Olá, ' + primeiroNome + ' · ' : '') + F.diaLongo(d.agora || App.agora()),
      acoes: [h('button.btn.icone.discreto', { type: 'button', 'aria-label': 'Atualizar', title: 'Atualizar', onclick: (ev) => TelaHoje.atualizar(ev.currentTarget, ctx) }, icone('atualizar'))]
    });
    const blocos = [];
    // Cópia de teste: o roteiro de teste da pessoa vem primeiro.
    blocos.push(Roteiro.cartao(ctx));
    (d.avisos || []).forEach((a) => blocos.push(Comp.aviso('alerta', a)));

    // No computador, o que fazer fica à esquerda e a agenda à direita; no celular, um embaixo do outro.
    let principal = [], lado = [];
    if (perfil === 'Gestor') {
      principal = [TelaHoje.campanhas(d), TelaHoje.pendencias(d, ctx, 'Para fazer agora')];
      lado = [TelaHoje.proximos(d, ctx, 'Próximos dias')];
    } else if (perfil === 'Influenciador e sócio') {
      // Para o sócio, presença a confirmar é exceção: sem nada pendente a seção some em vez de ocupar o topo vazia.
      principal = [(d.pendencias || []).length ? TelaHoje.pendencias(d, ctx, 'Confirme sua presença') : null, TelaHoje.campanhas(d)];
      lado = [TelaHoje.proximos(d, ctx, 'Sua agenda de ações')];
    } else if (perfil === 'Operação') {
      principal = [TelaHoje.pendencias(d, ctx, 'Para fazer agora')];
      lado = [TelaHoje.dinamicasDeHoje(d)];
    }
    lado = lado.filter(Boolean);
    blocos.push(lado.length ? h('.colunas.principal-lado', h('div.pilha', principal), h('div.pilha', lado)) : h('div.pilha', principal));
    ctx.mostrar(blocos);
    App.contador('hoje', (d.pendencias || []).filter((p) => p.gravidade === 'alta').length);
  }
};

const TelaHoje = {
  /** Atualizar: com o webhook do portal ligado, soma antes os pedidos que chegaram (se a soma falhar, a tela recarrega assim mesmo). */
  async atualizar(botao, ctx) {
    if (App.sessao.portal && App.sessao.portal.ligado && App.pode('portal.atualizar')) {
      botao.classList.add('carregando');
      botao.disabled = true;
      try { await App.chamar('portal.atualizar', {}); } catch (e) { /* o gatilho de 5 minutos continua somando */ }
    }
    App.esquecer();
    App.reler = true;
    ctx.recarregar();
  },

  campanhas(d) {
    const lista = d.campanhas || [];
    if (!lista.length) {
      return h('.cartao', Comp.vazio('Nenhuma campanha no ar', 'Quando uma campanha for ativada, o ritmo de vendas e o equilíbrio aparecem aqui.',
        App.pode('campanhas.criar') ? h('a.btn.primario', { href: '#campanhas/nova', onclick: App.cliqueNav('campanhas/nova') }, icone('mais'), 'Nova campanha') : null));
    }
    return h('section.pilha', { 'aria-label': 'Campanhas no ar' }, lista.map((c) => Blocos.cartaoCampanha(c)));
  },

  pendencias(d, ctx, titulo) {
    const lista = d.pendencias || [];
    const urgentes = lista.filter((p) => p.gravidade === 'alta').length;
    const cab = h('.secao-titulo', h('h2', titulo), lista.length
      ? h('span.suave', F.plural(lista.length, 'item', 'itens') + (urgentes ? ' · ' + F.plural(urgentes, 'urgente', 'urgentes') : '')) : null);
    if (!lista.length) {
      return h('section', cab, h('.cartao', { style: { marginTop: '12px' } },
        h('.vazio', icone('festa', 'icone-grande'), h('h3', 'Tudo em dia'), h('p', 'Nada pendente agora.'))));
    }
    return h('section', cab, h('ul.lista', { style: { marginTop: '12px' } }, lista.map((p) => TelaHoje.itemPendencia(p, ctx))));
  },

  itemPendencia(p, ctx) {
    const recarregar = () => ctx.recarregar();
    const a = p.acao || {};
    const botoes = [];
    // Botão cheio só no que é urgente (ponto vermelho); o resto fica com botão de contorno.
    const urgente = p.gravidade === 'alta';
    const cheio = urgente ? '.primario' : '';
    const ir = (rota, rotulo, primario) => botoes.push(h('a.btn.pequeno' + (primario ? '.primario' : ''),
      { href: '#' + rota, onclick: App.cliqueNav(rota) }, rotulo));
    let extra = null;
    switch (a.tela) {
      case 'vendas':
        botoes.push(h('button.btn.pequeno' + cheio, { type: 'button', onclick: () => Acoes.importarVendas(a.campanha, { aoMudar: recarregar }) },
          icone('upload'), 'Enviar resumo do portal'));
        break;
      case 'dinamicas':
        if (p.sugestoes && p.sugestoes.length) {
          extra = h('ul.sugestoes', p.sugestoes.map((s) => {
            s.campanha = a.campanha;
            const abrir = () => Acoes.dinamica({ id: s.id, campanha: a.campanha, nome: s.nome }, { aoMudar: recarregar });
            return h('li.clicavel', { role: 'button', tabindex: '0', onclick: abrir, onkeydown: chaveTecla(abrir) },
              h('.principal', h('.t', s.nome + ' · ' + F.quando(s.inicio)),
                h('.d', s.custo > 0.004
                  ? [F.moeda(s.custo, { semCentavos: true }) + ' com IR · saldo projetado da campanha ', Blocos.efeito(s.saldoAntes, s.saldoDepois)]
                  : 'Sem custo de prêmio'),
                s.acimaOrcamento || s.foraRegulamento ? h('.chips', { style: { marginTop: '4px' } },
                  s.acimaOrcamento ? h('span.chip.vermelho', 'Acima do orçamento') : null,
                  s.foraRegulamento ? h('span.chip.amarelo', 'Fora do regulamento') : null) : null),
              icone('avancar', 'seta'));
          }));
          // Aceitar de uma vez só as que não pedem justificativa; as outras a gestão decide uma a uma.
          const livres = p.sugestoes.filter((s) => !s.acimaOrcamento && !s.foraRegulamento);
          if (livres.length > 1) {
            const b = h('button.btn.pequeno' + cheio, { type: 'button',
              onclick: () => Acoes.aceitarTodas(livres, { botao: b, aoMudar: recarregar }) },
              livres.length === p.sugestoes.length ? 'Aceitar todas' : 'Aceitar as ' + livres.length + ' sem justificativa');
            botoes.push(b);
          }
          ir('calendario' + (a.campanha ? '?campanha=' + encodeURIComponent(a.campanha) : ''), 'Ver no calendário');
        } else if (a.id) {
          botoes.push(h('button.btn.pequeno' + cheio, { type: 'button',
            onclick: () => Acoes.dinamica({ id: a.id, campanha: a.campanha }, { aoMudar: recarregar }) }, 'Ver dinâmica'));
        } else {
          ir('campanha/' + encodeURIComponent(a.campanha) + '/dinamicas', 'Abrir');
        }
        break;
      case 'presenca': {
        const dn = { id: a.id, nome: a.nome || p.titulo };
        // Os dois botões neutros: nenhum parece escolhido antes do toque.
        const sim = h('button.btn.pequeno', { type: 'button', onclick: () => Acoes.presenca(dn, 'Confirmada', recarregar, sim) }, 'Vou estar');
        botoes.push(sim, h('button.btn.pequeno', { type: 'button', onclick: () => Acoes.presenca(dn, 'Recusada', recarregar) }, 'Não vou poder'));
        break;
      }
      case 'premios': ir('premios', 'Lançar', urgente); break;
      case 'legalizacao': ir('documentos' + (a.campanha ? '?campanha=' + encodeURIComponent(a.campanha) : ''), a.rotulo || 'Enviar documento', urgente); break;
      case 'caixa': ir('caixa' + (a.filtro ? '?filtro=' + a.filtro : ''), 'Ver no Livro caixa', urgente); break;
      case 'distribuicao': ir('distribuicao/' + encodeURIComponent(a.campanha), 'Simular', urgente); break;
      case 'campanha': ir('campanha/' + encodeURIComponent(a.campanha), 'Abrir campanha', urgente); break;
      case 'mensagens': ir('mensagens' + (a.dia ? '?dia=' + a.dia : ''), 'Abrir mensagens', urgente); break;
      case 'configuracoes': if (App.pode('config.ler')) ir('config' + (a.secao ? '/' + a.secao + (a.chave ? '?editar=' + a.chave : '') : ''), 'Configurar', urgente); break;
      default: break;
    }
    const campanha = p.campanha && App.campanha(p.campanha);
    const mostraCampanha = campanha && (App.sessao.campanhas || []).filter((c) => c.status === 'Ativa').length > 1 && p.titulo.indexOf(campanha.nome) < 0;
    return h('li', { 'data-gravidade': p.gravidade },
      h('span.ponto.' + p.gravidade, { title: { alta: 'Urgente', media: 'Importante', baixa: 'Quando puder' }[p.gravidade] }),
      h('.principal',
        h('.t', p.titulo),
        p.detalhe || mostraCampanha ? h('.d', [mostraCampanha ? campanha.nome : null, p.detalhe].filter(Boolean).join(' · ')) : null,
        p.itens && p.itens.length ? h('ul.alertas', p.itens.map((i) => h('li', h('span.ponto.' + i.gravidade), h('span', i.texto)))) : null,
        extra,
        botoes.length ? h('.acoes', { style: { marginTop: '10px' } }, botoes) : null));
  },

  proximos(d, ctx, titulo) {
    // Sugestão que já está em "Para fazer agora" não se repete na agenda ao lado.
    const nasPendencias = new Set();
    (d.pendencias || []).forEach((p) => (p.sugestoes || []).forEach((s) => nasPendencias.add(s.id)));
    const dias = (d.proximos || []).map((dia) => Object.assign({}, dia, {
      itens: (dia.itens || []).filter((it) => !(it.tipo === 'sugestao' && nasPendencias.has(it.id)))
    }));
    if (!dias.length) return null;
    const varias = (App.sessao.campanhas || []).filter((c) => c.status === 'Ativa').length > 1;
