        h('.principal', h('.t', l.cadastrado === false ? 'Link sem cadastro' : l.nome), h('.d.seps', itens.filter(Boolean).map((t) => h('span', t)))),
        h('.lado', h('span.num.forte', l.agendado && !l.venda ? '–' : F.moeda(l.venda)), TelaVendas.situacaoLink(l, encerrada)));
    });
    const custo = a.links.reduce((s, l) => s + (Number(l.custoTotal) || 0), 0);
    linhas.push(h('li', h('.principal', h('.t', 'Total dos links'), custo > 0.005 ? h('.d', 'custo de ' + F.moeda(custo) + ' em comissões e disparos') : null),
      h('.lado', h('span.num.forte', F.moeda(a.totalLinks)))));
    if (!F.vazio(a.semLink)) {
      linhas.push(h('li', h('.principal', h('.t', 'Sem link'), h('.d.seps', h('span', 'venda direta no site ou por link não cadastrado'),
        a.totalVendas > 0 ? h('span', F.pct(a.semLink / a.totalVendas, 0) + ' das vendas') : null)),
        h('.lado', h('span.num.forte', F.moeda(a.semLink)))));
    }
    return linhas;
  },

  /** Disparo que já aconteceu: cobriu ou não o custo. "Ainda não" enquanto a campanha vende; encerrada, não cobre mais. */
  situacaoLink(l, encerrada) {
    if (l.agendado || l.sePagou === null || l.sePagou === undefined) return null;
    return l.sePagou ? h('span.chip.verde', 'Cobriu o custo') : h('span.chip.vermelho', encerrada ? 'Não cobriu' : 'Ainda não cobriu');
  },

  editarLink(l, c, op) {
    const tipos = App.sessao.listas.tiposLink;
    const novo = !l || l.cadastrado === false;
    const v0 = l || {};
    const x = TelaCaixa.folhaForm(novo ? 'Novo link de venda' : 'Link ' + l.codigo, [
      h('.grade.duas',
        Comp.campo({ rotulo: 'Código do link', nome: 'codigo', valor: v0.codigo || '', atributos: { autocapitalize: 'characters', spellcheck: 'false' },
          dica: 'O mesmo código do afiliado no portal, sem espaços.' }),
        Comp.campo({ rotulo: 'Nome', nome: 'nome', valor: v0.cadastrado === false ? '' : v0.nome || '', atributos: { placeholder: 'Ex.: Disparo 04, Influenciador, Canal VIP' } }),
        Comp.campo({ rotulo: 'Tipo', nome: 'tipo', tipo: 'select', valor: v0.tipo || tipos[0], opcoes: tipos }),
        Comp.campo({ rotulo: 'Comissão', nome: 'comissao', tipo: 'pct', valor: v0.comissaoPct || '', opcional: true, dica: 'Sobre a venda deste link.' }),
        Comp.campo({ rotulo: 'Endereço do link', nome: 'url', tipo: 'url', valor: v0.url || '', opcional: true, largo: true,
          dica: 'Vai nas mensagens dos grupos ligados a este link.' }),
        Comp.campo({ rotulo: 'Data e hora do disparo', nome: 'dataDisparo', tipo: 'datahora', valor: v0.dataDisparo || '', classe: 'disparo' }),
        Comp.campo({ rotulo: 'Mensagens entregues', nome: 'entregues', tipo: 'numero', valor: F.vazio(v0.entregues) || !v0.entregues ? '' : v0.entregues, opcional: true }),
        Comp.campo({ rotulo: 'Custo do disparo', nome: 'custo', tipo: 'moeda', valor: v0.custo || '' }),
        Comp.campo({ rotulo: 'Link ativo?', nome: 'ativo', tipo: 'simnao', valor: v0.ativo === undefined ? true : v0.ativo !== 'Não' }))
    ], 'Salvar link', { larga: true });
    const soDisparo = ['dataDisparo', 'entregues', 'custo'].map((k) => x.form.elements[k].closest('.campo'));
    const ajustar = () => { const disparo = x.form.elements.tipo.value === 'Disparo'; soDisparo.forEach((el) => { el.hidden = !disparo; }); };
    x.form.elements.tipo.addEventListener('change', ajustar);
    ajustar();
    if (!novo && App.pode('afiliados.excluir')) {
      const excluir = h('button.btn.perigo', { type: 'button', onclick: async () => {
        const r = await App.executar('afiliados.excluir', { codigo: l.codigo }, { botao: excluir, erroEm: x.erro, sucesso: 'Link excluído.' });
        if (r) { x.f.fechar(); op.aoMudar(); }
      } }, icone('lixo'), 'Excluir');
      x.f.rodape.insertBefore(excluir, x.f.rodape.firstChild);
    }
    x.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(x.form);
      if (!v.codigo) return TelaCaixa.erro(x.erro, 'Informe o código do link.');
      if (/\s/.test(v.codigo)) return TelaCaixa.erro(x.erro, 'O código do link não pode ter espaços.');
      const disparo = v.tipo === 'Disparo';
      const params = {
        codigoOriginal: novo ? '' : l.codigo, codigo: v.codigo, campanha: c.id, tipo: v.tipo, nome: v.nome, url: v.url,
        comissao: v.comissao ? (/%/.test(v.comissao) ? v.comissao : v.comissao + '%') : '',
        dataDisparo: disparo ? v.dataDisparo : '', entregues: disparo ? v.entregues : '', custo: disparo ? v.custo : '',
        ativo: v.ativo || 'Sim'
      };
      const r = await App.executar('afiliados.salvar', params, { botao: x.salvar, erroEm: x.erro, sucesso: 'Link salvo.' });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  }
};

// ---------------------------------------------------------------------
// Prêmios
// ---------------------------------------------------------------------

const TelaPremios = {
  async montar(el, campanha, ctx) {
    el.classList.add('alvos-44');
    trocar(el, Comp.esqueleto(2));
    let d;
    try {
      d = await App.ler('premios.listar', TelaCaixa.semVazios({ campanha: campanha }));
    } catch (e) {
      if (ctx.ativo()) trocar(el, Comp.falha(e, () => TelaPremios.montar(el, campanha, ctx)));
      return;
    }
    if (!ctx.ativo()) return;
    const op = { campanha: campanha, aoMudar: () => { App.esquecer(); TelaPremios.montar(el, campanha, ctx); } };
    const varias = !campanha;
    const pode = App.pode('premios.registrar');

    // A dinâmica ainda no ar já aceita o lançamento (cota premiada pode sair durante o dia), mas sem pressa: chip "No ar até"
    // e botão secundário. O Hoje só cobra as que já terminaram.
    const noAr = (p) => { const m = Cockpit.momento(p); return m && m.classList.contains('verde') ? m : null; };
    const quantasNoAr = d.pendentes.filter(noAr).length;
    const pendentes = h('section',
      h('.secao-titulo', h('h2', 'Prêmios para lançar'), d.pendentes.length ? h('span.suave', F.plural(d.pendentes.length, 'dinâmica', 'dinâmicas') +
        (quantasNoAr ? ', ' + quantasNoAr + ' ainda no ar' : '')) : null),
      d.pendentes.length
        ? h('ul.lista', { style: { marginTop: '12px' } }, d.pendentes.map((p) => h('li',
          h('span.ponto.' + (noAr(p) ? 'baixa' : p.status === 'Encerrada' ? 'alta' : 'media')),
          h('.principal',
            h('.t', p.nome),
            noAr(p) ? h('.chips', noAr(p)) : null,
            h('.d', [varias ? TelaCaixa.nomeCampanha(p.campanha) : null, F.quando(p.inicio),
              // O texto do prêmio costuma já trazer o valor ("R$ 1.000 em dinheiro"); aí o valor não se repete, e o IR vem somado.
              (p.premio && /R\$/.test(p.premio) ? p.premio : [p.premio, F.moeda(p.valor, { semCentavos: Number(p.valor) % 1 === 0 })].filter(Boolean).join(' · ')) +
                (p.recolheIr === 'Sim' ? (Number(p.ir) > 0.004 ? ' (' + F.moeda(Number(p.valor) + Number(p.ir), { semCentavos: (Number(p.valor) + Number(p.ir)) % 1 === 0 }) + ' com IR)' : ' + IR') : ' sem IR')].filter(Boolean).join(' · '))),
          pode ? h('.lado', h('button.btn.pequeno' + (noAr(p) ? '' : '.primario'), { type: 'button', onclick: () => TelaPremios.registrar({ campanha: p.campanha, dinamica: p }, op) }, 'Lançar prêmio')) : null)))
        : h('.cartao', { style: { marginTop: '12px' } }, h('p.suave', { style: { margin: 0 } }, 'Nenhuma dinâmica esperando o lançamento do prêmio.')));

    const botoes = [];
    const explica = [];
    if (pode) {
      botoes.push(h('button.btn.pequeno', { type: 'button', onclick: () => TelaPremios.registrar({ campanha: campanha }, op) }, icone('mais'), 'Lançar bilhete premiado'));
      explica.push('Bilhete premiado: cota premiada da tábua do regulamento ou prêmio da roleta premiada (pelo ID do pedido), sem dinâmica; o custo entra no orçamento de Dinâmicas premiadas.');
    }
    if (App.pode('premios.naoDistribuido')) {
      botoes.push(h('button.btn.pequeno', { type: 'button', onclick: () => TelaPremios.naoDistribuido(campanha, op) }, icone('mais'), 'Registrar prêmio não distribuído'));
      explica.push('Prêmio não distribuído: prêmio declarado que ninguém levou (cota não vendida ou não reclamada); volta como crédito da campanha.');
    }
    // Os botões ficam numa linha própria, embaixo do título: ao lado dele, o total quebrava em três linhas no celular.
    const lancados = h('section.cartao',
      h('.cabeca',
        h('.titulo', h('h2', 'Prêmios pagos'), d.premios.length ? h('.sub', F.moeda(d.totais.valor) + ' em prêmios + ' + F.moeda(d.totais.ir) + ' de IR') : null)),
      botoes.length ? h('.acoes', botoes) : null,
      explica.length ? h('p.suave.pequeno', { style: { marginBottom: 0 } }, explica.join(' ')) : null,
      d.premios.length ? h('ul.lista.dentro', d.premios.map((x) => TelaPremios.item(x, varias, op)))
        : h('p.suave', { style: { marginBottom: 0 } }, 'Nenhum prêmio lançado ainda.'),
      h('p.suave.pequeno', { style: { marginBottom: 0 } }, 'Só o número da cota (ou o ID do pedido, na roleta) e o valor. Os dados de cada ganhador (nome, CPF, contato) ficam com a agência, fora do app.'));
    trocar(el, [pendentes, lancados]);
  },

  /** "Cota 0012345" ou, na roleta premiada, "Pedido 98765". */
  nome(x) { return x.pedido ? 'Pedido ' + x.pedido : 'Cota ' + x.cota; },

  /** "da cota 0012345" ou "do pedido 98765, da roleta" (textos corridos). */
  deQuem(x) { return x.pedido ? 'do pedido ' + x.pedido + ', da roleta' : 'da cota ' + x.cota; },

  item(x, varias, op) {
    const partes = App.sessao.partes;
    const roleta = !!x.pedido;
    const acoes = [
      App.pode('premios.identificar') ? { rotulo: 'Corrigir cota ou pedido', icone: 'editar',
        detalhe: roleta ? 'Hoje: pedido ' + x.pedido + ', da roleta.' : 'Ex.: prêmio da roleta lançado com a cota 000000.',
        acao: () => TelaPremios.identificar(x, op) } : null,
      App.pode('premios.quemPagou') ? { rotulo: 'Mudar quem pagou', icone: 'editar',
        detalhe: 'Hoje: pago pela ' + TelaCaixa.curto(x.pagoPor) + '. O Livro caixa acompanha a troca.', acao: () => TelaPremios.quemPagou(x, op) } : null,
      App.pode('premios.excluir') ? { rotulo: 'Excluir este prêmio', icone: 'lixo', perigo: true, detalhe: 'O lançamento no caixa sai junto.', acao: async () => {
        const r = await App.executar('premios.excluir', { id: x.id }, { sucesso: (res) => 'Prêmio excluído.' + (res.mensagensApagadas ? ' A mensagem de resultado que ainda não tinha saído foi apagada.' : '') });
        if (r) op.aoMudar();
      } } : null
    ].filter(Boolean);
    const menu = acoes.length ? Comp.menu(TelaPremios.nome(x), acoes) : null;
    const extra = x.origem === 'Cota extra';
    // A Prime paga quase tudo: só o prêmio pago pela Indião ganha marca.
    const daIndiao = x.pagoPor === partes.indiao;
    // O ponto fica preso à palavra de antes: a linha nunca começa com "·".
    const meta = [x.dinamicaNome || (roleta ? 'Roleta premiada' : extra ? null : 'Bilhete premiado'), varias ? TelaCaixa.nomeCampanha(x.campanha) : null, F.data(x.data),
      x.ir > 0 ? 'IR ' + F.moeda(x.ir) + ' (' + F.pct(x.aliquota, 0) + ')' : 'sem IR',
      x.lancadoPor ? 'registrado por ' + x.lancadoPor : null].filter(Boolean).join(' · ');
    // Cota e valor na mesma linha, sem separador; o resto ocupa a largura toda (no celular, uma coluna de valores espremia tudo).
    return h('li',
      h('.principal',
        h('.t', { style: { display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: '0 12px' } },
          // O ID do pedido pode ser um código longo, sem espaço: quebra em qualquer ponto em vez de passar da tela.
          h('span', { style: { overflowWrap: 'anywhere', minWidth: 0 } }, TelaPremios.nome(x)), h('span.num', F.moeda(x.valor))),
        h('.d', meta),
        extra || daIndiao ? h('.chips', { style: { marginTop: '6px' } }, extra ? h('span.chip.roxo', roleta ? 'Fora da tábua' : 'Cota extra') : null,
          daIndiao ? h('span.chip.azul', 'Pago pela ' + TelaCaixa.curto(partes.indiao)) : null) : null),
      menu);
  },

  /** Troca quem pagou o prêmio (só são duas partes: confirma e passa para a outra). */
  async quemPagou(x, op) {
    const partes = App.sessao.partes;
    const nova = x.pagoPor === partes.indiao ? partes.prime : partes.indiao;
    const ir = x.ir > 0 ? ' O IR de ' + F.moeda(x.ir) + ' continua com a ' + TelaCaixa.curto(partes.prime) + ', que recolhe o DARF.' : '';
    const sim = await Comp.confirmar({
      titulo: 'Mudar quem pagou o prêmio?',
      texto: 'O prêmio ' + TelaPremios.deQuem(x) + ' (' + F.moeda(x.valor) + ') passa a ser pago pela ' + nova + '.' +
        (nova === partes.indiao ? ' Ele conta como aporte da ' + TelaCaixa.curto(partes.indiao) + ' na campanha.' : '') + ir,
      botao: 'Pago pela ' + TelaCaixa.curto(nova)
    });
    if (!sim) return;
    const r = await App.executar('premios.quemPagou', { id: x.id, pagoPor: nova }, { sucesso: 'Agora o prêmio está como pago pela ' + nova + '.' });
    if (r) op.aoMudar();
  },

  /**
   * "Como o prêmio saiu" (cota premiada ou roleta premiada) e o campo que identifica: o número da cota ou o ID do pedido.
   * Devolve os elementos e ler(v), que dá { cota } ou { pedido } (ou { erro }) a partir do formulário.
   */
  camposDeIdentificacao(base) {
    base = base || {};
    const forma = Comp.campo({ rotulo: 'Como o prêmio saiu', nome: 'forma', tipo: 'escolha', largo: true, valor: base.forma || 'cota',
      opcoes: [{ valor: 'cota', rotulo: 'Cota premiada' }, { valor: 'roleta', rotulo: 'Roleta premiada' }] });
    const cota = Comp.campo({ rotulo: 'Número da cota premiada', nome: 'cota', valor: base.cota || '',
      atributos: { inputmode: 'numeric', autocomplete: 'off', placeholder: 'Ex.: 0012345' } });
    const pedido = Comp.campo({ rotulo: 'ID do pedido', nome: 'pedido', valor: base.pedido || '',
      atributos: { autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'Como aparece no portal' },
      dica: 'O pedido que ganhou na roleta. A roleta não tem cota nem mensagem de resultado.' });
    const mostrar = (f) => { cota.hidden = f === 'roleta'; pedido.hidden = f !== 'roleta'; };
    forma.addEventListener('change', (ev) => { if (ev.target.name === 'forma') mostrar(ev.target.value); });
    mostrar(base.forma || 'cota');
    const ler = (v) => {
      if (v.forma === 'roleta') {
        const p = String(v.pedido || '').replace(/\s+/g, '');
        if (!p) return { erro: 'Informe o ID do pedido que ganhou na roleta.' };
        if (p.length > 64 || !/^[A-Za-z0-9#._\/-]+$/.test(p)) return { erro: 'O ID do pedido só pode ter letras, algarismos e os sinais # . _ / - (até 64).' };
        return { pedido: p };
      }
      const c = String(v.cota || '').replace(/\s+/g, '');
      if (!/^\d{1,12}$/.test(c)) return { erro: 'O número da cota só pode ter algarismos (ex.: 0012345).' };
      return { cota: c };
    };
    return { forma, cota, pedido, ler };
  },

  /** Troca a cota pelo pedido da roleta (ou o contrário), para corrigir prêmio lançado com a cota 000000. */
  identificar(x, op) {
    const roleta = !!x.pedido;
    // Cota só de zeros era como a roleta entrava antes: a correção já abre em "Roleta premiada".
    const zeros = !roleta && /^0+$/.test(String(x.cota || ''));
    const id = TelaPremios.camposDeIdentificacao({ forma: roleta || zeros ? 'roleta' : 'cota', cota: zeros ? '' : x.cota, pedido: x.pedido });
    const f = TelaCaixa.folhaForm('Corrigir cota ou pedido', [
      h('.cartao.compacto', { style: { background: 'var(--superficie-2)', boxShadow: 'none' } },
        h('div.forte', TelaPremios.nome(x) + ' · ' + F.moeda(x.valor)),
        h('div.suave.pequeno', [x.dinamicaNome || 'Bilhete premiado', F.data(x.data)].filter(Boolean).join(' · '))),
      h('.grade.duas', id.forma, id.cota, id.pedido),
      h('p.suave.pequeno', { style: { marginBottom: 0 } }, 'O lançamento do prêmio no Livro caixa acompanha a correção. O valor, o IR e quem pagou não mudam.')
    ], 'Salvar', { larga: true });
    f.salvar.addEventListener('click', async () => {
      const lido = id.ler(Comp.lerForm(f.form));
      if (lido.erro) return TelaCaixa.erro(f.erro, lido.erro);
      const r = await App.executar('premios.identificar', Object.assign({ id: x.id }, lido), { botao: f.salvar, erroEm: f.erro,
        sucesso: (res) => !res.mudou ? 'Nada mudou.' : 'Prêmio corrigido: agora é ' + (res.pedido ? 'o pedido ' + res.pedido + ', da roleta.' : 'a cota ' + res.cota + '.') +
          (res.mensagensRefeitas ? ' A mensagem de resultado que ainda não tinha saído foi refeita com a cota nova.'
            : res.mensagensApagadas ? ' A mensagem de resultado que ainda não tinha saído foi apagada.' : '') });
      if (r) { f.f.fechar(); op.aoMudar(); }
    });
  },

  /** Orçamento da dinâmica, só quando o texto do prêmio ainda não diz o mesmo valor. */
  orcamentoSeNovo(d) {
    if (!(Number(d.valor) > 0)) return null;
    const valor = F.moeda(d.valor, { semCentavos: Number(d.valor) % 1 === 0 }).replace(/\s/g, ' ');
    const escapado = valor.replace(/[.*+?^${}()|[\]\\$]/g, '\\$&');
    return new RegExp(escapado + '(?![\\d.,]*\\d)').test(String(d.premio || '').replace(/\s/g, ' ')) ? null : 'orçamento ' + valor;
  },

  registrar(alvo, op) {
    const d = alvo.dinamica || null;
    const listas = App.sessao.listas;
    const partes = App.sessao.partes;
    const previa = h('p.suave.pequeno', { 'aria-live': 'polite', style: { marginBottom: 0 } });
    const anunciar = h('label.check', h('input', { type: 'checkbox', name: 'anunciar', checked: !!d }),
      h('span', 'Gerar a mensagem de resultado para os grupos', h('div.suave.pequeno', 'Aparece em Mensagens no próximo horário de envio.')));
    const id = TelaPremios.camposDeIdentificacao();
    // A roleta não tem mensagem de resultado: o prêmio sai na hora, no portal.
    id.forma.addEventListener('change', (ev) => { if (ev.target.name === 'forma') anunciar.hidden = ev.target.value === 'roleta'; });
    const campos = [
      d ? h('.cartao.compacto', { style: { background: 'var(--superficie-2)', boxShadow: 'none' } },
        h('div.forte', d.nome), h('div.suave.pequeno', [F.quando(d.inicio), d.premio, TelaPremios.orcamentoSeNovo(d)].filter(Boolean).join(' · ')))
        : [h('p.suave', { style: { margin: 0 } }, 'Cota premiada da tábua do regulamento ou prêmio da roleta premiada, sem dinâmica; o custo entra no orçamento de Dinâmicas premiadas. Prêmio de dinâmica se lança em "Prêmios para lançar".'),
          TelaCaixa.campoCampanha(alvo.campanha || Comp.campanhaPadrao())],
      h('.grade.duas',
        id.forma, id.cota, id.pedido,
        Comp.campo({ rotulo: 'Valor do prêmio', nome: 'valor', tipo: 'moeda', valor: d ? d.valor : '' }),
        Comp.campo({ rotulo: 'Data do pagamento', nome: 'data', tipo: 'data', valor: App.hoje(), atributos: { max: chaveDia(App.hoje()) } }),
        Comp.campo({ rotulo: 'Origem do prêmio', nome: 'origem', tipo: 'select', valor: listas.origensPremio[0], opcoes: listas.origensPremio,
          dica: 'Tábua principal: conta nos bilhetes premiados declarados no regulamento. Cota extra: prêmio fora dessa tábua.' }),
        Comp.campo({ rotulo: 'Tipo do prêmio', nome: 'tipoPremio', tipo: 'select', valor: (d && d.tipoPremio) || 'Dinheiro', opcoes: ['Dinheiro', 'Bem'] }),
        Comp.campo({ rotulo: 'Recolhe IR?', nome: 'recolheIr', tipo: 'simnao', valor: d && d.recolheIr ? d.recolheIr : 'Sim',
          dica: 'Segue o regulamento: nem toda dinâmica recolhe IR.' }),
        Comp.campo({ rotulo: 'Quem pagou o prêmio', nome: 'pagoPor', tipo: 'escolha', largo: true, valor: partes.prime,
          opcoes: [partes.prime, partes.indiao], dica: 'Prêmio pago pela ' + TelaCaixa.curto(partes.indiao) + ' conta como aporte dela na campanha.' })),
      previa,
      anunciar,
      h('p.suave.pequeno', { style: { marginBottom: 0 } }, 'Não registre nome, CPF ou contato do ganhador: esses dados ficam com a agência.')
    ];
    const x = TelaCaixa.folhaForm(d ? 'Lançar prêmio' : 'Bilhete premiado', campos, 'Lançar prêmio', { larga: true });
    const mostrarIr = () => {
      const v = Comp.lerForm(x.form), valor = lerNumero(v.valor);
      const aliquota = (App.sessao.aliquotasIr || {})[v.tipoPremio];
      const indiao = v.pagoPor === partes.indiao;
      let texto = '';
      if (v.recolheIr === 'Não') texto = 'Sem IR: só o prêmio entra no Livro caixa' + (indiao ? ', em nome da ' + TelaCaixa.curto(partes.indiao) + '.' : '.');
      else if (valor > 0 && aliquota !== undefined && aliquota !== null) {
        texto = indiao
          // Quem paga o prêmio pode ser a Indião, mas o IR é sempre da Prime, que recolhe o DARF: a prévia diz as duas pontas.
          ? 'No Livro caixa: o prêmio de ' + F.moeda(valor) + ' pela ' + TelaCaixa.curto(partes.indiao) + ' e o IR de ' + F.moeda(valor * aliquota) +
            ' (' + F.pct(aliquota, 0) + ') pela ' + TelaCaixa.curto(partes.prime) + ', que recolhe o DARF.'
          : 'IR de ' + F.moeda(valor * aliquota) + ' (' + F.pct(aliquota, 0) + ') entra no Livro caixa junto com o prêmio: ' +
            F.moeda(valor * (1 + aliquota)) + ' no total.';
      }
      trocar(previa, texto);
      previa.hidden = !texto;
    };
    x.form.addEventListener('input', mostrarIr);
    x.form.addEventListener('change', mostrarIr);
    mostrarIr();
    x.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(x.form);
      const campanha = d ? alvo.campanha : v.campanha;
      if (!campanha) return TelaCaixa.erro(x.erro, 'Escolha a campanha.');
      const lido = id.ler(v);
      if (lido.erro) return TelaCaixa.erro(x.erro, lido.erro);
      if (!(lerNumero(v.valor) > 0)) return TelaCaixa.erro(x.erro, 'Informe o valor do prêmio.');
      const params = Object.assign({ campanha: campanha, dinamica: d ? d.id : '', valor: v.valor, data: v.data, origem: v.origem,
        tipoPremio: v.tipoPremio, recolheIr: v.recolheIr || 'Sim', pagoPor: v.pagoPor || partes.prime, anunciar: !lido.pedido && !!v.anunciar }, lido);
      const r = await App.executar('premios.registrar', params, { botao: x.salvar, erroEm: x.erro,
        sucesso: (res) => 'Prêmio lançado: ' + F.moeda(res.premio.valor) + (res.ir ? ' + ' + F.moeda(res.ir) + ' de IR' : '') + '.' +
          (res.premio.pagoPor === partes.indiao ? ' O prêmio entrou como pago pela ' + TelaCaixa.curto(partes.indiao) + '.' : '') +
          (res.mensagensDeResultado ? ' A mensagem de resultado já está em Mensagens.' : '') });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  },

  naoDistribuido(campanha, op) {
    const x = TelaCaixa.folhaForm('Prêmio não distribuído', [
      h('p.suave', { style: { margin: 0 } }, 'Prêmio declarado que não saiu (cota não vendida ou não reclamada). Volta como crédito da campanha, junto com o IR dele.'),
      h('.grade.duas',
        TelaCaixa.campoCampanha(campanha || Comp.campanhaPadrao()),
        Comp.campo({ rotulo: 'Valor do prêmio', nome: 'valor', tipo: 'moeda' }),
        Comp.campo({ rotulo: 'Tipo do prêmio', nome: 'tipoPremio', tipo: 'select', valor: 'Dinheiro', opcoes: ['Dinheiro', 'Bem'] }),
        Comp.campo({ rotulo: 'Recolhia IR?', nome: 'recolheIr', tipo: 'simnao', valor: true }),
        Comp.campo({ rotulo: 'Data', nome: 'data', tipo: 'data', valor: App.hoje() }),
        Comp.campo({ rotulo: 'Situação', nome: 'status', tipo: 'select', valor: 'Pago', opcoes: [{ valor: 'Pago', rotulo: 'Crédito já recebido' }, { valor: 'Comprometido', rotulo: 'A receber' }] }),
        Comp.campo({ rotulo: 'Descrição', nome: 'descricao', opcional: true, largo: true, atributos: { placeholder: 'Ex.: cota premiada 0045123 não vendida' } }),
        Comp.campo({ rotulo: 'Link do comprovante', nome: 'comprovante', tipo: 'url', opcional: true, largo: true }))
    ], 'Lançar crédito', { larga: true });
    x.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(x.form);
      if (!v.campanha) return TelaCaixa.erro(x.erro, 'Escolha a campanha.');
      if (!(lerNumero(v.valor) > 0)) return TelaCaixa.erro(x.erro, 'Informe o valor do prêmio.');
      const r = await App.executar('premios.naoDistribuido', TelaCaixa.semVazios(v), { botao: x.salvar, erroEm: x.erro,
        sucesso: (res) => 'Crédito de ' + F.moeda(res.credito) + ' lançado no caixa.' });
      if (r) { x.f.fechar(); op.aoMudar(); }
    });
  }
};

// ---------------------------------------------------------------------
// Documentos de legalização
// ---------------------------------------------------------------------

const TelaDocumentos = {
  async montar(el, campanha, ctx) {
    el.classList.add('alvos-44');
    trocar(el, Comp.esqueleto(2));
    let lista;
    try {
      lista = await App.ler('legalizacao.listar', TelaCaixa.semVazios({ campanha: campanha }));
    } catch (e) {
      if (ctx.ativo()) trocar(el, Comp.falha(e, () => TelaDocumentos.montar(el, campanha, ctx)));
      return;
    }
    if (!ctx.ativo()) return;
    const op = { aoMudar: () => { App.esquecer(); TelaDocumentos.montar(el, campanha, ctx); } };
    if (!lista.length) { trocar(el, h('.cartao', Comp.vazio('Nenhuma campanha', 'Os documentos de cada campanha aparecem aqui.'))); return; }
    // Campanha no ar primeiro, depois rascunhos; as encerradas ficam recolhidas (validade e pendências delas não têm mais pressa).
    const ordem = { Ativa: 0, Rascunho: 1, Encerrada: 2 };
    lista.sort((a, b) => (a.status in ordem ? ordem[a.status] : 3) - (b.status in ordem ? ordem[b.status] : 3));
    const abertas = lista.filter((c) => campanha || c.status !== 'Encerrada');
    const encerradas = lista.filter((c) => abertas.indexOf(c) < 0);
    trocar(el, [
      abertas.map((c) => TelaDocumentos.cartao(c, op, !!campanha)),
      encerradas.length ? h('details.ajustes', h('summary', 'Campanhas encerradas (' + encerradas.length + ')'),
        h('div.pilha', { style: { marginTop: '12px' } }, encerradas.map((c) => TelaDocumentos.cartao(c, op, false)))) : null
    ]);
  },

  cartao(c, op, naCampanha) {
    const pode = App.pode('legalizacao.enviar');
    // O botão fica embaixo do cabeçalho: ao lado dele, o nome da campanha quebrava em seis linhas no celular.
    const enviar = pode ? h('button.btn.pequeno' + (c.faltam.length ? '.primario' : ''), { type: 'button',
      onclick: () => TelaDocumentos.enviar(c, { tipo: c.faltam[0] }, op) }, icone('upload'), c.faltam.length > 1 ? 'Enviar documentos' : 'Enviar documento') : null;
    const sub = [naCampanha ? null : c.status, c.sorteio ? 'sorteio ' + F.data(c.sorteio) : null].filter(Boolean).join(' · ');
    return h('section.cartao',
      h('.cabeca',
        h('.titulo', naCampanha ? h('h2', 'Documentos') : h('h2', c.nome), sub ? h('.sub', sub) : null)),
      h('p.suave.pequeno', { style: { marginBottom: 0 } }, c.foraDaLotep ? 'Campanha fora da LOTEP: as mensagens saem sem número de autorização.'
        : c.autorizacao ? 'As mensagens saem com a autorização nº ' + c.autorizacao + '.' : 'As mensagens ainda não têm o nº da autorização.'),
      c.faltam.length ? Comp.aviso(c.status === 'Ativa' ? 'perigo' : 'alerta', 'Falta enviar: ' + c.faltam.join(' e ') + '.') : null,
      enviar ? h('.acoes', enviar) : null,
      c.documentos.length ? h('ul.lista.dentro', c.documentos.map((d) => {
        const menu = pode ? Comp.menu(d.tipo, [
          { rotulo: 'Enviar versão nova', icone: 'upload', acao: () => TelaDocumentos.enviar(c, d, op) },
          { rotulo: 'Tirar da campanha', icone: 'lixo', perigo: true, detalhe: 'O arquivo continua no Drive.', acao: async () => {
            const r = await App.executar('legalizacao.excluir', { campanha: c.campanha, tipo: d.tipo, numero: d.numero }, { sucesso: 'Documento retirado.' });
            if (r) op.aoMudar();
          } }
        ]) : null;
        // A autorização é "enviada"; em "Outro" o gênero depende do nome (CND, contrato...), então quem foi enviado é o arquivo.
        const enviadoPor = { 'Autorização LOTEP': 'enviada por ', 'Regulamento': 'enviado por ' }[d.tipo] || 'arquivo enviado por ';
        const renovar = pode && (d.situacao === 'Vencido' || d.situacao === 'Vence antes do sorteio');
        // Os botões ficam numa linha própria, na largura toda do item (ao lado do selo, não caberiam no celular),
        // com o menu ⋮ no fim dela; sem botões, o menu fica embaixo do selo.
        const acoes = renovar || d.link;
        return h('li' + (acoes ? '.com-acoes' : ''),
          h('.principal',
            // Em "Outro", o número é o nome do documento (ex.: CND federal).
            h('.t', d.tipo === 'Outro' && d.numero ? d.numero : d.tipo + (d.numero ? ' nº ' + d.numero : '')),
            h('.d', [d.emissao ? 'emissão ' + F.data(d.emissao) : null, d.validade ? 'validade ' + F.data(d.validade) : null,
              d.enviadoPor ? enviadoPor + d.enviadoPor : null].filter(Boolean).join(' · ') || ' ')),
          h('.lado', Comp.chipStatus(d.situacao), acoes ? null : menu),
          acoes ? h('.acoes.linha-toda',
            renovar ? h('button.btn.pequeno.primario', { type: 'button', onclick: () => TelaDocumentos.enviar(c, { tipo: d.tipo, numero: d.numero }, op) },
              icone('upload'), d.tipo === 'Autorização LOTEP' ? 'Enviar autorização renovada' : 'Enviar documento renovado') : null,
            d.link ? h('a.btn.pequeno.discreto', { href: d.link, target: '_blank', rel: 'noopener' }, icone('externo'), 'Abrir') : null,
            menu ? h('.menu-fim', menu) : null) : null);
      })) : h('p.suave', { style: { marginBottom: 0 } }, 'Nenhum documento enviado.'));
  },

  enviar(c, base, op) {
    base = base || {};
    const tipos = App.sessao.listas.tiposDocumento;
    const arq = Comp.arquivo({ rotulo: 'Arquivo', aceita: 'application/pdf,image/*', dica: 'PDF (ou foto). Fica na pasta Legalização da campanha, no Drive.' });
    const link = Comp.campo({ rotulo: 'Link do documento no Drive', nome: 'link', tipo: 'url', opcional: true, atributos: { placeholder: 'https://' } });
    const x = TelaCaixa.folhaForm('Enviar documento · ' + c.nome, [
      h('.grade.duas',
        Comp.campo({ rotulo: 'Documento', nome: 'tipo', tipo: 'select', valor: base.tipo || tipos[0], opcoes: tipos }),
        Comp.campo({ rotulo: 'Número ou nome', nome: 'numero', valor: base.numero || (base.tipo === 'Autorização LOTEP' ? c.autorizacao || '' : ''),
          dica: 'O nº da autorização LOTEP vai no rodapé de todas as mensagens. Em "Outro", escreva o nome do documento (ex.: CND federal).' }),
        Comp.campo({ rotulo: 'Emissão', nome: 'emissao', tipo: 'data', valor: base.emissao || '', opcional: true }),
        Comp.campo({ rotulo: 'Validade', nome: 'validade', tipo: 'data', valor: base.validade || '',
          dica: 'Obrigatória na autorização LOTEP. O app avisa 15 dias antes de vencer.' })),
      arq,
      h('details.ajustes', h('summary', 'Usar um link em vez do arquivo'), h('div', { style: { marginTop: '10px' } }, link))
    ], 'Enviar documento', { larga: true });
    x.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(x.form);
      if (v.tipo === 'Autorização LOTEP' && !v.numero) return TelaCaixa.erro(x.erro, 'Informe o número da autorização LOTEP.');
      if (v.tipo === 'Autorização LOTEP' && !v.validade) return TelaCaixa.erro(x.erro, 'Informe a validade da autorização LOTEP: é por ela que o app avisa quando renovar.');
      let arquivo;
      try { arquivo = await Comp.lerArquivo(arq, { limiteMb: 20 }); } catch (e) { return TelaCaixa.erro(x.erro, e.message); }
      if (!arquivo && !v.link) return TelaCaixa.erro(x.erro, 'Escolha o PDF do documento ou cole o link dele no Drive.');
      const params = TelaCaixa.semVazios({ campanha: c.campanha, tipo: v.tipo, numero: v.numero, emissao: v.emissao, validade: v.validade, link: arquivo ? '' : v.link });
      if (arquivo) params.arquivo = arquivo;
      const r = await App.executar('legalizacao.enviar', params, { botao: x.salvar, erroEm: x.erro,
        sucesso: (res) => (res.substituiu ? 'Documento substituído.' : 'Documento enviado.') + (res.autorizacaoAtualizada ? ' As próximas mensagens saem com o número novo.' : '') });
      if (r) {
        x.f.fechar();
        if (r.autorizacaoAtualizada) await App.atualizarCampanhas();
        op.aoMudar();
      }
    });
  }
};
</script>
  <script>
/* =====================================================================
   Configurações (só o gestor): taxas e regras do app, usuários e links
   de acesso, percentuais das partes, grupos de WhatsApp, modelos de
   mensagem, regras de agenda, biblioteca de dinâmicas e auditoria.
   Cada seção é uma tela (#config/usuarios ...) com voltar para o início.
   Depois de salvar, a seção se redesenha no lugar, sem voltar ao topo.
   ===================================================================== */

App.telas.config = {
  area: 'config',
  titulo: 'Configurações',
  pode: () => App.pode('config.ler'),
  async render(ctx) {
    ctx.corpo.classList.add('estreita');
    const secao = TelaConfig.SECOES.filter((s) => s.id === ctx.partes[0])[0];
    if (!secao) { await TelaConfig.inicio(ctx); return; }
    ctx.topo({ titulo: secao.titulo, voltar: 'config' });
    await TelaConfig[secao.id](ctx, true);
  }
};

const TelaConfig = {
  SECOES: [
    { id: 'parametros', titulo: 'Taxas e regras do app', icone: 'config', detalhe: 'Taxas, IR, Simples, tetos do orçamento, fases, horários e agendas' },
    { id: 'usuarios', titulo: 'Usuários e acessos', icone: 'usuario', detalhe: 'Quem usa o app, com que perfil, e a senha e as entradas de cada um' },
    { id: 'partes', titulo: 'Partes e percentuais', icone: 'caixa', detalhe: 'Divisão do resultado e dos aportes, padrão e por campanha' },
    { id: 'grupos', titulo: 'Grupos de WhatsApp', icone: 'mensagens', detalhe: 'Comunidade e grupos que recebem as mensagens, com o link de venda de cada um' },
    { id: 'portal', titulo: 'Pedidos do portal', icone: 'vendas', detalhe: 'A venda de hoje em tempo real, pelo webhook do portal' },
    { id: 'modelos', titulo: 'Modelos de mensagem', icone: 'editar', detalhe: 'Os textos das mensagens, com variações para não repetir' },
    { id: 'regras', titulo: 'Sugestões por evento', icone: 'calendario', detalhe: 'Que dinâmica sugerir para cada evento da agenda (aba Regras de agenda da planilha)' },
    { id: 'biblioteca', titulo: 'Biblioteca de dinâmicas', icone: 'campanhas', detalhe: 'Custo, prêmio padrão, regulamento e IR de cada dinâmica' },
    { id: 'auditoria', titulo: 'Auditoria', icone: 'relogio', detalhe: 'Quem mudou o quê e quando, com o valor de antes e o de depois' },
    { id: 'verificacao', titulo: 'Verificar a instalação', icone: 'ok', detalhe: 'Confere planilha, listas suspensas, usuários, gatilhos, agenda, pasta no Drive e endereço do app, e mede a velocidade' }
  ],

  /** O endereço definitivo do site (o mesmo ENDERECO_SITE do Config.gs). */
  SITE: 'https://erp.indiaodasorte.com',

  PERFIS_INFO: {
    'Gestor': 'Vê e altera tudo, inclusive taxas, percentuais e acessos.',
    'Influenciador e sócio': 'Acompanha campanhas, calendário e caixa e confirma presença nas dinâmicas.',
    'Operação': 'Envia as vendas do portal e lança prêmios pagos e documentos.',
    'Responsável pelos envios': 'Vê as mensagens do dia, copia e marca o que enviou.'
  },

  // ----- peças comuns -----

  /** Linha de lista que abre com toque, Enter ou espaço, com a seta no fim. */
  item(abrir, filhos, classe) {
    return h('li.clicavel' + (classe || ''), { role: 'button', tabindex: '0', onclick: abrir, onkeydown: chaveTecla(abrir) },
      filhos, icone('avancar', 'seta'));
  },

  folha(titulo, campos, rotulo, op) { return TelaCaixa.folhaForm(titulo, campos, rotulo, op); },
  erro(el, msg) { return TelaCaixa.erro(el, msg); },
  curto(nome) { return TelaCaixa.curto(nome); },

  /** Botão no rodapé da folha, à esquerda dos outros (Excluir, Usar o padrão...). */
  botaoExtra(x, rotulo, classe, acao) {
    const b = h('button.btn' + (classe || '.discreto'), { type: 'button', onclick: () => acao(b) }, rotulo);
    x.f.rodape.insertBefore(b, x.f.rodape.firstChild);
    return b;
  },

  /** Frações do servidor em texto: 0,125 -> "12,5%". */
  pct(v) { return F.vazio(v) ? '–' : F.campoPct(v) + '%'; },
  /** Pontos percentuais digitados -> texto que o servidor entende como percentual: 40 -> "40%". */
  textoPct(n) { return String(Math.round(n * 10000) / 10000).replace('.', ',') + '%'; },
  /** Número digitado num campo com % ao lado (ignora um % que a pessoa tenha digitado). */
  lerPct(v) { return lerNumero(String(v === undefined || v === null ? '' : v).replace('%', '')); },

  /** Recarrega a seção sem sair dela; um erro vira aviso rápido. */
  recarregador(ctx, secao, extra) {
    return () => { App.esquecer(); TelaConfig[secao](ctx, false, extra).catch((e) => Comp.rapido(e.message, 'erro')); };
  },

  /** Botão do topo para criar: rótulo curto ("Nova", "Novo") para o título caber no celular. */
  botaoNovo(rotulo, acao, titulo) {
    return h('button.btn.primario', { type: 'button', onclick: acao, title: titulo || null }, icone('mais'), h('span', rotulo));
  },

  // =====================================================================
  // Início
  // =====================================================================

  async inicio(ctx) {
    ctx.topo({ titulo: 'Configurações', sub: 'Só o gestor vê esta área', voltar: 'hoje' });
    const c = await App.ler('config.ler', {}, 60);
    if (!ctx.ativo()) return;
    const p = TelaConfig.porChave(c.parametros);
    const faltas = [];
    if (p.simples && F.vazio(p.simples.valor)) {
      faltas.push({ texto: 'Falta a alíquota do Simples da Indião da Sorte. Sem ela, a distribuição não calcula o imposto sobre o que a Indião recebe.',
        rota: 'config/parametros?editar=simples' });
    }
    if (p.cal_influenciador && !p.cal_influenciador.valor) {
      faltas.push({ texto: 'Falta a agenda do influenciador. Sem ela, as sugestões não consideram lives, viagens e folgas.',
        rota: 'config/parametros?editar=cal_influenciador' });
    }
    (c.avisos || []).forEach((a) => faltas.push({ texto: a, rota: 'config/parametros' }));

    const partes = App.sessao.partes;
    const comAcesso = c.usuarios.filter((u) => u.perfil).length;
    const portal = App.sessao.portal;
    const detalhes = {
      usuarios: F.plural(comAcesso, 'pessoa com acesso', 'pessoas com acesso') + '. Perfil, senha e entradas de cada uma.',
      portal: portal && portal.ligado ? 'Ligado: a venda de hoje entra a cada 5 minutos, pelo webhook do portal.'
        : 'Desligado: as vendas entram só pelo resumo do portal. Ligue para ver a venda de hoje em tempo real.',
      partes: 'Divisão do resultado e dos aportes entre ' + TelaConfig.curto(partes.indiao) + ' e ' + TelaConfig.curto(partes.prime) + ', padrão e por campanha'
    };
    ctx.mostrar([
      faltas.map((x) => Comp.aviso('alerta', x.texto, h('div', { style: { marginTop: '8px' } },
        h('a.btn.pequeno', { href: '#' + x.rota, onclick: App.cliqueNav(x.rota) }, 'Resolver')))),
      // No celular, Sua conta vem primeiro: no computador ela fica no rodapé da barra lateral.
      h('ul.lista.secoes', [TelaConfig.item(() => TelaEntrada.conta(), [
        h('span.avatar', { 'aria-hidden': 'true' }, TelaConfig.iniciais(App.sessao.usuario.nome)),
        h('.principal', h('.t', 'Sua conta'), h('.d', App.via === 'senha' ? 'Trocar a senha e sair do app' : App.via === 'dono' ? 'Como você entrou no app' : 'Criar a sua senha'))
      ], '.so-celular')].concat(TelaConfig.SECOES.map((s) => TelaConfig.item(() => App.ir('config/' + s.id), [
        icone(s.icone),
        h('.principal', h('.t', s.titulo), h('.d', detalhes[s.id] || s.detalhe))
      ])))),
      h('.colunas.duas', TelaConfig.cartaoRotina(c.ultimaRotina), TelaConfig.cartaoSobre(c))
    ]);
  },

  cartaoRotina(r) {
    if (!r) {
      return h('section.cartao', h('h2', 'Rotina diária'),
        Comp.aviso('alerta', 'Ainda não rodou. No editor do Apps Script, rode instalar() uma vez: ela cria os acionadores que atualizam o caixa, as sugestões e as mensagens todo dia.'));
    }
    const quando = lerData(r.quando);
    const atrasada = !quando || App.agora() - quando > 26 * 3600000;
    const erros = r.erros || [];
    const etapas = Array.isArray(r.etapas) ? r.etapas.length : Number(r.etapas || 0);
    // "7 de 7 etapas" conta as rodadas do dia; registros antigos só tinham quantas rodaram na última.
    const feitas = r.total ? F.int(r.concluidas || 0) + ' de ' + F.int(r.total) : F.int(etapas);
    const estado = atrasada ? h('span.chip.vermelho', 'Atrasada') : erros.length ? h('span.chip.amarelo', 'Com erros') : h('span.chip.verde', 'Em dia');
    return h('section.cartao',
      h('.cabeca', h('h2', 'Rotina diária'), estado),
      h('dl.valores',
        h('dt', 'Última execução'), h('dd', quando ? F.dataHora(quando) : '–'),
        h('dt', 'Etapas feitas'), h('dd', feitas),
        r.segundos ? [h('dt', 'Duração'), h('dd', F.plural(r.segundos, 'segundo', 'segundos'))] : null),
      atrasada ? Comp.aviso('perigo', 'Não roda há mais de um dia. Sem ela, o caixa, as sugestões e as mensagens não se atualizam sozinhos. Confira os acionadores no editor do Apps Script.') : null,
      erros.length ? Comp.aviso('alerta', h('div', h('strong', F.plural(erros.length, 'erro', 'erros') + ' na última execução'),
        h('ul.erros', erros.map((e) => h('li', e))))) : null);
  },

  cartaoSobre(c) {
    const u = App.sessao.usuario;

  porChave(lista) { const o = {}; (lista || []).forEach((x) => { o[x.chave] = x; }); return o; },

  unidade(x) { return x.unidade || TelaConfig.UNIDADES[x.chave] || ''; },

  /** Valor como a pessoa lê: "12%", "8h", "R$ 0,25", "3 dias". Vazio -> null. */
  mostrarValor(x) {
    if (F.vazio(x.valor)) return null;
    if (x.tipo === 'percentual') return TelaConfig.pct(x.valor);
    if (x.tipo === 'hora') return x.valor + 'h';
    if (x.chave === 'custo_mensagem') return F.moeda(x.valor);
    if (x.tipo === 'numero') {
      const u = TelaConfig.unidade(x);
      // "4 por grupo por dia" repetiria o rótulo ("Mensagens por grupo por dia"): unidades com "por" ficam só no editor.
      return F.decimal(x.valor, Number(x.valor) % 1 ? 2 : 0) + (u && !/^%|^R\$$|^por\b/.test(u) ? ' ' + u : '');
    }
    return String(x.valor);
  },

  async parametros(ctx, primeira) {
    const c = await App.ler('config.ler', {}, 60);
    if (!ctx.ativo()) return;
    const p = TelaConfig.porChave(c.parametros);
    const recarregar = TelaConfig.recarregador(ctx, 'parametros');
    const usados = {};
    const blocos = [Comp.aviso('info', 'Toda mudança fica registrada na Auditoria, com o valor de antes e o de depois.')];
    TelaConfig.GRUPOS_PARAMETROS.concat([['Outros', null]]).forEach((g) => {
      const chaves = g[1] ? g[1].filter((k) => p[k]) : c.parametros.map((x) => x.chave).filter((k) => !usados[k]);
      chaves.forEach((k) => { usados[k] = true; });
      if (!chaves.length) return;
      blocos.push(h('section.cartao', h('h2', g[0]),
        h('ul.lista.dentro', chaves.map((k) => TelaConfig.linhaParametro(p[k], recarregar)))));
    });
    ctx.mostrar(blocos);
    const alvo = primeira && ctx.query.editar && p[ctx.query.editar];
    if (alvo) TelaConfig.editarParametro(alvo, recarregar);
  },

  linhaParametro(x, recarregar) {
    const v = TelaConfig.mostrarValor(x);
    const falta = v === null ? h('span.chip.amarelo', 'Cadastrar') : null;
    const abrir = () => TelaConfig.editarParametro(x, recarregar);
    if (x.tipo === 'texto') {
      return TelaConfig.item(abrir, [h('.principal', h('.t', x.rotulo), v !== null ? h('.d', v) : null), falta ? h('.lado', falta) : null]);
    }
    return TelaConfig.item(abrir, [h('.principal', h('.t', x.rotulo)), h('.lado', v !== null ? h('strong.num', v) : falta)]);
  },

  editarParametro(x, recarregar) {
    const u = TelaConfig.unidade(x);
    const tipo = x.tipo === 'percentual' ? 'pct' : x.chave === 'custo_mensagem' ? 'moeda' : x.tipo === 'texto' ? 'text' : 'numero';
    const sufixo = x.tipo === 'hora' ? 'h' : tipo === 'numero' && u && u.length <= 6 ? u : undefined;
    const atual = TelaConfig.mostrarValor(x);
    // O Simples pode ficar vazio na planilha (o app avisa), mas aqui não faz sentido apagar: sem ele a distribuição erra.
    const opcional = x.opcional && x.chave !== 'simples';
    const z = TelaConfig.folha(x.rotulo, [
      Comp.campo({ rotulo: 'Valor' + (tipo === 'numero' && u && !sufixo ? ' (' + u + ')' : ''), nome: 'valor', tipo: tipo, valor: x.valor,
        opcional: opcional, sufixo: sufixo, dica: TelaConfig.DICAS[x.chave] || null,
        atributos: x.tipo === 'texto' ? { spellcheck: 'false', autocapitalize: 'off' } : {} }),
      h('p.suave.pequeno', { style: { margin: 0 } }, 'Hoje: ' + (atual || 'vazio') + '. Vale para os próximos cálculos.')
    ], 'Salvar');
    z.salvar.addEventListener('click', async () => {
      let valor = Comp.lerForm(z.form).valor;
      if (valor === '' && !opcional) return TelaConfig.erro(z.erro, 'Preencha o valor.');
      if (valor !== '' && x.tipo !== 'texto') {
        const n = x.tipo === 'percentual' ? TelaConfig.lerPct(valor) : lerNumero(valor);
        if (n === null || isNaN(n)) return TelaConfig.erro(z.erro, 'Use só números, como 12 ou 12,5.');
        if (x.tipo === 'percentual') valor = TelaConfig.textoPct(n);
      }
      const ler = (v) => TelaConfig.mostrarValor(Object.assign({}, x, { valor: v })) || 'vazio';
      const r = await App.executar('config.salvarParametro', { chave: x.chave, valor: valor }, {
        botao: z.salvar, erroEm: z.erro, sucesso: (d) => x.rotulo + ': ' + ler(d.antes) + ' → ' + ler(d.depois) + '.' });
      if (r) { z.f.fechar(); recarregar(); }
    });
    setTimeout(() => { const i = z.form.querySelector('input'); if (i) i.focus(); }, 60);
  },

  async partes(ctx) {
    const d = await App.ler('partes.listar', {}, 60);

    const recarregar = TelaConfig.recarregador(ctx, 'partes');
    const ind = d.partes.indiao, pri = d.partes.prime;
    const ci = TelaConfig.curto(ind), cp = TelaConfig.curto(pri);
    const de = (linhas, parte, campo) => { const l = (linhas || []).filter((x) => x.parte === parte)[0]; return l ? l[campo] : null; };
    const dupla = (linhas, campo) => ci + ' ' + TelaConfig.pct(de(linhas, ind, campo)) + ' · ' + cp + ' ' + TelaConfig.pct(de(linhas, pri, campo));
    const padrao = d.padrao || [];
    const obs = de(padrao, ind, 'obs');
    ctx.mostrar([
      Comp.aviso('info', 'O % do resultado divide o lucro ou o prejuízo da campanha. O % do aporte diz quanto cada parte põe de dinheiro nela. Os dois somam 100% entre as partes.'),
      h('section.cartao',
        h('.cabeca', h('h2', 'Padrão'), h('button.btn.pequeno', { type: 'button', onclick: () => TelaConfig.editarPartes(null, d, recarregar) }, icone('editar'), 'Alterar')),
        padrao.length ? Comp.tabela([
          { titulo: 'Parte', valor: (l) => l },
          { titulo: 'Resultado', dir: true, valor: (l) => TelaConfig.pct(de(padrao, l, 'pctResultado')) },
          { titulo: 'Aporte', dir: true, valor: (l) => TelaConfig.pct(de(padrao, l, 'pctAporte')) }
        ], [ind, pri], { empilha: false }) : Comp.aviso('alerta', 'O padrão não está cadastrado.'),
        h('p.suave.pequeno', (obs ? obs + '. ' : '') + 'Vale para toda campanha sem percentual próprio.')),
      h('section.cartao',
        h('.cabeca', h('h2', 'Por campanha'), h('span.suave.pequeno', h('span.so-celular', 'Toque para mudar'), h('span.so-computador', 'Clique para mudar'))),
        d.campanhas.length ? Comp.tabela([
          { titulo: 'Campanha', valor: (c) => h('div', h('strong', c.nome), h('div.suave.pequeno', c.status)) },
          { titulo: 'Resultado', valor: (c) => dupla(c.vigente, 'pctResultado') },
          { titulo: 'Aporte', valor: (c) => dupla(c.vigente, 'pctAporte') },
          { titulo: 'Origem', valor: (c) => c.proprios ? h('span.chip.azul', 'Próprio') : h('span.chip', 'Padrão') }
        ], d.campanhas, { clicavel: (c) => TelaConfig.editarPartes(c, d, recarregar) }) : Comp.vazio('Nenhuma campanha', 'As campanhas aparecem aqui quando forem criadas.'))
    ]);
  },

  editarPartes(c, d, recarregar) {
    const ind = d.partes.indiao, pri = d.partes.prime;
    const ci = TelaConfig.curto(ind), cp = TelaConfig.curto(pri);
    const fonte = c ? (c.proprios ? c.linhas : c.vigente) : d.padrao;
    const de = (parte, campo) => { const l = (fonte || []).filter((x) => x.parte === parte)[0]; return l ? l[campo] : null; };
    const proprias = c && c.proprios ? c.linhas : !c ? d.padrao : [];
    const vigencia = (proprias || []).map((x) => x.vigencia).filter(Boolean)[0] || '';
    const previa = h('p.suave', { 'aria-live': 'polite', style: { margin: 0 } });
    const z = TelaConfig.folha(c ? 'Percentuais de ' + c.nome : 'Percentuais padrão', [
      c && !c.proprios ? Comp.aviso('info', 'Esta campanha usa o padrão. Salvar aqui cria percentuais só para ela.') : null,
      !c ? Comp.aviso('alerta', 'O padrão vale para todas as campanhas sem percentual próprio, inclusive as encerradas, e muda a posição entre as partes.') : null,
      h('.grade.duas',
        Comp.campo({ rotulo: ci + ': % do resultado', nome: 'resultado', tipo: 'pct', valor: de(ind, 'pctResultado') }),
        Comp.campo({ rotulo: ci + ': % do aporte', nome: 'aporte', tipo: 'pct', valor: de(ind, 'pctAporte') })),
      previa,
      Comp.campo({ rotulo: 'Observação', nome: 'obs', valor: de(ind, 'obs') || '', opcional: true, dica: 'Ex.: o que foi combinado e quando.' })
    ], 'Salvar', { larga: true });
    const valido = (n) => n !== null && !isNaN(n) && n >= 0 && n <= 100;
    const ler = () => { const v = Comp.lerForm(z.form); return { r: TelaConfig.lerPct(v.resultado), a: TelaConfig.lerPct(v.aporte), obs: v.obs }; };
    const atualizar = () => {
      const x = ler();
      previa.textContent = valido(x.r) && valido(x.a)
        ? 'A ' + cp + ' fica com ' + F.campoPct((100 - x.r) / 100) + '% do resultado e ' + F.campoPct((100 - x.a) / 100) + '% do aporte.'
        : 'Use valores de 0 a 100.';
    };
    z.form.addEventListener('input', atualizar);
    atualizar();
    if (c && c.proprios) {
      TelaConfig.botaoExtra(z, 'Usar o padrão', '.discreto', async (b) => {
        const r = await App.executar('partes.usarPadrao', { campanha: c.campanha }, { botao: b, erroEm: z.erro, sucesso: c.nome + ' voltou a usar o padrão.' });
        if (r) { z.f.fechar(); recarregar(); }
      });
    }
    z.salvar.addEventListener('click', async () => {
      const x = ler();
      if (!valido(x.r) || !valido(x.a)) return TelaConfig.erro(z.erro, 'Use percentuais de 0 a 100.');
      const linha = (parte, r, a) => ({ parte: parte, pctResultado: TelaConfig.textoPct(r), pctAporte: TelaConfig.textoPct(a), obs: x.obs, vigencia: vigencia });
      const res = await App.executar('partes.salvar', { campanha: c ? c.campanha : '', partes: [linha(ind, x.r, x.a), linha(pri, 100 - x.r, 100 - x.a)] },
        { botao: z.salvar, erroEm: z.erro, sucesso: 'Percentuais salvos.' });
      if (res) { z.f.fechar(); recarregar(); }
    });
  },

  // =====================================================================
  // Grupos de WhatsApp
  // =====================================================================

  ativo(g) { return g.ativo === '' || g.ativo === undefined || g.ativo === null || g.ativo === true || g.ativo === 'Sim'; },

  async grupos(ctx) {
    const campanhas = App.sessao.campanhas || [];
    // Os links de todas as campanhas numa chamada só (uma por campanha gastava as execuções simultâneas do Google).
    const [grupos, porCampanha] = await Promise.all([
      App.ler('grupos.listar', {}, 60),
      App.ler('vendas.linksTodas', {}, 120).catch(() => ({}))
    ]);
    if (!ctx.ativo()) return;
    const dados = { campanhas: campanhas, linksPor: {}, porCodigo: {} };
    campanhas.forEach((c) => {
      const lista = porCampanha[c.id] || [];
      dados.linksPor[c.id] = lista;
      lista.forEach((l) => { dados.porCodigo[l.codigo] = Object.assign({ campanha: c.id }, l); });
    });
    const recarregar = TelaConfig.recarregador(ctx, 'grupos');
    ctx.topo({ titulo: 'Grupos de WhatsApp', voltar: 'config', acoes: [TelaConfig.botaoNovo('Novo', () => TelaConfig.editarGrupo(null, dados, recarregar), 'Cadastrar um grupo')] });
    const ativas = campanhas.filter((c) => c.status === 'Ativa');
    const ordem = (g) => (g.tipo === 'Comunidade' ? 0 : 1) + (TelaConfig.ativo(g) ? 0 : 2);
    const ordenados = grupos.slice().sort((a, b) => ordem(a) - ordem(b) || String(a.nome).localeCompare(String(b.nome)));
    ctx.mostrar([
      Comp.aviso('info', 'A comunidade recebe os avisos oficiais e os grupos recebem as chamadas de venda. Cada grupo pode ter um link de venda próprio em cada campanha; sem ele, a mensagem usa o link de venda da campanha.'),
      ordenados.length ? h('ul.lista', ordenados.map((g) => TelaConfig.linhaGrupo(g, dados, ativas, () => TelaConfig.editarGrupo(g, dados, recarregar))))
        : h('.cartao', Comp.vazio('Nenhum grupo cadastrado', 'Sem grupos, as mensagens saem para uma "Comunidade" e uns "Grupos" genéricos.'))
    ]);
  },

  /** Link de venda de cada campanha ativa ("Hilux: Grupo VIP 3" ou "Hilux: link da campanha") e códigos de outras campanhas. */
  linhaGrupo(g, dados, ativas, abrir) {
    const ativo = TelaConfig.ativo(g);
    const codigos = g.links || [];
    const links = ativas.map((c) => {
      const k = codigos.filter((x) => dados.porCodigo[x] && dados.porCodigo[x].campanha === c.id)[0];
      return c.nome + ': ' + (k ? dados.porCodigo[k].nome || k : 'link da campanha');
    });
    codigos.forEach((k) => {
      const l = dados.porCodigo[k];
      if (l && ativas.some((c) => c.id === l.campanha)) return;
      links.push(l ? TelaCaixa.nomeCampanha(l.campanha) + ': ' + (l.nome || k) : k + ' (link apagado)');
    });
    return TelaConfig.item(abrir, [
      h('.principal',
        h('.t', g.nome),
        h('.d', [g.tipo, F.vazio(g.membros) ? null : F.plural(g.membros, 'membro', 'membros')].filter(Boolean).join(' · ')),
        links.length ? h('.d', 'Link de venda: ' + links.join(' · ')) : null),
      ativo ? null : h('.lado', h('span.chip', 'Não recebe'))
    ], ativo ? '' : '.inativo');
  },

  editarGrupo(g, dados, recarregar) {
    const novo = !g;
    const codigos = novo ? [] : (g.links || []);
    const campanhaDe = (k) => (dados.porCodigo[k] ? dados.porCodigo[k].campanha : null);
    const mostradas = dados.campanhas.filter((c) => c.status !== 'Encerrada' || codigos.some((k) => campanhaDe(k) === c.id));
    const selects = mostradas.map((c) => {
      const lista = dados.linksPor[c.id] || [];
      const atual = codigos.filter((k) => campanhaDe(k) === c.id)[0] || '';
      return Comp.campo({ rotulo: c.nome, nome: 'link_' + c.id, tipo: 'select', valor: atual,
        opcoes: [{ valor: '', rotulo: 'Sem link próprio (usa o da campanha)' }].concat(lista.map((l) => ({
          valor: l.codigo, rotulo: l.codigo + ' · ' + l.nome + (l.ativo ? '' : ' (inativo)') }))),
        dica: lista.length ? null : 'Esta campanha ainda não tem links cadastrados.' });
    });
    const apagados = codigos.filter((k) => !dados.porCodigo[k]);
    const z = TelaConfig.folha(novo ? 'Grupo novo' : g.nome, [
      h('.grade.duas',
        Comp.campo({ rotulo: 'Nome', nome: 'nome', valor: novo ? '' : g.nome }),
        Comp.campo({ rotulo: 'Tipo', nome: 'tipo', tipo: 'select', valor: novo ? 'Grupo' : g.tipo,
          opcoes: [{ valor: 'Grupo', rotulo: 'Grupo (chamadas de venda)' }, { valor: 'Comunidade', rotulo: 'Comunidade (avisos oficiais)' }] }),
        Comp.campo({ rotulo: 'Membros', nome: 'membros', tipo: 'numero', valor: novo ? '' : g.membros, opcional: true }),
        Comp.campo({ rotulo: 'Recebe mensagens', nome: 'ativo', tipo: 'simnao', valor: novo || TelaConfig.ativo(g) ? 'Sim' : 'Não' })),
      selects.length ? h('h3.subtitulo', 'Link de venda do grupo em cada campanha') : null,
      selects.length ? h('.grade.duas', selects) : null,
      apagados.length ? Comp.aviso('alerta', 'O código ' + apagados.join(', ') + ' não existe mais nos links e sai do grupo ao salvar.') : null
    ], novo ? 'Cadastrar' : 'Salvar', { larga: true });
    if (!novo) {
      TelaConfig.botaoExtra(z, [icone('lixo'), 'Excluir'], '.discreto.perigo', async (b) => {
        const r = await App.executar('grupos.excluir', { nome: g.nome }, { botao: b, erroEm: z.erro, sucesso: 'Grupo excluído.' });
        if (r) { z.f.fechar(); recarregar(); }
      });
    }
    z.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(z.form);
      if (!v.nome) return TelaConfig.erro(z.erro, 'Dê um nome ao grupo.');
      if (v.membros && !(lerNumero(v.membros) >= 0)) return TelaConfig.erro(z.erro, 'O número de membros precisa ser um número.');
      const escolhidos = mostradas.map((c) => v['link_' + c.id]).filter(Boolean);
      const mantidos = codigos.filter((k) => campanhaDe(k) && !mostradas.some((c) => c.id === campanhaDe(k)));
      const params = { nome: v.nome, tipo: v.tipo, membros: v.membros, ativo: v.ativo || 'Sim', links: escolhidos.concat(mantidos).join(', ') };
      if (!novo) params.nomeOriginal = g.nome;
      const r = await App.executar('grupos.salvar', params, { botao: z.salvar, erroEm: z.erro, sucesso: novo ? 'Grupo cadastrado.' : 'Grupo salvo.' });
      if (r) { z.f.fechar(); recarregar(); }
    });
  },

  // =====================================================================
  // Modelos de mensagem
  // =====================================================================

  MOMENTOS_DINAMICA: ['ANUNCIO', 'NO_AR', 'ULTIMA_CHAMADA', 'RESULTADO'],
  /** Na ordem em que as mensagens saem ao longo do dia e da campanha. */
  ORDEM_MOMENTOS: ['BOM_DIA', 'ANUNCIO', 'NO_AR', 'ULTIMA_CHAMADA', 'RESULTADO', 'LIVE', 'CONTAGEM', 'MARCO', 'ENTREGA'],

  ordenarMomentos(lista) {
    const pos = (m) => { const i = TelaConfig.ORDEM_MOMENTOS.indexOf(m.codigo); return i < 0 ? 99 : i; };
    return lista.slice().sort((a, b) => pos(a) - pos(b));
  },

  /** "C1" = anúncio da C1; "C1:NO_AR" = no ar da C1; "BOM_DIA" = texto geral do momento. */
  lerCodigo(codigo) {
    const t = String(codigo || '').toUpperCase();
    const m = t.match(/^([A-Z]\d{1,2})(?::([A-Z_]+))?$/);
    return m ? { dinamica: m[1], momento: m[2] || 'ANUNCIO' } : { dinamica: '', momento: t };
  },

  montarCodigo(momento, dinamica) {
    if (!dinamica) return momento;
    return momento === 'ANUNCIO' ? dinamica : dinamica + ':' + momento;
  },

  async modelos(ctx, primeira, filtro) {
    const [d, bib] = await Promise.all([App.ler('modelos.listar', {}, 60), App.ler('biblioteca.listar', {}, 300)]);
    if (!ctx.ativo()) return;
    d.momentos = TelaConfig.ordenarMomentos(d.momentos);
    const estado = { filtro: filtro !== undefined ? filtro : '' };
    const recarregar = () => { App.esquecer(); TelaConfig.modelos(ctx, false, estado.filtro).catch((e) => Comp.rapido(e.message, 'erro')); };
    const dados = { d: d, bib: bib, nomes: {} };
    bib.forEach((b) => { dados.nomes[b.codigo] = b.nome; });
    ctx.topo({ titulo: 'Modelos de mensagem', voltar: 'config', acoes: [TelaConfig.botaoNovo('Novo', () => TelaConfig.editarModelo(null, dados, recarregar, estado.filtro), 'Escrever um modelo')] });
    const filtros = dicaDeRolagem(h('.filtros', { role: 'group', 'aria-label': 'Filtrar por momento' }));
    const lista = h('div.pilha');
    const desenhar = () => {
      trocar(filtros, [['', 'Todos']].concat(d.momentos.map((m) => [m.codigo, m.nome])).map((x) => h('button.filtro', {
        type: 'button', 'aria-pressed': String(estado.filtro === x[0]), onclick: () => { estado.filtro = x[0]; desenhar(); } }, x[1])));
      const momentos = d.momentos.filter((m) => !estado.filtro || m.codigo === estado.filtro);
      trocar(lista, momentos.map((m) => {
        const itens = d.modelos.filter((x) => TelaConfig.lerCodigo(x.codigo).momento === m.codigo).sort((a, b) => {
          const da = TelaConfig.lerCodigo(a.codigo).dinamica, db = TelaConfig.lerCodigo(b.codigo).dinamica;
          return da.localeCompare(db) || String(a.variacao).localeCompare(String(b.variacao));
        });
        const proprios = itens.filter((x) => !x.padrao).length;
        return h('section.cartao',
          h('.cabeca', h('div', h('h2', m.nome), h('.suave.pequeno', 'Vai para: ' + m.destino)),
            h('span.suave.pequeno', proprios ? F.plural(proprios, 'texto', 'textos') : 'Texto padrão')),
          h('ul.lista.dentro', itens.map((x) => TelaConfig.linhaModelo(x, dados, recarregar, m.destino))));
      }));
    };
    desenhar();
    ctx.mostrar([
      Comp.aviso('info', 'Cada mensagem do dia usa um destes textos. Com mais de uma variação (A, B, C), o app troca de texto para as mensagens não se repetirem nos grupos. O rodapé legal com a autorização e a data do sorteio entra sozinho.'),
      filtros, lista
    ]);
  },

  /** O texto é o principal; as marcas dizem só o que foge do comum (dinâmica específica, outro destino, arte). */
  linhaModelo(x, dados, recarregar, destinoPadrao) {
    const c = TelaConfig.lerCodigo(x.codigo);
    const marcas = [];
    if (c.dinamica) marcas.push(h('span.chip.azul', 'Só para ' + c.dinamica + (dados.nomes[c.dinamica] ? ' · ' + dados.nomes[c.dinamica] : '')));
    if (x.padrao) marcas.push(h('span.chip', 'Padrão do app'));
    if (x.destino && !x.padrao && x.destino !== destinoPadrao) marcas.push(h('span.chip.roxo', 'Vai para: ' + x.destino));
    if (x.arte) marcas.push(h('span.chip', 'Com arte'));
    return TelaConfig.item(() => TelaConfig.editarModelo(x, dados, recarregar), [
      h('span.selo', { title: x.padrao ? 'Texto padrão do app' : 'Variação ' + x.variacao }, x.padrao ? '–' : x.variacao),
      h('.principal',
        h('.texto-modelo', String(x.texto || '')),
        marcas.length ? h('.chips', { style: { marginTop: '6px' } }, marcas) : null)
    ]);
  },

  /** Insere o texto onde está o cursor do campo. */
  inserir(area, texto) {
    const ini = area.selectionStart || 0, fim = area.selectionEnd || 0;
    if (area.setRangeText) area.setRangeText(texto, ini, fim, 'end');
    else area.value = area.value.slice(0, ini) + texto + area.value.slice(fim);
    area.focus();
    area.dispatchEvent(new Event('input', { bubbles: true }));
  },

  editarModelo(x, dados, recarregar, momentoInicial) {
    const d = dados.d;
    const editando = !!x && !x.padrao;
    const cod = x ? TelaConfig.lerCodigo(x.codigo) : { dinamica: '', momento: momentoInicial || 'ANUNCIO' };
    const nomeMomento = {};
    d.momentos.forEach((m) => { nomeMomento[m.codigo] = m; });
    const proximaLetra = (codigo) => {
      const usadas = d.modelos.filter((m) => !m.padrao && String(m.codigo).toUpperCase() === codigo).map((m) => String(m.variacao).toUpperCase());
      return TelaConfig.variacoes().filter((l) => usadas.indexOf(l) < 0)[0] || 'A';
    };

    const campoMomento = Comp.campo({ rotulo: 'Momento', nome: 'momento', tipo: 'select', valor: cod.momento,
      opcoes: d.momentos.map((m) => ({ valor: m.codigo, rotulo: m.nome })) });
    const campoDinamica = Comp.campo({ rotulo: 'Dinâmica', nome: 'dinamica', tipo: 'select', valor: cod.dinamica,
      opcoes: [{ valor: '', rotulo: 'Todas (texto geral)' }].concat(dados.bib.map((b) => ({ valor: b.codigo, rotulo: b.codigo + ' · ' + b.nome }))),
      dica: 'Um texto só de uma dinâmica vale no lugar do geral.' });
    const campoVariacao = Comp.campo({ rotulo: 'Variação', nome: 'variacao', tipo: 'select',
      valor: editando ? x.variacao : proximaLetra(TelaConfig.montarCodigo(cod.momento, cod.dinamica)), opcoes: TelaConfig.variacoes() });
    const campoDestino = Comp.campo({ rotulo: 'Vai para', nome: 'destino', tipo: 'select', valor: editando ? x.destino : '',
      opcoes: [{ valor: '', rotulo: 'O padrão do momento' }].concat(d.destinos.map((t) => ({ valor: t, rotulo: t }))) });
    const campoTexto = Comp.campo({ rotulo: 'Texto', nome: 'texto', tipo: 'textarea', linhas: 8, valor: x ? x.texto : '' });
    const area = campoTexto.querySelector('textarea');
    const variaveis = h('.variaveis', d.variaveis.map((v) => h('button', { type: 'button', title: v.descricao,
      onclick: () => TelaConfig.inserir(area, '{{' + v.nome + '}}') }, '{{' + v.nome + '}}')));
    const avisoTexto = h('div', { 'aria-live': 'polite' });
    const previa = h('.bolha', 'Escreva o texto para ver a prévia.');

    const selMomento = campoMomento.querySelector('select');
    const selDinamica = campoDinamica.querySelector('select');
    const selDestino = campoDestino.querySelector('select');
    const selVariacao = campoVariacao.querySelector('select');
    const ajustar = (trocouAlvo) => {
      const comDinamica = TelaConfig.MOMENTOS_DINAMICA.indexOf(selMomento.value) >= 0;
      campoDinamica.hidden = !comDinamica;
      if (!comDinamica) selDinamica.value = '';
      const m = nomeMomento[selMomento.value];
      selDestino.options[0].textContent = 'O padrão do momento' + (m ? ' (' + m.destino + ')' : '');
      if (trocouAlvo && !editando) selVariacao.value = proximaLetra(TelaConfig.montarCodigo(selMomento.value, selDinamica.value));
    };
    selMomento.addEventListener('change', () => { ajustar(true); conferir(); });
    selDinamica.addEventListener('change', () => ajustar(true));
    ajustar(false);

    const conhecidas = {};
    d.variaveis.forEach((v) => { conhecidas[v.nome] = true; });
    const conferir = () => {
      const texto = area.value;
      const usadas = (texto.match(/\{\{\s*[A-Za-z_]+\s*\}\}/g) || []).map((v) => v.replace(/[{}\s]/g, ''));
      const ruins = usadas.filter((v) => !conhecidas[v]);
      let aviso = [];
      if (ruins.length) aviso = Comp.aviso('perigo', 'Variável desconhecida: ' + ruins.map((v) => '{{' + v + '}}').join(', ') + '. Use as da lista abaixo.');
      else if (texto.trim() && selMomento.value !== 'ENTREGA' && !/\{\{\s*LINK\s*\}\}/.test(texto)) aviso = Comp.aviso('alerta', 'O texto não tem {{LINK}}: a mensagem vai sem link de compra.');
      trocar(avisoTexto, aviso);
    };
    let versao = 0, espera = null;
    const atualizarPrevia = () => {
      clearTimeout(espera);
      espera = setTimeout(async () => {
        const minha = ++versao;
        const t = area.value.trim();
        if (!t) { previa.textContent = 'Escreva o texto para ver a prévia.'; return; }
        try {
          const r = await App.chamar('modelos.previa', { texto: t });
          if (minha === versao) previa.textContent = r.texto;
        } catch (e) {
          if (minha === versao) previa.textContent = 'Não deu para montar a prévia: ' + e.message;
        }
      }, 500);
    };
    area.addEventListener('input', () => { conferir(); atualizarPrevia(); });
    conferir();
    atualizarPrevia();

    const titulo = !x ? 'Modelo novo' : x.padrao ? 'Personalizar o texto padrão' : 'Editar modelo';
    // O texto vem logo depois do momento (é o que mais se muda); variação, destino e arte ficam recolhidos.
    const campoArte = Comp.campo({ rotulo: 'Link da arte', nome: 'arte', tipo: 'url', valor: editando ? x.arte : '', opcional: true,
      dica: 'Imagem ou vídeo que vai junto, como um link do Drive.', atributos: { placeholder: 'https://' } });
    const fora = editando && (!!x.arte || (!!x.destino && nomeMomento[cod.momento] && x.destino !== nomeMomento[cod.momento].destino));
    const z = TelaConfig.folha(titulo, [
      x && x.padrao ? Comp.aviso('info', 'O app usa este texto enquanto não houver um modelo cadastrado para o momento. Ao salvar, ele vira uma variação e passa a valer no lugar do padrão.') : null,
      h('.grade.duas', campoMomento, campoDinamica),
      h('.colunas.duas',
        h('div.form', campoTexto, avisoTexto, h('.campo', h('span.rotulo', 'Variáveis (toque para inserir no texto)'), variaveis)),
        h('div.form', h('.campo', h('span.rotulo', 'Prévia com valores de exemplo'), previa))),
      h('details.ajustes', { open: fora },
        h('summary', 'Variação, destino e arte'),
        h('.grade.duas', { style: { marginTop: '12px' } }, campoVariacao, campoDestino, campoArte))
    ], 'Salvar', { larga: true });
    if (editando) {
      TelaConfig.botaoExtra(z, [icone('lixo'), 'Excluir'], '.discreto.perigo', async (b) => {
        const r = await App.executar('modelos.excluir', { codigo: x.codigo, variacao: x.variacao }, { botao: b, erroEm: z.erro, sucesso: 'Modelo excluído.' });
        if (r) { z.f.fechar(); recarregar(); }
      });
    }
    z.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(z.form);
      if (!area.value.trim()) return TelaConfig.erro(z.erro, 'Escreva o texto do modelo.');
      const din = TelaConfig.MOMENTOS_DINAMICA.indexOf(v.momento) >= 0 ? v.dinamica : '';
      const params = { codigo: TelaConfig.montarCodigo(v.momento, din), variacao: v.variacao, texto: area.value, destino: v.destino, arte: v.arte };
      if (editando) { params.codigoOriginal = x.codigo; params.variacaoOriginal = x.variacao; }
      const r = await App.executar('modelos.salvar', params, { botao: z.salvar, erroEm: z.erro, sucesso: 'Modelo salvo.' });
      if (r) { z.f.fechar(); recarregar(); }
    });
  },

  editarRegra(r, bib, recarregar) {
    const doApp = !!(r && r.doApp);
    const nomes = {};
    bib.forEach((b) => { nomes[b.codigo] = b.nome; });
    const escolhidas = r ? r.dinamicas.map((x) => x.codigo) : [];
    const ordenadas = h('ol.ordenadas');
    const adicionar = h('select', { 'aria-label': 'Adicionar dinâmica' });
    const desenhar = () => {
      trocar(ordenadas, escolhidas.map((k, i) => h('li',

        h('button.btn.icone.discreto', { type: 'button', 'aria-label': 'Tirar ' + k, title: 'Tirar',
          onclick: () => { escolhidas.splice(i, 1); desenhar(); } }, icone('fechar')))));

    desenhar();
    const palavras = r ? (Array.isArray(r.palavras) ? r.palavras.join(', ') : r.palavras || '') : '';
    const z = TelaConfig.folha(r ? r.tipo : 'Regra nova', [

        doApp ? null : Comp.campo({ rotulo: 'Lives nesse dia', nome: 'permiteLive', tipo: 'select', valor: r ? r.permiteLive : '', opcoes: TelaConfig.LIVE_OPCOES }))
    ], 'Salvar', { larga: true });

      TelaConfig.botaoExtra(z, [icone('lixo'), 'Excluir'], '.discreto.perigo', async (b) => {
