    if (Site.ligado() && sessao.versao && sessao.versao !== VERSAO_TELA && (await Site.irParaVersao(sessao.versao))) return;
    App.sessao = sessao;
    App.agoraServidor = lerData(sessao.agora) || null;
    App.carregadoEm = Date.now();
    App.montar();
    if (sessao.versao && sessao.versao !== VERSAO_TELA) App.avisarVersao(sessao.versao, true);
    App.contador('mensagens', (sessao.contadores || {}).mensagens);
    App.renderizando = false;
    App.ouvirEndereco();
    App.navegar(await App.lerHash());
  },

  /** Voltar e avançar do navegador trocam de tela (ligado uma vez só, mesmo que a pessoa saia e entre de novo). */
  ouvirEndereco() {
    if (App.ouvindo) return;
    App.ouvindo = true;
    const gs = window.google && google.script;
    if (gs && gs.history && !Site.ativo()) {
      gs.history.setChangeHandler((ev) => { if (App.sessao) App.navegar((ev && ev.location && ev.location.hash) || ''); });
    } else {
      window.addEventListener('hashchange', () => {
        const h2 = location.hash.slice(1);
        if (App.ignorarHash === h2) { App.ignorarHash = null; return; }
        // Link de primeiro acesso colado na barra de endereço desta mesma aba.
        const codigo = TelaEntrada.codigoDoHash(h2);
        if (codigo) { App.sair(); TelaEntrada.primeiroAcesso(codigo); return; }
        if (App.sessao) App.navegar(h2);
      });
    }
  },

  /** Site publicado sem o endereço do servidor (o gestor ainda não informou o /exec). */
  siteSemServidor() {
    trocar(document.body, h('main.pagina.entrada', h('.marca-completo.logo-entrada', { role: 'img', 'aria-label': 'Indião da Sorte' }),
      h('.falha.cartao', icone('alerta', 'icone-grande'), h('h2', 'O app ainda não está ligado'),
        h('p', 'Este endereço ainda não sabe onde fica o servidor do app. Avise o gestor do app.'))));
    App.marcarEstado();
  }
};

// ---------------------------------------------------------------------
// Peças comuns
// ---------------------------------------------------------------------

const Comp = {
  // ----- avisos -----
  aviso(tipo, conteudo, extra) {
    const ic = { info: 'info', alerta: 'alerta', perigo: 'alerta', sucesso: 'ok' }[tipo] || 'info';
    return h('.aviso.' + tipo, { role: tipo === 'perigo' ? 'alert' : null }, icone(ic), h('div', conteudo, extra || null));
  },

  rapido(texto, tipo, duracao) {
    const area = App.el.avisos || document.body;
    const el = h('.rapido.' + (tipo || 'ok'), h('.texto', texto),
      h('button', { type: 'button', 'aria-label': 'Fechar', onclick: () => el.remove() }, '×'));
    area.appendChild(el);
    while (area.children.length > 4) area.removeChild(area.firstChild);
    setTimeout(() => { if (el.isConnected) el.remove(); }, duracao || (tipo === 'erro' ? 9000 : 4000));
    return el;
  },

  // ----- estados -----
  esqueleto(linhas) {
    const n = linhas || 3;
    const itens = [h('.esqueleto', { style: { height: '22px', width: '45%' } })];
    for (let i = 0; i < n; i++) itens.push(h('.esqueleto', { style: { height: i === 0 ? '96px' : '64px', marginTop: '14px' } }));
    return h('div', { 'aria-busy': 'true', 'aria-label': 'Carregando' }, itens);
  },

  falha(e, tentar) {
    return h('.falha.cartao', icone('alerta', 'icone-grande'),
      h('h2', e && e.conexao ? 'Sem conexão com o servidor' : 'Não deu para abrir esta tela'),
      h('p', e && e.message ? e.message : String(e)),
      tentar ? h('button.btn.primario', { type: 'button', onclick: tentar }, icone('atualizar'), 'Tentar de novo') : null);
  },

  vazio(titulo, texto, acao) {
    return h('.vazio', icone('vazio', 'icone-grande'), h('h3', titulo), texto ? h('p', texto) : null, acao || null);
  },

  // ----- folhas (diálogos) -----
  folhas: [],
  /**
   * Abre uma folha (embaixo no celular, no meio no computador).
   * op: { titulo, corpo, rodape: [botões], larga, aoFechar }
   */
  folha(op) {
    const anterior = document.activeElement;
    const fechar = () => {
      if (!fundo.isConnected) return;
      fundo.remove();
      Comp.folhas = Comp.folhas.filter((f) => f !== controle);
      document.removeEventListener('keydown', tecla);
      if (op.aoFechar) op.aoFechar();
      if (anterior && anterior.focus && anterior.isConnected) anterior.focus();
    };
    const tecla = (ev) => { if (ev.key === 'Escape' && Comp.folhas[Comp.folhas.length - 1] === controle) fechar(); };
    const titulo = h('h2', { id: 'folha-' + Date.now() }, op.titulo || '');
    const corpo = h('.corpo-folha', op.corpo || null);
    const rodape = h('.rodape-folha', op.rodape || null);
    rodape.hidden = !(op.rodape && op.rodape.length);
    const folha = h('.folha' + (op.larga ? '.larga' : ''), { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titulo.id, tabindex: '-1' },
      h('.cabeca-folha', titulo, h('button.btn.icone.discreto', { type: 'button', 'aria-label': 'Fechar', onclick: fechar }, icone('fechar'))),
      corpo, rodape);
    const fundo = h('.fundo-escuro', { onmousedown: (ev) => { if (ev.target === fundo && !op.fixa) fechar(); } }, folha);
    document.body.appendChild(fundo);
    document.addEventListener('keydown', tecla);
    const controle = {
      fechar: fechar, el: folha, corpo: corpo, rodape: rodape, titulo: titulo,
      /** Troca o conteúdo depois de aberta (ex.: quando os dados chegam). */
      mostrar: (filhos, botoes) => {
        trocar(corpo, filhos);
        if (botoes !== undefined) { trocar(rodape, botoes || []); rodape.hidden = !(botoes && botoes.length); }
      },
      renomear: (t) => { titulo.textContent = t; }
    };
    Comp.folhas.push(controle);
    setTimeout(() => {
      // No computador, o cursor já vai para o primeiro campo. No celular isso abriria o teclado por cima da folha:
      // o foco fica na própria folha (leitores de tela anunciam o título) sem desenhar contorno em nenhum botão.
      const alvo = folha.querySelector('[autofocus]') || folha.querySelector('input:not([type=hidden]):not([type=file]):not([type=radio]):not([type=checkbox]), select, textarea');
      if (alvo && window.innerWidth >= 700) alvo.focus();
      else folha.focus({ preventScroll: true });
    }, 30);
    return controle;
  },

  fecharFolhas() { Comp.folhas.slice().forEach((f) => f.fechar()); },

  /** Pergunta de confirmação. op: { texto, resumo, titulo, botao, perigo } -> Promise<boolean> */
  confirmar(op) {
    op = typeof op === 'string' ? { texto: op } : op;
    return new Promise((resolve) => {
      let respondeu = false;
      const verbo = op.botao || Comp.verboDaPergunta(op.texto);
      const perigo = op.perigo !== undefined ? op.perigo : /^(Excluir|Apagar|Estornar|Cancelar|Tirar|Encerrar|Gerar um link)/i.test(String(op.texto || ''));
      const sim = h('button.btn' + (perigo ? '.perigo.cheio' : '.primario'), { type: 'button', onclick: () => { respondeu = true; f.fechar(); resolve(true); } }, verbo);
      const nao = h('button.btn', { type: 'button', onclick: () => { f.fechar(); } }, 'Voltar');
      const f = Comp.folha({
        titulo: op.titulo || 'Confirme',
        corpo: [h('p', { style: { fontSize: '1rem' } }, op.texto || ''), Comp.resumo(op.resumo)],
        rodape: [nao, sim],
        aoFechar: () => { if (!respondeu) resolve(false); }
      });
      setTimeout(() => sim.focus(), 40);
    });
  },

  /** "Ativar a campanha X? ..." -> "Ativar"; "Lançar mesmo assim?" -> "Lançar mesmo assim". */
  verboDaPergunta(texto) {
    // Frases terminam em . ? ! seguidos de espaço (assim "R$ 36.944,50" não quebra a frase).
    const partes = String(texto || '').split(/([.?!])\s+/);
    const frases = [];
    for (let i = 0; i < partes.length; i += 2) frases.push((partes[i] + (partes[i + 1] || '')).trim());
    const pergunta = frases.filter((f) => /\?\s*$/.test(f)).pop() || frases[0] || '';
    const palavras = pergunta.replace(/\?\s*$/, '').trim().split(/\s+/);
    const primeira = palavras[0] || '';
    if (!/(ar|er|ir)$/i.test(primeira) || /^(Confira)$/i.test(primeira)) return 'Confirmar';
    if (/mesmo assim/i.test(pergunta)) return primeira + ' mesmo assim';
    if (/^(Excluir|Estornar|Encerrar|Ativar|Cancelar|Apagar|Tirar)$/i.test(primeira) && palavras.length > 1) {
      const resto = palavras.slice(1, 3).join(' ').replace(/[,:;].*$/, '');
      return (primeira + ' ' + resto).replace(/\s+(de|da|do)$/, '');
    }
    return primeira;
  },

  /** Detalhes que o servidor manda junto da pergunta (pendências, cenários, avisos). */
  resumo(r) {
    if (!r || typeof r !== 'object') return null;
    const blocos = [];
    if (r.equilibrio !== undefined) {
      blocos.push(h('dl.valores',
        h('dt', 'Equilíbrio'), h('dd', F.moeda(r.equilibrio)),
        r.cotasEquilibrio !== undefined ? [h('dt', 'Em cotas'), h('dd', F.int(r.cotasEquilibrio) + ' (' + F.pct(r.pctEquilibrio) + ')')] : null));
    }
    if (Array.isArray(r.cenarios) && r.cenarios.length) {
      blocos.push(h('table.tabela', h('thead', h('tr', h('th', 'Cenário'), h('th.d', 'Vendido'), h('th.d', 'Resultado'))),
        h('tbody', r.cenarios.map((c) => h('tr', h('td', c.nome), h('td.d', F.pct(c.pctVendido, 0)),
          h('td.d.num.' + (F.cls(c.resultado) || 'x'), F.moeda(c.resultado, { semCentavos: true })))))));
    }
    if (r.resultado !== undefined || r.vendas !== undefined) {
      blocos.push(h('dl.valores',
        r.vendas !== undefined ? [h('dt', 'Vendas'), h('dd', F.moeda(r.vendas))] : null,
        r.resultado !== undefined ? [h('dt', 'Resultado'), h('dd.' + (F.cls(r.resultado) || 'x'), F.moeda(r.resultado))] : null));
    }
    ['pendencias', 'avisos'].forEach((k) => {
      if (Array.isArray(r[k]) && r[k].length) {
        blocos.push(Comp.aviso('alerta', [h('strong', k === 'pendencias' ? 'Ainda falta:' : 'Atenção:'),
          h('ul', r[k].map((x) => h('li', x)))]));
      }
    });
    return blocos.length ? h('div', { style: { display: 'grid', gap: '12px', marginTop: '12px' } }, blocos) : null;
  },

  /** Menu de ações (botão "⋮" que abre uma folha com opções). itens: [{ rotulo, icone, acao, perigo, oculto }] */
  menu(titulo, itens) {
    const visiveis = itens.filter((i) => i && !i.oculto);
    if (!visiveis.length) return null;
    return h('button.btn.icone', { type: 'button', 'aria-label': 'Mais ações', title: 'Mais ações', onclick: () => {
      const f = Comp.folha({ titulo: titulo, corpo: h('ul.lista.dentro', visiveis.map((i) => h('li.clicavel', {
        role: 'button', tabindex: '0',
        onclick: () => { f.fechar(); i.acao(); },
        onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); f.fechar(); i.acao(); } }
      }, i.icone ? icone(i.icone) : null, h('.principal', h('.t' + (i.perigo ? '.neg' : ''), i.rotulo), i.detalhe ? h('.d', i.detalhe) : null)))) });
    } }, icone('menu'));
  },

  // ----- campos de formulário -----
  /**
   * Campo com rótulo. op: { rotulo, nome, tipo, valor, dica, opcional, prefixo, sufixo, opcoes, linhas,
   *   largo, atributos, obrigatorio }
   * tipo: text | moeda | numero | pct | data | datahora | hora | select | textarea | email | url | simnao | escolha
   * (escolha: botões lado a lado, um só marcado, com as opcoes do select)
   */
  campo(op) {
    const id = 'c-' + op.nome + '-' + Math.random().toString(36).slice(2, 7);
    let controle;
    const at = Object.assign({ id: id, name: op.nome }, op.atributos || {});
    if (op.obrigatorio) at.required = true;
    if (op.tipo === 'select') {
      controle = h('select', at, (op.opcoes || []).map((o) => {
        const v = typeof o === 'object' ? o.valor : o, r = typeof o === 'object' ? o.rotulo : o;
        return h('option', { value: v, selected: String(v) === String(op.valor === undefined || op.valor === null ? '' : op.valor) }, r);
      }));
    } else if (op.tipo === 'textarea') {
      controle = h('textarea', Object.assign({ rows: op.linhas || 4 }, at));
      controle.value = op.valor === undefined || op.valor === null ? '' : op.valor;
    } else if (op.tipo === 'simnao') {
      const atual = op.valor === true || op.valor === 'Sim' ? 'Sim' : op.valor === false || op.valor === 'Não' ? 'Não' : '';
      controle = h('.opcoes-sim-nao', { role: 'radiogroup', 'aria-labelledby': id + '-r' }, ['Sim', 'Não'].map((v) =>
        h('label', h('input', { type: 'radio', name: op.nome, value: v, checked: atual === v }), h('span', v))));
    } else if (op.tipo === 'escolha') {
      const atual = op.valor === undefined || op.valor === null ? '' : String(op.valor);
      controle = h('.opcoes-sim-nao.escolhas', { role: 'radiogroup', 'aria-labelledby': id + '-r' }, (op.opcoes || []).map((o) => {
        const v = typeof o === 'object' ? o.valor : o, r = typeof o === 'object' ? o.rotulo : o;
        return h('label', h('input', { type: 'radio', name: op.nome, value: v, checked: atual === String(v) }), h('span', r));
      }));
    } else {
      const tipos = { moeda: 'text', numero: 'text', pct: 'text', data: 'date', datahora: 'datetime-local', hora: 'time', email: 'email', url: 'url', text: 'text' };
      const extra = {};
      if (op.tipo === 'moeda' || op.tipo === 'pct') extra.inputmode = 'decimal';
      if (op.tipo === 'numero') extra.inputmode = 'numeric';
      if (op.tipo === 'url') extra.inputmode = 'url';
      controle = h('input', Object.assign({ type: tipos[op.tipo || 'text'] || 'text', autocomplete: 'off' }, extra, at));
      let v = op.valor;
      if (op.tipo === 'moeda') v = F.campoMoeda(v);
      else if (op.tipo === 'numero') v = F.vazio(v) || isNaN(Number(v)) ? v : F.decimal(v, Number(v) % 1 ? 2 : 0);
      else if (op.tipo === 'pct') v = F.campoPct(v);
      else if (op.tipo === 'data') v = chaveDia(v);
      else if (op.tipo === 'datahora') v = isoLocal(v);
      controle.value = v === undefined || v === null ? '' : v;
      if (op.prefixo || op.tipo === 'moeda') controle = h('.prefixo', h('span', op.prefixo || 'R$'), controle);
      else if (op.sufixo || op.tipo === 'pct') controle = h('.sufixo', controle, h('span', op.sufixo || '%'));
    }
    const grupo = op.tipo === 'simnao' || op.tipo === 'escolha';
    return h('.campo' + (op.largo ? '.largo' : ''),
      h(grupo ? 'span.rotulo' : 'label', { for: grupo ? null : id, id: id + '-r' }, op.rotulo,
        op.opcional ? h('span.opcional', ' (opcional)') : null),
      controle,
      op.dica ? h('.dica', op.dica) : null);
  },

  /** Valores de um formulário: { nome: valor }. Caixas de marcar viram true/false; arquivos ficam de fora. */
  lerForm(form) {
    const o = {};
    Array.prototype.forEach.call(form.elements, (el) => {
      if (!el.name || el.type === 'file' || el.disabled) return;
      if (el.type === 'checkbox') o[el.name] = el.checked;
      else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; else if (!(el.name in o)) o[el.name] = ''; }
      else o[el.name] = typeof el.value === 'string' ? el.value.trim() : el.value;
    });
    return o;
  },

  /** Campo de arquivo. Devolve o elemento; use Comp.lerArquivo(el) para pegar { nome, tipo, base64 }. */
  arquivo(op) {
    op = op || {};
    const input = h('input', { type: 'file', name: op.nome || 'arquivo', accept: op.aceita || '' });
    const nome = h('span.nome', op.texto || 'Escolher arquivo');
    input.addEventListener('change', () => {
      const f = input.files && input.files[0];
      nome.textContent = f ? f.name + ' · ' + Math.max(1, Math.round(f.size / 1024)) + ' KB' : op.texto || 'Escolher arquivo';
      if (op.aoEscolher) op.aoEscolher(f);
    });
    return h('.campo' + (op.largo ? '.largo' : ''),
      op.rotulo ? h('span.rotulo', op.rotulo, op.opcional ? h('span.opcional', ' (opcional)') : null) : null,
      h('label.arquivo', input, icone('upload'), nome, h('span.btn.pequeno', 'Escolher')),
      op.dica ? h('.dica', op.dica) : null);
  },

  lerArquivo(el, op) {
    op = op || {};
    const input = el.tagName === 'INPUT' ? el : el.querySelector('input[type=file]');
    const f = input && input.files && input.files[0];
    if (!f) return Promise.resolve(null);
    const limite = (op.limiteMb || 20) * 1024 * 1024;
    if (f.size > limite) return Promise.reject(new Error('O arquivo passou de ' + (op.limiteMb || 20) + ' MB.'));
    return new Promise((resolve, reject) => {
      const leitor = new FileReader();
      leitor.onload = () => {
        if (op.texto) { resolve({ nome: f.name, tipo: f.type, texto: String(leitor.result) }); return; }
        const s = String(leitor.result);
        resolve({ nome: f.name, tipo: f.type || 'application/octet-stream', base64: s.slice(s.indexOf(',') + 1) });
      };
      leitor.onerror = () => reject(new Error('Não consegui ler o arquivo.'));
      if (op.texto) leitor.readAsText(f, op.codificacao || 'UTF-8');
      else leitor.readAsDataURL(f);
    });
  },

  /** Copia texto para a área de transferência (com plano B para navegadores que bloqueiam). */
  async copiar(texto) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(texto);
        return true;
      }
    } catch (e) { /* tenta o plano B */ }
    const area = h('textarea', { style: { position: 'fixed', top: '0', left: '0', opacity: '0' }, readonly: true });
    area.value = texto;
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, texto.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    area.remove();
    return ok;
  },

  // ----- peças de leitura -----
  chipStatus(status) {
    const cor = {
      'Ativa': 'verde', 'Rascunho': 'amarelo', 'Encerrada': '', 'Sugerida': 'amarelo', 'Aprovada': 'azul', 'Recusada': 'vermelho',
      'Pago': 'verde', 'Comprometido': 'amarelo', 'Simulado': 'azul', 'Pendente': 'amarelo', 'Enviado': 'verde', 'Confirmada': 'verde',
      'Vencido': 'vermelho', 'Vence antes do sorteio': 'vermelho', 'Vence em breve': 'amarelo', 'Válido': 'verde', 'Em dia': 'verde', 'Não vence': 'verde'
    }[status];
    return h('span.chip' + (cor ? '.' + cor : ''), status || '–');
  },

  /**
   * Barra de progresso com marcas (equilíbrio, meta). op: { valor, marcas: [{ valor, rotulo, classe }], cor, rotulos }
   * Com rotulos, cada marca ganha o seu texto logo embaixo, uma linha por marca, saindo do ponto da marca
   * para o lado com mais espaço (e quebrando a linha ali mesmo, se não couber).
   */
  progresso(op) {
    const lim = (v) => Math.max(0, Math.min(1, Number(v) || 0));
    const marcas = (op.marcas || []).filter((m) => m && m.valor > 0).sort((a, b) => a.valor - b.valor);
    const barra = h('.progresso', { role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.round(lim(op.valor) * 100)),
      'aria-label': op.rotulo || 'Progresso' },
      h('.feito' + (op.cor ? '.' + op.cor : ''), { style: { width: (lim(op.valor) * 100).toFixed(1) + '%' } }),
      marcas.map((m) => h('.marca' + (m.classe ? '.' + m.classe : ''),
        { style: { left: 'calc(' + (lim(m.valor) * 100).toFixed(1) + '% - 1px)' }, title: m.rotulo })));
    if (!op.rotulos || !marcas.length) return barra;
    return h('div', barra, h('.rotulos-marcas', marcas.map((m) => {
      const x = lim(m.valor) * 100, esquerda = x > 50;
      return h('.rotulo-marca' + (esquerda ? '.esquerda' : '') + (m.classe ? '.' + m.classe : ''),
        { style: esquerda ? { paddingRight: (100 - x).toFixed(1) + '%' } : { paddingLeft: x.toFixed(1) + '%' } },
        h('span', esquerda ? m.rotulo + ' ▲' : '▲ ' + m.rotulo));
    })));
  },

  kpi(rotulo, valor, detalhe, classe) {
    return h('.kpi', h('.rotulo', rotulo), h('.valor' + (classe ? '.' + classe : ''), valor), detalhe ? h('.detalhe', detalhe) : null);
  },

  /** Tabela que vira lista no celular. colunas: [{ titulo, valor(l), dir, classe(l) }] */
  tabela(colunas, linhas, op) {
    op = op || {};
    return h('.tabela-rolagem' + (op.empilha === false ? '' : '.empilhada'),
      h('table.tabela' + (op.empilha === false ? '' : '.empilha'),
        h('thead', h('tr', colunas.map((c) => h('th' + (c.dir ? '.d' : ''), c.titulo)))),
        h('tbody', linhas.map((l, i) => h('tr', {
          class: [op.clicavel ? 'clicavel' : '', op.classeLinha ? op.classeLinha(l, i) : ''].filter(Boolean).join(' ') || null,
          onclick: op.clicavel ? () => op.clicavel(l) : null,
          tabindex: op.clicavel ? '0' : null,
          onkeydown: op.clicavel ? chaveTecla(() => op.clicavel(l)) : null
        }, colunas.map((c, j) => {
          const v = c.valor(l, i);
          // "–" sozinho vira linha vazia no cartão do celular: some lá e continua na tabela do computador.
          const vazia = v === '–' || v === '' || v === null || v === undefined;
          return h('td', { class: [c.dir ? 'd' : '', j === 0 ? 'primeira' : '', vazia && j > 0 ? 'vazia' : '', c.classe ? c.classe(l) : ''].filter(Boolean).join(' ') || null,
            'data-rotulo': c.titulo }, v);
        }))))));
  },

  /** Seletor de campanha (para telas de uma campanha só). */
  seletorCampanha(atual, aoTrocar, op) {
    op = op || {};
    const lista = (App.sessao.campanhas || []).filter((c) => !op.status || op.status.indexOf(c.status) >= 0);
    return h('.campo', { style: { maxWidth: '360px' } },
      h('label', { for: 'sel-campanha' }, op.rotulo || 'Campanha'),
      h('select#sel-campanha', { onchange: (ev) => aoTrocar(ev.target.value) },
        op.todas ? h('option', { value: '', selected: !atual }, op.todas) : null,
        lista.map((c) => h('option', { value: c.id, selected: c.id === atual }, c.nome + (c.status !== 'Ativa' ? ' (' + c.status.toLowerCase() + ')' : '')))));
  },

  /** Campanha padrão para telas que precisam de uma: a ativa mais recente, senão a primeira da lista. */
  campanhaPadrao() {
    const lista = App.sessao.campanhas || [];
    return (lista.filter((c) => c.status === 'Ativa')[0] || lista.filter((c) => c.status === 'Rascunho')[0] || lista[0] || {}).id || '';
  }
};

window.addEventListener('error', (ev) => {
  try { Comp.rapido('Algo deu errado na tela: ' + (ev.message || 'erro') + '. Recarregue se continuar.', 'erro'); } catch (e) { /* nada */ }
});
window.addEventListener('unhandledrejection', (ev) => {
  const e = ev.reason;
  try { Comp.rapido(e && e.message ? e.message : 'Algo deu errado na tela.', 'erro'); } catch (x) { /* nada */ }
});
</script>
  <script>
/* =====================================================================
   Entrada no app (3.3.0): entrar com e-mail e senha, criar a senha pelo
   link de primeiro acesso (#acesso=…), criar a senha a partir do link
   pessoal antigo, e a folha "Sua conta" (trocar a senha e sair).
   As senhas são lidas direto do campo, sem o trim do Comp.lerForm: um
   espaço no meio da senha faz parte dela.
   ===================================================================== */

const TelaEntrada = {
  SENHA_MIN: 8,
  DICA_SENHA: 'Pelo menos 8 caracteres. Uma frase curta que só você saiba é mais fácil de lembrar e mais difícil de adivinhar.',

  /** "#acesso=<64 letras e números>" (o link de primeiro acesso) -> o código, ou ''. */
  codigoDoHash(hash) {
    const m = String(hash || '').match(/(?:^|[&?/#])acesso=([0-9a-fA-F]{64})(?:$|[&/])/);
    return m ? m[1].toLowerCase() : '';
  },

  /** As mesmas regras do servidor, para avisar antes de enviar. Devolve o problema, ou ''. */
  problemaDaSenha(senha, email) {
    if (senha.length < TelaEntrada.SENHA_MIN) return 'A senha precisa ter pelo menos ' + TelaEntrada.SENHA_MIN + ' caracteres.';
    if (senha.length > 128) return 'A senha pode ter no máximo 128 caracteres.';
    if (/^\s|\s$/.test(senha)) return 'A senha não pode começar nem terminar com espaço.';
    if (email && senha.toLowerCase() === String(email).toLowerCase()) return 'A senha não pode ser o seu e-mail.';
    if (/^(.)\1+$/.test(senha)) return 'Escolha uma senha menos óbvia que um caractere repetido.';
    return '';
  },

  /** Endereço onde a pessoa entra, para os textos: "erp.indiaodasorte.com" (na cópia de teste, o próprio app). */
  onde() {
    const e = App.sessao && App.sessao.entrada;
    return App.emTeste() || !e || !e.endereco || !e.site ? 'no app' : 'em ' + Site.curto(e.endereco);
  },

  // ----- peças -----

  /**
   * Campo de senha com o botão Mostrar. op: { rotulo, nome, nova (senha nova: o gerenciador de senhas sugere uma),
   * dica, id }. Devolve o .campo; o input é campo.input.
   */
  campoSenha(op) {
    const id = 'c-' + op.nome + '-' + Math.random().toString(36).slice(2, 7);
    const input = h('input', { type: 'password', id: id, name: op.nome, autocomplete: op.nova ? 'new-password' : 'current-password',
      autocapitalize: 'none', spellcheck: 'false', maxlength: '128', required: true });
    const mostrar = h('button.btn.discreto.pequeno', { type: 'button', 'aria-pressed': 'false', 'aria-controls': id, onclick: () => {
      const ver = input.type === 'password';
      input.type = ver ? 'text' : 'password';
      mostrar.textContent = ver ? 'Ocultar' : 'Mostrar';
      mostrar.setAttribute('aria-pressed', String(ver));
    } }, 'Mostrar');
    const campo = h('.campo', h('label', { for: id }, op.rotulo), h('.campo-senha', input, mostrar), op.dica ? h('.dica', op.dica) : null);
    campo.input = input;
    return campo;
  },

  /** Campo de e-mail para entrar (o gerenciador de senhas o reconhece como o usuário). */
  campoEmail(op) {
    const id = 'c-email-' + Math.random().toString(36).slice(2, 7);
    const input = h('input', { type: 'email', id: id, name: 'email', autocomplete: op.autocomplete || 'username', inputmode: 'email',
      autocapitalize: 'none', spellcheck: 'false', maxlength: '200', required: true, value: op.valor || '' });
    const campo = h('.campo', h('label', { for: id }, op.rotulo || 'E-mail'), input, op.dica ? h('.dica', op.dica) : null);
    campo.input = input;
    return campo;
  },

  /** E-mail que não se edita, mas que o gerenciador de senhas precisa ver para guardar a senha nova junto dele. */
  usuarioOculto(email) {
    return h('input', { type: 'email', name: 'usuario', autocomplete: 'username', value: email || '', readOnly: true,
      tabindex: '-1', 'aria-hidden': 'true', class: 'usuario-oculto' });
  },

  /** Enter em qualquer campo da folha faz o mesmo que o botão de salvar (a folha não tem botão de enviar no formulário). */
  enterSalva(form, botao) {
    form.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); botao.click(); }
    });
  },

  /** Página inteira das telas de entrada (sem o menu do app): o logo, o conteúdo e o nome do app no pé. */
  pagina(filhos, titulo) {
    App.renderizando = false;
    const conteudo = h('main.pagina.entrada', { id: 'conteudo' },
      h('.marca-completo.logo-entrada', { role: 'img', 'aria-label': 'Indião da Sorte' }),
      filhos,
      h('p.rodape-entrada', 'Indião da Sorte · Rifas'));
    App.el.avisos = h('.avisos-rapidos', { 'aria-live': 'polite', role: 'status' });
    trocar(document.body, [conteudo, App.el.avisos]);
    document.title = (titulo ? titulo + ' · ' : '') + 'Indião da Sorte';
    window.scrollTo(0, 0);
    App.marcarEstado();
    return conteudo;
  },

  /** Foco no primeiro campo vazio, só no computador (no celular, o teclado cobriria a tela antes de a pessoa ler). */
  focar(campos) {
    if (window.innerWidth < 700) return;
    const alvo = campos.filter((c) => c && !c.value)[0] || campos[campos.length - 1];
    if (alvo) setTimeout(() => alvo.focus(), 30);
  },

  /** Depois de entrar ou criar a senha: guarda a credencial e abre o app. */
  async abrirCom(credencial, email, botao, erro) {
    App.chave = credencial;
    Guardado.gravar(Guardado.CREDENCIAL, credencial);
    if (email) Guardado.gravar(Guardado.EMAIL, email);
    try {
      App.renderizando = true;
      const sessao = await App.chamar('sessao', {});
      await App.abrir(sessao);
      return true;
    } catch (e) {
      App.renderizando = false;
      App.marcarEstado();
      if (e.semAcesso) { App.semAcesso(e.message); return false; }
      if (botao) { botao.classList.remove('carregando'); botao.disabled = false; }
      if (erro) trocar(erro, Comp.aviso('perigo', e.message));
      return false;
    }
  },

  // =====================================================================
  // Entrar
  // =====================================================================

  /** op: { aviso (por que a pessoa precisa entrar de novo), info (ex.: "Você saiu do app neste aparelho.") } */
  entrar(op) {
    op = op || {};
    const email = TelaEntrada.campoEmail({ valor: Guardado.ler(Guardado.EMAIL) });
    const senha = TelaEntrada.campoSenha({ rotulo: 'Senha', nome: 'senha' });
    const erro = h('div.erro-form', { role: 'alert' });
    const botao = h('button.btn.primario', { type: 'submit' }, 'Entrar');
    const form = h('form.form-entrada', { method: 'post', action: '#', novalidate: true }, email, senha, erro, botao);
    // O motivo de ter voltado para esta tela sai quando a pessoa tenta entrar (o erro, se houver, aparece no lugar).
    const motivo = op.aviso ? Comp.aviso('alerta', op.aviso) : op.info ? Comp.aviso('sucesso', op.info) : null;
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const e = email.input.value.trim();
      const s = senha.input.value;
      if (motivo) motivo.remove();
      trocar(erro, []);
      if (!e || !s) { trocar(erro, Comp.aviso('perigo', 'Informe o seu e-mail e a sua senha.')); return; }
      botao.classList.add('carregando');
      botao.disabled = true;
      let r;
      try {
        r = await App.chamar('entrada.entrar', { email: e, senha: s });
      } catch (x) {
        botao.classList.remove('carregando');
        botao.disabled = false;
        trocar(erro, Comp.aviso('perigo', x.message));
        senha.input.select();
        return;
      }
      await TelaEntrada.abrirCom(r.credencial, e, botao, erro);
    });
    TelaEntrada.pagina([
      h('h1', 'Entrar no app'),
      motivo,
      form,
      h('details.ajuda-entrada',
        h('summary', 'Esqueci a senha ou é o meu primeiro acesso'),
        h('p', 'Peça ao gestor do app o link para criar a sua senha. Ele chega pelo WhatsApp, vale 7 dias e só funciona uma vez.'),
        h('p', 'Ainda tem o link pessoal antigo do app? Abra o app por ele e toque em Criar a senha.'))
    ], 'Entrar');
    TelaEntrada.focar([email.input, senha.input]);
  },

  // =====================================================================
  // Link de primeiro acesso (#acesso=…)
  // =====================================================================

  async primeiroAcesso(codigo) {
    TelaEntrada.pagina(h('p.suave', { style: { textAlign: 'center' } }, 'Abrindo o seu link…'), 'Criar a senha');
    App.renderizando = true;
    App.marcarEstado();
    let c;
    try {
      c = await App.chamar('entrada.convite', { codigo: codigo });
    } catch (e) {
      App.renderizando = false;
      if (e.conexao) {
        TelaEntrada.pagina(h('.falha.cartao', icone('alerta', 'icone-grande'), h('h2', 'Sem conexão com o servidor'), h('p', e.message),
          h('button.btn.primario', { type: 'button', onclick: () => TelaEntrada.primeiroAcesso(codigo) }, icone('atualizar'), 'Tentar de novo')));
        return;
      }
      TelaEntrada.pagina([
        h('h1', 'Este link não vale mais'),
        h('p.sub', String(e.message).replace(/^Este link não vale mais:\s*(.)/, (m, c) => c.toUpperCase())),
        h('button.btn.primario.bloco', { type: 'button', onclick: () => { App.limparHash(); TelaEntrada.entrar(); } }, 'Entrar com e-mail e senha')
      ], 'Link de acesso');
      return;
    }
    const primeiro = String(c.nome || '').split(/[\s@]/)[0];
    const senha = TelaEntrada.campoSenha({ rotulo: c.temSenha ? 'Senha nova' : 'Senha', nome: 'senha', nova: true, dica: TelaEntrada.DICA_SENHA });
    const repetida = TelaEntrada.campoSenha({ rotulo: 'Repita a senha', nome: 'repetida', nova: true });
    const erro = h('div.erro-form', { role: 'alert' });
    const botao = h('button.btn.primario', { type: 'submit' }, 'Criar a senha e entrar');
    const form = h('form.form-entrada', { method: 'post', action: '#', novalidate: true },
      TelaEntrada.usuarioOculto(c.email), senha, repetida, erro, botao);
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const s = senha.input.value;
      trocar(erro, []);
      const problema = TelaEntrada.problemaDaSenha(s, c.email) || (s !== repetida.input.value ? 'As duas senhas não estão iguais.' : '');
      if (problema) { trocar(erro, Comp.aviso('perigo', problema)); return; }
      botao.classList.add('carregando');
      botao.disabled = true;
      let r;
      try {
        r = await App.chamar('entrada.criarSenha', { codigo: codigo, senha: s });
      } catch (x) {
        botao.classList.remove('carregando');
        botao.disabled = false;
        trocar(erro, Comp.aviso('perigo', x.message));
        return;
      }
      App.limparHash();
      if (await TelaEntrada.abrirCom(r.credencial, r.email, botao, erro)) {
        Comp.rapido((c.temSenha ? 'Senha nova criada.' : 'Senha criada.') + ' Daqui em diante, entre ' + TelaEntrada.onde() + ' com o seu e-mail e esta senha.', 'ok', 9000);
      }
    });
    App.renderizando = false;
    TelaEntrada.pagina([
      h('h1', c.temSenha ? 'Crie uma senha nova' : 'Crie a sua senha'),
      h('p.sub', 'Olá, ' + primeiro + '! Você vai entrar no app com o e-mail ', h('strong', c.email), ' e a senha que criar agora.'),
      form
    ], 'Criar a senha');
    TelaEntrada.focar([senha.input, repetida.input]);
  },

  // =====================================================================
  // Quem ainda entra pelo link antigo (ou pela Conta do Google)
  // =====================================================================

  /** Faixa no alto das telas convidando a criar a senha. "Agora não" esconde até a próxima vez que abrir o app. */
  convidarSenha() {
    if (App.via !== 'link' && App.via !== 'google') return null;
    // Só convida quando o site já abre: antes disso, a pessoa continua pelo link e cria a senha em Sua conta, se quiser.
    const e = App.sessao && App.sessao.entrada;
    if (!e || e.temSenha || !e.site) return null;
    try { if (window.sessionStorage.getItem('rifas.senhaDepois') === '1') return null; } catch (e) { /* sem armazenamento */ }
    const faixa = h('.aviso-versao.convite-senha', Comp.aviso('info', [
      h('strong', 'Crie a sua senha. '),
      'Daqui em diante, você entra ' + TelaEntrada.onde() + ' com o seu e-mail e uma senha' + (App.via === 'link' ? ', e o link pessoal deixa de funcionar.' : '.')
    ], h('.acoes', { style: { marginTop: '8px' } },
      h('button.btn.pequeno.primario', { type: 'button', onclick: () => TelaEntrada.criarSenhaPeloLink() }, 'Criar a senha'),
      h('button.btn.pequeno.discreto', { type: 'button', onclick: () => {
        try { window.sessionStorage.setItem('rifas.senhaDepois', '1'); } catch (e) { /* fica só nesta tela */ }
        faixa.remove();
        App.el.senha = null;
      } }, 'Agora não'))));
    return faixa;
  },

  criarSenhaPeloLink() {
    const entrada = App.sessao.entrada || {};
    const temEmail = !!entrada.email;
    const email = temEmail ? null : TelaEntrada.campoEmail({ rotulo: 'Seu e-mail', autocomplete: 'email', dica: 'É com ele que você vai entrar no app.' });
    const senha = TelaEntrada.campoSenha({ rotulo: 'Senha', nome: 'senha', nova: true, dica: TelaEntrada.DICA_SENHA });
    const repetida = TelaEntrada.campoSenha({ rotulo: 'Repita a senha', nome: 'repetida', nova: true });
    const z = TelaCaixa.folhaForm('Criar a sua senha', [
      temEmail ? [h('dl.valores', h('dt', 'E-mail'), h('dd', entrada.email)), TelaEntrada.usuarioOculto(entrada.email)] : email,
      senha, repetida
    ], 'Criar a senha');
    TelaEntrada.enterSalva(z.form, z.salvar);
    z.salvar.addEventListener('click', async () => {
      const e = temEmail ? entrada.email : email.input.value.trim().toLowerCase();
      const s = senha.input.value;
      if (!temEmail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return TelaConfig.erro(z.erro, 'Informe um e-mail válido.');
      const problema = TelaEntrada.problemaDaSenha(s, e) || (s !== repetida.input.value ? 'As duas senhas não estão iguais.' : '');
      if (problema) return TelaConfig.erro(z.erro, problema);
      const params = { senha: s };
      if (!temEmail) params.email = e;
      const r = await App.executar('entrada.criarSenhaPeloLink', params, { botao: z.salvar, erroEm: z.erro });
      if (!r) return;
      // O link antigo parou de valer: daqui em diante, esta aba usa a credencial nova.
      App.chave = r.credencial;
      App.via = 'senha';
      Object.assign(App.sessao.entrada, { via: 'senha', email: r.email, temSenha: true, endereco: r.endereco || entrada.endereco });
      Guardado.gravar(Guardado.CREDENCIAL, r.credencial);
      Guardado.gravar(Guardado.EMAIL, r.email);
      if (App.el.senha) { App.el.senha.remove(); App.el.senha = null; }
      if (App.rota) App.historico(App.rota.hash, true);
      z.f.fechar();
      TelaEntrada.senhaCriada(r.email, r.endereco || entrada.endereco);
    });
  },

  /** Depois de criar a senha pelo link antigo: onde entrar daqui em diante. */
  senhaCriada(email, endereco) {
    // Antes de o site abrir, o endereço é o /exec do app: a pessoa continua pelo mesmo link, que agora pede a senha.
    const site = !App.emTeste() && endereco && !/script\.google(usercontent)?\.com/.test(endereco);
    const f = Comp.folha({
      titulo: 'Senha criada',
      corpo: h('.pilha',
        h('p', { style: { fontSize: '1rem' } }, 'Daqui em diante, entre ', site ? ['em ', h('strong', Site.curto(endereco))] : 'no app',
          ' com o e-mail ', h('strong', email), ' e a senha que você acabou de criar.'),
        !site && !App.emTeste() ? h('p.suave', 'Continue abrindo o app pelo mesmo link: ele vai pedir o e-mail e a senha. Quando o site do app abrir, o gestor avisa o endereço novo.') : null,
        App.via === 'senha' && !Site.ativo() && site ? h('p.suave', 'O seu link pessoal antigo parou de funcionar.') : null,
        site ? h('.acoes',
          h('a.btn.primario', { href: endereco, target: '_blank', rel: 'noopener' }, icone('externo'), 'Abrir ' + Site.curto(endereco)),
          h('button.btn', { type: 'button', onclick: async () => {
            const ok = await Comp.copiar(endereco);
            Comp.rapido(ok ? 'Endereço copiado.' : 'Não consegui copiar.', ok ? 'ok' : 'erro');
          } }, icone('copiar'), 'Copiar o endereço')) : null,
        site ? h('p.suave.pequeno', 'Dica: abra o endereço no celular e adicione à tela de início, para abrir o app como um aplicativo.') : null),
      rodape: [h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Pronto')]
    });
  },

  // =====================================================================
  // Sua conta
  // =====================================================================

  conta() {
    const s = App.sessao;
    if (!s) return;
    const entrada = s.entrada || {};
    const via = { senha: 'E-mail e senha', link: 'Link pessoal antigo', google: 'Conta do Google', dono: 'Conta do Google da dona do app' }[App.via] || '–';
    let f = null;
    const fechar = () => { if (f) f.fechar(); };
    const acoes = [];
    if (App.via === 'senha') {
      acoes.push(h('button.btn', { type: 'button', onclick: () => { fechar(); TelaEntrada.trocarSenha(); } }, icone('editar'), 'Trocar a senha'));
      acoes.push(h('button.btn', { type: 'button', onclick: () => {
        Guardado.gravar(Guardado.CREDENCIAL, '');
        App.sair();
        TelaEntrada.entrar({ info: 'Você saiu do app neste aparelho.' });
      } }, 'Sair deste aparelho'));
      const todos = h('button.btn.perigo', { type: 'button', onclick: async () => {
        const r = await App.executar('entrada.sairDeTodos', {}, { botao: todos, confirmarAntes: {
          texto: 'Sair em todos os aparelhos? O app fecha em todo celular e computador em que você entrou, inclusive este, e pede a senha de novo.',
          botao: 'Sair em todos', perigo: true } });
        if (!r) return;
        Guardado.gravar(Guardado.CREDENCIAL, '');
        App.sair();
        TelaEntrada.entrar({ info: 'Você saiu do app em todos os aparelhos.' });
      } }, 'Sair em todos os aparelhos');
      acoes.push(todos);
    } else if (App.via === 'link' || App.via === 'google') {
      acoes.push(h('button.btn.primario', { type: 'button', onclick: () => { fechar(); TelaEntrada.criarSenhaPeloLink(); } }, 'Criar a sua senha'));
    }
    f = Comp.folha({
      titulo: 'Sua conta',
      corpo: h('.pilha',
        h('dl.valores',
          h('dt', 'Nome'), h('dd', s.usuario.nome),
          h('dt', 'Perfil'), h('dd', s.usuario.perfil),
          h('dt', 'E-mail'), h('dd', entrada.email || '–'),
          h('dt', 'Entrou com'), h('dd', via)),
        App.via === 'dono' ? Comp.aviso('info', 'Você entrou pela conta dona do app, sem cadastro. Para entrar com e-mail e senha, cadastre-se em Configurações › Usuários e acessos e use o link de primeiro acesso.') : null,
        App.via === 'senha' ? h('p.suave.pequeno', 'Trocar a senha também fecha o app nos outros aparelhos em que você entrou.') : null,
        acoes.length ? h('.acoes', acoes) : null,
        h('p.suave.pequeno', 'Versão ' + VERSAO_TELA + (entrada.endereco && !App.emTeste() ? ' · ' + Site.curto(entrada.endereco) : ''))),
      rodape: [h('button.btn', { type: 'button', onclick: fechar }, 'Fechar')]
    });
  },

  trocarSenha() {
    const entrada = App.sessao.entrada || {};
    const atual = TelaEntrada.campoSenha({ rotulo: 'Senha atual', nome: 'atual' });
    const nova = TelaEntrada.campoSenha({ rotulo: 'Senha nova', nome: 'nova', nova: true, dica: TelaEntrada.DICA_SENHA });
    const repetida = TelaEntrada.campoSenha({ rotulo: 'Repita a senha nova', nome: 'repetida', nova: true });
    const z = TelaCaixa.folhaForm('Trocar a senha', [TelaEntrada.usuarioOculto(entrada.email), atual, nova, repetida], 'Trocar a senha');
    TelaEntrada.enterSalva(z.form, z.salvar);
    z.salvar.addEventListener('click', async () => {
      const a = atual.input.value, n = nova.input.value;
      if (!a) return TelaConfig.erro(z.erro, 'Informe a senha atual.');
      const problema = TelaEntrada.problemaDaSenha(n, entrada.email) ||
        (n !== repetida.input.value ? 'As duas senhas novas não estão iguais.' : n === a ? 'A senha nova é igual à atual.' : '');
      if (problema) return TelaConfig.erro(z.erro, problema);
      const r = await App.executar('entrada.trocarSenha', { atual: a, nova: n }, { botao: z.salvar, erroEm: z.erro,
        sucesso: 'Senha trocada. Nos outros aparelhos, entre de novo com a senha nova.' });
      if (!r) return;
      App.chave = r.credencial;
      Guardado.gravar(Guardado.CREDENCIAL, r.credencial);
      z.f.fechar();
    });
  }
};
</script>
  <script>
/* =====================================================================
   Peças e ações usadas em mais de uma tela: cartão de campanha, lista de
   dias da agenda, folha de dinâmica (aceitar, recusar, editar, cancelar,
   presença) e importação do relatório de vendas do portal.
   ===================================================================== */

const Blocos = {
  /** Chip do ritmo de vendas que o servidor calcula. */
  ritmo(r) {
    const mapa = {
      'acima': ['verde', 'No ritmo'], 'abaixo': ['vermelho', 'Abaixo do ritmo'], 'sem dados': ['', 'Sem vendas importadas'],
      'equilíbrio atingido': ['verde', 'Equilíbrio atingido'], 'vendas encerradas': ['', 'Vendas encerradas']
    };
    const m = mapa[r] || ['', r || '–'];
    return h('span.chip' + (m[0] ? '.' + m[0] : ''), m[1]);
  },

  presenca(p) {
    if (!p) return null;
    const cor = { 'Pendente': 'amarelo', 'Confirmada': 'verde', 'Recusada': 'vermelho' }[p] || '';
    return h('span.chip' + (cor ? '.' + cor : ''), Blocos.textoPresenca(p));
  },

  /** De quem é a presença: para o próprio influenciador, "sua"; para os outros, o nome dele. */
  textoPresenca(p) {
    const quem = App.perfil() === 'Influenciador e sócio' ? '' : App.sessao.influenciador || '';
    if (!quem) return { 'Pendente': 'Presença a confirmar', 'Confirmada': 'Presença confirmada', 'Recusada': 'Não vai estar' }[p] || p;
    return { 'Pendente': 'Presença de ' + quem + ' a confirmar', 'Confirmada': quem + ' confirmou presença', 'Recusada': quem + ' não vai estar' }[p] || p;
  },

  /** "-R$ 61,6 mil → -R$ 62,9 mil" */
  efeito(antes, depois) {
    // O compacto arredonda saldos grandes ao milhar, e R$ 650 virava "−R$ 113 mil → −R$ 114 mil". Quando a mudança é
    // pequena perto do saldo, as duas pontas ganham uma casa: "−R$ 112,9 mil → −R$ 113,5 mil".
    const a0 = Number(antes) || 0, a1 = Number(depois) || 0;
    const fino = Math.abs(a1 - a0) < 0.05 * Math.max(Math.abs(a0), Math.abs(a1));
    const fmt = (v) => {
      const a = Math.abs(v);
      if (!fino || a < 1000) return F.moeda(v, { compacto: true });
      const sinal = v < -0.004 ? '\u2212' : '';
      return a >= 1e6 ? sinal + 'R$\u00a0' + F.decimal(a / 1e6, 2) + '\u00a0mi' : sinal + 'R$\u00a0' + F.decimal(a / 1e3, 1) + '\u00a0mil';
    };
    return h('span.num', h('span.' + (F.cls(a0) || 'x'), fmt(a0)), ' → ', h('span.' + (F.cls(a1) || 'x'), fmt(a1)));
  },

  /** Cartão de uma campanha ativa (Hoje). c: cartão do servidor. */
  cartaoCampanha(c) {
    const falta = Number(c.cotasFaltaEquilibrio) > 0;
    const linhas = [];
    if (c.ritmo === 'equilíbrio atingido') {
      linhas.push(h('span', Number(c.pctVendido) >= 0.9999 ? 'Todas as cotas foram vendidas.' : 'Equilíbrio atingido: cada venda agora é lucro.'));
    } else if (falta) {
      linhas.push(h('span', 'Equilíbrio: faltam ', h('strong', F.int(c.cotasFaltaEquilibrio) + ' cotas'),
        ' (' + F.moeda(c.faltaEquilibrio, { compacto: true }) + ')',
        c.diasRestantes > 0 ? ' em ' + F.plural(c.diasRestantes, 'dia', 'dias') : ''));
    }
    const kpis = [];
    // Com o webhook do portal, a venda de hoje vem primeiro (o resto da linha é dos dias fechados).
    if (c.aoVivo) {
      kpis.push(h('span', 'Hoje ', h('strong', F.moeda(c.vendaHoje, { semCentavos: true })),
        h('span.marca-vivo', { title: 'Pelo webhook do portal, a cada 5 minutos' }, 'ao vivo')));
    }
    if (c.necessarioPorDia > 0 && c.ritmo !== 'equilíbrio atingido') kpis.push(h('span', 'Precisa ', h('strong', F.moeda(c.necessarioPorDia, { semCentavos: true }) + '/dia')));
    if (!F.vazio(c.vendaOntem)) kpis.push(h('span', 'Ontem ', h('strong', F.moeda(c.vendaOntem, { semCentavos: true }))));
    if (!F.vazio(c.media3)) kpis.push(h('span', 'Média 3 dias ', h('strong', F.moeda(c.media3, { semCentavos: true }))));
    kpis.push(h('span', 'Saldo projetado ', h('strong.' + (F.cls(c.saldoProjetado) || 'x'), F.moeda(c.saldoProjetado, { compacto: true }))));
    const sorteio = c.sorteio ? 'sorteio ' + F.dataCurta(c.sorteio) + (c.diasRestantes >= 0 ? ' · ' + F.plural(c.diasRestantes, 'dia', 'dias') : '') : '';
    return h('a.cartao', { href: '#campanha/' + encodeURIComponent(c.id), onclick: App.cliqueNav('campanha/' + encodeURIComponent(c.id)) },
      h('.cabeca',
        h('.titulo', h('h2', c.nome), h('.sub', [c.fase, sorteio].filter(Boolean).join(' · '))),
        Blocos.ritmo(c.ritmo)),
      h('div',
        h('p', { style: { margin: '0 0 6px' } }, h('strong', F.pct(c.pctVendido) + ' vendido'), ' · ' + F.moeda(c.vendaTotal, { compacto: true })),
        Comp.progresso({ valor: c.pctVendido, rotulo: 'Cotas vendidas', rotulos: true, cor: c.ritmo === 'abaixo' ? 'vermelho' : c.ritmo === 'equilíbrio atingido' ? 'verde' : '',
          marcas: [{ valor: c.pctEquilibrio, rotulo: 'Equilíbrio ' + F.pct(c.pctEquilibrio) }] })),
      linhas.length ? h('p', { style: { margin: 0 } }, linhas) : null,
      h('.linha-kpis.suave', kpis),
      c.ultimoDiaImportado && difDias(c.ultimoDiaImportado, App.hoje()) > 1
        ? h('.pequeno.neg', 'Vendas importadas até ' + F.dataCurta(c.ultimoDiaImportado) + ': os números podem estar atrasados.') : null);
  },

  /**
   * Lista de dias da agenda (Hoje e Calendário no celular).
   * op: { aoMudar, mostrarCampanha, semVazios }
   */
  dias(dias, op) {
    op = op || {};
    return (dias || []).map((d) => {
      const hoje = mesmoDia(d.dia, App.hoje());
      const marcas = [];
      if (d.feriado) marcas.push(h('span.chip.roxo', 'Feriado'));
      (d.datas || []).forEach((x) => { if (!(d.feriado && x === 'Feriado')) marcas.push(h('span.chip.roxo', x)); });
      const temItens = d.itens && d.itens.length;
      // Dia sem nada: some do resumo (Hoje) e vira uma linha só no calendário, que serve para ver os dias livres.
      if (!temItens && op.semVazios && !marcas.length && !hoje) return null;
      return h('section.dia-agenda' + (hoje ? '.hoje' : '') + (temItens ? '' : '.livre'),
        h('header', h('span.data', hoje ? 'Hoje, ' + F.dataCurta(d.dia) : F.diaLongo(d.dia)), marcas,
          temItens ? null : h('span.suave.pequeno', 'nada marcado')),
        temItens ? d.itens.map((it) => Blocos.itemAgenda(it, op)) : null);
    });
  },

  itemAgenda(it, op) {
    op = op || {};
    const clicavel = (it.tipo === 'sugestao' || it.tipo === 'dinamica') && App.pode('dinamicas.listar');
    const hora = it.hora ? F.hora(it.hora) : it.tipo === 'agenda' ? 'Dia todo' : '';
    let titulo, detalhe = [], chips = [];
    const daCampanha = op.mostrarCampanha && it.campanhaNome ? it.campanhaNome : '';
    const custo = (x) => Number(x) > 0.004 ? F.moeda(x, { semCentavos: true }) + ' com IR' : 'Sem custo de prêmio';
    if (it.tipo === 'agenda') {
      titulo = it.titulo;
      // A classificação só entra quando diz algo que o título ainda não diz ("Live no Instagram" já é uma live).
      if (!it.classificacao) detalhe.push('Agenda do influenciador');
      else if (semAcento(it.titulo).indexOf(semAcento(it.classificacao)) < 0) detalhe.push(it.classificacao);
      if (it.permiteLive === 'Não') detalhe.push('sem live');
    } else if (it.tipo === 'sugestao') {
      titulo = 'Sugestão: ' + it.nome;
      detalhe.push(custo(it.custo));
      if (Number(it.custo) > 0.004 && !F.vazio(it.saldoProjetadoAntes)) {
        detalhe.push(h('span', 'saldo projetado da campanha ', Blocos.efeito(it.saldoProjetadoAntes, it.saldoProjetadoDepois)));
      }
      if (it.acimaOrcamento) chips.push(h('span.chip.vermelho', 'Acima do orçamento'));
      if (it.foraRegulamento) chips.push(h('span.chip.amarelo', 'Fora do regulamento'));
    } else if (it.tipo === 'dinamica') {
      titulo = it.nome;
      detalhe.push(custo(it.custo));
      if (it.status && it.status !== 'Aprovada') chips.push(Comp.chipStatus(it.status));
      if (it.presenca) chips.push(Blocos.presenca(it.presenca));
      // Aprovada acima do orçamento foi decisão da gestão: o aviso é para quem decide, em cinza como no cockpit.
      if (it.acimaOrcamento && App.pode('dinamicas.aceitar')) chips.push(h('span.chip', 'Aprovada acima do orçamento'));
    } else if (it.tipo === 'disparo') {
      titulo = F.disparo(it);
      if (it.custo) detalhe.push(F.moeda(it.custo, { semCentavos: true }));
    } else if (it.tipo === 'marco') {
      titulo = it.titulo;
    }
    if (daCampanha) detalhe.unshift(daCampanha);
    const partes = [];
    detalhe.forEach((x, i) => { if (i) partes.push(' · '); partes.push(x); });
    const abrir = () => Acoes.dinamica({ id: it.id, campanha: it.campanha, nome: it.nome }, { aoMudar: op.aoMudar });
    return h('.item-agenda.' + it.tipo + (clicavel ? '.clicavel' : ''), clicavel ? {
      role: 'button', tabindex: '0', onclick: abrir,
      onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } }
    } : null,
      h('.hora' + (it.hora ? '' : '.dia-todo'), hora),
      h('.corpo', h('.t', titulo), partes.length ? h('.d', partes) : null, chips.length ? h('.chips', { style: { marginTop: '4px' } }, chips) : null),
      clicavel ? icone('avancar', 'seta') : null);
  }
};

const Acoes = {
  /**
   * Folha de uma dinâmica: sugestão (aceitar, recusar, ajustar) ou aprovada (detalhes, editar, cancelar, presença).
   * ref: { id, campanha, nome }; op: { aoMudar }
   */
  async dinamica(ref, op) {
    op = op || {};
    const f = Comp.folha({ titulo: ref.nome || 'Dinâmica', corpo: Comp.esqueleto(2) });
    let dados;
    try {
      dados = await App.chamar('dinamicas.listar', { campanha: ref.campanha });
    } catch (e) {
      f.mostrar(Comp.falha(e, () => { f.fechar(); Acoes.dinamica(ref, op); }), []);
      return;
    }
    const d = (dados.dinamicas || []).filter((x) => x.id === ref.id)[0];
    if (!d) {
      f.mostrar(Comp.aviso('alerta', 'Esta dinâmica não está mais na lista: as sugestões são refeitas todo dia. Atualize a tela.'), []);
      return;
    }
    d.campanha = d.campanha || ref.campanha;
    f.renomear(d.nome);
    const mudou = () => { if (op.aoMudar) op.aoMudar(); };
    if (d.status === 'Sugerida' && App.pode('dinamicas.aceitar')) Acoes.sugestao(f, d, dados, mudou);
    else Acoes.aprovada(f, d, mudou);
  },

  /** Cabeçalho comum: quando, campanha, chips. */
  cabecalhoDinamica(d) {
    const c = App.campanha(d.campanha);
    const chips = [Comp.chipStatus(d.status === 'Sugerida' ? 'Sugerida' : d.status)];
    if (d.acimaOrcamento) chips.push(h('span.chip.vermelho', 'Acima do orçamento'));
    if (d.noRegulamento === 'Não') chips.push(h('span.chip.amarelo', 'Fora do regulamento'));
    if (d.presenca) chips.push(Blocos.presenca(d.presenca));
    const quando = lerData(d.inicio) ? F.diaLongo(d.inicio) + ' às ' + F.hora(d.inicio) + (d.fim ? ' até ' + F.hora(d.fim) : '') : 'Sem data';
    return [
      h('.chips', chips),
      h('p', { style: { margin: '10px 0 0' } }, h('strong', quando), c ? h('span.suave', ' · ' + c.nome) : null),
      d.motivo && d.status === 'Sugerida' ? h('p.suave', { style: { margin: '6px 0 0' } }, 'Por que agora: ' + d.motivo) : null,
      d.comoFunciona ? h('p.suave.pequeno', { style: { margin: '6px 0 0' } }, d.comoFunciona) : null
    ];
  },

  valoresDinamica(d) {
    return h('dl.valores', { style: { marginTop: '14px' } },
      h('dt', 'Prêmio'), h('dd', d.premio || F.moeda(d.valor)),
      h('dt', 'IR do prêmio'), h('dd', d.recolheIr === 'Não' ? 'não recolhe' : F.moeda(d.ir)),
      h('dt.total', 'Custo total'), h('dd.total', F.moeda(d.custo)));
  },

  /** Sugestão: efeito no orçamento e no saldo, ajustes e aceitar/recusar. */
  sugestao(f, d, dados, mudou) {
    const efeito = h('dl.valores', { style: { marginTop: '10px' } },
      h('dt', 'Orçamento livre de dinâmicas'), h('dd', Blocos.efeito(d.orcamentoLivreAntes, d.orcamentoLivreDepois)),
      h('dt', 'Saldo projetado da campanha'), h('dd', Blocos.efeito(d.saldoProjetadoAntes, d.saldoProjetadoDepois)));
    const avisoJust = h('div');
    const campoJust = Comp.campo({ rotulo: 'Justificativa da gestão', nome: 'justificativa', tipo: 'textarea', linhas: 3,
      dica: 'Fica registrada com o seu nome na dinâmica e aparece no relatório da campanha.' });
    const blocoJust = h('.form', avisoJust, campoJust);
    if (d.precisaJustificativa) {
      const motivos = d.motivosJustificativa || [];
      trocar(avisoJust, Comp.aviso('perigo', motivos.length
        ? 'Esta dinâmica ' + motivos.join(' e ') + '. Você pode aprovar como decisão da gestão: escreva a justificativa.'
        : 'Para aprovar, escreva a justificativa da gestão.'));
    } else {
      blocoJust.hidden = true;
    }
    const campoReg = Comp.campo({ rotulo: 'Esta dinâmica está no regulamento?', nome: 'noRegulamento', tipo: 'simnao', valor: d.noRegulamento,
      dica: 'Sim: o prêmio entra nos bilhetes premiados declarados. Não: precisa de justificativa.' });
    const avisoReg = h('div');
    const blocoReg = h('.form', avisoReg, campoReg);
    const convidar = h('label.check', h('input', { type: 'checkbox', name: 'convidar', checked: d.presenca === 'Pendente' }),
      h('span', 'Pedir a presença do influenciador', h('span.suave.pequeno', { style: { display: 'block' } }, 'A dinâmica entra na agenda dele e ele confirma pelo app.')));
    const ajustes = h('details.ajustes', d.regulamentoPendente ? null : { },
      h('summary', 'Ajustar horário, prêmio ou marcações'),
      h('.grade.duas', { style: { marginTop: '12px' } },
        Comp.campo({ rotulo: 'Início', nome: 'inicio', tipo: 'datahora', valor: d.inicio }),
        Comp.campo({ rotulo: 'Valor do prêmio', nome: 'valor', tipo: 'moeda', valor: d.valor }),
        Comp.campo({ rotulo: 'Tipo do prêmio', nome: 'tipoPremio', tipo: 'select', opcoes: ['Dinheiro', 'Bem'], valor: d.tipoPremio || 'Dinheiro' }),
        Comp.campo({ rotulo: 'Recolhe IR?', nome: 'recolheIr', tipo: 'simnao', valor: d.recolheIr }),
        d.regulamentoPendente ? null : h('.largo', blocoReg)),
      h('p.suave.pequeno', { style: { margin: '10px 0 0' } }, 'Se mudar o valor ou o tipo, o custo e o saldo novos aparecem depois de aceitar.'));
    const form = h('form.form', { onsubmit: (ev) => { ev.preventDefault(); aceitar(); } },
      Acoes.cabecalhoDinamica(d), Acoes.valoresDinamica(d), efeito,
      d.regulamentoPendente ? blocoReg : null, blocoJust, convidar, ajustes);
    const botaoAceitar = h('button.btn.primario', { type: 'button', onclick: () => aceitar() }, icone('ok'), 'Aceitar');
    const botaoRecusar = h('button.btn', { type: 'button', onclick: () => Acoes.recusar(d, () => { f.fechar(); mudou(); }) }, 'Recusar');
    f.mostrar(form, [botaoRecusar, botaoAceitar]);

    async function aceitar() {
      const v = Comp.lerForm(form);
      if (d.precisaJustificativa && !String(v.justificativa || '').trim()) {
        trocar(avisoJust, Comp.aviso('perigo', 'Para aprovar, escreva a justificativa da gestão.'));
        campoJust.querySelector('textarea').focus();
        return;
      }
      const p = { id: d.id, convidar: !!v.convidar };
      if (v.justificativa) p.justificativa = v.justificativa;
      if (v.noRegulamento) p.noRegulamento = v.noRegulamento;
      if (v.inicio && v.inicio !== isoLocal(d.inicio)) p.inicio = v.inicio;
      if (v.valor !== F.campoMoeda(d.valor)) p.valor = v.valor;
      if (v.tipoPremio && v.tipoPremio !== (d.tipoPremio || 'Dinheiro')) p.tipoPremio = v.tipoPremio;
      if (v.recolheIr && v.recolheIr !== d.recolheIr) p.recolheIr = v.recolheIr;
      const r = await App.executar('dinamicas.aceitar', p, {
        botao: botaoAceitar,
        sucesso: (x) => 'Dinâmica aprovada. Saldo projetado da campanha: ' + F.moeda(x.saldoProjetadoAntes, { compacto: true }) + ' → ' +
          F.moeda(x.saldoProjetadoDepois, { compacto: true }) + '.',
        aoErrar: (e) => {
          const extra = e.extra || {};
          if (extra.precisaJustificativa) {
            blocoJust.hidden = false;
            trocar(avisoJust, Comp.aviso('perigo', e.message));
            campoJust.querySelector('textarea').focus();
            return null;
          }
          if (extra.precisaRegulamento) {
            if (!d.regulamentoPendente) ajustes.open = true;
            trocar(avisoReg, Comp.aviso('perigo', e.message));
            campoReg.scrollIntoView({ block: 'center', behavior: 'smooth' });
            return null;
          }
          return undefined;
        }
      });
      if (r) { f.fechar(); mudou(); }
    }
  },

  recusar(d, depois) {
    const motivo = Comp.campo({ rotulo: 'Motivo', nome: 'motivo', opcional: true, dica: 'Fica registrado na dinâmica.' });
    const botao = h('button.btn.perigo.cheio', { type: 'button' }, 'Recusar sugestão');
    const f2 = Comp.folha({
      titulo: 'Recusar a sugestão?',
      corpo: [h('p', d.nome + ' de ' + F.quando(d.inicio) + ' sai da lista e não volta a ser sugerida para este dia.'), motivo],
      rodape: [h('button.btn', { type: 'button', onclick: () => f2.fechar() }, 'Voltar'), botao]
    });
    botao.addEventListener('click', async () => {
      const r = await App.executar('dinamicas.recusar', { id: d.id, motivo: motivo.querySelector('input').value.trim() },
        { botao: botao, sucesso: 'Sugestão recusada.' });
      if (r) { f2.fechar(); depois(); }
    });
  },

  /** Dinâmica aprovada, ativa ou encerrada. */
  aprovada(f, d, mudou) {
    const extra = [];
    if (d.justificativa) extra.push(h('dt', 'Justificativa'), h('dd', { style: { textAlign: 'left', fontWeight: 400 } }, d.justificativa));
    if (d.aprovadoPor) extra.push(h('dt', 'Aprovada por'), h('dd', d.aprovadoPor));
    if (!F.vazio(d.vendaPeriodo)) {
      extra.push(h('dt', 'Venda no período'), h('dd', F.moeda(d.vendaPeriodo)));
      extra.push(h('dt', 'Venda além da média'), h('dd.' + (F.cls(d.vendaAdicional) || 'x'), F.moeda(d.vendaAdicional)));
      if (!F.vazio(d.retorno)) extra.push(h('dt', 'Retorno'), h('dd', F.retorno(d.retorno) + ' o custo'));
    } else if (d.status === 'Encerrada') {
      extra.push(h('dt', 'Retorno'), h('dd.suave', 'medido quando as vendas do dia forem importadas'));
    }
    const corpo = [Acoes.cabecalhoDinamica(d), Acoes.valoresDinamica(d), extra.length ? h('dl.valores', { style: { marginTop: '10px' } }, extra) : null];
    const botoes = [];
    const vigente = d.status === 'Aprovada' || d.status === 'Ativa';
    if (vigente && App.pode('dinamicas.editar')) {
      botoes.push(h('button.btn.perigo', { type: 'button', onclick: () => Acoes.cancelar(d, () => { f.fechar(); mudou(); }) }, 'Cancelar dinâmica'));
      botoes.push(h('button.btn.primario', { type: 'button', onclick: () => Acoes.editarDinamica(f, d, mudou) }, icone('editar'), 'Editar'));
    } else if (vigente && App.pode('dinamicas.confirmarPresenca') && d.presenca) {
      if (d.presenca !== 'Recusada') botoes.push(h('button.btn', { type: 'button', onclick: () => Acoes.presenca(d, 'Recusada', () => { f.fechar(); mudou(); }) }, 'Não vou poder'));
      if (d.presenca !== 'Confirmada') {
        // Neutro como o "Não vou poder": verde com ✓ parecia resposta já dada.
        const b = h('button.btn', { type: 'button', onclick: () => Acoes.presenca(d, 'Confirmada', () => { f.fechar(); mudou(); }, b) }, 'Vou estar');
        botoes.push(b);
      }
    }
    f.mostrar(corpo, botoes);
  },

  editarDinamica(f, d, mudou) {
    const form = h('form.form', { onsubmit: (ev) => { ev.preventDefault(); salvar(); } },
      h('.grade.duas',
        Comp.campo({ rotulo: 'Início', nome: 'inicio', tipo: 'datahora', valor: d.inicio }),
        Comp.campo({ rotulo: 'Término', nome: 'fim', tipo: 'datahora', valor: d.fim }),
        Comp.campo({ rotulo: 'Valor do prêmio', nome: 'valor', tipo: 'moeda', valor: d.valor }),
        Comp.campo({ rotulo: 'Tipo do prêmio', nome: 'tipoPremio', tipo: 'select', opcoes: ['Dinheiro', 'Bem'], valor: d.tipoPremio || 'Dinheiro' }),
        Comp.campo({ rotulo: 'No regulamento?', nome: 'noRegulamento', tipo: 'simnao', valor: d.noRegulamento }),
        Comp.campo({ rotulo: 'Recolhe IR?', nome: 'recolheIr', tipo: 'simnao', valor: d.recolheIr }),
        Comp.campo({ rotulo: 'Descrição do prêmio', nome: 'premio', valor: d.premio, largo: true, opcional: true,
          dica: 'Vazio: o app escreve pelo valor e o tipo.' }),
        Comp.campo({ rotulo: 'Justificativa', nome: 'justificativa', tipo: 'textarea', linhas: 2, largo: true,
          dica: d.justificativa ? 'Atual: ' + d.justificativa : 'Só é obrigatória se a dinâmica passar do orçamento ou sair do regulamento.' })),
      h('p.suave.pequeno', 'Mudar o horário refaz o evento no Calendar e as mensagens pendentes desta dinâmica.'));
    const erro = h('div');
    const salvarBtn = h('button.btn.primario', { type: 'button', onclick: () => salvar() }, 'Salvar');
    f.mostrar([erro, form], [h('button.btn', { type: 'button', onclick: () => Acoes.aprovada(f, d, mudou) }, 'Voltar'), salvarBtn]);

    async function salvar() {
      const v = Comp.lerForm(form);
      const p = { id: d.id };
      if (v.inicio !== isoLocal(d.inicio)) p.inicio = v.inicio;
      if (v.fim !== isoLocal(d.fim)) p.fim = v.fim;
      if (v.valor !== F.campoMoeda(d.valor)) p.valor = v.valor;
      if (v.tipoPremio !== (d.tipoPremio || 'Dinheiro')) p.tipoPremio = v.tipoPremio;
      if (v.noRegulamento && v.noRegulamento !== d.noRegulamento) p.noRegulamento = v.noRegulamento;
      if (v.recolheIr && v.recolheIr !== d.recolheIr) p.recolheIr = v.recolheIr;
      if (v.premio !== (d.premio || '')) p.premio = v.premio;
      if (v.justificativa) p.justificativa = v.justificativa;
      const r = await App.executar('dinamicas.editar', p, { botao: salvarBtn, erroEm: erro, sucesso: 'Dinâmica atualizada.' });
      if (r) { f.fechar(); mudou(); }
    }
  },

  cancelar(d, depois) {
    const motivo = Comp.campo({ rotulo: 'Motivo do cancelamento', nome: 'motivo', obrigatorio: true });
    const erro = h('div');
    const botao = h('button.btn.perigo.cheio', { type: 'button' }, 'Cancelar dinâmica');
    const f2 = Comp.folha({
      titulo: 'Cancelar ' + d.nome + '?',
      corpo: [h('p', 'O evento sai do Google Calendar, a reserva sai do caixa e as mensagens pendentes dela são apagadas.'), motivo, erro],
      rodape: [h('button.btn', { type: 'button', onclick: () => f2.fechar() }, 'Voltar'), botao]
    });
    botao.addEventListener('click', async () => {
      const texto = motivo.querySelector('input').value.trim();
      if (!texto) { trocar(erro, Comp.aviso('perigo', 'Escreva o motivo.')); return; }
      // O servidor pergunta de novo; aqui a pessoa já confirmou.
      const r = await App.executar('dinamicas.cancelar', { id: d.id, motivo: texto, confirmar: true },
        { botao: botao, erroEm: erro, sucesso: 'Dinâmica cancelada.' });
      if (r) { f2.fechar(); depois(); }
    });
  },

  /** Resposta do influenciador. Recusar pede o motivo (opcional). */
  async presenca(d, resposta, depois, botao) {
    if (resposta === 'Confirmada') {
      const r = await App.executar('dinamicas.confirmarPresenca', { id: d.id, resposta: resposta }, { botao: botao, sucesso: 'Presença confirmada. Obrigado!' });
      if (r && depois) depois();
      return;
    }
    const obs = Comp.campo({ rotulo: 'Quer avisar o motivo?', nome: 'obs', opcional: true, dica: 'A gestão vê a sua resposta no app.' });
    const b = h('button.btn.perigo.cheio', { type: 'button' }, 'Não vou poder');
    const f2 = Comp.folha({
      titulo: 'Não vai poder estar?',
      corpo: [h('p', (d.nome || 'Dinâmica') + (d.inicio ? ' · ' + F.quando(d.inicio) : '') + '. A gestão vai trocar o horário ou seguir sem você.'), obs],
      rodape: [h('button.btn', { type: 'button', onclick: () => f2.fechar() }, 'Voltar'), b]
    });
    b.addEventListener('click', async () => {
      const r = await App.executar('dinamicas.confirmarPresenca', { id: d.id, resposta: 'Recusada', obs: obs.querySelector('input').value.trim() },
        { botao: b, sucesso: 'Resposta enviada.' });
      if (r) { f2.fechar(); if (depois) depois(); }
    });
  },

  /** Aceita várias sugestões de uma vez; as que precisam de decisão ficam listadas. */
  async aceitarTodas(sugestoes, op) {
    op = op || {};
    const custo = sugestoes.reduce((t, s) => t + (Number(s.custo) || 0), 0);
    const ok = await Comp.confirmar({
      titulo: 'Aceitar ' + F.plural(sugestoes.length, 'sugestão', 'sugestões') + '?',
      texto: 'Custo somado: ' + F.moeda(custo) + ' com IR. Se alguma ainda precisar de decisão sua (orçamento ou regulamento), ela fica para você ver uma a uma.',
      botao: 'Aceitar'
    });
    if (!ok) return;
    const r = await App.executar('dinamicas.aceitarVarias', { ids: sugestoes.map((s) => s.id) }, { botao: op.botao });
    if (!r) return;
    if (!r.pendentes.length) {
      Comp.rapido(F.plural(r.aceitas.length, 'dinâmica aprovada', 'dinâmicas aprovadas') + '.', 'ok');
    } else {
      const nomes = {};
      sugestoes.forEach((s) => { nomes[s.id] = s; });
      const f = Comp.folha({
        titulo: F.plural(r.aceitas.length, 'aprovada', 'aprovadas') + ', ' + F.plural(r.pendentes.length, 'precisa', 'precisam') + ' de você',
        corpo: h('ul.lista.dentro', r.pendentes.map((p) => {
          const s = nomes[p.id] || { id: p.id };
          return h('li.clicavel', { role: 'button', tabindex: '0', onclick: () => { f.fechar(); Acoes.dinamica({ id: p.id, campanha: s.campanha, nome: s.nome }, op); } },
            h('span.ponto.media'), h('.principal', h('.t', (s.nome || p.id) + (s.inicio ? ' · ' + F.quando(s.inicio) : '')), h('.d', p.motivo)),
            icone('avancar', 'seta'));
        })),
        rodape: [h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Fechar')]
      });
    }
    if (op.aoMudar) op.aoMudar();
  },

  /** Importa o resumo do portal (o arquivo relatorio-overview) de uma campanha. */
  importarVendas(campanha, op) {
    op = op || {};
    const seletor = campanha ? null : Comp.campo({ rotulo: 'Campanha', nome: 'campanha', tipo: 'select',
      opcoes: (App.sessao.campanhas || []).filter((c) => c.status !== 'Encerrada').map((c) => ({ valor: c.id, rotulo: c.nome })),
      valor: Comp.campanhaPadrao() });
    const arq = Comp.arquivo({ rotulo: 'Resumo do portal', aceita: '.csv,text/csv,text/plain',
      dica: 'O arquivo "relatorio-overview" que o portal exporta, com as colunas Data, Participantes, Pedidos, Expirados e Faturamento. Pode subir o período todo: os dias que já existem são atualizados.' });
    const erro = h('div');
    // O mesmo nome do botão que abre esta folha ("Enviar resumo do portal") e o mesmo rodapé das outras folhas.
    const botao = h('button.btn.primario', { type: 'button' }, icone('upload'), 'Enviar');
    const c = campanha ? App.campanha(campanha) : null;
    const f = Comp.folha({
      titulo: 'Resumo do portal' + (c ? ' · ' + c.nome : ''),
      corpo: [seletor, arq, erro],
      rodape: [h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Voltar'), botao]
    });
    botao.addEventListener('click', async () => {
      trocar(erro, []);
      let arquivo;
      try { arquivo = await Comp.lerArquivo(arq, { texto: true, limiteMb: 5 }); } catch (e) { trocar(erro, Comp.aviso('perigo', e.message)); return; }
      if (!arquivo) { trocar(erro, Comp.aviso('perigo', 'Escolha o arquivo do portal.')); return; }
      const id = campanha || seletor.querySelector('select').value;
      const r = await App.executar('vendas.importarOverview', { campanha: id, arquivo: arquivo }, { botao: botao, erroEm: erro });
      if (!r) return;
      const resumo = [
        h('dt', 'Dias no arquivo'), h('dd', F.int(r.dias) + ' (' + F.periodo(r.periodo.de, r.periodo.ate) + ')'),
        h('dt', 'Novos'), h('dd', F.int(r.novos)),
        h('dt', 'Atualizados'), h('dd', F.int(r.substituidos)),
        h('dt', 'Sem mudança'), h('dd', F.int(r.iguais)),
        h('dt', 'Faturamento no arquivo'), h('dd', F.moeda(r.faturamento)),
        h('dt', 'Pedidos pagos'), h('dd', F.int(r.pedidos)),
        h('dt', 'Expirados'), h('dd', F.int(r.expirados))
      ];
      // Dias que vinham do webhook: o resumo substituiu, e a diferença mostra se o webhook está somando certo.
      const conf = r.conferencia || [];
      const bateu = conf.every((x) => Math.abs(x.diferenca) < 0.005);
      f.mostrar([
        Comp.aviso('sucesso', 'Resumo enviado. O caixa e o ritmo da campanha já estão atualizados.'),
        r.hojeComWebhook ? Comp.aviso('info', 'Hoje (' + F.dataCurta(r.hojeComWebhook.dia) + ') ficou com o webhook do portal, porque o dia ainda está vendendo. O resumo de amanhã traz o dia inteiro.') : null,
        h('dl.valores', { style: { marginTop: '12px' } }, resumo),
        conf.length ? h('div', { style: { marginTop: '14px' } },
          h('h3', { style: { margin: '0 0 6px', fontSize: '.95rem' } }, 'Conferência com o webhook'),
          bateu ? h('p.suave.pequeno', { style: { margin: 0 } }, 'O resumo bateu com o webhook ' + (conf.length === 1 ? 'no dia ' + F.dataCurta(conf[0].dia) : 'nos ' + F.int(conf.length) + ' dias') + '.')
            : [Comp.tabela([
              { titulo: 'Dia', valor: (x) => F.dataCurta(x.dia) },
              { titulo: 'Webhook', dir: true, valor: (x) => h('span.num', F.moeda(x.webhook.faturamento)) },
              { titulo: 'Resumo', dir: true, valor: (x) => h('span.num', F.moeda(x.arquivo.faturamento)) },
              { titulo: 'Diferença', dir: true, valor: (x) => h('span.num.' + (Math.abs(x.diferenca) < 0.005 ? 'x' : F.cls(x.diferenca) || 'x'),
                Math.abs(x.diferenca) < 0.005 ? '–' : F.moeda(x.diferenca)) }
            ], conf), h('p.suave.pequeno', { style: { margin: '6px 0 0' } }, 'O resumo é o oficial: os números dele já valem nesses dias.')]) : null,
        r.erros && r.erros.length ? Comp.aviso('alerta', [h('strong', 'Linhas que não entraram:'), h('ul', r.erros.slice(0, 8).map((x) => h('li', x)))]) : null,
        r.colunasIgnoradas && r.colunasIgnoradas.length ? h('p.suave.pequeno', 'Colunas ignoradas: ' + r.colunasIgnoradas.join(', ') + '.') : null
      ], [h('button.btn.primario', { type: 'button', onclick: () => f.fechar() }, 'Pronto')]);
      if (op.aoMudar) op.aoMudar();
    });
  }
};
</script>
  <script>
/* =====================================================================
   Cópia de teste: o roteiro de teste de cada perfil (no alto de Hoje e,
   para quem envia as mensagens, de Mensagens) e, para o gestor, o botão
   que prepara a campanha de teste. Só aparece quando o app roda numa
   cópia da planilha (sessao.ambiente.teste). O que cada pessoa já marcou
   fica guardado neste aparelho.
   ===================================================================== */

const Roteiro = {
  /** Cada passo: id (não muda), t (o que fazer) e rota (onde fazer, com {c} = campanha de teste). */
  PASSOS: {
    'Gestor': [
      { id: 'g-links', t: 'Em Configurações > Usuários, dê nome às linhas de Operação e Envios e mande a cada pessoa o link de teste dela. Se ninguém faz a operação, use o seu nome nessa linha para testar essa visão.', rota: 'config/usuarios' },
      { id: 'g-verificar', t: 'Em Configurações > Verificar a instalação, confira que nada ficou em vermelho.', rota: 'config/verificacao' },
      { id: 'g-campanha', t: 'Abra a campanha Moto de teste e passe por todas as abas. Veja se os números fazem sentido.', rota: 'campanha/{c}' },
      { id: 'g-sugestoes', t: 'Aqui em Hoje, aceite uma sugestão de dinâmica e recuse outra. A aceita vai para o Calendário e para o Google Agenda, com [Teste] no nome.' },
      { id: 'g-calendario', t: 'No Calendário, mude o horário da dinâmica de hoje e confira no Google Agenda que o evento mudou junto.', rota: 'calendario' },
      { id: 'g-caixa', t: 'No Caixa, lance uma despesa com a foto de um comprovante e depois corrija o valor.', rota: 'caixa' },

      { id: 'e-ordem', t: 'Veja as mensagens de hoje, na ordem dos horários.' },

      { id: 'e-whatsapp', t: 'Toque em WhatsApp numa mensagem: o WhatsApp abre com o texto pronto para você escolher a conversa.' },
