      h('fieldset.escolhas', h('legend', 'Fases em que pode ser sugerida'), h('.grade.duas', caixaTodas, caixasFase)),
      h('.grade.duas',
        Comp.campo({ rotulo: 'Exige live', nome: 'exigeLive', tipo: 'simnao', valor: novo ? 'Não' : b.exigeLive }),
        Comp.campo({ rotulo: 'No regulamento', nome: 'noRegulamento', tipo: 'simnao', valor: novo ? '' : b.noRegulamento,
          dica: 'Fora do regulamento, a sugestão aparece marcada como decisão da gestão.' }),
        Comp.campo({ rotulo: 'Recolhe IR', nome: 'recolheIr', tipo: 'simnao', valor: novo ? '' : b.recolheIr,
          dica: 'Sem marcar, o app conta o IR no custo.' }))
    ], 'Salvar', { larga: true });
    const marcarTodas = () => {
      const t = caixaTodas.querySelector('input').checked;
      caixasFase.forEach((c) => { const i = c.querySelector('input'); i.disabled = t; if (t) i.checked = false; });
    };
    caixaTodas.querySelector('input').addEventListener('change', marcarTodas);
    marcarTodas();
    z.salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(z.form);
      if (novo && !/^[A-Za-z]\d{1,2}$/.test(v.codigo || '')) return TelaConfig.erro(z.erro, 'O código é uma letra e um número, como C7.');
      if (!v.nome) return TelaConfig.erro(z.erro, 'Dê um nome à dinâmica.');
      const escolhidas = v.fase_Todas ? ['Todas'] : (App.sessao.listas.fases || []).filter((f) => v['fase_' + f]);
      if (!escolhidas.length) return TelaConfig.erro(z.erro, 'Marque ao menos uma fase.');
      const params = { codigo: novo ? v.codigo.toUpperCase() : b.codigo, nome: v.nome, familia: v.familia, faixa: v.faixa, comoFunciona: v.comoFunciona,
        premioPadrao: v.premioPadrao, tipoPremioPadrao: v.tipoPremioPadrao, duracao: v.duracao, intervalo: v.intervalo, gatilho: v.gatilho,
        fases: escolhidas.join(', '), exigeLive: v.exigeLive, noRegulamento: v.noRegulamento, recolheIr: v.recolheIr };
      if (novo && bib.some((x) => String(x.codigo).toUpperCase() === params.codigo)) return TelaConfig.erro(z.erro, 'Já existe a dinâmica ' + params.codigo + '.');
      const r = await App.executar('biblioteca.salvar', params, { botao: z.salvar, erroEm: z.erro, sucesso: novo ? 'Dinâmica criada.' : 'Dinâmica salva.' });
      if (r) { z.f.fechar(); recarregar(); }
    });
  },

  // =====================================================================
  // Auditoria
  // =====================================================================

  valorAud(v, max) {
    if (v === '' || v === null || v === undefined) return 'vazio';
    const s = typeof v === 'number' ? F.decimal(v, v % 1 ? 4 : 0).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '') : String(v);
    max = max || 160;
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  },

  /** Uma alteração: registro criado (só o depois), excluído (só o antes, riscado) ou campo mudado (antes → depois). */
  linhaAuditoria(x) {
    let mudanca;
    if (x.campo === 'Registro criado') mudanca = h('.mudanca.registro', TelaConfig.valorAud(x.depois, 400));
    else if (x.campo === 'Registro excluído') mudanca = h('.mudanca.registro', h('span.antes', TelaConfig.valorAud(x.antes, 400)));
    else mudanca = h('.mudanca', h('span.antes', TelaConfig.valorAud(x.antes)), ' → ', h('span.depois', TelaConfig.valorAud(x.depois)));
    return h('li', h('.principal',
      h('.t', x.registro || '–', h('span.suave', ' · ' + x.campo)),
      h('.d', [x.aba, x.usuario, F.dataHora(x.quando)].filter(Boolean).join(' · ')),
      mudanca));
  },

  // =====================================================================
  // Verificar a instalação
  // =====================================================================

  /** Roda a verificação no servidor (só lê) e mostra primeiro o que ajustar, com o que fazer em cada caso. */
  async verificacao(ctx) {
    const r = await App.chamar('sistema.autoteste', {});
    if (!ctx.ativo()) return;
    const SIMBOLO = { ok: 'ok', aviso: 'alerta', erro: 'alerta' };
    const COR = { ok: 'verde', aviso: 'amarelo', erro: 'vermelho' };
    const linha = (x) => h('li.item-verificacao.st-' + x.status,
      h('span.status-verificacao', { 'aria-label': { ok: 'Certo', aviso: 'Aviso', erro: 'Erro' }[x.status] }, icone(SIMBOLO[x.status])),
      h('.principal', h('.t', x.titulo, h('span.suave', ' · ' + x.grupo)), h('.d', x.detalhe),
        x.status !== 'ok' && x.acao ? h('.o-que-fazer', h('strong', 'O que fazer: '), x.acao) : null));
    const problemas = r.itens.filter((x) => x.status !== 'ok').sort((a, b) => (a.status === 'erro' ? 0 : 1) - (b.status === 'erro' ? 0 : 1));
    const certos = r.itens.filter((x) => x.status === 'ok');
    const c = r.contagem;
    const chips = h('.chips',
      c.erro ? h('span.chip.' + COR.erro, F.plural(c.erro, 'erro', 'erros')) : null,
      c.aviso ? h('span.chip.' + COR.aviso, F.plural(c.aviso, 'aviso', 'avisos')) : null,
      h('span.chip.' + COR.ok, c.ok + ' ok'));
    const copiar = h('button.btn', { type: 'button', onclick: async () => {
      const ok = await Comp.copiar(r.texto || '');
      Comp.rapido(ok ? 'Resultado copiado. Cole onde for pedir ajuda.' : 'Não consegui copiar.', ok ? 'ok' : 'erro');
    } }, icone('copiar'), 'Copiar o resultado');
    const refazer = h('button.btn', { type: 'button', onclick: () => { refazer.classList.add('carregando'); refazer.disabled = true; ctx.recarregar(); } },
      icone('atualizar'), 'Verificar de novo');
    ctx.mostrar([
      h('section.cartao',
        h('.cabeca', h('div', h('h2', c.erro ? 'Há o que ajustar' : c.aviso ? 'Funcionando, com avisos' : 'Tudo certo'),
          h('p.suave.pequeno', { style: { margin: '4px 0 0' } }, 'Versão ' + r.versao + ' · ' + (r.ambiente.teste ? 'cópia de teste' : 'planilha oficial') +
            ' · verificado ' + F.dataHora(r.quando))), chips),
        h('p.suave.pequeno', 'Confere se a conta que roda o app, a planilha, as listas suspensas, os usuários, os gatilhos, a agenda, a pasta no Drive e o endereço do app estão como o app precisa. Só lê: não muda nada.'),
        h('.acoes', refazer, copiar)),
      TelaConfig.cartaoVelocidade(),
      problemas.length ? h('section', h('.secao-titulo', h('h2', 'Para ajustar'), h('span.suave', F.plural(problemas.length, 'item', 'itens'))),
        h('ul.lista', { style: { marginTop: '12px' } }, problemas.map(linha))) : null,
      certos.length ? h('details.recolher', { open: !problemas.length },
        h('summary', 'O que está certo (' + certos.length + ')'), h('ul.lista', certos.map(linha))) : null
    ]);
  },

  /**
   * Medir a velocidade (3.2.6): o tempo do servidor para montar as telas principais lendo a planilha e lendo a memória
   * das leituras, e a ida e volta até o Google, que todo toque tem e a memória não muda.
   */
  cartaoVelocidade() {
    const seg = (ms) => {
      const casas = ms < 1000 ? 2 : 1;
      return (ms / 1000).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas }) + ' s';
    };
    const resultado = h('div');
    const linha = (t, d) => h('li.item-verificacao', h('.principal', h('.t', t), h('.d', d)));
    const botao = h('button.btn', { type: 'button', onclick: async () => {
      botao.classList.add('carregando');
      botao.disabled = true;
      try {
        const t0 = Date.now();
        await App.chamar('sistema.eco', {});
        const ida = Date.now() - t0;
        const r = await App.chamar('sistema.velocidade', {});
        trocar(resultado, [
          h('ul.lista', { style: { marginTop: '12px' } }, r.telas.map((t) => linha(t.nome, 'Lendo a planilha: ' + seg(t.planilha) +
            (t.memoria === null ? '' : ' · com a memória: ' + seg(t.memoria))))
            .concat([linha('Ida e volta até o Google', seg(ida) + ' em cada toque, com ou sem memória: é a internet e o Google começando a responder.')])),
          r.memoria ? null : Comp.aviso('alerta', 'A memória das leituras está desligada. Rode instalar() no editor do Apps Script para ligar.')
        ]);
      } catch (e) {
        App.mostrarErro(e, resultado);
      } finally {
        botao.classList.remove('carregando');
        botao.disabled = false;
      }
    } }, icone('relogio'), 'Medir a velocidade');
    return h('section.cartao', h('h2', 'Velocidade'),
      h('p.suave.pequeno', 'Mede quanto o servidor do Google leva para montar a tela Hoje e o painel da campanha ativa, lendo a planilha e lendo a memória das leituras. Só lê: não muda nada.'),
      resultado, h('.acoes', botao));
  },

  async auditoria(ctx, primeira, limite) {
    limite = limite || 200;
    const lista = await App.ler('auditoria.listar', { limite: limite }, 30);
    if (!ctx.ativo()) return;
    const PASSO = 40;
    const estado = { aba: '', busca: '', mostrar: PASSO };
    const abas = [];
    lista.forEach((x) => { if (x.aba && abas.indexOf(x.aba) < 0) abas.push(x.aba); });
    abas.sort();
    const selAba = h('select', { 'aria-label': 'Aba da planilha' }, h('option', { value: '' }, 'Todas as abas'), abas.map((a) => h('option', { value: a }, a)));
    const busca = h('input', { type: 'search', placeholder: 'Buscar na auditoria', 'aria-label': 'Buscar registro, campo, pessoa ou valor', autocomplete: 'off' });
    const total = h('span.suave.pequeno');
    const corpo = h('div');
    const desenhar = () => {
      const q = semAcento(estado.busca);
      const filtrados = lista.filter((x) => (!estado.aba || x.aba === estado.aba) &&
        (!q || semAcento([x.registro, x.campo, x.usuario, x.antes, x.depois].join(' ')).indexOf(q) >= 0));
      total.textContent = F.plural(filtrados.length, 'alteração', 'alterações');
      if (!filtrados.length) {
        trocar(corpo, Comp.vazio(lista.length ? 'Nada encontrado' : 'Nenhuma alteração ainda',
          lista.length ? 'Tente outra busca ou outra aba.' : 'As mudanças feitas no app e na planilha aparecem aqui.'));
        return;
      }
      const resto = filtrados.length - estado.mostrar;
      const maisAntigas = resto <= 0 && lista.length >= limite && limite < 500;
      trocar(corpo, [
        h('ul.lista.dentro', filtrados.slice(0, estado.mostrar).map(TelaConfig.linhaAuditoria)),
        resto > 0 || maisAntigas ? h('.acoes', { style: { justifyContent: 'center', marginTop: '12px' } },
          resto > 0
            ? h('button.btn', { type: 'button', onclick: () => { estado.mostrar += PASSO; desenhar(); } }, 'Mostrar mais ' + Math.min(PASSO, resto))
            : h('button.btn', { type: 'button', onclick: (ev) => { ev.currentTarget.classList.add('carregando');
              TelaConfig.auditoria(ctx, false, 500).catch((e) => Comp.rapido(e.message, 'erro')); } }, 'Buscar alterações mais antigas')) : null
      ]);
    };
    let espera = null;
    selAba.addEventListener('change', () => { estado.aba = selAba.value; estado.mostrar = PASSO; desenhar(); });
    busca.addEventListener('input', () => { clearTimeout(espera); espera = setTimeout(() => { estado.busca = busca.value.trim(); estado.mostrar = PASSO; desenhar(); }, 250); });
    desenhar();
    ctx.mostrar(h('section.cartao',
      h('.cabeca', h('h2', 'Últimas alterações'), total),
      h('.grade.duas', h('.campo', selAba), h('.campo', busca)),
      corpo));
  }
};
</script>
  <script>
/* =====================================================================
   Pedidos do portal (webhook), em dois lugares:
   - Configurações > Pedidos do portal (só o gestor): os 5 passos para
     ligar, a situação da soma, a campanha de cada sorteio do portal e a
     manutenção (testar, trocar a chave, refazer a soma, desligar).
   - O cartão "Hoje, pelo portal" da tela Vendas.
   O portal avisa cada pedido a um recebedor à parte (um Apps Script na
   planilha dos pedidos); o app soma os avisos a cada 5 minutos.
   ===================================================================== */

const TelaPortal = {
  /** Os eventos a marcar no portal, com o nome que aparece lá. */
  EVENTOS: ['Pedido criado', 'Pedido pago', 'Pedido expirado', 'Pedido cancelado', 'Cota premiada'],
  /** Sem aviso do portal há mais tempo que isso: a situação fica amarela (o servidor usa o mesmo limite). */
  HORAS_SEM_AVISO: 12,

  // =====================================================================
  // Configurações > Pedidos do portal
  // =====================================================================

  async secao(ctx) {
    const [s, cod] = await Promise.all([App.ler('portal.situacao', {}, 5), App.ler('portal.codigo', {}, 60)]);
    if (!ctx.ativo()) return;
    if (App.sessao) App.sessao.portal = { ligado: !!s.ligado };
    const recarregar = TelaConfig.recarregador(ctx, 'portal');
    ctx.topo({ titulo: 'Pedidos do portal', voltar: 'config', acoes: [s.planilha ? TelaPortal.menu(s, cod, recarregar) : null] });
    const blocos = [];
    if (s.teste) {
      blocos.push(Comp.aviso('info', 'Cópia de teste: a planilha dos pedidos e o endereço daqui são só do teste. No portal, cadastre o endereço como um webhook a mais e apague esse webhook quando terminar os testes.'));
    }
    if (!s.planilha && !s.erroPlanilha) {
      blocos.push(TelaPortal.apresentacao(recarregar));
      ctx.mostrar(blocos);
      return;
    }
    if (s.erroPlanilha) blocos.push(Comp.aviso('perigo', s.erroPlanilha));
    const passos = TelaPortal.passos(s, cod, recarregar);
    const prontos = passos.every((p) => p.feito);
    if (prontos) {
      blocos.push(TelaPortal.cartaoSituacao(s, recarregar), TelaPortal.cartaoSorteios(s, recarregar),
        h('section.cartao', h('h2', 'Endereço do webhook'),
          h('p.suave.pequeno', 'É o que está no portal, em URL de destino. Só o gestor vê: quem tiver este endereço consegue mandar avisos para o app.'),
          TelaPortal.caixaEndereco(s)),
        h('details.recolher', h('summary', 'Os 5 passos da ligação'), h('section.cartao', TelaPortal.listaPassos(passos))));
    } else {
      blocos.push(h('section.cartao',
        h('.cabeca', h('h2', 'Ligar em 5 passos'), h('span.suave.pequeno', passos.filter((p) => p.feito).length + ' de 5 feitos')),
        TelaPortal.listaPassos(passos)));
      // Durante a ligação, os passos já contam o que falta; a situação só aparece se a soma estiver com problema.
      if (s.ligado && (s.erro || !s.gatilho)) blocos.push(TelaPortal.cartaoSituacao(s, recarregar));
      if ((s.sorteios || []).length) blocos.push(TelaPortal.cartaoSorteios(s, recarregar));
    }
    ctx.mostrar(blocos);
  },

  apresentacao(recarregar) {
    return h('section.cartao',
      h('h2', 'A venda de hoje, sem esperar o resumo'),
      h('p', 'O portal avisa cada pedido na hora em que ele acontece. O app soma esses avisos a cada 5 minutos, e a venda do dia aparece no Hoje, nas Vendas e no caixa como provisória.'),
      h('ul.marcadores',
        h('li', 'O resumo do portal continua sendo o oficial: quando ele chega, substitui o provisório do dia.'),
        h('li', 'Nome, telefone e e-mail do comprador não são guardados.'),
        h('li', 'Ligar leva uns 10 minutos, em 5 passos, e o app mostra cada um.')),
      h('.acoes', TelaPortal.botaoPreparar(recarregar, 'Começar')));
  },

  botaoPreparar(recarregar, rotulo) {
    const b = h('button.btn.primario', { type: 'button', onclick: async () => {
      const r = await App.executar('portal.preparar', {}, { botao: b,
        sucesso: (d) => (d.criada ? 'Planilha dos pedidos criada na pasta do app.' : 'Planilha dos pedidos conferida.') });
      if (r) recarregar();
    } }, rotulo);
    return b;
  },

  // ----- os 5 passos -----

  passos(s, cod, recarregar) {
    const testado = !!(s.testeApp && s.testeApp.ok);
    const chegou = s.ultimoAviso || s.testePortal;
    const planilha = s.planilha ? h('a.btn', { href: s.planilha.url, target: '_blank', rel: 'noopener' }, icone('externo'), 'Abrir a planilha dos pedidos') : null;
    return [
      {
        titulo: 'Criar a planilha dos pedidos', feito: !!s.planilha,
        resumo: () => [s.planilha ? '"' + s.planilha.nome + '", na pasta do app no Drive.' : ''],
        corpo: () => [
          h('p', 'Uma planilha à parte, na pasta do app no Drive. O recebedor grava nela uma linha por aviso do portal, sem os dados pessoais do comprador.'),
          h('.acoes', TelaPortal.botaoPreparar(recarregar, 'Criar a planilha dos pedidos'))
        ]
      },
      {
        titulo: 'Colar o código do recebedor', feito: testado,
        resumo: () => ['Colado e publicado (versão ' + (s.versaoEmUso || cod.versao) + ').'],
        corpo: () => [
          h('p', 'Abra a planilha dos pedidos e vá em ', h('strong', 'Extensions › Apps Script'), ' (Extensões › Apps Script). No alto do editor, troque ',
            h('strong', 'Untitled project'), ' por ', h('strong', 'Recebedor dos pedidos'), '.'),
          h('p', 'Clique dentro do código, apague tudo (Ctrl+A e Delete), cole o código do recebedor (Ctrl+V) e salve (Ctrl+S).'),
          h('.acoes', planilha, TelaPortal.botaoCopiarCodigo(cod, true)),
          h('p.suave.pequeno', 'Versão ' + cod.versao + ' do recebedor. O código já traz o endereço desta planilha dos pedidos.')
        ]
      },
      {
        titulo: 'Publicar o recebedor', feito: testado,
        resumo: () => [s.recebedor ? s.recebedor.mascarado : ''],
        corpo: () => [
          h('p', 'No editor do recebedor: ', h('strong', 'Deploy › New deployment'), ' (Implantar › Nova implantação). Na engrenagem ao lado de ',
            h('strong', 'Select type'), ', escolha ', h('strong', 'Web app'), ' (App da Web), e preencha assim:'),
          h('.ajustes-google',
            h('.linha', h('span', 'Execute as ', h('span.suave', '(Executar como)')), h('strong', 'Me (Eu)')),
            h('.linha', h('span', 'Who has access ', h('span.suave', '(Quem pode acessar)')), h('strong', 'Anyone (Qualquer pessoa)'))),
          Comp.aviso('info', 'É "Anyone" mesmo, e não "Anyone with Google account": o portal não entra com Conta do Google. O recebedor só grava os avisos que trazem a chave do endereço do passo 5.'),
          h('p', 'Clique em ', h('strong', 'Deploy'), '. O Google pede autorização: ', h('strong', 'Authorize access'),
            ', escolha a conta do app, depois ', h('strong', 'Advanced › Go to Recebedor dos pedidos (unsafe)'), ' e ', h('strong', 'Allow'),
            '. No fim, copie o ', h('strong', 'Web app URL'), ', que termina em /exec.')
        ]
      },
      {
        titulo: 'Colar o endereço do recebedor', feito: testado,
        resumo: () => [s.testeApp ? 'Testado ' + F.quando(s.testeApp.quando) + ': o aviso de teste chegou à planilha dos pedidos.' : ''],
        corpo: () => TelaPortal.corpoEndereco(s, recarregar)
      },
      {
        titulo: 'Cadastrar o webhook no portal', feito: !!chegou,
        resumo: () => [s.ultimoAviso ? 'O portal está mandando: último aviso ' + F.quando(s.ultimoAviso) + '.' : 'O teste do portal chegou ' + F.quando(s.testePortal) + '.'],
        corpo: () => TelaPortal.corpoPortal(s, recarregar)
      }
    ];
  },

  listaPassos(passos) {
    const atual = passos.findIndex((p) => !p.feito);
    return h('ol.passos-portal', passos.map((p, i) => h('li' + (p.feito ? '.feito' : i === atual ? '.atual' : ''),
      h('span.marca', { 'aria-hidden': 'true' }, p.feito ? icone('ok') : String(i + 1)),
      h('.texto-passo',
        h('h3', p.titulo, p.feito ? h('span.chip.verde', 'Feito') : null),
        p.feito ? h('p.suave.pequeno', p.resumo()) : p.corpo()))));
  },

  botaoCopiarCodigo(cod, primario) {
    return h('button.btn' + (primario ? '.primario' : ''), { type: 'button', disabled: !cod.codigo, onclick: async () => {
      const ok = await Comp.copiar(cod.codigo);
      Comp.rapido(ok ? 'Código do recebedor copiado. Cole no editor do Apps Script da planilha dos pedidos.' : 'Não consegui copiar. Tente de novo.', ok ? 'ok' : 'erro');
    } }, icone('copiar'), 'Copiar o código');
  },

  corpoEndereco(s, recarregar) {
    const blocos = [h('p', 'Cole aqui o Web app URL do passo 3. Ao salvar, o app manda um aviso de teste e confere se ele chegou à planilha dos pedidos.')];
    if (s.recebedor && s.testeApp && !s.testeApp.ok) {
      const testar = h('button.btn', { type: 'button', onclick: () => TelaPortal.testar(testar, recarregar) }, icone('atualizar'), 'Testar de novo');
      blocos.push(Comp.aviso('perigo', h('div', h('strong', 'O teste de ' + F.quando(s.testeApp.quando) + ' falhou. '), s.testeApp.texto),
        h('div', { style: { marginTop: '6px' } }, h('span.pequeno', 'Endereço salvo: ', h('code', s.recebedor.mascarado)))),
      h('.acoes', testar));
    }
    blocos.push(TelaPortal.formEndereco(s, recarregar));
    return blocos;
  },

  /** Campo do endereço do recebedor com "Salvar e testar" (passo 4 e "Trocar o endereço"). aoSalvar: fecha a folha. */
  formEndereco(s, recarregar, aoSalvar) {
    const form = h('form.form', { onsubmit: (ev) => ev.preventDefault() },
      Comp.campo({ rotulo: s.recebedor ? 'Endereço novo do recebedor' : 'Endereço do recebedor', nome: 'url', tipo: 'url', valor: '',
        atributos: { placeholder: 'https://script.google.com/macros/s/…/exec', spellcheck: 'false' } }));
    const erro = h('div');
    const salvar = h('button.btn.primario', { type: 'button', onclick: async () => {
      const url = String(form.elements.url.value || '').trim();
      if (!url) { trocar(erro, Comp.aviso('perigo', 'Cole o Web app URL que o Apps Script mostrou ao publicar.')); return; }
      const r = await App.executar('portal.salvarRecebedor', { url: url }, { botao: salvar, erroEm: erro,
        sucesso: (d) => (d.teste && d.teste.ok ? 'Recebedor ligado: o aviso de teste chegou à planilha dos pedidos.' : '') });
      if (!r) return;
      if (r.teste && !r.teste.ok) Comp.rapido('O endereço foi salvo, mas o teste falhou. Veja o que fazer no passo 4.', 'erro');
      if (aoSalvar) aoSalvar();
      recarregar();
    } }, 'Salvar e testar');
    return h('div', form, erro, h('.acoes', { style: { marginTop: '10px' } }, salvar));
  },

  corpoPortal(s, recarregar) {
    const blocos = [h('p', 'No painel do portal, abra ', h('strong', 'Webhooks › Novo webhook'), ' e preencha assim:'),
      h('.campos-portal',
        h('div', h('.rotulo-campo', 'URL de destino'), s.enderecoPortal ? TelaPortal.caixaEndereco(s)
          : h('p.suave.pequeno', { style: { margin: 0 } }, 'O endereço aparece aqui depois do passo 4.')),
        h('div', h('.rotulo-campo', 'Cabeçalho Authorization'), h('span', 'Deixe vazio: a chave já vai no endereço.')),
        h('div', h('.rotulo-campo', 'Eventos'), h('.chips', TelaPortal.EVENTOS.map((e) => h('span.chip.verde', icone('ok'), e))),
          h('p.suave.pequeno', { style: { margin: '6px 0 0' } }, 'Novo cliente cadastrado não precisa.'))),
      h('p', 'Clique em ', h('strong', 'Cadastrar webhook'), ' e depois, na lista de webhooks do portal, em ', h('strong', 'Testar'), '.')];
    if (s.enderecoPortal) {
      const conferir = h('button.btn', { type: 'button', onclick: () => TelaPortal.atualizar(conferir, recarregar) }, icone('atualizar'), 'Conferir agora');
      blocos.push(Comp.aviso('info', 'Ainda não chegou nada do portal. Depois de tocar em Testar lá, toque em Conferir agora.',
        h('div', { style: { marginTop: '8px' } }, conferir)));
    }
    return blocos;
  },

  /** Endereço para o portal (com a chave), mascarado, com o botão de copiar. */
  caixaEndereco(s) {
    const endereco = s.enderecoPortal || '';
    const m = endereco.match(/^https:\/\/(.*\/s\/)([A-Za-z0-9_-]+)(\/exec)\?t=(.+)$/);
    const mascarado = m ? m[1] + m[2].slice(0, 6) + '…' + m[2].slice(-4) + m[3] + '?t=' + m[4].slice(0, 4) + '••••' : '';
    const copiar = h('button.btn.primario', { type: 'button', onclick: async () => {
      const ok = await Comp.copiar(endereco);
      Comp.rapido(ok ? 'Endereço copiado. Cole em URL de destino, no portal.' : 'Não consegui copiar. Tente de novo.', ok ? 'ok' : 'erro');
    } }, icone('copiar'), 'Copiar o endereço');
    return h('.caixa-link', h('code', mascarado), h('.acoes', copiar));
  },

  // ----- situação, sorteios e manutenção -----

  cartaoSituacao(s, recarregar) {
    const agora = App.agora();
    const ultimo = lerData(s.ultimoAviso);
    const horas = ultimo ? Math.floor((agora - ultimo) / 3600000) : 0;
    const testeFalhou = !!(s.testeApp && !s.testeApp.ok);
    let chip;
    if (s.erro) chip = h('span.chip.vermelho', 'Soma com erro');
    else if (!s.gatilho) chip = h('span.chip.vermelho', 'Soma parada');
    else if (testeFalhou) chip = h('span.chip.vermelho', 'Recebedor com problema');
    else if (!ultimo) chip = h('span.chip.amarelo', 'Esperando o portal');
    else if (horas >= TelaPortal.HORAS_SEM_AVISO) chip = h('span.chip.amarelo', 'Sem avisos há ' + F.plural(horas, 'hora', 'horas'));
    else chip = h('span.chip.verde', 'Recebendo');
    const avisos = [];
    if (s.erro) avisos.push(Comp.aviso('perigo', h('div', h('strong', 'A última soma deu erro' + (s.erroEm ? ' (' + F.quando(s.erroEm) + ')' : '') + ': '), s.erro)));
    if (!s.gatilho) avisos.push(Comp.aviso('perigo', 'Falta o gatilho que soma a cada 5 minutos. No editor do Apps Script do app, rode instalar() de novo.'));
    if (testeFalhou && !s.erro) avisos.push(Comp.aviso('perigo', h('div', h('strong', 'O teste do recebedor falhou: '), s.testeApp.texto)));
    if (s.atrasado) avisos.push(Comp.aviso('info', 'Chegaram muitos avisos de uma vez: a soma continua na próxima rodada.'));
    if (s.versaoEmUso && s.versaoCodigo && Number(s.versaoEmUso) < Number(s.versaoCodigo)) {
      avisos.push(Comp.aviso('alerta', 'Há uma versão nova do recebedor (' + s.versaoCodigo + '). Copie o código de novo (no menu ⋮), cole no Apps Script da planilha dos pedidos e publique uma versão nova: Deploy › Manage deployments › editar (lápis) › Version: New version.'));
    }
    const recusa = lerData(s.ultimaRecusa);
    if (recusa && agora - recusa < 7 * 86400000) {
      avisos.push(Comp.aviso('alerta', 'Chegou um aviso com a chave errada ' + F.quando(recusa) + '. Se você trocou a chave, troque também a URL de destino no portal.'));
    }
    if ((s.camposNovos || []).length) {
      avisos.push(h('p.suave.pequeno', 'O portal mandou campos que o app não usa (' + s.camposNovos.join(', ') + '). Só o nome deles fica anotado.'));
    }
    const atualizar = h('button.btn', { type: 'button', onclick: () => TelaPortal.atualizar(atualizar, recarregar) }, icone('atualizar'), 'Somar agora');
    const testar = h('button.btn', { type: 'button', onclick: () => TelaPortal.testar(testar, recarregar) }, icone('ok'), 'Testar o recebedor');
    // O primeiro dia fica fora das vendas; a explicação só nos primeiros dias, depois vira ruído.
    const inicio = lerData(s.inicio);
    const comecoRecente = !!inicio && agora - inicio < 7 * 86400000;
    return h('section.cartao',
      h('.cabeca', h('h2', 'Situação'), chip),
      h('dl.valores',
        h('dt', 'Último aviso do portal'), h('dd', ultimo ? F.quando(ultimo) : 'nenhum ainda'),
        h('dt', 'Última soma'), h('dd', s.ultimaSoma ? F.quando(s.ultimaSoma) : 'ainda não rodou'),
        // A conta inclui os avisos de teste do app: só aparece depois do primeiro aviso do portal.
        ultimo ? [h('dt', 'Avisos recebidos'), h('dd', F.int(s.eventos))] : null,
        inicio ? [h('dt', 'Recebendo desde'), h('dd', F.quando(inicio))] : null),
      comecoRecente ? h('p.suave.pequeno', 'O dia ' + F.dataCurta(inicio) + ' ficou fora das vendas: o webhook começou com o dia em andamento. Os dias seguintes entram inteiros.') : null,
      avisos,
      h('.acoes.cheias', atualizar, testar));
  },

  cartaoSorteios(s, recarregar) {
    const lista = s.sorteios || [];
    const estado = (x) => (x.campanha ? h('span.chip.verde', x.campanha.nome) : x.ignorado ? h('span.chip', 'Ignorado') : h('span.chip.amarelo', 'Sem campanha'));
    return h('section.cartao',
      h('.cabeca', h('h2', 'Sorteios do portal'), lista.length ? h('span.suave.pequeno', F.plural(lista.length, 'sorteio', 'sorteios')) : null),
      lista.length
        ? [h('p.suave.pequeno', { style: { margin: '0 0 4px' } }, 'Abra um sorteio para escolher a campanha que recebe as vendas dele.'),
          h('ul.lista.dentro', lista.map((x) => TelaConfig.item(() => TelaPortal.mapear(x, s, recarregar), [
            h('.principal', h('.t', x.nome), h('.d.seps', h('span', 'hoje ' + F.moeda(x.hoje.vendido)),
              h('span', F.moeda(x.total.vendido) + ' em ' + F.plural(x.dias, 'dia', 'dias')))),
            h('.lado', estado(x))
          ])))]
        : h('p.suave', { style: { margin: 0 } }, 'Nenhum pedido chegou ainda. Cada sorteio do portal aparece aqui com o primeiro pedido dele.'));
  },

  mapear(x, s, recarregar) {
    const opcoes = [{ valor: '', rotulo: 'Nenhuma: ignorar este sorteio' }].concat((s.campanhas || []).map((c) => ({
      valor: c.id, rotulo: c.nome + (c.status !== 'Ativa' ? ' (' + String(c.status).toLowerCase() + ')' : '') })));
    const z = TelaConfig.folha('Sorteio "' + x.nome + '"', [
      h('p.suave.pequeno', { style: { margin: 0 } }, 'Os pedidos deste sorteio entram como vendas provisórias da campanha escolhida, dia a dia, até o resumo do portal de cada dia chegar.'),
      Comp.campo({ rotulo: 'Campanha', nome: 'campanha', tipo: 'select', opcoes: opcoes, valor: x.campanha ? x.campanha.id : '' }),
      h('dl.valores',
        h('dt', 'Hoje'), h('dd', F.moeda(x.hoje.vendido) + ' · ' + F.plural(x.hoje.pagos, 'pedido pago', 'pedidos pagos')),
        h('dt', 'Desde o primeiro aviso'), h('dd', F.moeda(x.total.vendido) + ' em ' + F.plural(x.dias, 'dia', 'dias')))
    ], 'Salvar');
    z.salvar.addEventListener('click', async () => {
      const campanha = Comp.lerForm(z.form).campanha || '';
      const r = await App.executar('portal.mapear', { sorteio: x.nome, campanha: campanha }, { botao: z.salvar, erroEm: z.erro,
        sucesso: (d) => (d.campanha ? 'As vendas de "' + x.nome + '" agora entram em ' + d.campanha.nome + '.' : '"' + x.nome + '" ignorado: as vendas dele não entram em nenhuma campanha.') });
      if (r) { z.f.fechar(); recarregar(); }
    });
  },

  menu(s, cod, recarregar) {
    return Comp.menu('Pedidos do portal', [
      { rotulo: 'Abrir a planilha dos pedidos', icone: 'externo', acao: () => window.open(s.planilha.url, '_blank', 'noopener') },
      { rotulo: 'Copiar o código do recebedor', icone: 'copiar', detalhe: 'Versão ' + cod.versao + '. Para atualizar o recebedor.', oculto: !cod.codigo,
        acao: async () => {
          const ok = await Comp.copiar(cod.codigo);
          Comp.rapido(ok ? 'Código do recebedor copiado.' : 'Não consegui copiar. Tente de novo.', ok ? 'ok' : 'erro');
        } },
      { rotulo: 'Trocar o endereço do recebedor', icone: 'editar', detalhe: 'Depois de uma implantação nova no Apps Script', oculto: !s.recebedor,
        acao: () => TelaPortal.trocarEndereco(s, recarregar) },
      { rotulo: 'Trocar a chave do webhook', icone: 'atualizar', detalhe: 'Se o endereço vazou. O que está no portal para de funcionar.', oculto: !s.recebedor,
        acao: () => TelaPortal.novaChave(recarregar) },
      { rotulo: 'Refazer a soma', icone: 'relogio', detalhe: 'Soma de novo todos os avisos guardados', oculto: !s.ligado,
        acao: async () => {
          const r = await App.executar('portal.reprocessar', {}, { sucesso: (d) => 'Soma refeita com ' + F.plural(d.lidos || 0, 'aviso', 'avisos') + '.' });
          if (r) recarregar();
        } },
      { rotulo: 'Desligar o webhook', icone: 'fechar', perigo: true, detalhe: 'As vendas voltam a entrar só pelo resumo do portal', oculto: !s.recebedor,
        acao: async () => {
          const r = await App.executar('portal.salvarRecebedor', { url: '' }, {
            confirmarAntes: { texto: 'Desligar o webhook? A soma a cada 5 minutos para e as vendas voltam a entrar só pelo resumo do portal. Os avisos guardados continuam na planilha dos pedidos. Para parar de vez, apague também o webhook no portal.', botao: 'Desligar', perigo: true },
            sucesso: 'Webhook desligado.' });
          if (r) recarregar();
        } }
    ]);
  },

  trocarEndereco(s, recarregar) {
    const f = Comp.folha({
      titulo: 'Endereço do recebedor',
      corpo: [h('p.suave.pequeno', { style: { marginTop: 0 } }, 'Endereço atual: ', h('code', s.recebedor.mascarado)),
        h('p.suave.pequeno', 'Uma versão nova da mesma implantação (Deploy › Manage deployments) mantém o endereço. Só uma implantação nova (New deployment) muda o endereço.'),
        TelaPortal.formEndereco(s, recarregar, () => f.fechar())],
      rodape: [h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Voltar')]
    });
  },

  async novaChave(recarregar) {
    const r = await App.executar('portal.novaChave', {}, { confirmacao: { botao: 'Trocar a chave', perigo: true }, sucesso: 'Chave trocada.' });
    if (!r) return;
    recarregar();
    const f = Comp.folha({
      titulo: 'Endereço novo do webhook',
      corpo: [TelaPortal.caixaEndereco({ enderecoPortal: r.enderecoPortal }),
        h('p', 'No portal, edite o webhook e troque a URL de destino por este endereço. O antigo para de funcionar em até 10 minutos.')],
      rodape: [h('button.btn.primario', { type: 'button', onclick: () => f.fechar() }, 'Pronto')]
    });
  },

  async testar(botao, recarregar) {
    const r = await App.executar('portal.testar', {}, { botao: botao,
      sucesso: (d) => (d.teste.ok ? 'O recebedor respondeu e gravou o teste na planilha dos pedidos.' : '') });
    if (!r) return;
    if (!r.teste.ok) Comp.rapido(r.teste.texto, 'erro');
    recarregar();
  },

  /** Soma agora o que chegou (a mesma soma do gatilho de 5 minutos). */
  async atualizar(botao, depois) {
    const r = await App.executar('portal.atualizar', {}, { botao: botao,
      sucesso: (d) => {
        if (!d || d.ligado === false) return 'O webhook não está ligado.';
        if (d.somados) return F.plural(d.somados, 'aviso novo somado', 'avisos novos somados') + '.';
        return d.testes ? 'Chegou o teste do portal.' : 'Nada novo do portal.';
      } });
    if (r && depois) depois();
    return r;
  },

  // =====================================================================
  // Vendas: "Hoje, pelo portal"
  // =====================================================================

  /** vivo: resposta de portal.aoVivo (null ou { ligado: false } sem webhook). op: { aoMudar } */
  cartaoAoVivo(vivo, op) {
    if (!vivo || !vivo.ligado) return null;
    const gestor = App.pode('portal.situacao');
    const configurar = gestor ? h('a.btn.pequeno', { href: '#config/portal', onclick: App.cliqueNav('config/portal') }, 'Abrir Pedidos do portal') : null;
    if (!vivo.temSorteio) {
      return gestor ? Comp.aviso('info', 'O webhook do portal está ligado, mas nenhum sorteio do portal vende para esta campanha. Escolha a campanha de cada sorteio em Configurações › Pedidos do portal.',
        h('div', { style: { marginTop: '8px' } }, configurar)) : null;
    }
    const t = vivo.hoje;
    const ultimo = lerData(vivo.ultimoAviso);
    const parado = !!vivo.erro || (ultimo && App.agora() - ultimo >= TelaPortal.HORAS_SEM_AVISO * 3600000);
    const atualizar = h('button.btn.pequeno', { type: 'button', onclick: () => TelaPortal.atualizar(atualizar, op.aoMudar) }, icone('atualizar'), 'Atualizar agora');
    const detalhes = [
      F.plural(t.pagos, 'pedido pago', 'pedidos pagos'),
      t.aguardando > 0 ? F.int(t.aguardando) + ' aguardando pagamento' : null,
      t.expirados ? F.plural(t.expirados, 'expirado', 'expirados') : null,
      t.cancelados ? F.plural(t.cancelados, 'cancelado', 'cancelados') : null,
      t.premiadas ? F.plural(t.premiadas, 'cota premiada', 'cotas premiadas') : null
    ].filter(Boolean);
    const quando = [t.ultimo ? 'Último pedido às ' + F.hora(t.ultimo) : 'Nenhum pedido hoje ainda', vivo.ultimaSoma ? 'somado às ' + F.hora(vivo.ultimaSoma) : null];
    return h('section.cartao.ao-vivo',
      h('.cabeca', h('h2', 'Hoje, pelo portal'), parado ? h('span.chip.amarelo', 'parado') : h('span.chip.verde.pulso', 'ao vivo')),
      h('p.valor-vivo', h('span.num', F.moeda(t.vendido)), h('span.suave', ' vendidos hoje')),
      h('.d.seps.suave', detalhes.map((x) => h('span', x))),
      vivo.comecouHoje ? Comp.aviso('info', 'O webhook começou hoje' + (vivo.inicio ? ', às ' + F.hora(vivo.inicio) : '') + ': a venda de hoje está incompleta e fica fora das vendas e do caixa. A partir de amanhã o dia entra inteiro.') : null,
      vivo.erro ? Comp.aviso('perigo', h('div', h('strong', 'A soma dos pedidos parou: '), vivo.erro), configurar ? h('div', { style: { marginTop: '8px' } }, configurar) : null) : null,
      !vivo.erro && parado ? Comp.aviso('alerta', 'O portal não manda pedidos desde ' + F.quando(ultimo) + '. Confira se o webhook continua ligado no portal.') : null,
      h('.rodape-vivo', h('span.suave.pequeno', quando.filter(Boolean).join(' · ') + '. Provisório até o resumo do portal.'), atualizar));
  }
};

// A seção de Configurações (TelaConfig.SECOES) chama TelaConfig.portal, como as outras.
TelaConfig.portal = (ctx) => TelaPortal.secao(ctx);
</script>
  <script>App.iniciar();</script>
</body>
</html>
