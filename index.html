          Comp.campo({ rotulo: 'Nome da campanha', nome: 'nome', largo: true, obrigatorio: true, atributos: { placeholder: 'Ex.: Hilux 2027' } }),
          premio.modalidade,
          Comp.campo({ rotulo: 'Prêmio principal', nome: 'premio', opcional: true, largo: true, atributos: { placeholder: 'Ex.: Toyota Hilux SRX 2027' } }),
          premio.forma, premio.custo, premio.dinheiro),
        h('.grade.duas', { style: { marginTop: '14px' } },
          Comp.campo({ rotulo: 'Preço da cota', nome: 'precoCota', tipo: 'moeda', obrigatorio: true, atributos: { placeholder: 'Ex.: 0,10' } }),
          TelaCampanhas.campoCotas(''),
          Comp.campo({ rotulo: 'Início das vendas', nome: 'inicio', tipo: 'data', obrigatorio: true }),
          Comp.campo({ rotulo: 'Data do sorteio', nome: 'sorteio', tipo: 'data', obrigatorio: true,
            dica: 'Sem prazo máximo. Se as cotas esgotarem antes, dá para antecipar o sorteio na campanha.' }))),
      h('details.cartao',
        h('summary.forte', 'Detalhes do regulamento (pode preencher depois)'),
        h('.grade.duas', { style: { marginTop: '14px' } },
          premio.declarado,
          Comp.campo({ rotulo: 'Bilhetes premiados declarados', nome: 'bilhetesDeclarados', tipo: 'moeda', opcional: true, dica: 'Soma dos prêmios em dinheiro do regulamento.' }),
          Comp.campo({ rotulo: 'Fim das vendas', nome: 'fim', tipo: 'data', opcional: true, dica: 'Vazio: vende até o sorteio.' }))));
    const erro = h('div');
    const botao = h('button.btn.primario', { type: 'button' }, 'Criar rascunho');
    const painel = h('.cartao', { 'aria-live': 'polite' });
    const vazio = () => trocar(painel, [h('h2', 'Simulação'), h('p.suave', { style: { margin: '8px 0 0' } }, 'Preencha preço, cotas e custo do prêmio para ver a venda máxima, o equilíbrio e os cenários.')]);
    vazio();
    // No celular a simulação fica entre o formulário e o botão, para ser vista antes de criar; no computador, ao lado.
    ctx.mostrar(h('.nova-campanha', h('.area-form', form, erro), h('.area-painel', painel), h('.acoes.fim.area-botao', botao)));

    let timer = null, ultimo = '';
    const simular = async () => {
      const v = Comp.lerForm(form);
      const preco = lerNumero(v.precoCota), cotas = lerNumero(v.totalCotas), custo = lerNumero(v.custoReal);
      if (!(preco > 0) || !(cotas > 0) || !(custo >= 0)) { ultimo = ''; vazio(); return; }
      const p = { precoCota: v.precoCota, totalCotas: v.totalCotas, custoReal: v.custoReal, valorDeclarado: v.valorDeclarado,
        formaPremio: v.formaPremio, valorDinheiro: v.valorDinheiro, modalidade: v.modalidade,
        bilhetesDeclarados: v.bilhetesDeclarados, inicio: v.inicio, fim: v.fim, sorteio: v.sorteio };
      const chave = JSON.stringify(p);
      if (chave === ultimo) return;
      ultimo = chave;
      painel.style.opacity = '.6';
      try {
        const r = await App.chamar('campanhas.simular', p);
        if (chave !== ultimo || !ctx.ativo()) return;
        trocar(painel, TelaCampanhas.painelSimulacao(r.simulador, { declaradoSuposto: r.declaradoSuposto, tipoSuposto: r.tipoSuposto,
          preco: preco, cotas: cotas }));
      } catch (e) {
        if (chave === ultimo) trocar(painel, [h('h2', 'Simulação'), Comp.aviso('perigo', e.message)]);
      } finally {
        painel.style.opacity = '';
      }
    };
    form.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(simular, 500); });
    form.addEventListener('change', () => { clearTimeout(timer); timer = setTimeout(simular, 200); });

    botao.addEventListener('click', async () => {
      const v = TelaCampanhas.semAuxiliares(Comp.lerForm(form));
      const faltam = [];
      if (!v.nome) faltam.push('nome');
      if (!(lerNumero(v.precoCota) > 0)) faltam.push('preço da cota');
      if (!(lerNumero(v.totalCotas) > 0)) faltam.push('total de cotas');
      if (!(lerNumero(v.custoReal) >= 0)) faltam.push(v.formaPremio === 'Dinheiro' ? 'valor do prêmio em dinheiro' : 'custo real do prêmio (pode ser zero)');
      if (v.formaPremio === 'Bem ou dinheiro' && !(lerNumero(v.valorDinheiro) > 0)) faltam.push('opção em dinheiro');
      if (!v.inicio) faltam.push('início das vendas');
      if (!v.sorteio) faltam.push('data do sorteio');
      if (faltam.length) { trocar(erro, Comp.aviso('perigo', 'Falta preencher: ' + faltam.join(', ') + '.')); return; }
      const r = await App.executar('campanhas.criar', v, { botao: botao, erroEm: erro, sucesso: 'Rascunho criado. Agora complete o que falta para ativar.' });
      if (!r) return;
      await App.atualizarCampanhas();
      App.ir('campanha/' + encodeURIComponent(r.campanha.id), { substituir: true });
    });
  },

  /**
   * Venda máxima, equilíbrio e cenários; na campanha nova, também os tetos do orçamento (no Financeiro eles têm o cartão deles).
   * op: { novo, projetado: { nome, pctVendido, vendas, resultado }, metodo (como o projetado foi calculado), simples (sem a conta do R$ 1) }
   */
  painelSimulacao(sim, op) {
    op = op || {};
    const alertas = (sim.tetos || []).filter((t) => t.alerta);
    const sc = { semCentavos: true };
    const cenarios = (sim.cenarios || []).slice();
    if (op.projetado) cenarios.push(Object.assign({ projetado: true }, op.projetado));
    cenarios.sort((a, b) => a.vendas - b.vendas);
    return [
      h('h2', 'Simulação'),
      h('dl.valores',
        h('dt', 'Venda máxima'), h('dd', F.moeda(sim.vendaMaxima, sc)),
        h('dt', 'Ponto de equilíbrio'), h('dd', F.moeda(sim.equilibrio, sc)),
        h('dt', 'Cotas para o equilíbrio'), h('dd', F.int(sim.cotasEquilibrio) + ' (' + F.pct(sim.pctEquilibrio) + ')')),
      op.simples ? null : h('p.suave.pequeno', { style: { margin: '8px 0 0' } },
        'Para cada R$ 1 de custo fixo é preciso vender ' + F.moeda(sim.vendaExtraPorReal) + '.'),
      cenarios.length ? h('table.tabela.cenarios', h('thead', h('tr', h('th', 'Cenário'), h('th.d', 'Venda'), h('th.d', 'Resultado'))),
        h('tbody', cenarios.map((c) => h('tr', h('td', c.projetado ? h('strong', c.nome) : c.nome,
          c.base ? h('span.chip.amarelo', { style: { marginLeft: '6px' }, title: 'A base dos tetos e da venda orçada' }, 'base') : null,
          h('div.suave.pequeno', F.pct(c.pctVendido) + ' das cotas')),
          h('td.d.num', F.moeda(c.vendas, sc)),
          h('td.d.num.' + (F.cls(c.resultado) || 'x'), F.moeda(c.resultado, sc)))))) : null,
      op.metodo ? h('p.suave.pequeno', { style: { margin: 0 } }, op.metodo) : null,
      op.novo === false ? null : alertas.length ? Comp.aviso('alerta', [h('strong', 'Orçamento fora dos tetos:'), h('ul', alertas.map((t) =>
        h('li', t.bloco + ': ' + F.moeda(t.planejado, { compacto: true }) + ' (' + t.situacao.toLowerCase() + ' de ' + F.moeda(t.teto, { compacto: true }) + ')')))])
        : Comp.aviso('sucesso', 'Prêmio, dinâmicas e mídia dentro dos tetos, e a margem mínima é atingida no cenário conservador.'),
      sim.foraDaLotep ? h('p.suave.pequeno', 'Fora da LOTEP: sem taxa de licença e sem IR do prêmio principal.') : null,
      TelaCampanhas.notaPremio(sim.premio),
      op.declaradoSuposto ? h('p.suave.pequeno', 'Sem o valor declarado, IR e LOTEP estão calculados sobre o custo real.') : null,
      op.tipoSuposto ? h('p.suave.pequeno', 'Sem o que o ganhador recebe (bem ou dinheiro), o IR está calculado como prêmio em dinheiro.') : null,
      op.novo !== false ? h('p.suave.pequeno', 'O orçamento sugerido (dinâmicas, mídia e comissões) entra junto e pode ser ajustado no Financeiro da campanha.') : null
    ];
  }
};

// ---------------------------------------------------------------------
// Cockpit
// ---------------------------------------------------------------------

App.telas.campanha = {
  area: 'campanhas',
  titulo: 'Campanha',
  pode: () => App.pode('campanhas.cockpit'),
  render(ctx) { return Cockpit.render(ctx); }
};

const Cockpit = {
  abas() {
    return [
      ['visao', 'Visão geral', true], ['calendario', 'Calendário', App.pode('agenda.periodo')], ['dinamicas', 'Dinâmicas', App.pode('dinamicas.listar')],
      ['vendas', 'Vendas', App.pode('vendas.listar')], ['financeiro', 'Financeiro', true],
      ['premios', App.pode('legalizacao.listar') ? 'Prêmios e documentos' : 'Prêmios', App.pode('premios.listar')],
      ['mensagens', 'Mensagens', App.pode('mensagens.dia')], ['relatorio', 'Relatório', App.pode('campanhas.relatorio')]
    ].filter((a) => a[2]);
  },

  /** Orçamento das dinâmicas: quanto ainda cabe ou, se estourou, quanto passou (sem "livre" negativo). */
  kpiLivre(livre) {
    // O orçado das dinâmicas inclui o IR delas (na tabela, o IR fica na linha "IR sobre prêmios").
    const op = { compacto: true, semCentavos: true };
    const orcado = F.moeda(livre.limite, op) + ' com IR';
    if ((livre.livre || 0) < -0.005) return Comp.kpi('Dinâmicas acima do orçado', F.moeda(-livre.livre, op), 'orçado: ' + orcado, 'neg');
    return Comp.kpi('Livre para dinâmicas', F.moeda(livre.livre || 0, op), 'de ' + orcado + ' orçados');
  },

  async render(ctx) {
    const id = ctx.partes[0];
    const aba = ctx.partes[1] || 'visao';
    // A base simulada vale só enquanto o Financeiro desta campanha está aberto: fora dele, tudo volta para a padrão.
    if (aba !== 'financeiro' || (Cockpit.simBase && Cockpit.simBase.id !== id)) Cockpit.simBase = null;
    let info = App.campanha(id);
    if (!info) { await App.atualizarCampanhas(); info = App.campanha(id); }
    if (!info) throw new ErroApi({ erro: 'Campanha não encontrada: ' + id + '.' });
    if (!ctx.ativo()) return;
    Cockpit.topo(ctx, info, null);
    // O subtítulo é o mesmo em todas as abas: quem abre direto numa aba que não lê o cockpit ainda não tem a fase.
    if (info.status === 'Ativa' && !(id in Cockpit.fases) && aba !== 'visao' && aba !== 'financeiro') {
      App.ler('campanhas.cockpit', { id: id }).then((d) => { if (ctx.ativo()) Cockpit.topo(ctx, null, d); }, () => {});
    }
    const nav = dicaDeRolagem(h('nav.abas', { 'aria-label': 'Partes da campanha' }, Cockpit.abas().map((a) => {
      const rota = 'campanha/' + encodeURIComponent(id) + (a[0] === 'visao' ? '' : '/' + a[0]);
      return h('a', { href: '#' + rota, onclick: App.cliqueNav(rota), 'aria-current': a[0] === aba ? 'page' : null }, a[1]);
    })));
    const conteudo = h('div.pilha', Comp.esqueleto(3));
    ctx.mostrar([nav, conteudo]);
    const atual = nav.querySelector('[aria-current]');
    if (atual) atual.scrollIntoView({ block: 'nearest', inline: 'center' });
    const fn = Cockpit['aba_' + aba];
    if (!fn) throw new ErroApi({ erro: 'Esta parte da campanha não existe.' });
    await fn(conteudo, id, ctx);
  },

  /** Fase de cada campanha vista no cockpit, para o subtítulo não mudar entre as abas que não carregam o cockpit. */
  fases: {},

  /** Base de comparação simulada no Financeiro: { id, escolha }. Não é gravada em lugar nenhum. */
  simBase: null,

  topo(ctx, info, d) {
    const c = d ? d.campanha : info;
    if (d) Cockpit.fases[c.id] = d.fase || null;
    const fase = Cockpit.fases[c.id];
    // Curto para caber no celular: a fase só conta com a campanha no ar, e o ano do sorteio só aparece se não for o deste ano.
    const sorteio = lerData(c.sorteio);
    const sub = [c.status, fase && c.status === 'Ativa' ? 'fase ' + fase.toLowerCase() : null,
      sorteio ? 'sorteio ' + (sorteio.getFullYear() === App.agora().getFullYear() ? F.dataCurta(sorteio) : F.data(sorteio)) : null].filter(Boolean).join(' · ');
    const menu = App.ehGestor() ? Comp.menu(c.nome, [
      { rotulo: 'Editar campanha', icone: 'editar', acao: () => Cockpit.editar(c.id, ctx) },
      { rotulo: 'Ativar campanha', icone: 'ok', oculto: c.status !== 'Rascunho', acao: () => Cockpit.ativar(c.id, ctx) },
      { rotulo: 'Antecipar o sorteio', icone: 'calendario', oculto: c.status !== 'Ativa' || !(chaveDia(sorteio) > chaveDia(App.agora())),
        acao: () => Cockpit.antecipar(c.id, ctx) },
      { rotulo: 'Distribuição do resultado', icone: 'caixa', oculto: c.status !== 'Encerrada', acao: () => App.ir('distribuicao/' + encodeURIComponent(c.id)) },
      { rotulo: 'Encerrar campanha', icone: 'fechar', perigo: true, oculto: c.status !== 'Ativa', acao: () => Cockpit.encerrar(c.id, ctx) },
      { rotulo: 'Excluir rascunho', icone: 'lixo', perigo: true, oculto: c.status !== 'Rascunho', acao: () => Cockpit.excluir(c.id) }
    ]) : null;
    ctx.topo({ titulo: c.nome, sub: sub, voltar: 'campanhas', acoes: menu ? [menu] : [] });
  },

  async ativar(id, ctx) {
    const r = await App.executar('campanhas.ativar', { id: id }, { sucesso: 'Campanha ativada. A rotina diária já gera sugestões e mensagens.' });
    if (r) { await App.atualizarCampanhas(); ctx.recarregar(); }
  },

  async encerrar(id, ctx) {
    const r = await App.executar('campanhas.encerrar', { id: id }, { sucesso: 'Campanha encerrada.' });
    if (r) { await App.atualizarCampanhas(); ctx.recarregar(); }
  },

  /** Só rascunho: o servidor diz o que sai junto e o que impede (vendas, prêmios, lançamentos à mão). */
  async excluir(id) {
    const r = await App.executar('campanhas.excluir', { id: id }, { sucesso: (d) => 'Rascunho ' + d.excluida.nome + ' excluído.' });
    if (r) { await App.atualizarCampanhas(); App.ir('campanhas'); }
  },

  /**
   * Antecipar o sorteio (wireframe, "Antecipação do sorteio"). Sugere o próximo sorteio da Loteria Federal e, com as
   * cotas esgotadas, o fim das vendas hoje. O servidor confere as datas e avisa o que ficou fora do novo período.
   */
  async antecipar(id, ctx) {
    const f = Comp.folha({ titulo: 'Antecipar o sorteio', corpo: Comp.esqueleto(2) });
    let d;
    try { d = await App.ler('campanhas.cockpit', { id: id }); } catch (e) { f.mostrar(Comp.falha(e), []); return; }
    const c = d.campanha, a = d.antecipacao || {}, v = d.vendas || {};
    const hoje = chaveDia(App.agora());
    const sorteio = lerData(c.sorteio);
    const vespera = sorteio ? chaveDia(new Date(sorteio.getFullYear(), sorteio.getMonth(), sorteio.getDate() - 1)) : '';
    const esgotou = Cockpit.esgotou(v);
    // Sem antecipação pelo calendário (com a Loteria Federal, o próximo sorteio dela já é o dia marcado): diz por quê,
    // sem travar o formulário, porque a Caixa às vezes muda o dia do sorteio em feriados.
    const semData = d.antecipacao ? null
      : Comp.aviso('info', 'Pelo calendário da Loteria Federal (quartas e sábados), o próximo sorteio já é o dia marcado (' + F.data(c.sorteio) + '). ' +
        'Só antecipe se a Caixa tiver um sorteio antes disso.');
    const situacao = esgotou
      ? Comp.aviso('sucesso', 'Todas as cotas foram vendidas. O sorteio está marcado para ' + F.data(c.sorteio) + '.' +
        (d.foraDaLotep ? '' : ' Confira se o regulamento registrado na LOTEP prevê a antecipação.'))
      : Comp.aviso('alerta', 'Ainda faltam ' + F.pct(Math.max(0, 1 - (v.pctVendido || 0))) + ' das cotas. Antecipe só se o regulamento permitir.');
    const data = Comp.campo({ rotulo: 'Nova data do sorteio', nome: 'sorteio', tipo: 'data', valor: a.sugestao || '',
      atributos: { min: hoje, max: vespera || null },
      dica: a.sugestao ? 'Sugestão: o próximo sorteio da Loteria Federal (quartas e sábados).' : 'Antes de ' + F.data(c.sorteio) + '.' });
    const fim = Comp.campo({ rotulo: 'Fim das vendas', nome: 'fim', tipo: 'data', valor: esgotou ? hoje : '', opcional: true,
      dica: 'Vazio: as vendas vão até o novo sorteio.' });
    // Fora da LOTEP o sorteio pode não ser pela Federal: aí o concurso nem se aplica.
    const dicaConcurso = c.concurso ? 'O concurso muda com a data. O atual (' + c.concurso + ') sai da campanha.'
      : d.foraDaLotep ? 'Só se o sorteio for pela Loteria Federal.' : 'O concurso muda com a data. Confira no site da Caixa.';
    const form = h('form.form', { onsubmit: (ev) => ev.preventDefault() },
      situacao, semData,
      h('.grade.duas', data,
        Comp.campo({ rotulo: 'Concurso da Loteria Federal', nome: 'concurso', valor: '', opcional: true, dica: dicaConcurso }),
        fim),
      h('p.suave.pequeno', { style: { marginBottom: 0 } }, 'As mensagens, as fases e a contagem regressiva passam a usar a data nova. ' +
        'Dinâmicas aprovadas depois do fim das vendas ficam no aviso, para você remarcar ou recusar.'));
    // Fim das vendas depois do novo sorteio não vale: acompanha a data nova.
    data.querySelector('input').addEventListener('change', (ev) => {
      const campo = fim.querySelector('input');
      if (campo.value && ev.target.value && campo.value > ev.target.value) campo.value = ev.target.value;
    });
    const erro = h('div');
    const botao = h('button.btn.primario', { type: 'button' }, 'Antecipar o sorteio');
    f.mostrar([erro, form], [h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Voltar'), botao]);
    botao.addEventListener('click', async () => {
      const x = Comp.lerForm(form);
      if (!x.sorteio) { trocar(erro, Comp.aviso('perigo', 'Informe a nova data do sorteio.')); return; }
      const r = await App.executar('campanhas.antecipar', { id: id, sorteio: x.sorteio, concurso: x.concurso, fim: x.fim },
        { botao: botao, erroEm: erro, sucesso: (res) => 'Sorteio antecipado para ' + F.data(res.campanha.sorteio) + '.' });
      if (r) { f.fechar(); await App.atualizarCampanhas(); ctx.recarregar(); }
    });
  },

  async editar(id, ctx) {
    const f = Comp.folha({ titulo: 'Editar campanha', corpo: Comp.esqueleto(3), larga: true });
    let d;
    try { d = await App.ler('campanhas.cockpit', { id: id }); } catch (e) { f.mostrar(Comp.falha(e), []); return; }
    const c = d.campanha;
    const premio = TelaCampanhas.camposPremio(c);
    const form = h('form.form', { onsubmit: (ev) => ev.preventDefault() },
      h('.grade.duas',
        Comp.campo({ rotulo: 'Nome', nome: 'nome', valor: c.nome, largo: true }),
        premio.modalidade,
        Comp.campo({ rotulo: 'Prêmio principal', nome: 'premio', valor: c.premio }),
        premio.forma, premio.custo, premio.dinheiro, premio.escolha,
        premio.declarado,
        Comp.campo({ rotulo: 'Bilhetes premiados declarados', nome: 'bilhetesDeclarados', tipo: 'moeda', valor: c.bilhetesDeclarados }),
        Comp.campo({ rotulo: 'Meta de venda', nome: 'meta', tipo: 'moeda', valor: c.meta, opcional: true }),
        Comp.campo({ rotulo: 'Preço da cota', nome: 'precoCota', tipo: 'moeda', valor: c.precoCota }),
        TelaCampanhas.campoCotas(c.totalCotas),
        Comp.campo({ rotulo: 'Início das vendas', nome: 'inicio', tipo: 'data', valor: c.inicio }),
        Comp.campo({ rotulo: 'Fim das vendas', nome: 'fim', tipo: 'data', valor: c.fim, opcional: true }),
        Comp.campo({ rotulo: 'Data do sorteio', nome: 'sorteio', tipo: 'data', valor: c.sorteio }),
        premio.concurso,
        premio.autorizacao,
        Comp.campo({ rotulo: 'Link de venda', nome: 'linkVenda', tipo: 'url', valor: c.linkVenda, largo: true, dica: 'Vai nas mensagens quando o modelo usa o link da campanha.' })));
    const inicial = TelaCampanhas.semAuxiliares(Comp.lerForm(form));
    const erro = h('div');
    const salvar = h('button.btn.primario', { type: 'button' }, 'Salvar');
    f.mostrar([erro, form], [h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Voltar'), salvar]);
    salvar.addEventListener('click', async () => {
      const v = TelaCampanhas.semAuxiliares(Comp.lerForm(form)), campos = {};
      Object.keys(v).forEach((k) => { if (v[k] !== inicial[k]) campos[k] = v[k]; });
      if (v.formaPremio === 'Bem ou dinheiro' && !(lerNumero(v.valorDinheiro) > 0)) {
        trocar(erro, Comp.aviso('perigo', 'Informe a opção em dinheiro: o valor que o ganhador pode pedir no lugar do bem.'));
        return;
      }
      if (!Object.keys(campos).length) { f.fechar(); return; }
      const r = await App.executar('campanhas.salvar', { id: id, campos: campos }, { botao: salvar, erroEm: erro, sucesso: 'Campanha atualizada.' });
      if (r) { f.fechar(); await App.atualizarCampanhas(); ctx.recarregar(); }
    });
  },

  // ----- Visão geral -----
  async aba_visao(el, id, ctx) {
    const d = await App.ler('campanhas.cockpit', { id: id });
    if (!ctx.ativo()) return;
    Cockpit.topo(ctx, null, d);
    const c = d.campanha, v = d.vendas, e = d.equilibrio;
    const encerrada = c.status === 'Encerrada';
    const blocos = [];
    if (c.status === 'Rascunho') blocos.push(Cockpit.paraAtivar(d, ctx));
    if (encerrada && d.fechamento) blocos.push(Cockpit.fechamento(d));
    if (d.alertas.length) blocos.push(Cockpit.alertas(d.alertas, c.status));
    if (!encerrada) blocos.push(h('.kpis', Cockpit.kpiSaldo(d), Cockpit.kpiPorDia(d)));
    blocos.push(Cockpit.cotasVendidas(d, ctx));

    // Sem venda diária importada, o gráfico só aparece com a campanha no ar (com o aviso do que falta importar).
    if ((d.serie && d.serie.length) || c.status === 'Ativa') {
      const semDia = c.status === 'Ativa' && App.pode('vendas.importarOverview') ? (v.diasSemImportacao || []).map(F.dataCurta) : [];
      blocos.push(h('.cartao', h('.cabeca', h('h2', 'Vendas por dia'),
        v.ultimoDiaImportado ? h('span.suave.pequeno', 'até ' + F.dataCurta(v.ultimoDiaImportado)) : null),
        Grafico.vendas(d.serie, { necessario: e.ritmo === 'equilíbrio atingido' || encerrada ? 0 : e.necessarioPorDia,
          de: c.inicio, ate: c.fim || c.sorteio, parcial: c.status === 'Ativa' }),
        semDia.length
          ? Comp.aviso('alerta', [(semDia.length > 4 ? 'Faltam as vendas de ' + semDia.length + ' dias, entre ' + semDia[0] + ' e ' + semDia[semDia.length - 1] + '. '
            : 'Faltam as vendas de ' + (semDia.length > 1 ? semDia.slice(0, -1).join(', ') + ' e ' : '') + semDia[semDia.length - 1] + '. '),
            h('button.btn.pequeno', { type: 'button', onclick: () => Acoes.importarVendas(id, { aoMudar: () => ctx.recarregar() }) }, 'Enviar o resumo do portal')])
          : null));
    }

    const expiracao = Cockpit.expiracao(v);
    const ponte = encerrada ? null : Cockpit.ponte(d);
    if (ponte || expiracao) blocos.push(h('.colunas' + (ponte && expiracao ? '.duas' : ''), ponte, expiracao));

    // Só o que ainda vai acontecer: a dinâmica que já terminou sai daqui (o prêmio dela é cobrado em Prêmios).
    const agora = App.agora();
    const proximas = encerrada ? [] : (d.dinamicas || []).filter((x) => ['Aprovada', 'Ativa'].indexOf(x.status) >= 0 &&
      (lerData(x.fim) || new Date((lerData(x.inicio) || agora).getTime() + 3600000)) >= agora).slice(0, 4);
    if (proximas.length) {
      blocos.push(h('section', h('.secao-titulo', h('h2', 'Próximas dinâmicas'),
        h('a.pequeno', { href: '#campanha/' + encodeURIComponent(id) + '/dinamicas', onclick: App.cliqueNav('campanha/' + encodeURIComponent(id) + '/dinamicas') }, 'Ver todas')),
        h('ul.lista', { style: { marginTop: '12px' } }, proximas.map((x) => Cockpit.itemDinamica(x, id, ctx)))));
    }
    trocar(el, blocos);
  },

  /** Todas as cotas vendidas (a conta não prevê mais venda). */
  esgotou(v) { return (Number(v && v.pctVendido) || 0) >= 0.9999; },

  /** Saldo projetado com a base da conta: o ritmo dos últimos 3 dias ou, no rascunho sem venda, a base do orçamento. */
  kpiSaldo(d) {
    const pr = d.projecao, v = d.vendas;
    if (pr.base === 'orcada') {
      return Comp.kpi('Resultado ' + Cockpit.naBase(d), F.moeda(pr.resultado, { compacto: true }),
        'se vender ' + F.moeda(pr.vendaProjetada, { compacto: true }) + ' (' + F.pct(v.vendaMaxima ? pr.vendaProjetada / v.vendaMaxima : 0) + ' das cotas)', F.cls(pr.resultado));
    }
    return Comp.kpi('Saldo projetado', F.moeda(pr.resultado, { compacto: true }),
      Cockpit.esgotou(v) ? 'com todas as cotas vendidas' : F.vazio(v.media3) ? 'só com o que já foi vendido'
        : 'no ritmo de ' + F.moeda(v.media3, { semCentavos: true }) + '/dia', F.cls(pr.resultado));
  },

  /** Venda por dia para o equilíbrio. Antes de abrir, os dias contam do início das vendas. */
  kpiPorDia(d) {
    const c = d.campanha, v = d.vendas, e = d.equilibrio;
    // Valor curto: "Equilíbrio atingido" não cabia no cartão do celular.
    if (e.ritmo === 'equilíbrio atingido') {
      return Comp.kpi('Equilíbrio', 'Atingido', Cockpit.esgotou(v)
        ? 'em ' + F.moeda(e.projetado, { compacto: true }) + ' (' + F.pct(e.pctProjetado) + ' das cotas)' : 'cada venda agora é lucro', 'pos');
    }
    const fim = c.fim || c.sorteio;
    const dias = v.diasAteAbrir > 0 && c.inicio && fim
      ? F.plural(v.diasRestantes || 0, 'dia de venda', 'dias de venda') + ' (' + F.periodo(c.inicio, fim) + ')'
      : F.plural(Math.max(0, v.diasRestantes || 0), 'dia restante', 'dias restantes');
    return Comp.kpi('Precisa por dia', e.necessarioPorDia > 0 ? F.moeda(e.necessarioPorDia, { semCentavos: true }) : '–',
      (e.cotasPorDia ? F.int(e.cotasPorDia) + ' cotas · ' : '') + dias);
  },

  /**
   * Do resultado até agora ao saldo projetado, linha a linha (projecao.ponte do servidor).
   * O último centavo de arredondamento fica nas taxas, para a coluna somar exatamente o total.
   */
  ponte(d) {
    const c = d.campanha, pl = d.pl, pr = d.projecao, p = pr.ponte || {}, v = d.vendas;
    const r2 = (x) => Math.round((Number(x) || 0) * 100) / 100;
    const conservadora = pr.base === 'orcada', b = d.base;
    const ate = r2(pl.resultado), apagar = r2(pl.totalComprometido), vendas = r2(p.vendasPrevistas), custos = r2(p.custosAinda), total = r2(pr.resultado);
    const taxas = r2(ate - apagar + vendas - custos - total);
    const fim = c.fim || c.sorteio;
    const pctConservadora = v.vendaMaxima ? pr.vendaProjetada / v.vendaMaxima : 0;
    const linhas = [
      ['Resultado até agora', ate, 'pago e recebido'],
      // O sinal fica só no valor (como no relatório): "− Contas a pagar −R$ 295 mil" parecia somar de volta.
      ['Contas a pagar já lançadas', -apagar],
      [conservadora ? b.nome + (b.tipo === 'pct' ? '' : ' (' + F.pct(pctConservadora) + ' das cotas)') : 'Vendas previstas' + (fim ? ' até ' + F.dataCurta(fim) : ''), vendas, null, true],
      [Math.abs(vendas) > 0.005 ? 'Taxas e comissões sobre as vendas previstas' : 'Taxas e comissões que faltam lançar', -taxas],
      ['Custos por vir', -custos, 'orçados e ainda não lançados']
    ].filter((l, i) => i === 0 && !conservadora || Math.abs(l[1]) > 0.005);
    const base = conservadora
      ? 'Rascunho sem venda: a conta usa ' + b.a + ', a mesma dos tetos do orçamento.'
      : Cockpit.esgotou(v) ? 'Todas as cotas foram vendidas: não entra mais venda na conta, só as taxas e os custos que faltam lançar.'
      : F.vazio(v.media3) ? 'Ainda não há 3 dias fechados de venda: a projeção conta só o que já foi vendido.'
        : 'Vendas no ritmo dos últimos 3 dias (' + F.moeda(v.media3, { semCentavos: true }) + ' por dia)' + (fim ? ' até ' + F.dataCurta(fim) : '') + ', contando só o que resta de hoje.';
    const dl = [];
    linhas.forEach((l) => {
      dl.push(h('dt', l[0], l[2] ? h('div.suave.pequeno', l[2]) : null), h('dd.' + (F.cls(l[1]) || 'x'), F.moeda(l[1], { sinal: !!l[3] })));
    });
    dl.push(h('dt.total', conservadora ? 'Resultado ' + Cockpit.naBase(d) : 'Saldo projetado no fechamento'),
      h('dd.total.' + (F.cls(total) || 'x'), F.moeda(total)));
    return h('.cartao', h('h2', conservadora ? b.da.charAt(0).toUpperCase() + b.da.slice(1) + ' ao resultado' : 'Do resultado de hoje ao saldo projetado'),
      h('dl.valores', dl), h('p.suave.pequeno', { style: { margin: '10px 0 0' } }, base));
  },

  /** Dinâmica aprovada que já começou: "No ar até 23h59"; que já terminou e espera a rotina: "Realizada". */
  momento(x) {
    if (x.status !== 'Aprovada' && x.status !== 'Ativa') return null;
    const agora = App.agora(), ini = lerData(x.inicio);
    if (!ini || ini > agora) return null;
    const fim = lerData(x.fim) || new Date(ini.getTime() + 3600000);
    if (fim <= agora) return h('span.chip', 'Realizada');
    return h('span.chip.verde', 'No ar até ' + (mesmoDia(fim, agora) ? F.hora(fim) : F.dataCurta(fim) + ' às ' + F.hora(fim)));
  },

  /** Barra das cotas vendidas com o equilíbrio e a meta marcados, e o que falta. */
  cotasVendidas(d, ctx) {
    const c = d.campanha, v = d.vendas, e = d.equilibrio;
    const encerrada = c.status === 'Encerrada';
    // Encerrada: o equilíbrio com os custos realizados, o mesmo do Financeiro.
    const eq = encerrada && !F.vazio(e.realizado) ? e.realizado : e.projetado;
    const pctEq = encerrada && !F.vazio(e.realizado) ? (v.vendaMaxima ? eq / v.vendaMaxima : 0) : e.pctProjetado;
    const marcas = [{ valor: pctEq, rotulo: 'Equilíbrio ' + F.pct(pctEq) + ' · ' + F.moeda(eq, { compacto: true }) }];
    if (d.meta.valor && v.vendaMaxima) {
      marcas.push({ valor: d.meta.valor / v.vendaMaxima, classe: 'meta',
        rotulo: 'Meta ' + F.pct(d.meta.valor / v.vendaMaxima) + ' · ' + F.moeda(d.meta.valor, { compacto: true }) });
    }
    const falta = !encerrada && e.cotasFalta > 0 && e.ritmo !== 'equilíbrio atingido';
    const semVenda = c.status === 'Rascunho' && !(v.total > 0);
    const metaAbaixo = !encerrada && d.meta.valor > 0 && e.projetado > d.meta.valor + 0.5;
    return h('.cartao',
      // Rascunho sem venda: o chip diz quando as vendas abrem, não "sem vendas importadas".
      h('.cabeca', h('h2', 'Cotas vendidas'), semVenda && c.inicio ? h('span.chip', 'Vendas a partir de ' + F.dataCurta(c.inicio)) : Blocos.ritmo(e.ritmo)),
      semVenda ? null : h('p', { style: { margin: 0 } }, h('strong', F.pct(v.pctVendido) + ' das cotas vendidas'),
        ' · ' + F.moeda(v.total, encerrada ? {} : { compacto: true }) + ' · ' + F.plural(v.cotasVendidas, 'cota', 'cotas')),
      Comp.progresso({ valor: v.pctVendido, marcas: marcas, rotulos: true, rotulo: 'Cotas vendidas',
        cor: e.ritmo === 'abaixo' ? 'vermelho' : e.ritmo === 'equilíbrio atingido' ? 'verde' : '' }),
      falta
        ? h('p', { style: { marginBottom: 0 } }, 'Faltam ', h('strong', F.plural(e.cotasFalta, 'cota', 'cotas')), ' (' + F.moeda(e.falta, { compacto: true }) + ') para o equilíbrio' +
          (v.diasRestantes > 0 ? ' em ' + F.plural(v.diasRestantes, 'dia', 'dias') + (v.diasAteAbrir > 0 ? ' de venda' : '') : '') + '.' +
          (F.vazio(v.media3) ? '' : ' Média dos últimos 3 dias: ' + F.moeda(v.media3, { semCentavos: true }) + '.'))
        : null,
      metaAbaixo ? h('p.suave.pequeno', { style: { margin: 0 } }, 'Mesmo batendo a meta de ' + F.moeda(d.meta.valor, { compacto: true }) +
        ', a campanha fecha no prejuízo: o equilíbrio é ' + F.moeda(e.projetado, { compacto: true }) + '.') : null,
      // Esgotou com o sorteio ainda por vir: o atalho para antecipar fica aqui, onde se vê o 100%.
      ctx && d.antecipacao && d.antecipacao.esgotou && App.ehGestor() && App.pode('campanhas.antecipar')
        ? Comp.aviso('sucesso', ['Todas as cotas foram vendidas. ', h('button.btn.pequeno', { type: 'button',
          onclick: () => Cockpit.antecipar(c.id, ctx) }, 'Antecipar o sorteio')]) : null);
  },

  /** Campanha encerrada: o resultado final e, ao lado, quem cobriu o quê no caixa, a parte de cada um e quem deve a quem. */
  fechamento(d) {
    const f = d.fechamento, c = d.campanha, partes = App.sessao.partes;
    const ind = TelaCaixa.curto(partes.indiao), pri = TelaCaixa.curto(partes.prime);
    const rota = 'distribuicao/' + encodeURIComponent(c.id);
    const fimVendas = c.fim || c.sorteio;
    const periodo = [c.inicio && fimVendas ? 'Vendas de ' + F.dataCurta(c.inicio) + ' a ' + F.data(fimVendas) : null,
      c.sorteio ? 'sorteio ' + F.data(c.sorteio) : null].filter(Boolean).join(' · ');
    const resultado = h('.cartao',
      h('.cabeca', h('.titulo', h('h2', 'Fechamento'), periodo ? h('.sub', periodo) : null)),
      h('dl.valores',
        h('dt', 'Vendas'), h('dd', F.moeda(f.vendas)),
        h('dt', 'Custos'), h('dd', F.moeda(f.resultado - f.vendas)),
        h('dt.total', 'Resultado final'), h('dd.total.' + (F.cls(f.resultado) || 'x'), F.moeda(f.resultado))),
      f.comprometido > 0.005 ? h('p.suave.pequeno', { style: { margin: '8px 0 0' } }, 'Inclui ' + F.moeda(f.comprometido) + ' que ainda falta pagar.') : null);
    // fluxo: o que passou pelo caixa de cada parte nesta campanha (negativo: ela pôs dinheiro).
    const noCaixa = (nome, fl) => fl < -0.005 ? nome + ' cobriu ' + F.moeda(-fl) : fl > 0.005 ? nome + ' ficou com ' + F.moeda(fl) : null;
    const caixa = [noCaixa('a ' + pri, f.fluxoPrime), noCaixa('a ' + ind, f.fluxoIndiao)].filter(Boolean);
    const saldo = f.saldoIndiao || 0, deve = Math.abs(saldo) > 0.005;
    const acerto = saldo < -0.005 ? 'A ' + ind + ' deve ' + F.moeda(-saldo) + ' à ' + pri + '.'
      : saldo > 0.005 ? 'A ' + pri + ' deve ' + F.moeda(saldo) + ' à ' + ind + '.' : 'Nenhuma das partes deve à outra por esta campanha.';
    const situacao = deve
      ? h('span.chip.amarelo', saldo < 0 && f.abatido > 0.005 ? 'Pago em parte: ' + F.moeda(f.abatido) + ' de ' + F.moeda(f.abatido - saldo) : 'Acerto pendente')
      : f.abatido > 0.005 || f.distribuicaoPaga ? h('span.chip.verde', 'Acerto feito') : null;
    const botoes = [];
    if (App.pode('distribuicao.simular')) botoes.push(h('a.btn.pequeno', { href: '#' + rota, onclick: App.cliqueNav(rota) }, 'Ver distribuição'));
    if (saldo < -0.005 && App.pode('caixa.abatimento')) botoes.push(h('a.btn.pequeno', { href: '#caixa', onclick: App.cliqueNav('caixa') }, 'Registrar abatimento no Caixa'));
    const divisao = h('.cartao',
      h('.cabeca', h('h2', 'Acerto entre as partes'), situacao),
      caixa.length ? h('p', { style: { margin: '0 0 8px' } }, 'No caixa, ' + caixa.join(' e ') + '.') : null,
      h('p', { style: { margin: '0 0 8px' } }, 'Na divisão de ' + F.pct(f.pctIndiao) + ' e ' + F.pct(f.pctPrime) + ', ' + (f.resultado < 0 ? 'o prejuízo' : 'o lucro') + ' fica ' +
        F.moeda(Math.abs(f.parteIndiao)) + ' para a ' + ind + ' e ' + F.moeda(Math.abs(f.partePrime)) + ' para a ' + pri + '.'),
      h('p', { style: { margin: 0 } }, h('strong', acerto)),
      botoes.length ? h('.acoes', { style: { marginTop: '12px' } }, botoes) : null);
    return h('.colunas.duas', resultado, divisao);
  },

  paraAtivar(d, ctx) {
    const c = d.campanha;
    const editar = () => Cockpit.editar(c.id, ctx);
    const docs = () => App.ir('campanha/' + encodeURIComponent(c.id) + '/premios');
    // Fora da LOTEP não há autorização nem regulamento registrado para cobrar.
    const lotep = d.foraDaLotep ? [] : [
      { ok: !!String(c.autorizacao || '').trim(), t: 'Número da autorização LOTEP', falta: 'número da autorização LOTEP', obrig: true, acao: editar },
      { ok: d.documentos && d.documentos.autorizacao, t: 'PDF da autorização LOTEP', acao: docs },
      { ok: d.documentos && d.documentos.regulamento, t: 'Regulamento', acao: docs }
    ];
    const itens = [
      { ok: c.precoCota > 0 && c.totalCotas > 0, t: 'Preço e total de cotas', falta: 'preço e total de cotas', obrig: true, acao: editar },
      { ok: !!c.inicio && !!c.sorteio, t: 'Início das vendas e data do sorteio', falta: 'datas das vendas e do sorteio', obrig: true, acao: editar }
    ].concat(lotep, [
      { ok: !!String(c.linkVenda || '').trim(), t: 'Link de venda da campanha', acao: editar },
      { ok: !!String(c.concurso || '').trim(), t: 'Concurso da Loteria Federal', acao: editar }
    ]);
    const faltam = itens.filter((i) => i.obrig && !i.ok);
    const botao = App.pode('campanhas.ativar')
      ? h('button.btn.primario', { type: 'button', disabled: faltam.length > 0, onclick: () => Cockpit.ativar(c.id, ctx) }, 'Ativar campanha') : null;
    // Item recomendado que falta: círculo vazio (o triângulo fica para o que trava a ativação).
    const circulo = () => s('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '2', class: 'ic', 'aria-hidden': 'true' },
      s('circle', { cx: 12, cy: 12, r: 8 }));
    return h('.cartao',
      h('.cabeca', h('.titulo', h('h2', 'Para ativar'), h('.sub', 'Enquanto for rascunho, o app não sugere dinâmicas nem agenda mensagens.' +
        (d.foraDaLotep ? ' Fora da LOTEP, não precisa de autorização.' : ''))), botao),
      // O motivo do botão travado fica junto dele, não no fim do cartão.
      faltam.length ? h('p.neg', { style: { margin: '10px 0 0', fontWeight: 600 } }, (faltam.length === 1 ? 'Falta 1 item obrigatório: ' : 'Faltam ' + faltam.length + ' itens obrigatórios: ') +
        faltam.map((i) => i.falta).join(', ') + '.') : null,
      h('ul.lista.dentro', itens.map((i) => h('li' + (i.ok || !App.ehGestor() ? '' : '.clicavel'), !i.ok && App.ehGestor() ? { role: 'button', tabindex: '0', onclick: i.acao } : null,
        h('span', { style: { color: i.ok ? 'var(--sucesso)' : i.obrig ? 'var(--perigo)' : 'var(--texto-3)', display: 'flex' } }, i.ok ? icone('ok') : i.obrig ? icone('alerta') : circulo()),
        h('.principal', h('.t', i.t), !i.ok ? h('.d', i.obrig ? 'Obrigatório para ativar' : 'Recomendado') : null),
        !i.ok && App.ehGestor() ? icone('avancar', 'seta') : null))));
  },

  /**
   * Alertas do cockpit: os dois mais graves abertos e o resto recolhido. Com a campanha no ar, os de planejamento
   * (tetos, margem, meta) já não mudam nada no dia a dia: ficam juntos, recolhidos. Para o sócio, tudo recolhido.
   */
  alertas(lista, status) {
    const ordem = { alta: 0, media: 1, baixa: 2 };
    const tipos = { alta: 'perigo', media: 'alerta', baixa: 'info' };
    const grade = (itens) => h('div', { style: { display: 'grid', gap: '8px' } }, itens.map((a) => Comp.aviso(tipos[a.gravidade] || 'info', a.texto)));
    const todos = lista.slice().sort((a, b) => ordem[a.gravidade] - ordem[b.gravidade]);
    if (!App.ehGestor()) {
      return h('details.ajustes', h('summary', F.plural(todos.length, 'alerta', 'alertas') + ' da gestão'), h('div', { style: { marginTop: '10px' } }, grade(todos)));
    }
    const noAr = status === 'Ativa';
    const doDia = todos.filter((a) => !(noAr && a.planejamento)), plano = todos.filter((a) => noAr && a.planejamento);
    const abertos = doDia.slice(0, 2), resto = doDia.slice(2);
    const recolhido = (titulo, itens) => itens.length
      ? h('details.ajustes', h('summary', titulo), h('div', { style: { marginTop: '10px' } }, grade(itens))) : null;
    return h('div', { style: { display: 'grid', gap: '8px' } },
      abertos.length ? grade(abertos) : null,
      recolhido('Ver mais ' + F.plural(resto.length, 'alerta', 'alertas'), resto),
      recolhido(F.plural(plano.length, 'aviso de planejamento', 'avisos de planejamento'), plano));
  },

  /** Pedidos do portal (pagos e expirados sem pagar); sem dados do portal o cartão não aparece. */
  expiracao(v) {
    const x = v.expiracao || {};
    if (!x.tentativas) return null;
    // Esgotou: as cotas dos pedidos expirados foram compradas por outras pessoas.
    const esgotou = Cockpit.esgotou(v);
    return h('.cartao', h('h2', 'Pedidos'),
      h('dl.valores',
        h('dt', 'Pedidos feitos'), h('dd', F.int(x.tentativas)),
        h('dt', 'Pagos'), h('dd', F.int(x.pedidos)),
        h('dt', 'Expirados sem pagar'), h('dd', F.int(x.expirados) + ' (' + F.pct(x.taxa) + ')'),
        h('dt', 'Tíquete médio'), h('dd', F.moeda(x.ticketMedio)),
        h('dt.total', 'Venda perdida (estimada)'), h('dd.total', esgotou ? 'Nenhuma' : F.moeda(x.vendaNaMesa))),
      App.ehGestor() ? h('details.recolher', { style: { marginTop: '10px' } }, h('summary', 'Como a conta é feita'),
        h('p.suave.pequeno', { style: { margin: 0 } }, 'Os ' + F.pct(x.taxa) + ' são os expirados sobre os pedidos feitos (pagos + expirados). ' +
          'A venda perdida multiplica os expirados pelo tíquete médio.' +
          (esgotou ? ' Com as cotas esgotadas, as dos pedidos expirados foram vendidas para outras pessoas: não houve venda perdida.' : ''))) : null);
  },

  /**
   * Uma dinâmica na lista (visão geral e aba Dinâmicas). O status já é o filtro da lista, então não vira chip.
   * A sugestão mostra o efeito no saldo projetado da campanha e por que pede justificativa; os avisos de orçamento
   * e regulamento são para quem decide (na aprovada, em cinza: a decisão já foi tomada).
   * op: { presenca (botões de resposta para quem confirma presença) }
   */
  itemDinamica(x, campanha, ctx, op) {
    op = op || {};
    const abrir = () => Acoes.dinamica({ id: x.id, campanha: campanha, nome: x.nome }, { aoMudar: () => ctx.recarregar() });
    const decide = App.pode('dinamicas.aceitar');
    const sugestao = x.status === 'Sugerida';
    const sc = { semCentavos: true };
    const custo = Number(x.custo) || 0;
    const momento = Cockpit.momento(x);
    const responder = op.presenca && x.presenca === 'Pendente' && (x.status === 'Aprovada' || x.status === 'Ativa') && !momento;
    const chips = [];
    if (momento) chips.push(momento);
    // Quanto do custo desta sugestão passa do que resta no orçamento de dinâmicas.
    const acimaLivre = sugestao && custo > 0.005 && x.orcamentoLivreDepois < -0.005;
    const excesso = acimaLivre ? custo - Math.max(0, x.orcamentoLivreAntes || 0) : 0;
    if (x.acimaOrcamento && decide) {
      chips.push(sugestao ? h('span.chip.vermelho', excesso > 0.005 ? F.moeda(excesso, sc) + ' acima do orçamento' : 'Acima do orçamento')
        : h('span.chip', 'Aprovada acima do orçamento'));
    }
    if (x.noRegulamento === 'Não' && decide) {
      chips.push(h('span.chip' + (sugestao ? '.amarelo' : ''), { title: 'O regulamento da campanha não prevê esta dinâmica.' },
        sugestao ? 'Fora do regulamento' : 'Aprovada fora do regulamento'));
    }
    if (sugestao && x.regulamentoPendente && decide) chips.push(h('span.chip.amarelo', 'Regulamento a confirmar'));
    if (x.presenca && !responder) chips.push(Blocos.presenca(x.presenca));
    if (!F.vazio(x.retorno)) chips.push(h('span.chip.' + (x.retorno >= 1 ? 'verde' : 'vermelho'), 'Retorno ' + F.retorno(x.retorno)));
    // Por que a sugestão fica fora do "Aceitar" em lote.
    const motivos = [];
    if (sugestao && decide) {
      if (acimaLivre) motivos.push('passa do orçamento de dinâmicas');
      if ((x.motivosJustificativa || []).some((m) => /bilhetes/.test(m))) motivos.push('passa dos bilhetes premiados declarados');
      if (x.noRegulamento === 'Não') motivos.push('não está no regulamento da campanha');
    }
    const juntar = (l) => l.length > 1 ? l.slice(0, -1).join(', ') + ' e ' + l[l.length - 1] : l[0];
    let botoes = null;
    if (responder) {
      const parar = (ev) => ev.stopPropagation();
      const dn = { id: x.id, nome: x.nome, inicio: x.inicio };
      const sim = h('button.btn.pequeno', { type: 'button', onkeydown: parar,
        onclick: (ev) => { ev.stopPropagation(); Acoes.presenca(dn, 'Confirmada', () => ctx.recarregar(), sim); } }, 'Vou estar');
      const nao = h('button.btn.pequeno', { type: 'button', onkeydown: parar,
        onclick: (ev) => { ev.stopPropagation(); Acoes.presenca(dn, 'Recusada', () => ctx.recarregar()); } }, 'Não vou poder');
      // Os dois botões quebram juntos: no celular a pergunta fica em cima e os botões lado a lado.
      botoes = h('.acoes', { style: { marginTop: '8px' } }, h('span.pequeno.suave', 'Você vai estar?'),
        h('span', { style: { display: 'inline-flex', gap: '8px' } }, sim, nao));
    }
    return h('li.clicavel', { role: 'button', tabindex: '0', onclick: abrir,
      onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } } },
      h('.num', { style: { width: '56px', flex: 'none', fontWeight: 650, fontSize: '.9rem' } }, x.inicio ? [F.dataCurta(x.inicio), h('div.suave', F.hora(x.inicio))] : '–'),
      h('.principal', h('.t', x.nome),
        h('.d', custo > 0.005 ? [x.premio || F.moeda(x.valor, sc), F.moeda(custo, sc) + ' com IR'].join(' · ') : 'Sem custo de prêmio'),
        sugestao && custo > 0.005 && !F.vazio(x.saldoProjetadoAntes)
          ? h('.d', 'Saldo projetado da campanha ', Blocos.efeito(x.saldoProjetadoAntes, x.saldoProjetadoDepois)) : null,
        motivos.length ? h('.d', 'Pede justificativa: ' + juntar(motivos) + '.')
          : sugestao && x.regulamentoPendente && decide ? h('.d', 'Antes de aprovar, confirme se está no regulamento.') : null,
        chips.length ? h('.chips', { style: { marginTop: '4px' } }, chips) : null,
        botoes),
      icone('avancar', 'seta'));
  },

  // ----- Calendário (da campanha) -----
  async aba_calendario(el, id, ctx) { await TelaCalendario.montar(el, { campanha: id, ctx: ctx }); },

  // ----- Dinâmicas -----
  async aba_dinamicas(el, id, ctx) {
    const d = await App.ler('dinamicas.listar', { campanha: id });
    if (!ctx.ativo()) return;
    const info = App.campanha(id) || {};
    const livre = d.livre || {};
    const grupos = {
      Sugerida: d.dinamicas.filter((x) => x.status === 'Sugerida'),
      Vigentes: d.dinamicas.filter((x) => x.status === 'Aprovada' || x.status === 'Ativa'),
      Encerrada: d.dinamicas.filter((x) => x.status === 'Encerrada'),
      Recusada: d.dinamicas.filter((x) => x.status === 'Recusada')
    };
    // Quem decide vê sugestões e recusadas; o sócio vê o que foi aprovado (com a presença a responder) e o que já passou.
    const decide = App.pode('dinamicas.aceitar');
    const presenca = !decide && App.pode('dinamicas.confirmarPresenca');
    const filtros = decide ? [['Sugerida', 'Sugestões'], ['Vigentes', 'Aprovadas'], ['Encerrada', 'Encerradas'], ['Recusada', 'Recusadas']]
      : [['Vigentes', 'Aprovadas'], ['Encerrada', 'Encerradas']];
    let filtro = filtros.some((f) => f[0] === ctx.query.status) ? ctx.query.status : decide && grupos.Sugerida.length ? 'Sugerida' : 'Vigentes';
    const lista = h('div');
    const botoesFiltro = filtros.map((f) =>
      h('button.filtro', { type: 'button', 'aria-pressed': String(f[0] === filtro), onclick: (ev) => {
        filtro = f[0];
        botoesFiltro.forEach((b) => b.setAttribute('aria-pressed', 'false'));
        ev.currentTarget.setAttribute('aria-pressed', 'true');
        desenhar();
      } }, f[1] + ' (' + grupos[f[0]].length + ')'));
    const desenhar = () => {
      const itens = grupos[filtro];
      const acoes = [];
      // Em lote, só as que não pedem justificativa nem conferência do regulamento: a mesma regra do Hoje.
      const livres = filtro === 'Sugerida' ? itens.filter((x) => !x.precisaJustificativa && !x.regulamentoPendente) : [];
      if (livres.length > 1 && App.pode('dinamicas.aceitarVarias')) {
        const b = h('button.btn.pequeno.primario', { type: 'button', onclick: () => Acoes.aceitarTodas(livres.map((x) => Object.assign({ campanha: id }, x)), { botao: b, aoMudar: () => ctx.recarregar() }) },
          livres.length === itens.length ? 'Aceitar todas' : 'Aceitar as ' + livres.length + ' sem justificativa');
        acoes.push(b);
      }
      trocar(lista, [
        acoes.length ? h('.acoes', { style: { marginBottom: '10px' } }, acoes) : null,
        itens.length ? h('ul.lista', itens.map((x) => Cockpit.itemDinamica(x, id, ctx, { presenca: presenca })))
          : h('.cartao', Comp.vazio(filtro === 'Sugerida' ? 'Nenhuma sugestão agora' : 'Nada por aqui',
            filtro === 'Sugerida' ? 'As sugestões dos próximos 7 dias saem da agenda do influenciador, das datas comerciais e do ritmo de vendas.' : null))
      ]);
    };
    const acoesTopo = [];
    if (App.pode('dinamicas.gerarSugestoes') && info.status !== 'Encerrada') {
      const b = h('button.btn', { type: 'button', onclick: async () => {
        const r = await App.executar('dinamicas.gerarSugestoes', { campanha: id }, { botao: b,
          sucesso: (x) => F.plural(x.sugestoes, 'sugestão', 'sugestões') + ' para os próximos 7 dias (' + F.plural(x.novas, 'nova', 'novas') + ').' });
        if (r) ctx.recarregar();
      } }, icone('atualizar'), 'Atualizar sugestões');
      acoesTopo.push(b);
    }
    if (App.pode('dinamicas.criar') && info.status !== 'Encerrada') {
      acoesTopo.push(h('button.btn.primario', { type: 'button', onclick: () => Cockpit.novaDinamica(id, ctx) }, icone('mais'), 'Nova dinâmica'));
    }
    trocar(el, [
      // Orçamento e regulamento são números de quem decide; o sócio vai direto à lista.
      decide ? h('.kpis',
        Cockpit.kpiLivre(livre),
        Comp.kpi('Saldo projetado da campanha', F.moeda(d.saldoProjetado, { compacto: true }), 'no fechamento', F.cls(d.saldoProjetado)),
        livre.declarado ? Comp.kpi('Bilhetes premiados do regulamento', F.moeda(Math.max(0, livre.livreDeclarado || 0), { compacto: true }) + ' livres',
          F.pct(livre.pctDeclaradoUsado || 0, 0) + ' dos ' + F.moeda(livre.declarado, { compacto: true }) + ' declarados já usados') : null) : null,
      acoesTopo.length ? h('.acoes.fim.cheias', acoesTopo) : null,
      h('.filtros.quebra', { role: 'group', 'aria-label': 'Filtrar dinâmicas' }, botoesFiltro),
      lista
    ]);
    desenhar();
  },

  /** Dinâmica criada direto pela gestão, a partir da biblioteca. */
  async novaDinamica(campanha, ctx) {
    const f = Comp.folha({ titulo: 'Nova dinâmica', corpo: Comp.esqueleto(3) });
    let bib;
    try { bib = await App.ler('biblioteca.listar', {}, 300); } catch (e) { f.mostrar(Comp.falha(e), []); return; }
    const familias = {};
    bib.forEach((b) => { (familias[b.familia || 'Outras'] = familias[b.familia || 'Outras'] || []).push(b); });
    const sel = h('select', { name: 'codigo', id: 'nd-codigo' }, h('option', { value: '' }, 'Escolha…'),
      Object.keys(familias).map((fa) => h('optgroup', { label: fa }, familias[fa].map((b) => h('option', { value: b.codigo }, b.codigo + ' · ' + b.nome)))));
    const info = h('div');
    const valor = Comp.campo({ rotulo: 'Valor do prêmio', nome: 'valor', tipo: 'moeda' });
    const tipo = Comp.campo({ rotulo: 'Tipo do prêmio', nome: 'tipoPremio', tipo: 'select', opcoes: ['Dinheiro', 'Bem'] });
    const reg = h('div');
    const ir = h('div');
    const convidar = h('input', { type: 'checkbox', name: 'convidar' });
    const form = h('form.form', { onsubmit: (ev) => ev.preventDefault() },
      h('.campo', h('label', { for: 'nd-codigo' }, 'Dinâmica'), sel), info,
      h('.grade.duas',
        Comp.campo({ rotulo: 'Início', nome: 'inicio', tipo: 'datahora', obrigatorio: true }), valor, tipo,
        h('div', reg), h('div', ir)),
      h('label.check', convidar, h('span', 'Pedir a presença do influenciador', h('span.suave.pequeno', { style: { display: 'block' } }, 'A dinâmica entra na agenda dele e ele confirma pelo app.'))),
      Comp.campo({ rotulo: 'Justificativa', nome: 'justificativa', tipo: 'textarea', linhas: 2,
        dica: 'Só é obrigatória se a dinâmica passar do orçamento livre ou estiver fora do regulamento.' }));
    const marcar = (b) => {
      const x = bib.filter((y) => y.codigo === b)[0];
      trocar(reg, Comp.campo({ rotulo: 'No regulamento?', nome: 'noRegulamento', tipo: 'simnao', valor: x ? x.noRegulamento : '' }));
      trocar(ir, Comp.campo({ rotulo: 'Recolhe IR?', nome: 'recolheIr', tipo: 'simnao', valor: x ? x.recolheIr : '' }));
      if (!x) { trocar(info, []); return; }
      valor.querySelector('input').value = F.campoMoeda(x.premioPadrao);
      tipo.querySelector('select').value = x.tipoPremioPadrao || 'Dinheiro';
      convidar.checked = x.exigeLive === 'Sim';
      trocar(info, h('.aviso.info', icone('info'), h('div', x.comoFunciona || '', h('div.pequeno.suave', { style: { marginTop: '4px' } },
        ['Custo padrão ' + F.moeda(x.custoPadrao, { semCentavos: true }) + ' com IR', x.exigeLive === 'Sim' ? 'pede live' : null,
          !F.vazio(x.retorno) ? 'retorno médio ' + F.retorno(x.retorno) + ' (' + F.plural(x.medicoes, 'medição', 'medições') + ')' : null].filter(Boolean).join(' · ')))));
    };
    marcar('');
    sel.addEventListener('change', () => marcar(sel.value));
    const erro = h('div');
    const criar = h('button.btn.primario', { type: 'button' }, 'Criar dinâmica');
    f.mostrar([erro, form], [h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Voltar'), criar]);
    criar.addEventListener('click', async () => {
      const v = Comp.lerForm(form);
      if (!v.codigo) { trocar(erro, Comp.aviso('perigo', 'Escolha a dinâmica.')); return; }
      if (!v.inicio) { trocar(erro, Comp.aviso('perigo', 'Informe a data e a hora.')); return; }
      const p = { campanha: campanha, codigo: v.codigo, inicio: v.inicio, valor: v.valor, tipoPremio: v.tipoPremio, convidar: !!v.convidar };
      if (v.noRegulamento) p.noRegulamento = v.noRegulamento;
      if (v.recolheIr) p.recolheIr = v.recolheIr;
      if (v.justificativa) p.justificativa = v.justificativa;
      const r = await App.executar('dinamicas.criar', p, { botao: criar, erroEm: erro,
        sucesso: (x) => 'Dinâmica criada. Saldo projetado: ' + F.moeda(x.saldoProjetadoAntes, { compacto: true }) + ' → ' + F.moeda(x.saldoProjetadoDepois, { compacto: true }) + '.' });
      if (r) { f.fechar(); ctx.recarregar(); }
    });
  },

  // ----- Vendas -----
  async aba_vendas(el, id, ctx) { await TelaVendas.montar(el, id, ctx); },

  // ----- Financeiro -----
  async aba_financeiro(el, id, ctx) {
    const sim = Cockpit.simBase && Cockpit.simBase.id === id ? Cockpit.simBase.escolha : '';
    let d, caixa = null;
    try {
      // O Livro caixa da campanha alimenta "Quem pagou os custos" (3.3.1); quem não vê o caixa não vê o cartão.
      [d, caixa] = await Promise.all([App.ler('campanhas.cockpit', sim ? { id: id, base: sim } : { id: id }),
        App.pode('caixa.listar') ? App.ler('caixa.listar', { campanha: id, limite: 2000 }) : null]);
    } catch (e) {
      // A base simulada deixou de valer (a meta foi apagada, por exemplo): volta para a padrão e avisa.
      if (!sim || e.conexao) throw e;
      Cockpit.simBase = null;
      Comp.rapido(e.message, 'alerta', 6000);
      return Cockpit.aba_financeiro(el, id, ctx);
    }
    if (!ctx.ativo()) return;
    Cockpit.topo(ctx, null, d);
    const c = d.campanha, livre = d.orcamento.livre || {}, pl = d.pl;
    const encerrada = c.status === 'Encerrada';
    const rotaDist = 'distribuicao/' + encodeURIComponent(id);
    const verDistribuicao = App.pode('distribuicao.simular') ? h('a.btn.pequeno', { href: '#' + rotaDist, onclick: App.cliqueNav(rotaDist) }, 'Ver distribuição') : null;
    const kpis = [];
    if (encerrada) {
      // Encerrada: um resultado só, exato, e quem deve a quem.
      const f = d.fechamento || { resultado: pl.resultadoComComprometidos, saldoIndiao: 0 };
      const partes = App.sessao.partes, ind = TelaCaixa.curto(partes.indiao), pri = TelaCaixa.curto(partes.prime);
      kpis.push(Comp.kpi('Resultado final', F.moeda(f.resultado), f.saldoIndiao < -0.005 ? 'A ' + ind + ' deve ' + F.moeda(-f.saldoIndiao) + ' à ' + pri
        : f.saldoIndiao > 0.005 ? 'A ' + pri + ' deve ' + F.moeda(f.saldoIndiao) + ' à ' + ind : 'Nenhuma parte deve à outra', F.cls(f.resultado)));
    } else {
      kpis.push(Cockpit.kpiSaldo(d));
      if (c.status !== 'Rascunho' || Math.abs(pl.resultado) > 0.005 || pl.totalComprometido > 0.005) {
        kpis.push(Comp.kpi('Resultado até agora', F.moeda(pl.resultado, { compacto: true }), 'pago e recebido', F.cls(pl.resultado)),
          Comp.kpi('Contas a pagar', F.moeda(pl.totalComprometido, { compacto: true }), 'já lançadas, ainda não pagas'));
      }
      kpis.push(Cockpit.kpiLivre(livre));
    }
    trocar(el, [
      Cockpit.seletorBase(d, el, ctx),
      h('.kpis', kpis),
      encerrada && verDistribuicao ? h('.acoes.fim', verDistribuicao) : null,
      encerrada ? null : Cockpit.ponte(d),
      Cockpit.orcadoRealizado(d, ctx),
      caixa ? Cockpit.quemPagouCustos(caixa.linhas || [], id, ctx) : null,
      encerrada ? Cockpit.tetosRealizados(d) : Cockpit.cenarios(d, verDistribuicao),
      encerrada ? null : Cockpit.tetos(d)
    ]);
  },

  /**
   * Base de comparação: a venda sobre a qual valem a venda orçada, os tetos e a margem mínima. Tocar numa base refaz o
   * Financeiro com ela, sem gravar nada (decisão de 28/10/2026: "só simular"); a campanha continua na padrão das Configurações.
   */
  seletorBase(d, el, ctx) {
    const b = d.base, id = d.campanha.id;
    const opcoes = (b.opcoes || []).map((o) => [o.escolha, o.curto + ' ' + F.pct(o.pct)]).concat([['outra', b.tipo === 'pct' ? 'Outra: ' + b.curto : 'Outra %']]);
    const marcada = b.tipo === 'pct' ? 'outra' : b.escolha;
    const simular = (escolha) => {
      Cockpit.simBase = escolha ? { id: id, escolha: escolha } : null;
      el.style.opacity = '.6';
      Cockpit.aba_financeiro(el, id, ctx).catch((e) => Comp.rapido(e.message, 'erro', 6000)).finally(() => { el.style.opacity = ''; });
    };
    const campo = Comp.campo({ rotulo: '% das cotas vendidas', nome: 'pctBase', tipo: 'pct', valor: b.tipo === 'pct' ? b.pct : '',
      atributos: { placeholder: 'Ex.: 25' } });
    const entrada = campo.querySelector('input');
    const erro = h('div');
    const aplicar = () => {
      // O campo é em %: "25" e "25%" são 25%.
      const pct = /%/.test(entrada.value) ? lerNumero(entrada.value) * 100 : lerNumero(entrada.value);
      if (!(pct > 0) || pct > 100) { trocar(erro, Comp.aviso('perigo', 'Digite um % entre 0 e 100.')); entrada.focus(); return; }
      simular(entrada.value.trim() + (/%/.test(entrada.value) ? '' : '%'));
    };
    entrada.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); aplicar(); } });
    const outra = h('.base-outra', { hidden: marcada !== 'outra' }, campo,
      h('button.btn', { type: 'button', onclick: aplicar }, 'Simular'), erro);
    const grupo = h('.opcoes-sim-nao.escolhas', { role: 'radiogroup', 'aria-label': 'Base de comparação' }, opcoes.map((o) =>
      h('label', h('input', { type: 'radio', name: '_base', value: o[0], checked: o[0] === marcada }), h('span', o[1]))));
    grupo.addEventListener('change', (ev) => {
      if (ev.target.value === 'outra') { outra.hidden = false; entrada.focus(); return; }
      simular(ev.target.value);
    });
    const valor = F.moeda(b.valor, { compacto: true });
    const nota = b.simulada
      ? Comp.aviso('alerta', [h('strong', 'Simulação: '), 'venda orçada, tetos e margem sobre ' + Cockpit.baseTetos(d) +
        '. Nada foi gravado: os alertas e o relatório seguem n' + b.padrao.a + '. '],
        h('button.btn.pequeno', { type: 'button', onclick: () => simular('') }, 'Voltar para ' + b.padrao.a))
      : h('p.suave.pequeno', { style: { margin: 0 } }, 'Venda orçada, tetos e margem sobre ' + b.a + ' (' + F.pct(b.pct) + ' das cotas, ' + valor +
        '), a padrão das Configurações. Toque em outra base para simular, sem gravar nada.');
    return h('.cartao.base-comparacao', h('h2', 'Base de comparação'), grupo, outra, nota);
  },

  /** "na venda conservadora", "na meta de venda" ou, para um % digitado, "com 25% vendido" (cabe no título do cartão). */
  naBase(d) { return d.base.tipo === 'pct' ? 'com ' + d.base.curto + ' vendido' : d.base.na; },

  /**
   * Quem pagou os custos (3.3.1): cada custo já pago e quem pagou, com o total de cada parte, que volta para ela no acerto,
   * no fim da apuração. Tocar num custo lançado à mão abre "Quem pagou" (uma parte ou as duas, com quanto cada uma
   * pagou); num prêmio, troca quem pagou; num pagamento de comissão ou disparo, abre o lançamento. Os automáticos (taxa da
   * plataforma, comissões, IR) vêm somados por categoria. Os totais são os mesmos da "Devolução do que pagou" do acerto.
   */
  quemPagouCustos(lista, id, ctx) {
    const partes = App.sessao.partes, ind = TelaCaixa.curto(partes.indiao), pri = TelaCaixa.curto(partes.prime);
    const op = { campanha: id, aoMudar: () => ctx.recarregar() };
    const premio = (l) => /^premio:[^:]+$/.test(l.origem || '');
    const tot = { indiao: 0, prime: 0 };
    const somar = (parte, v) => { if (parte === partes.indiao) tot.indiao += v; else if (parte === partes.prime) tot.prime += v; };
    const itens = [], grupos = {}, vistos = {};
    lista.forEach((l) => {
      if (l.status === 'Comprometido') return;
      if (l.para) {
        // Aporte: dinheiro que uma parte pôs na campanha para pagar custos; conta para quem aportou.
        if (l.tipo !== 'Aporte') return;
        somar(l.parte, Number(l.valor) || 0);
        somar(l.para, -(Number(l.valor) || 0));
        itens.push({ l: l, valor: Number(l.valor) || 0, aporte: true });
        return;
      }
      const v = -(Number(l.efeito) || 0);
      if (!(v > 0.004)) return;
      somar(l.parte, v);
      if (l.classe === 'automatico' && !premio(l)) {
        const g = grupos[l.categoria] = grupos[l.categoria] || { categoria: l.categoria, qtd: 0, indiao: 0, prime: 0 };
        g.qtd++;
        if (l.parte === partes.indiao) g.indiao += v; else g.prime += v;
        return;
      }
      // Custo pago pelas duas partes: são duas linhas no Livro caixa; aqui, uma só, com o custo inteiro.
      if (l.divisao) {
        const k = l.origem || l.id;
        if (vistos[k]) return;
        vistos[k] = true;
        itens.push({ l: l, valor: l.divisao.total, divisao: l.divisao });
        return;
      }
      itens.push({ l: l, valor: v });
    });
    const quem = (x) => x.aporte ? h('span.chip.azul', 'Aporte da ' + TelaCaixa.curto(x.l.parte) + ' à ' + TelaCaixa.curto(x.l.para))
      : x.divisao ? h('span.chip.azul', ind + ' ' + F.moeda(x.divisao.indiao) + ' · ' + pri + ' ' + F.moeda(x.divisao.prime))
        : x.l.parte === partes.indiao ? h('span.chip.azul', 'Pago pela ' + ind) : h('span.chip', 'Pago pela ' + pri);
    const acao = (x) => {
      const l = x.l;
      if (x.aporte) return null;
      if (premio(l)) return App.pode('premios.quemPagou') ? () => TelaCaixa.quemPagouPremio(l, op) : () => TelaCaixa.detalhe(l, op);
      if (l.classe === 'manual' && l.tipo === 'Saída' && App.pode('caixa.quemPagou')) return () => TelaCaixa.quemPagou(l, op);
      return () => TelaCaixa.detalhe(l, op);
    };
    const linha = (x) => {
      const abrir = acao(x);
      const l = x.l;
      return h('li' + (abrir ? '.clicavel' : ''), abrir ? { role: 'button', tabindex: '0', onclick: abrir,
        onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } } } : null,
      h('.principal', h('.t', l.descricao || (x.aporte ? 'Aporte' : l.categoria)),
        h('.d', [F.dataCurta(l.data), x.aporte ? null : l.categoria].filter(Boolean).join(' · ')),
        h('.chips', { style: { marginTop: '6px' } }, quem(x))),
      h('.lado', h('span.num.forte', F.moeda(x.valor))));
    };
    const somados = Object.keys(grupos).sort().map((k) => {
      const g = grupos[k];
      return h('li', h('.principal', h('.t', g.categoria), h('.d', g.qtd === 1 ? '1 lançamento automático' : F.int(g.qtd) + ' lançamentos automáticos, somados'),
        h('.chips', { style: { marginTop: '6px' } }, g.indiao > 0.004 ? h('span.chip.azul', ind + ' ' + F.moeda(g.indiao)) : null,
          g.prime > 0.004 ? h('span.chip', pri + ' ' + F.moeda(g.prime)) : null)),
      h('.lado', h('span.num.forte', F.moeda(g.indiao + g.prime))));
    });
    const lancar = App.pode('caixa.lancar') ? h('button.btn.pequeno', { type: 'button',
      onclick: () => TelaCaixa.lancar('Saída', { partes: partes }, op) }, icone('mais'), 'Lançar custo') : null;
    const vazio = !itens.length && !somados.length;
    return h('.cartao', h('.cabeca', h('h2', 'Quem pagou os custos'), lancar),
      vazio ? h('p.suave', { style: { margin: 0 } }, 'Nenhum custo pago ainda nesta campanha.') : [
        h('dl.valores', h('dt', 'Pago pela ' + ind), h('dd', F.moeda(tot.indiao)), h('dt', 'Pago pela ' + pri), h('dd', F.moeda(tot.prime))),
        h('p.suave.pequeno', { style: { margin: '10px 0 6px' } }, 'No acerto, feito no fim da apuração, o que cada parte pagou volta para ela; como os custos ' +
          'saem do resultado antes da divisão, cada parte acaba arcando com a sua porcentagem de cada custo (aba Relatório). Toque num custo para ' +
          'dizer quem pagou e quanto: uma parte ou as duas.'),
        h('ul.lista.dentro', itens.map(linha).concat(somados))]);
  },

  /** Orçado x realizado: a receita à parte (recebido não é pago) e os custos, sem as linhas zeradas. */
  orcadoRealizado(d, ctx) {
    const cat = App.sessao.listas.cat, o = d.orcamento, v = d.vendas;
    const encerrada = d.campanha.status === 'Encerrada';
    const zero = (x) => Math.abs(Number(x) || 0) < 0.005;
    const lv = o.linhas.filter((l) => l.categoria === cat.vendas)[0];
    let receita = null;
    if (lv) {
      const dif = (lv.pago || 0) - (lv.orcado || 0);
      const pct = v.vendaMaxima ? lv.orcado / v.vendaMaxima : 0;
      receita = h('dl.valores', { style: { marginBottom: '14px' } },
        h('dt', 'Vendas recebidas'), h('dd', F.moeda(lv.pago)),
        // Não é a meta de venda: é a base dos tetos e do orçamento, a venda conservadora se não houver simulação (dito para todos).
        h('dt', 'Venda orçada', h('div.suave.pequeno', (d.base.tipo === 'pct' ? '' : F.pct(pct) + ' das cotas: ') + d.base.a + ', base do orçamento' +
          (d.base.simulada ? ' (simulação)' : ''))), h('dd', F.moeda(lv.orcado)),
        h('dt', dif >= 0 ? 'Acima da venda orçada' : encerrada ? 'Abaixo da venda orçada' : 'Falta para a venda orçada'),
        h('dd.' + (dif > 0.005 ? 'pos' : encerrada && dif < -0.005 ? 'neg' : 'x'), F.moeda(Math.abs(dif))));
    }
    const custos = o.linhas.filter((l) => l.categoria !== cat.vendas && !(zero(l.orcado) && zero(l.pago) && zero(l.comprometido)));
    const aPagar = custos.some((l) => !zero(l.comprometido));
    const soma = (k) => custos.reduce((t, l) => t + (Number(l[k]) || 0), 0);
    // ehTotal, não total: as linhas do servidor já têm "total" (pago mais a pagar).
    const total = { categoria: 'Total dos custos', orcado: soma('orcado'), pago: soma('pago'), comprometido: soma('comprometido'), diferenca: soma('diferenca'), ehTotal: true };
    const tabela = Comp.tabela([
      { titulo: 'Custo', valor: (l) => [l.ehTotal ? h('strong', l.categoria) : l.categoria, // A nota (orçado sobre a venda projetada, crédito do prêmio) vale para todos, como no relatório.
      l.observacao ? h('div.suave.pequeno', { style: { fontWeight: 400 } }, l.observacao) : null] },
      { titulo: 'Orçado', dir: true, valor: (l) => h('span.num', F.moeda(l.orcado)) },
      // Zero vira "–" (e some no cartão do celular), como no relatório e no PDF.
      { titulo: 'Pago', dir: true, valor: (l) => zero(l.pago) && !l.ehTotal ? '–' : h('span.num', F.moeda(l.pago)) },
      aPagar ? { titulo: 'A pagar', dir: true, valor: (l) => zero(l.comprometido) && !l.ehTotal ? '–' : h('span.num', F.moeda(l.comprometido)) } : null,
      { titulo: encerrada ? 'Diferença' : 'Disponível', dir: true, valor: (l) => F.vazio(l.diferenca) ? '–'
        : h('span.num.' + (l.acima || (l.ehTotal && l.diferenca < -0.005) ? 'neg' : 'x'), F.moeda(l.diferenca)) }
    ].filter(Boolean), custos.concat([total]), { classeLinha: (l) => l.ehTotal ? 'total' : '' });
    const t = tabela.querySelector('table');
    if (t) t.classList.add('compacta');
    return h('.cartao', h('.cabeca', h('h2', 'Orçado x realizado'),
      // "Editar" e não "Editar orçamento": o título do quadro já diz o que se edita e cabe numa linha no celular.
      App.pode('campanhas.salvarOrcamento') && !encerrada ? h('button.btn.pequeno', { type: 'button', 'aria-label': 'Editar orçamento',
        onclick: () => Cockpit.editarOrcamento(d, ctx) }, icone('editar'), 'Editar') : null),
      receita, tabela,
      h('p.suave.pequeno', { style: { margin: '10px 0 0' } }, encerrada
        ? 'Diferença: orçado menos ' + (aPagar ? 'pago e a pagar' : 'pago') + '. Negativa, em vermelho, é custo acima do orçado.'
        : 'Disponível: orçado menos ' + (aPagar ? 'pago e a pagar' : 'pago') + ', o que ainda resta para gastar. Negativo, em vermelho, já passou do orçado.'));
  },

  /** Cenários com os custos projetados (os mesmos da visão geral e da distribuição), com a linha do projetado. */
  cenarios(d, link) {
    const c = d.campanha, sim = d.simulador, v = d.vendas, pr = d.projecao, e = d.equilibrio;
    const base = Object.assign({}, sim, { equilibrio: e.projetado, cotasEquilibrio: e.cotasProjetado, pctEquilibrio: e.pctProjetado, cenarios: d.cenarios });
    const op = { novo: false, simples: !App.ehGestor() };
    if (pr.base === 'projetada') {
      const fim = c.fim || c.sorteio;
      op.projetado = { nome: 'Projetado', pctVendido: v.vendaMaxima ? pr.vendaProjetada / v.vendaMaxima : 0, vendas: pr.vendaProjetada, resultado: pr.resultado,
        base: d.base.tipo === 'projetada' };
      op.metodo = F.vazio(v.media3) ? 'Projetado: só o que já foi vendido (ainda não há 3 dias fechados de venda).'
        : 'Projetado: o que já foi vendido mais ' + F.moeda(v.media3, { semCentavos: true }) + ' por dia, a média dos últimos 3 dias' + (fim ? ', até ' + F.dataCurta(fim) : '') + '.';
    }
    return h('.cartao', h('.cabeca', h('h2', 'Cenários'), link), TelaCampanhas.painelSimulacao(base, op).slice(1));
  },

  /** Tetos do orçamento. As dinâmicas usam o previsto (aprovadas e pagas, com IR), o mesmo do "livre para dinâmicas". */
  tetos(d) {
    const cat = App.sessao.listas.cat, o = d.orcamento, livre = o.livre || {};
    const linhas = (o.tetos || []).map((t) => {
      if (t.minimo || t.bloco.indexOf(cat.dinamicas) !== 0 || !(livre.usado > t.planejado)) return t;
      return Object.assign({}, t, { planejado: livre.usado, alerta: livre.usado > t.teto + 0.005 });
    });
    // Margem é um mínimo; os outros blocos são tetos. A coluna diz qual é qual, e a situação fica curta para caber.
    return h('.cartao', h('h2', 'Tetos do orçamento'), h('p.suave.pequeno', (d.base.simulada ? 'Simulação sobre ' : 'Sobre ') + Cockpit.baseTetos(d) + '.'),
      Comp.tabela([
        // A margem é o resultado nessa venda, não o saldo projetado: o nome da linha diz isso.
        { titulo: 'Bloco', valor: (t) => t.minimo ? 'Margem nessa venda' : t.bloco },
        { titulo: 'Limite', dir: true, valor: (t) => h('span.num', (t.minimo ? 'mín. ' : 'até ') + F.moeda(t.teto, { compacto: true }) + ' (' + F.pct(t.pct, 0) + ')') },
        { titulo: 'Previsto', dir: true, valor: (t) => h('span.num.' + (F.cls(t.planejado) === 'neg' ? 'neg' : 'x'), F.moeda(t.planejado, { compacto: true })) },
        { titulo: 'Situação', dir: true, valor: (t) => h('span.chip.' + (t.alerta ? 'vermelho' : 'verde'), t.alerta ? (t.minimo ? 'Abaixo' : 'Acima') : 'Dentro') }
      ], linhas));
  },

  /**
   * Encerrada: o equilíbrio e os tetos com o realizado, não com o orçado.
   * O IR do prêmio principal é o calculado sobre o valor declarado; o resto do IR é das dinâmicas.
   */
  tetosRealizados(d) {
    const cat = App.sessao.listas.cat, pl = d.pl, v = d.vendas, sim = d.simulador, e = d.equilibrio;
    const real = (k) => -((pl.realizado[k] || 0) + (pl.comprometido[k] || 0));
    const ir = real(cat.ir), irPrincipal = Math.min(ir, sim.irPremio || 0);
    const resultado = d.fechamento ? d.fechamento.resultado : pl.resultadoComComprometidos;
    const valor = (t) => t.minimo ? resultado
      : t.bloco.indexOf(cat.premio) === 0 ? real(cat.premio) + irPrincipal + real(cat.lotep)
        : t.bloco.indexOf(cat.dinamicas) === 0 ? real(cat.dinamicas) + ir - irPrincipal
          : t.bloco.indexOf(cat.midia) === 0 ? real(cat.midia) : t.planejado;
    const linhas = (d.orcamento.tetos || []).map((t) => {
      const x = valor(t);
      return Object.assign({}, t, { realizado: x, alerta: t.minimo ? x < t.teto - 0.005 : x > t.teto + 0.005 });
    });
    const eq = F.vazio(e.realizado) ? e.projetado : e.realizado;
    const vendas = pl.realizado[cat.vendas] || 0;
    return h('.cartao', h('h2', 'Realizado x tetos do orçamento'),
      h('p', { style: { margin: '0 0 10px' } }, 'Com os custos realizados, o equilíbrio ficou em ' + F.moeda(eq) + ' (' + F.pct(v.vendaMaxima ? eq / v.vendaMaxima : 0) +
        ' das cotas). A campanha vendeu ' + F.moeda(vendas) + ' (' + F.pct(v.pctVendido) + ')' +
        (eq > vendas + 0.005 ? ': faltaram ' + F.moeda(eq - vendas) + ' em vendas.' : ', acima do equilíbrio.')),
      Comp.tabela([
        { titulo: 'Bloco', valor: (t) => t.minimo ? 'Margem (resultado final)' : t.bloco },
        { titulo: 'Limite', dir: true, valor: (t) => h('span.num', (t.minimo ? 'mín. ' : 'até ') + F.moeda(t.teto, { compacto: true }) + ' (' + F.pct(t.pct, 0) + ')') },
        { titulo: 'Realizado', dir: true, valor: (t) => h('span.num.' + (F.cls(t.realizado) === 'neg' ? 'neg' : 'x'), F.moeda(t.realizado)) },
        { titulo: 'Situação', dir: true, valor: (t) => h('span.chip.' + (t.alerta ? 'vermelho' : 'verde'), t.alerta ? (t.minimo ? 'Abaixo' : 'Acima') : 'Dentro') }
      ], linhas),
      h('p.suave.pequeno', { style: { margin: '10px 0 0' } }, d.base.simulada ? 'Simulação: os tetos estão sobre ' + Cockpit.baseTetos(d) + '.'
        : 'Os tetos são sobre ' + Cockpit.baseTetos(d) + ', como no planejamento.'));
  },

  /** A base dos tetos em palavras, com o % das cotas (quem não é gestor pode não saber o que é a "venda conservadora"). */
  baseTetos(d) {
    const b = d.base, valor = F.moeda(b.valor, { compacto: true });
    return b.a + (b.tipo === 'pct' || !d.vendas.vendaMaxima ? ' (' + valor + ')' : ' (' + F.pct(b.pct) + ' das cotas, ' + valor + ')');
  },

  editarOrcamento(d, ctx) {
    const cat = App.sessao.listas.cat;
    const atual = {};
    (d.orcamento.cadastro || []).forEach((l) => { atual[l.categoria] = l; });
    const linha = (categoria) => atual[categoria] || {};
    const form = h('form.form', { onsubmit: (ev) => ev.preventDefault() },
      h('.grade.duas',
        Comp.campo({ rotulo: cat.dinamicas, nome: 'din_valor', tipo: 'moeda', valor: linha(cat.dinamicas).valor, dica: 'Prêmios das dinâmicas (sem o IR).' }),
        Comp.campo({ rotulo: 'Dos quais com IR recolhido', nome: 'din_comIr', tipo: 'moeda', valor: linha(cat.dinamicas).comIr, dica: 'O app soma o IR sobre esta parte.' }),
        Comp.campo({ rotulo: cat.midia, nome: 'midia', tipo: 'moeda', valor: linha(cat.midia).valor }),
        Comp.campo({ rotulo: cat.comissoes, nome: 'comissoes', tipo: 'pct', valor: linha(cat.comissoes).pctVenda, dica: '% médio sobre a venda (cada link tem o seu).' }),
        Comp.campo({ rotulo: cat.logistica, nome: 'logistica', tipo: 'moeda', valor: linha(cat.logistica).valor }),
        Comp.campo({ rotulo: cat.outros, nome: 'outros', tipo: 'moeda', valor: linha(cat.outros).valor })),
      h('p.suave.pequeno', 'Prêmio principal, IR, LOTEP e plataforma vêm da campanha e dos parâmetros, não daqui.'));
    const erro = h('div');
    const salvar = h('button.btn.primario', { type: 'button' }, 'Salvar orçamento');
    const f = Comp.folha({ titulo: 'Orçamento de ' + d.campanha.nome, corpo: [erro, form],
      rodape: [h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Voltar'), salvar] });
    salvar.addEventListener('click', async () => {
      const v = Comp.lerForm(form);
      const obs = (c) => linha(c).obs || '';
      const linhas = [
        { categoria: cat.dinamicas, valor: v.din_valor, comIr: v.din_comIr, obs: obs(cat.dinamicas) },
        { categoria: cat.midia, valor: v.midia, obs: obs(cat.midia) },
        { categoria: cat.logistica, valor: v.logistica, obs: obs(cat.logistica) },
        { categoria: cat.outros, valor: v.outros, obs: obs(cat.outros) },
        // O campo mostra "5" para 5%: vai com o símbolo para o servidor ler como percentual.
        { categoria: cat.comissoes, pctVenda: v.comissoes === '' ? 0 : /%/.test(v.comissoes) ? v.comissoes : v.comissoes + '%', obs: obs(cat.comissoes) }
      ];
      const r = await App.executar('campanhas.salvarOrcamento', { id: d.campanha.id, linhas: linhas }, { botao: salvar, erroEm: erro, sucesso: 'Orçamento salvo.' });
      if (r) { f.fechar(); ctx.recarregar(); }
    });
  },

  // ----- Relatório -----
  // O mesmo conteúdo do PDF para a Prime (Distribuicao.montarHtml): valores exatos, com centavos, e a Indião primeiro.
  async aba_relatorio(el, id, ctx) {

    }
    blocos.push(Cockpit.relDias(d));

    const texto = Comp.campo({ rotulo: 'O que aprendemos', nome: 'aprendizados', tipo: 'textarea', linhas: 5, valor: d.aprendizados,

      { botao: salvar, sucesso: 'Aprendizados salvos.' }));
    blocos.push(h('.cartao', h('h2', 'Aprendizados'), texto, App.pode('campanhas.salvarAprendizados') ? h('.acoes.fim', salvar) : null));

  relValor(v, op) { return h('span.num' + (Number(v) < -0.004 ? '.neg' : ''), F.moeda(v, op)); },

  /** Relatório: no celular, cada linha da tabela vira o nome e os valores lado a lado. */
  relCompacta(tabela) {
