  /** Relatório: a campanha em números (prêmio, datas, cotas, equilíbrio, pedidos não pagos). */
  relResumo(d) {
    const c = d.campanha, v = d.vendas, e = d.equilibrio, ex = v.expiracao || {};
    const fim = c.fim || c.sorteio;
    const vendas = d.pl.realizado[App.sessao.listas.cat.vendas] || 0;
    // Encerrada: o equilíbrio com os custos realizados, o mesmo do cockpit e do Financeiro.
    const real = c.status === 'Encerrada' && !F.vazio(e.realizado);
    const eq = real ? e.realizado : e.projetado;
    const pctEq = real ? (v.vendaMaxima ? eq / v.vendaMaxima : 0) : e.pctProjetado;
    const linhas = [
      h('dt', 'Prêmio principal'), h('dd', c.premio || '–'),
      h('dt', 'Período de vendas'), h('dd', lerData(c.inicio) && lerData(fim) ? F.data(c.inicio) + ' a ' + F.data(fim) : '–'),
      h('dt', 'Sorteio'), h('dd', F.data(c.sorteio), c.concurso ? [' ', h('span.num', '(concurso ' + c.concurso + ')')] : null),
      h('dt', 'Cotas vendidas'), h('dd', F.int(v.cotasVendidas) + ' de ' + F.int(c.totalCotas) + ' ', h('span.num', '(' + F.pct(v.pctVendido) + ')'))
    ];
    if (!(d.serie || []).length && vendas > 0.005) linhas.push(h('dd.nota', 'Vendas diárias não disponíveis: a campanha tem só o total vendido.'));
    linhas.push(h('dt', 'Ponto de equilíbrio'), h('dd', F.moeda(eq) + ' ', h('span.num', '(' + F.pct(pctEq) + ' das cotas)')));
    // Sem pedidos expirados importados, 0% seria uma informação falsa.
    if (ex.tentativas) {
      linhas.push(h('dt', 'Expirados sem pagar'), h('dd', F.pct(ex.taxa) + ' (' + F.int(ex.expirados) + ' de ' + F.int(ex.tentativas) + ')'),
        h('dd.nota', 'Pedidos que expiraram sem pagamento. Venda perdida estimada: ' + F.moeda(ex.vendaNaMesa) + '.'));
    }
    // Rótulo na largura do texto e o valor quebra (no celular o rótulo não quebra palavra por palavra).
    return h('.cartao', h('h2', 'Resumo'), h('dl.valores', { style: { gridTemplateColumns: 'auto 1fr' } }, linhas));
  },

  /** Relatório de campanha no ar: do resultado até agora ao saldo projetado no fechamento, linha a linha. */
  relResultado(d) {
    const c = d.campanha, pl = d.pl, pr = d.projecao || {}, p = pr.ponte || {}, v = d.vendas;
    const vendas = pl.realizado[App.sessao.listas.cat.vendas] || 0;
    const zero = (x) => Math.abs(Number(x) || 0) < 0.005;
    const fim = lerData(c.fim || c.sorteio);
    const completos = (d.serie || []).filter((x) => chaveDia(x.dia) < chaveDia(App.hoje())).length;
    const ritmo = pr.base === 'orcada' ? 'Sem vendas ainda: a conta usa a venda conservadora do orçamento.'
      : F.vazio(v.media3) ? 'Ainda sem um dia de venda completo: a conta usa só o que já foi vendido.'
        : 'No ritmo ' + (completos >= 3 ? 'dos últimos 3 dias' : 'dos dias já completos') + ': ' + F.moeda(v.media3) + ' por dia.';
    const linhas = [
      h('dt', 'Vendas recebidas'), h('dd', F.moeda(vendas)),
      h('dt', 'Custos pagos'), h('dd', F.moeda(pl.resultado - vendas)),
      h('dt.total', 'Resultado até agora'), h('dd.total', Cockpit.relValor(pl.resultado)),
      h('dd.nota', 'Recebido e pago até ' + F.data(d.posicaoEm) + '.')
    ];
    if (!zero(pl.totalComprometido)) {
      linhas.push(h('dt', 'Contas a pagar já lançadas'), h('dd', F.moeda(-pl.totalComprometido)),
        h('dt.total', 'Resultado com o que falta pagar'), h('dd.total', Cockpit.relValor(pl.resultadoComComprometidos)));
    }
    if (!zero(p.vendasPrevistas)) linhas.push(h('dt', 'Vendas previstas' + (fim ? ' até ' + F.dataCurta(fim) : '')), h('dd', F.moeda(p.vendasPrevistas, { sinal: true })), h('dd.nota', ritmo));
    if (!zero(p.taxasPrevistas)) {
      linhas.push(h('dt', zero(p.vendasPrevistas) ? 'Taxas e comissões que faltam lançar' : 'Taxas e comissões sobre as vendas previstas'), h('dd', F.moeda(-p.taxasPrevistas)));
    }
    if (!zero(p.custosAinda)) linhas.push(h('dt', 'Custos por vir'), h('dd', F.moeda(-p.custosAinda)), h('dd.nota', 'Orçados e ainda não lançados.'));
    linhas.push(h('dt.destaque', 'Saldo projetado no fechamento'), h('dd.destaque', Cockpit.relValor(pr.resultado)),
      h('dd.nota', 'Com a venda projetada de ' + F.moeda(pr.vendaProjetada) + (v.vendaMaxima ? ' (' + F.pct(pr.vendaProjetada / v.vendaMaxima) + ' das cotas)' : '') + '.'));
    return h('.cartao', h('h2', 'Resultado'), h('dl.valores', linhas));
  },

  /** Relatório de campanha encerrada: o fechamento com os valores exatos. */
  relFechamento(d) {
    const pl = d.pl;
    const vendas = pl.realizado[App.sessao.listas.cat.vendas] || 0;
    return h('.cartao', h('h2', 'Fechamento'), h('dl.valores',
      h('dt', 'Vendas recebidas'), h('dd', F.moeda(vendas)),
      h('dt', 'Custos'), h('dd', F.moeda(pl.resultadoComComprometidos - vendas)),
      pl.totalComprometido > 0.005 ? h('dd.nota', 'Inclui ' + F.moeda(pl.totalComprometido) + ' que ainda falta pagar.') : null,
      h('dt.destaque', 'Resultado final'), h('dd.destaque', Cockpit.relValor(pl.resultadoComComprometidos))));
  },

  /**
   * Relatório: orçado x realizado, a receita e os custos em quadros com as mesmas colunas (alinhadas no computador), com o
   * total dos custos e sem linhas zeradas. Com a campanha no ar, a última coluna é o que ainda resta do orçado e o que falta
   * vender, não um ganho: o que sobra hoje ainda vai ser gasto. Encerrada, é a diferença, + favorável e − desfavorável.
   */
  relOrcamento(d) {
    const cat = App.sessao.listas.cat;
    const encerrada = d.campanha.status === 'Encerrada';
    const zero = (x) => Math.abs(Number(x) || 0) < 0.005;
    const receita = d.orcamento.filter((l) => l.categoria === cat.vendas);
    const custos = d.orcamento.filter((l) => l.categoria !== cat.vendas && !(zero(l.orcado) && zero(l.pago) && zero(l.comprometido)));
    const aPagar = custos.some((l) => !zero(l.comprometido));
    const soma = (k) => custos.reduce((s, l) => s + (Number(l[k]) || 0), 0);
    // A linha da soma tem marca própria: as linhas do servidor já trazem um campo "total" (o valor da categoria).
    const total = { categoria: 'Total dos custos', orcado: soma('orcado'), pago: soma('pago'), comprometido: soma('comprometido'), diferenca: soma('diferenca'), ehTotal: true };
    const nome = (l) => l.ehTotal ? h('strong', l.categoria) : [l.categoria, l.observacao ? h('div.suave.pequeno', l.observacao) : null];
    const valor = (x) => zero(x) ? '–' : h('span.num', F.moeda(x));
    const orcado = { titulo: 'Orçado', dir: true, valor: (l) => h('span.num', F.moeda(l.orcado)) };
    const dif = { titulo: 'Diferença', dir: true, valor: (l) => F.vazio(l.diferenca) ? '–' : Cockpit.relValor(l.diferenca, { sinal: true }) };
    const disponivel = { titulo: 'Disponível', dir: true, valor: (l) => F.vazio(l.diferenca) ? '–' : Cockpit.relValor(l.diferenca) };
    const faltaVender = { titulo: 'Falta vender', dir: true, valor: (l) => {
      const f = (Number(l.orcado) || 0) - (Number(l.pago) || 0);
      return f > 0.005 ? h('span.num', F.moeda(f)) : 'já superou';
    } };
    const alinhar = (t) => { const x = Cockpit.relCompacta(t); const tb = x.querySelector('table'); if (tb) tb.classList.add('alinhada'); return x; };
    return h('.cartao', h('h2', 'Orçado x realizado'),
      receita.length ? alinhar(Comp.tabela([
        { titulo: 'Receita', valor: nome }, orcado,
        { titulo: 'Recebido', dir: true, valor: (l) => h('span.num', F.moeda(l.pago)) },
        aPagar ? { titulo: '', dir: true, valor: () => '–' } : null,
        encerrada ? dif : faltaVender
      ].filter(Boolean), receita)) : null,
      alinhar(Comp.tabela([
        { titulo: 'Custos', valor: nome }, orcado,
        { titulo: 'Pago', dir: true, valor: (l) => valor(l.pago) },
        aPagar ? { titulo: 'A pagar', dir: true, valor: (l) => valor(l.comprometido) } : null,
        encerrada ? dif : disponivel
      ].filter(Boolean), custos.concat([total]), { classeLinha: (l) => l.ehTotal ? 'total' : '' })),
      h('p.suave.pequeno', { style: { margin: 0 } }, encerrada
        ? 'Diferença: + favorável (vendeu mais ou gastou menos que o orçado); − desfavorável, em vermelho.'
        : 'Disponível: o orçado menos o pago e o a pagar; negativo, em vermelho, já passou do orçado. Falta vender: o que falta para chegar à venda orçada.'));
  },

  /**
   * Relatório: um quadro só por dia, para os dias que já terminaram e tiveram dinâmica, disparo ou mensagem:
   * a venda do dia contra a média dos 3 dias anteriores e se o custo da dinâmica foi coberto.
   */
  relDias(d) {
    const hojeK = chaveDia(App.hoje());
    const fator = (d.parametros && d.parametros.vendaExtraPorReal) || d.equilibrio.vendaExtraPorReal || 1;
    const porDia = {};
    const dia = (v) => {
      const k = chaveDia(v);
      if (!k || k >= hojeK) return null;
      porDia[k] = porDia[k] || { dia: k, itens: [], custo: 0, adicional: null, venda: null, din: [] };
      return porDia[k];
    };
    (d.dinamicas || []).filter((x) => ['Aprovada', 'Ativa', 'Encerrada'].indexOf(x.status) >= 0).forEach((x) => {
      const r = dia(x.inicio);
      if (!r) return;
      // O custo fica só na coluna Custo.
      r.itens.push(x.nome + ' às ' + F.hora(x.inicio));
      r.custo += Number(x.custo) || 0;
      r.din.push(x);
    });
    const serie = {};
    (d.serie || []).forEach((s) => {
      serie[chaveDia(s.dia)] = s;
      (s.disparos || []).forEach((x) => { const r = dia(s.dia); if (r) r.itens.push(F.disparo(x) + ' (ver Links de venda)'); });
    });
    (d.mensagens || []).forEach((m) => {
      const r = dia(m.dia);
      if (!r) return;
      if (m.enviadas > 0) r.itens.push(F.plural(m.enviadas, 'mensagem enviada', 'mensagens enviadas'));
      if (!F.vazio(m.adicional)) r.adicional = Number(m.adicional);
      if (!F.vazio(m.venda)) r.venda = Number(m.venda);
    });
    const linhas = Object.keys(porDia).sort().map((k) => porDia[k]).filter((r) => r.itens.length);
    if (!linhas.length) return null;
    linhas.forEach((r) => {
      if (serie[r.dia]) r.venda = Number(serie[r.dia].faturamento);
      if (r.venda === null && r.din.length === 1 && !F.vazio(r.din[0].vendaPeriodo)) r.venda = Number(r.din[0].vendaPeriodo);
      if (r.adicional === null && r.din.length === 1 && !F.vazio(r.din[0].vendaAdicional)) r.adicional = Number(r.din[0].vendaAdicional);
    });
    return h('.cartao', h('h2', 'Dinâmicas, disparos e mensagens por dia'), Cockpit.relCompacta(Comp.tabela([
      { titulo: 'Dia', valor: (r) => [h('div', F.diaSemana(r.dia) + ' ' + F.dataCurta(r.dia)), r.itens.map((t) => h('div.suave.pequeno', t))] },
      { titulo: 'Venda do dia', dir: true, valor: (r) => r.venda === null ? '–' : h('span.num', F.moeda(r.venda)) },
      { titulo: 'Diferença para a média', dir: true, valor: (r) => r.adicional === null ? '–' : Cockpit.relValor(r.adicional, { sinal: true }) },
      { titulo: 'Custo', dir: true, valor: (r) => r.custo > 0 ? h('span.num', F.moeda(r.custo)) : '–' },
      { titulo: 'Cobriu o custo?', dir: true, valor: (r) => r.custo > 0 && r.adicional !== null
        ? h('span.chip.' + (r.adicional >= r.custo * fator ? 'verde' : 'vermelho'), r.adicional >= r.custo * fator ? 'Sim' : 'Não') : '–' }
    ], linhas)), h('p.suave.pequeno', { style: { margin: 0 } }, 'Diferença para a média: a venda do dia menos a média dos dias anteriores (até 3). ' +
      'Cobriu o custo: a venda acima da média pagou o custo da dinâmica e as taxas sobre essa venda.'));
  },

  /**
   * Relatório: a conta do acerto (3.3.1), a mesma do PDF (Distribuicao.linhasConta): a devolução do que a parte pagou, menos
   * o que recebeu, mais a parte no resultado (e os repasses já feitos), dando o acerto. Com a campanha no
   * ar, é só uma posição do caixa. O mesmo acerto custo a custo e quem pagou cada custo ficam recolhidos no fim do cartão.
   */
  relPartes(d) {
    const p = d.posicao, partes = App.sessao.partes, encerrada = d.campanha.status === 'Encerrada';
    const div = Math.round((Number(p.pctIndiao) || 0) * 100) + '/' + Math.round((Number(p.pctPrime) || 0) * 100);
    const s = Number(p.saldoIndiao) || 0, quites = Math.abs(s) < 0.005;
    const deve = s > 0 ? partes.prime : partes.indiao, recebe = s > 0 ? partes.indiao : partes.prime;
    const frase = encerrada
      ? [h('strong', 'Acerto da campanha: '), quites ? 'as partes estão quites.' : 'a ' + deve + ' deve ' + F.moeda(Math.abs(s)) + ' à ' + recebe + '.']
      : [h('strong', 'Posição parcial em ' + F.data(d.posicaoEm) + ' (só o caixa): '),
        (quites ? 'hoje as partes estariam quites.' : 'hoje a ' + deve + ' teria ' + F.moeda(Math.abs(s)) + ' a repassar à ' + recebe + '.') +
        ' O acerto final é feito no encerramento' + (d.aPagar > 0.005 ? ', depois de pagos os ' + F.moeda(d.aPagar) + ' que ainda faltam.' : '.')];
    const acerto = (v) => Math.abs(v) < 0.005 ? 'quite' : (v > 0 ? 'a receber ' : 'a pagar ') + F.moeda(Math.abs(v));
    // Cada linha com o sinal do que faz no acerto; a parte no resultado em vermelho quando é prejuízo.
    const valor = (x, v) => x.chave === 'parte' ? Cockpit.relValor(v) : Math.abs(v) < 0.005 ? '–' : h('span.num', (v > 0 ? '+' : '') + F.moeda(v));
    const linhas = (d.conta || []).concat([{ fim: true, rotulo: encerrada ? 'Acerto' : 'Acerto se fosse hoje',
      indiao: Number(p.saldoIndiao) || 0, prime: Number(p.saldoPrime) || 0 }]);
    return h('.cartao', h('h2', encerrada ? 'Acerto entre as partes' : 'Posição entre as partes'),
      h('p', { style: { margin: 0 } }, frase),
      encerrada && p.resultado < -0.005 ? h('p', { style: { margin: 0 } }, 'Houve prejuízo de ' + F.moeda(-p.resultado) + ': não há lucro para dividir. O prejuízo fica ' +
        F.pct(p.pctIndiao, 0) + ' com a ' + partes.indiao + ' e ' + F.pct(p.pctPrime, 0) + ' com a ' + partes.prime + '.') : null,
      encerrada && d.aPagar > 0.005 ? h('p', { style: { margin: 0 } }, 'Faltam pagar ' + F.moeda(d.aPagar) + ' de custos: o acerto muda quando forem pagos.') : null,
      Comp.tabela([
        { titulo: 'Conta do acerto', valor: (x) => x.fim ? h('strong', x.rotulo) : h('div', h('div', x.rotulo), h('.suave.pequeno', x.nota)) },
        { titulo: partes.indiao + ' (' + F.pct(p.pctIndiao, 0) + ')', dir: true, valor: (x) => x.fim ? h('strong.num', acerto(x.indiao)) : valor(x, x.indiao) },
        { titulo: partes.prime + ' (' + F.pct(p.pctPrime, 0) + ')', dir: true, valor: (x) => x.fim ? h('strong.num', acerto(x.prime)) : valor(x, x.prime) }
      ], linhas, { classeLinha: (x) => x.fim ? 'total' : '' }),
      // A mesma nota do PDF (Distribuicao.notaConta).
      h('p.suave.pequeno', { style: { margin: 0 } }, 'O acerto é feito no fim da apuração: cada parte recebe de volta o que pagou (custos e aportes), desconta o dinheiro da ' +
        'campanha que já está com ela e fica com a sua parte do resultado (as vendas menos todos os custos). Como os custos saem do ' +
        'resultado antes da divisão, cada parte acaba arcando com a sua parte de cada custo (' + div + '), seja quem for que pagou. O quadro ' +
        '"Quem custeou e quanto cabia a cada parte", logo abaixo, faz a conta custo a custo, pelos ' + div + ', e chega no mesmo acerto.'),
      Cockpit.relCusteio(d), Cockpit.relQuemPagou(d.custosPorParte));
  },

  /**
   * "Quem custeou e quanto cabia a cada parte" (3.2.8): o mesmo quadro do PDF da Prime (Distribuicao.custeioHtml). Desde a 3.3.1
   * fica recolhido no cartão do acerto, como a conta custo a custo.
   */
  relCusteio(d) {
    const cu = d.custeio, partes = App.sessao.partes, encerrada = d.campanha.status === 'Encerrada';
    if (!cu || (!cu.custos.length && !cu.entradas.length)) return null;
    const zero = (v) => Math.abs(Number(v) || 0) < 0.005;
    const favor = (v) => zero(v) ? '–' : h('div', h('span.num', F.moeda(Math.abs(v))), h('.suave.pequeno', 'a favor da ' + (v > 0 ? partes.indiao : partes.prime)));
    const parte = (x, feito, deve, verbo) => {
      if (x.aporte) return zero(feito) ? '–' : h('span.num', (feito > 0 ? 'aportou ' : 'recebeu ') + F.moeda(Math.abs(feito)));
      return h('div', h('div.num', verbo + ' ' + F.moeda(feito)), h('.suave.pequeno.num', 'deveria ' + F.moeda(deve)));
    };
    const tabela = (primeira, lista, total, rotuloTotal, verbo) => {
      const linhas = [];
      let grupo = null;
      lista.forEach((x) => {
        if (x.grupo && x.grupo !== grupo) { grupo = x.grupo; linhas.push({ titulo: grupo }); }
        linhas.push(x);
      });
      linhas.push(Object.assign({ fim: true, rotulo: rotuloTotal }, total));
      // Alinhada: os dois quadros com as colunas no mesmo lugar, como receita e custos do orçado x realizado.
      const t = Comp.tabela([
        { titulo: primeira, valor: (x) => x.titulo ? h('strong', x.titulo) : x.fim ? h('strong', x.rotulo) : h('div', h('div', x.rotulo), x.nota ? h('.suave.pequeno', x.nota) : null) },
        { titulo: 'Total', dir: true, valor: (x) => x.titulo ? '' : x.aporte ? '–' : h('span.num', F.moeda(x.total)) },
        { titulo: partes.indiao + ' (' + F.pct(cu.pctIndiao, 0) + ')', dir: true, valor: (x) => x.titulo ? '' : parte(x, x.indiao, x.deveIndiao, verbo) },
        { titulo: partes.prime + ' (' + F.pct(cu.pctPrime, 0) + ')', dir: true, valor: (x) => x.titulo ? '' : parte(x, x.prime, x.devePrime, verbo) },
        { titulo: 'Diferença', dir: true, valor: (x) => x.titulo ? '' : favor(x.diferenca) }
      ], linhas, { classeLinha: (x) => x.titulo ? 'grupo' : x.fim ? 'total' : '' });
      t.querySelector('table').classList.add('alinhada');
      return t;
    };
    const fecha = [{ rotulo: 'Diferença nos custos', v: cu.totalCustos.diferenca }, { rotulo: 'Diferença nas vendas e créditos', v: cu.totalEntradas.diferenca }];
    if (!zero(cu.repasses)) {
      fecha.push({ rotulo: 'Repasses e abatimentos já feitos', nota: 'a ' + partes.indiao + (cu.repasses > 0 ? ' já recebeu ' : ' já pagou ') + F.moeda(Math.abs(cu.repasses)),
        v: -cu.repasses });
    }
    fecha.push({ rotulo: encerrada ? 'Acerto' : 'Acerto se fosse hoje', v: cu.acerto, fim: true });
    return h('details.recolher', h('summary', 'Quem custeou e quanto cabia a cada parte'),
      // A mesma abertura do PDF (Distribuicao.notaCusteio).
      h('p', { style: { margin: 0 } }, 'A conta do acerto entre as partes, custo a custo. Pela participação (' + partes.indiao + ' ' + F.pct(cu.pctIndiao, 0) +
        ', ' + partes.prime + ' ' + F.pct(cu.pctPrime, 0) + '), cabe a cada parte essa porcentagem de cada custo e das vendas; a diferença entre o que ' +
        'ela pagou ou recebeu e o que cabia a ela forma o acerto.' + (encerrada ? '' : ' Com a campanha no ar, entra só o que já foi pago ou recebido.')),
      // Os subtítulos separam os quadros no celular, onde o cabeçalho da tabela some.
      cu.custos.length ? [h('h3.subtitulo', 'Custos'), tabela('Custo', cu.custos, cu.totalCustos, 'Total dos custos', 'pagou')] : null,
      cu.entradas.length ? [h('h3.subtitulo', 'Vendas e créditos'), tabela('Entrada', cu.entradas, cu.totalEntradas, 'Total recebido', 'recebeu')] : null,
      h('h3.subtitulo', 'Como fecha o acerto'),
      Comp.tabela([
        { titulo: 'Item', valor: (x) => x.fim ? h('strong', x.rotulo) : h('div', h('div', x.rotulo), x.nota ? h('.suave.pequeno', x.nota) : null) },
        { titulo: 'Valor', dir: true, valor: (x) => x.fim && zero(x.v) ? 'quites' : favor(x.v) }
      ], fecha, { classeLinha: (x) => x.fim ? 'total' : '', empilha: false }),
      // A mesma nota do PDF (Distribuicao.NOTA_CUSTEIO).
      h('p.suave.pequeno', { style: { margin: 0 } }, 'Deveria: o total da linha vezes a participação da parte. Diferença: o que a parte pagou a mais, ' +
        'ou recebeu a menos, do que cabia a ela. O aporte conta para quem aportou. O acerto é o mesmo da conta acima.'));
  },

  /** "Quem pagou cada custo" (3.2.7): o mesmo quadro do PDF da Prime, recolhido. */
  relQuemPagou(cp) {
    if (!cp || !(cp.linhas || []).length) return null;
    const partes = App.sessao.partes;
    const valor = (v) => Math.abs(v) < 0.005 ? '–' : h('span.num' + (v < 0 ? '.neg' : ''), F.moeda(v));
    const total = { rotulo: 'Total pago', indiao: cp.indiao, prime: cp.prime, fim: true };
    return h('details.recolher', h('summary', 'Quem pagou cada custo'),
      Comp.tabela([
        { titulo: 'Custo', valor: (x) => x.fim ? h('strong', x.rotulo) : h('div', h('div', x.rotulo), h('.suave.pequeno', x.nota)) },

/* =====================================================================
   Calendário: agenda do influenciador + dinâmicas + sugestões + disparos

App.telas.calendario = {
  area: 'calendario',
  titulo: 'Calendário',
  pode: () => App.pode('agenda.periodo'),
  async render(ctx) {
    ctx.topo({ titulo: 'Calendário' });

const TelaCalendario = {
  /** op: { ctx, campanha, livre (pode trocar a campanha) } */
  async montar(el, op) {
    const ctx = op.ctx;
    const computador = window.matchMedia('(min-width: 900px)').matches;
    const estado = {
      campanha: op.campanha || '',
      modo: ctx.query.modo || (computador ? 'grade' : 'lista'),
      de: null
    };
    estado.de = TelaCalendario.inicioPadrao(estado.modo, ctx.query.de);
    const barra = h('.acoes.entre');
    const legenda = h('.legenda');
    const desenharLegenda = () => {
      const gestor = App.pode('dinamicas.aceitar');
      const item = (estilo, texto) => h('span', h('i', { style: estilo }), texto);
      trocar(legenda, [
        item({ background: 'var(--borda-forte)' }, 'agenda do influenciador'),
        item({ background: 'var(--sucesso)' }, 'dinâmica aprovada'),
        gestor ? item({ background: 'var(--alerta)' }, 'sugestão') : null,
        // Na lista o aviso vem escrito no item; na grade é só a borda vermelha.
        gestor && estado.modo === 'grade' ? item({ background: 'var(--superficie)', border: '1.5px solid var(--perigo)' }, 'sugestão acima do orçamento') : null,
        item({ background: 'var(--info)' }, 'disparo'),
        item({ background: 'var(--roxo)' }, 'marco e data comercial')]);
    };
    const corpo = h('div', Comp.esqueleto(3));
    const avisos = h('div');
    trocar(el, [barra, avisos, corpo, legenda]);

    const carregar = async () => {
      const dias = estado.modo === 'grade' ? 14 : 14;
      const ate = somarDias(estado.de, dias - 1);
      desenharBarra(ate);
      corpo.style.opacity = '.55';
      let r;
      try {
        r = await App.ler('agenda.periodo', { de: chaveDia(estado.de), ate: chaveDia(ate), campanha: estado.campanha || undefined }, 30);
      } catch (e) {
        if (ctx.ativo()) trocar(corpo, Comp.falha(e, carregar));
        corpo.style.opacity = '';
        return;
      }
      if (!ctx.ativo()) return;
      corpo.style.opacity = '';
      trocar(avisos, (r.avisos || []).map((a) => Comp.aviso('alerta', a)));
      const aoMudar = () => { App.esquecer(); carregar(); };
      // O nome da campanha só vai em cada item quando há mais de uma para confundir.
      const emVista = new Set();
      (r.dias || []).forEach((d) => (d.itens || []).forEach((it) => { if (it.campanha) emVista.add(it.campanha); }));
      const ativas = (App.sessao.campanhas || []).filter((c) => c.status === 'Ativa').length;
      const mostrarCampanha = !estado.campanha && (emVista.size > 1 || ativas > 1);
      desenharLegenda();
      if (estado.modo === 'grade') trocar(corpo, TelaCalendario.grade(r.dias, { aoMudar: aoMudar, mostrarCampanha: mostrarCampanha }));

    };

    const desenharBarra = (ate) => {
      const passo = 14;
      const nav = h('.acoes',
        h('button.btn.icone', { type: 'button', 'aria-label': 'Período anterior', title: 'Período anterior', onclick: () => { estado.de = somarDias(estado.de, -passo); carregar(); } }, icone('voltar')),
        h('button.btn', { type: 'button', onclick: () => { estado.de = TelaCalendario.inicioPadrao(estado.modo); carregar(); } }, 'Hoje'),
        h('button.btn.icone', { type: 'button', 'aria-label': 'Próximo período', title: 'Próximo período', onclick: () => { estado.de = somarDias(estado.de, passo); carregar(); } }, icone('avancar')),
        h('span.suave.pequeno', F.periodo(estado.de, ate)));
      const direita = [];
      if (op.livre) {
        const sel = h('select', { 'aria-label': 'Campanha', style: { minHeight: '40px', borderRadius: 'var(--raio-p)', border: '1px solid var(--borda-forte)', padding: '0 10px', background: 'var(--superficie)' },
          onchange: () => { estado.campanha = sel.value; carregar(); } },
          h('option', { value: '' }, 'Todas as campanhas'),
          (App.sessao.campanhas || []).filter((c) => c.status !== 'Encerrada' || c.id === estado.campanha)
            .map((c) => h('option', { value: c.id, selected: c.id === estado.campanha }, c.nome)));
        direita.push(sel);
      }
      if (computador) {
        direita.push(h('.segmentado', { role: 'group', 'aria-label': 'Visualização' },
          [['lista', 'Lista'], ['grade', 'Grade']].map((m) => h('button', { type: 'button', 'aria-pressed': String(estado.modo === m[0]),
            onclick: () => { estado.modo = m[0]; estado.de = TelaCalendario.inicioPadrao(m[0]); carregar(); } }, m[1]))));
      }
      const camp = estado.campanha ? App.campanha(estado.campanha) : null;
      if (App.pode('dinamicas.gerarSugestoes') && camp && camp.status === 'Ativa') {
        const b = h('button.btn', { type: 'button', onclick: async () => {
          const r = await App.executar('dinamicas.gerarSugestoes', { campanha: camp.id }, { botao: b,
            sucesso: (x) => F.plural(x.sugestoes, 'sugestão', 'sugestões') + ' para os próximos 7 dias (' + F.plural(x.novas, 'nova', 'novas') + ').' });
          if (r) carregar();
        } }, icone('atualizar'), 'Atualizar sugestões');
        direita.push(b);
      }
      trocar(barra, [nav, h('.acoes', direita)]);
    };

    await carregar();
  },

  /** Lista começa hoje; a grade começa na segunda-feira desta semana. */
  inicioPadrao(modo, de) {
    const base = lerData(de) || App.hoje();
    return modo === 'grade' ? inicioDaSemana(base) : inicioDoDia(base);
  },

  /** Grade de semanas (computador). */
  grade(dias, op) {
    const nomes = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'];
    const celulas = dias.map((d) => {
      const data = lerData(d.dia);
      const hoje = mesmoDia(data, App.hoje());
      const passado = data < App.hoje();
      const datas = [];
      if (d.feriado) datas.push('Feriado');
      (d.datas || []).forEach((x) => { if (datas.indexOf(x) < 0) datas.push(x); });
      return h('.celula' + (hoje ? '.hoje' : '') + (passado ? '.fora' : ''),
        h('.cab', h('span', nomes[(data.getDay() + 6) % 7]), h('span.n', String(data.getDate()) + (data.getDate() === 1 ? ' ' + MESES[data.getMonth()] : ''))),
        datas.length ? h('.datas-dia', datas.join(' · ')) : null,
        (d.itens || []).map((it) => TelaCalendario.bloco(it, op)));
    });
    return h('.semana', celulas);
  },

  bloco(it, op) {
    const hora = it.hora ? F.hora(it.hora) + ' ' : '';
    const temCusto = Number(it.custo) > 0.004;
    let texto;
    if (it.tipo === 'agenda') texto = hora + it.titulo;
    else if (it.tipo === 'sugestao' || it.tipo === 'dinamica') texto = hora + it.nome;
    else if (it.tipo === 'disparo') texto = hora + F.disparo(it);
    else texto = it.titulo;
    // Custo, presença e campanha ficam em linhas próprias: o nome comprido não corta nenhuma delas.
    const meta = [];
    if (it.tipo === 'sugestao') meta.push(temCusto ? F.moeda(it.custo, { compacto: true }) : 'sem custo');
    if (it.tipo === 'sugestao' && it.foraRegulamento) meta.push('fora do regulamento');
    if (it.presenca) meta.push(Blocos.textoPresenca(it.presenca));
    if (op.mostrarCampanha && it.campanhaNome && it.tipo !== 'agenda') meta.push(it.campanhaNome);
    const clicavel = (it.tipo === 'sugestao' || it.tipo === 'dinamica') && App.pode('dinamicas.listar');
    // O aviso de orçamento é para quem decide (no Hoje e na lista vale o mesmo). A borda vermelha é da sugestão, que ainda
    // pede decisão; a dinâmica aprovada acima do orçamento só diz isso na dica, como o chip cinza do cockpit.
    const acima = it.tipo === 'sugestao' && it.acimaOrcamento && App.pode('dinamicas.aceitar');
    const dica = [(it.tipo === 'sugestao' ? 'Sugestão: ' : '') + texto].concat(meta);
    if (it.tipo === 'sugestao' && temCusto && !F.vazio(it.saldoProjetadoAntes)) {
      dica.push('Custo ' + F.moeda(it.custo) + ' com IR', 'Saldo projetado da campanha ' + F.moeda(it.saldoProjetadoAntes) + ' → ' + F.moeda(it.saldoProjetadoDepois));
    }
    if (acima) dica.push('Acima do orçamento');
    else if (it.acimaOrcamento && App.pode('dinamicas.aceitar')) dica.push('Aprovada acima do orçamento');
    const abrir = () => Acoes.dinamica({ id: it.id, campanha: it.campanha, nome: it.nome }, { aoMudar: op.aoMudar });
    return h('.bloco.' + it.tipo + (acima ? '.acima' : ''), Object.assign({ title: dica.join('\n') }, clicavel ? {
      role: 'button', tabindex: '0', onclick: abrir,
      onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } }
    } : {}), h('span.t', texto), meta.map((m) => h('span.m', m)));
  }
};

  <script>
/* =====================================================================
   Mensagens do dia para grupos e comunidades do WhatsApp. Cada cartão é
   um texto e os grupos que o recebem; cada grupo tem Copiar, WhatsApp e
   Marcar enviada. O que falta enviar vem primeiro; enviadas e expiradas
   ficam recolhidas embaixo. Também é a aba Mensagens do cockpit (com a
   campanha fixa).
   ===================================================================== */

App.telas.mensagens = {
  area: 'mensagens',
  titulo: 'Mensagens',
  pode: () => App.pode('mensagens.dia'),
  async render(ctx) {
    ctx.topo({ titulo: 'Mensagens', config: true });
    await TelaMensagens.montar(ctx.corpo, { ctx: ctx, dia: ctx.query.dia, area: true });
  }
};

const TelaMensagens = {
  /** op: { ctx, campanha, dia, area } */
  async montar(el, op) {
    const ctx = op.ctx;
    const estado = { dia: inicioDoDia(op.dia) || App.hoje() };
    const barra = h('.acoes.entre');
    const alertas = h('div', { hidden: true });
    const resumo = h('div', { hidden: true });
    const corpo = h('div', Comp.esqueleto(3));
    const extra = h('div', { hidden: true });
    // Cópia de teste: quem envia as mensagens não tem a tela Hoje, então o roteiro de teste fica aqui.
    const roteiro = op.area && App.perfil() === 'Responsável pelos envios' ? Roteiro.cartao(ctx) : null;
    trocar(el, h('div.mensagens.pilha', roteiro, barra, alertas, resumo, corpo, extra));

    const carregar = async (dados) => {
      desenharBarra();
      let d = dados;
      if (!d) {
        corpo.style.opacity = '.55';
        try {
          d = await App.chamar('mensagens.dia', { dia: chaveDia(estado.dia), campanha: op.campanha || undefined });
        } catch (e) {
          corpo.style.opacity = '';
          if (ctx.ativo()) trocar(corpo, Comp.falha(e, () => carregar()));
          return;
        }
      }
      if (!ctx.ativo()) return;
      corpo.style.opacity = '';
      if (op.area && mesmoDia(estado.dia, App.hoje())) App.contador('mensagens', d.totais.pendentes);
      // Autorização vencendo: aviso para quem cuida dos documentos (as mensagens saem com o número dela).
      const avisosDocs = App.pode('legalizacao.listar') ? (d.alertas || []) : [];
      trocar(alertas, avisosDocs.map((a) => Comp.aviso('alerta', a.texto,
        h('div', { style: { marginTop: '8px' } }, h('a.btn.pequeno', { href: '#documentos?campanha=' + encodeURIComponent(a.campanha),
          onclick: App.cliqueNav('documentos?campanha=' + encodeURIComponent(a.campanha)) }, 'Abrir documentos')))));
      alertas.hidden = !avisosDocs.length;
      const placar = TelaMensagens.resumo(d, estado.dia);
      trocar(resumo, placar);
      resumo.hidden = !placar;
      if (!d.blocos.length) {
        trocar(corpo, h('.cartao', Comp.vazio('Nenhuma mensagem para ' + (mesmoDia(estado.dia, App.hoje()) ? 'hoje' : F.diaLongo(estado.dia)),
          podeGerar() ? 'A rotina prepara as mensagens todo dia de manhã. Se algo mudou (dinâmica nova, horário), prepare de novo.' : 'Este dia não tem mensagens.',
          podeGerar() ? botaoGerar() : null)));
      } else {
        // O que falta enviar vem primeiro; enviadas e expiradas (recolhidas) ficam embaixo.
        const aFazer = d.blocos.filter((bl) => !bl.expirada && bl.pendentes > 0);
        const resolvidas = d.blocos.filter((bl) => aFazer.indexOf(bl) < 0);
        // O nome da campanha só vai no cartão quando o dia tem mensagens de mais de uma.
        const variasCampanhas = !op.campanha && d.blocos.some((bl) => bl.campanha !== d.blocos[0].campanha);
        const lista = (bls) => h('.lista-msgs', { style: { marginTop: '12px' } }, bls.map((bl) => TelaMensagens.bloco(bl, d, {
          aoMudar: (novo) => carregar(novo), mostrarCampanha: variasCampanhas
        })));
        const secao = (titulo, bls) => h('section', h('.secao-titulo', h('h2', titulo), h('span.suave', F.plural(bls.length, 'mensagem', 'mensagens'))), lista(bls));
        trocar(corpo, h('div.pilha',
          aFazer.length ? (resolvidas.length ? secao('Para enviar', aFazer) : lista(aFazer)) : null,
          resolvidas.length ? secao(aFazer.length ? 'Enviadas e expiradas' : 'Já resolvidas', resolvidas) : null));
      }
      (d.avisos || []).forEach((a) => Comp.rapido(a, 'alerta', 9000));
      const fim = TelaMensagens.rodape(op, d, carregar);
      trocar(extra, fim);
      extra.hidden = !fim;
    };

    const podeGerar = () => {
      const dif = difDias(App.hoje(), estado.dia);
      return App.pode('mensagens.gerar') && App.ehGestor() && dif >= 0 && dif <= 7 && !op.campanha;
    };

    const gerar = async (botao) => {
      const r = await App.executar('mensagens.gerar', { dia: chaveDia(estado.dia) }, { botao: botao,
        sucesso: (x) => 'Mensagens refeitas: ' + F.plural(x.geradas.novas, 'nova', 'novas') + ', ' + F.plural(x.geradas.atualizadas, 'atualizada', 'atualizadas') + '.' });
      if (r) carregar(r);
    };
    const botaoGerar = () => {
      const b = h('button.btn.primario', { type: 'button', onclick: () => gerar(b) }, icone('atualizar'), 'Preparar as mensagens do dia');
      return b;
    };
    // Refazer apaga e remonta as pendentes: fica no menu, com confirmação.
    const refazer = async () => {
      const ok = await Comp.confirmar({ titulo: 'Refazer as mensagens', botao: 'Refazer',
        texto: 'Refazer as mensagens de ' + F.diaLongo(estado.dia) + '? As pendentes são montadas de novo com as dinâmicas, os horários e os links de agora. ' +
          'As enviadas, as editadas à mão e as que já passaram da hora ficam como estão.' });
      if (ok) await gerar(null);
    };

    const desenharBarra = () => {
      const nav = h('.acoes',
        h('button.btn.icone', { type: 'button', 'aria-label': 'Dia anterior', title: 'Dia anterior', onclick: () => { estado.dia = somarDias(estado.dia, -1); carregar(); } }, icone('voltar')),
        h('button.btn', { type: 'button', onclick: () => { estado.dia = App.hoje(); carregar(); } }, 'Hoje'),
        h('button.btn.icone', { type: 'button', 'aria-label': 'Próximo dia', title: 'Próximo dia', onclick: () => { estado.dia = somarDias(estado.dia, 1); carregar(); } }, icone('avancar')),
        h('span.forte', { style: { marginLeft: '4px' } }, F.diaLongo(estado.dia)));
      const menu = podeGerar() ? Comp.menu('Mensagens de ' + F.diaLongo(estado.dia), [
        { rotulo: 'Refazer as mensagens do dia', icone: 'atualizar', detalhe: 'As enviadas e as editadas ficam como estão.', acao: refazer }
      ]) : null;
      trocar(barra, [nav, menu]);
    };

    await carregar();
  },

  /** Placar do dia em envios (uma mensagem num grupo), com o número de mensagens quando é diferente. */
  resumo(d, dia) {
    const t = d.totais;
    if (!t.mensagens) return null;
    // As expiradas (anúncio de dinâmica que já começou) não contam: não há mais o que enviar.
    const total = t.mensagens - (t.expiradas || 0);
    const cartoes = (f) => d.blocos.filter(f).length;
    const emMensagens = (envios, msgs) => (msgs && msgs !== envios ? ' (' + F.plural(msgs, 'mensagem', 'mensagens') + ')' : '');
    const expiradas = cartoes((bl) => bl.expirada);
    let prazo = '';
    if (t.pendentes && mesmoDia(dia, App.hoje())) {
      const limite = new Date(App.hoje());
      limite.setHours(Number(d.janela.fim) || 0, 0, 0, 0);
      const falta = Math.round((limite - App.agora()) / 60000);
      prazo = falta > 0 ? ' (faltam ' + TelaMensagens.duracao(falta) + ')' : ' (o horário de hoje já acabou)';
    }
    const chips = [
      t.atrasadas ? h('span.chip.vermelho', F.plural(t.atrasadas, 'envio atrasado', 'envios atrasados') + emMensagens(t.atrasadas, cartoes((bl) => bl.atrasado))) : null,
      t.pendentes && !t.atrasadas ? h('span.chip.amarelo', F.plural(t.pendentes, 'envio pendente', 'envios pendentes') +
        emMensagens(t.pendentes, cartoes((bl) => !bl.expirada && bl.pendentes > 0))) : null,
      !t.pendentes && total ? h('span.chip.verde', 'Tudo enviado') : null,
      expiradas ? h('span.chip', F.plural(expiradas, 'mensagem expirada', 'mensagens expiradas')) : null
    ].filter(Boolean);
    return h('.cartao.compacto',
      h('strong', { style: { display: 'block', fontSize: '1.05rem' } }, F.int(t.enviadas) + ' de ' + F.plural(total, 'envio feito', 'envios feitos')),
      chips.length ? h('.chips', chips) : null,
      Comp.progresso({ valor: total ? t.enviadas / total : 0, cor: !t.pendentes ? 'verde' : '', rotulo: 'Envios feitos' }),
      h('p.suave.pequeno', { style: { marginBottom: 0 } }, 'Envios das ' + d.janela.inicio + 'h às ' + d.janela.fim + 'h' + prazo +
        ', no máximo ' + d.limitePorGrupo + ' por grupo por dia.'));
  },

  /** 90 -> "1h30"; 45 -> "45 min" */
  duracao(min) {
    const horas = Math.floor(min / 60), resto = min % 60;
    return horas ? horas + 'h' + (resto ? String(resto).padStart(2, '0') : '') : resto + ' min';
  },

  /** "VIP 1 e VIP 3"; com mais de três, "VIP 1, VIP 2 e mais 3 grupos". */
  nomesDosGrupos(envios) {
    // "VIP 3" não quebra entre o nome e o número.
    const nomes = envios.map((e) => String(e.grupo || '').replace(/ (\S{1,3})$/, ' $1'));
    if (nomes.length > 3) return nomes.slice(0, 2).join(', ') + ' e mais ' + F.plural(nomes.length - 2, 'grupo', 'grupos');
    return nomes.length > 1 ? nomes.slice(0, -1).join(', ') + ' e ' + nomes[nomes.length - 1] : nomes[0] || '';
  },

  /** "Enviada às 09:05 · por você" */
  enviadaEm(e) {
    const eu = App.sessao.usuario && App.sessao.usuario.nome;
    return 'Enviada às ' + F.horaMin(e.enviadoEm) + (e.responsavel ? ' · por ' + (e.responsavel === eu ? 'você' : e.responsavel) : '');
  },

  /**
   * Um texto e os grupos que recebem esse texto. Se só o link muda de um grupo para outro (mesmoTexto = false),
   * cada grupo copia o próprio texto. Enviada ou expirada, a mensagem fica recolhida: expirada tem "Já enviei".
   */
  bloco(bl, d, op) {

    const ids = pendentes.map((e) => e.id);
    const tudoEnviado = !pendentes.length;
    const umGrupo = bl.envios.length === 1;
    const porGrupo = !bl.mesmoTexto;
    const recolhida = tudoEnviado || bl.expirada;
    const gestor = App.ehGestor();

    // Na cópia de teste, o texto copiado (ou aberto no WhatsApp) sai com "🧪 TESTE" na frente.
    const copiarTexto = async (t, grupo) => {
      const ok = await Comp.copiar(App.marcarTeste(t));
      Comp.rapido(ok ? (App.emTeste() ? 'Texto de teste copiado, com 🧪 TESTE na frente. Cole numa conversa sua, não nos grupos.'
        : 'Texto ' + (porGrupo ? 'do grupo ' + grupo + ' ' : '') + 'copiado. Cole no grupo e marque como enviada.')
        : 'Não consegui copiar: segure o texto e copie à mão.', ok ? 'ok' : 'erro');
    };
    const marcar = async (lista, enviado, botao, sucesso) => {
      const r = await App.executar('mensagens.marcarEnviado', { ids: lista, enviado: enviado }, { botao: botao, sucesso: sucesso });
      if (r) op.aoMudar();
    };

    const chips = [];
    if (bl.expirada) chips.push(h('span.chip', 'Expirada'));
    else if (bl.atrasado) chips.push(h('span.chip.vermelho', 'Atrasada'));
    if (tudoEnviado) chips.push(h('span.chip.verde', umGrupo ? TelaMensagens.enviadaEm(bl.envios[0]) : 'Enviada nos ' + bl.envios.length + ' grupos'));
    else if (bl.enviados) chips.push(h('span.chip', bl.enviados + ' de ' + bl.envios.length + ' grupos enviados'));
    if (bl.editado) chips.push(h('span.chip', 'Texto editado'));

    const texto = porGrupo ? String(bl.texto || '').replace(/https?:\/\/\S+/g, '[link do grupo]') : bl.texto;
    const bolha = h('.bolha', texto);
    const longo = String(texto || '').split('\n').length > 9 || String(texto || '').length > 520;
    if (longo) bolha.classList.add('recolhida');
    const verTudo = longo ? h('button.btn.discreto.pequeno', { type: 'button', onclick: (ev) => {
      const fechado = bolha.classList.toggle('recolhida');
      ev.currentTarget.textContent = fechado ? 'Mostrar o texto todo' : 'Mostrar menos';
    } }, 'Mostrar o texto todo') : null;

    // Grupos: cada um com o próprio Copiar, WhatsApp e Marcar enviada (expirada não oferece copiar).
    const linhas = bl.envios.map((e) => {
      const enviado = e.status === 'Enviado';
      const textoDoGrupo = porGrupo ? e.texto : bl.texto;
      const membros = e.membros ? F.plural(e.membros, 'membro', 'membros') : null;
      // Com um grupo só, quem enviou e a hora já estão no selo do cartão.
      const quando = enviado && !umGrupo;
      const detalhe = enviado ? [quando ? TelaMensagens.enviadaEm(e) : membros]
        : [membros, gestor && e.semLinkProprio ? 'sem link próprio: vai o link geral da campanha' : null];
      let acoes;
      if (enviado) {
        const b = h('button.btn.pequeno.discreto', { type: 'button', 'aria-label': 'Voltar para pendente: ' + e.grupo, title: 'Voltar para pendente',
          onclick: () => marcar([e.id], false, b, 'Voltou para pendente.') }, 'Desfazer');
        acoes = [b];
      } else {
        const b = h('button.btn.pequeno', { type: 'button', 'aria-label': 'Marcar como enviada no grupo ' + e.grupo,
          onclick: () => marcar([e.id], true, b, 'Marcada como enviada no grupo ' + e.grupo + '.') }, 'Marcar enviada');
        acoes = bl.expirada ? [b] : [
          h('button.btn.pequeno', { type: 'button', 'aria-label': 'Copiar o texto para o grupo ' + e.grupo, onclick: () => copiarTexto(textoDoGrupo, e.grupo) }, 'Copiar'),
          h('a.btn.pequeno', { href: 'https://wa.me/?text=' + encodeURIComponent(App.marcarTeste(textoDoGrupo)), target: '_blank', rel: 'noopener',
            'aria-label': 'Abrir no WhatsApp o texto para o grupo ' + e.grupo, title: 'Abre o WhatsApp com o texto pronto: escolha o grupo ' + e.grupo + ' e envie.' }, 'WhatsApp'),
          b];
      }
      return h('.grupo-envio',
        h('.nome', h('div.forte', e.grupo), h('div.suave.pequeno' + (quando ? '.pos' : ''), detalhe.filter(Boolean).join(' · ') || ' ')),
        h('.acoes', acoes));
    });
    // Marcar todos fica no fim, depois dos grupos (primeiro envia, depois marca).
    let todos = null;
    if (!bl.expirada && pendentes.length > 1) {
      todos = h('button.btn', { type: 'button', onclick: () => marcar(ids, true, todos, 'Marcadas como enviadas.') }, icone('ok'),
        pendentes.length === bl.envios.length ? 'Marcar enviada nos ' + pendentes.length + ' grupos' : 'Marcar enviada nos ' + pendentes.length + ' que faltam');
    }
    const corpo = [
      bolha, verTudo,
      bl.tarde && !recolhida ? h('p.nota-msg', 'Como já passou da hora, o texto troca o “começou agora” por “ainda dá tempo”.') : null,
      h('div', h('p.onde-rotulo', 'Onde enviar' + (porGrupo ? ' · o link muda conforme o grupo' : '')), linhas),
      todos ? h('.acoes', todos) : null
    ];

    const passouDaHora = bl.previsto && lerData(bl.previsto) < App.agora() - 15 * 60000;
    const menu = Comp.menu(bl.momento, [
      { rotulo: 'Trocar o texto pela outra variação', icone: 'atualizar',
        oculto: tudoEnviado || bl.expirada || bl.editado || bl.evento || bl.tarde || passouDaHora || !App.pode('mensagens.trocarVariacao'),
        acao: async () => {
          const r = await App.executar('mensagens.trocarVariacao', { ids: ids }, { sucesso: 'Texto trocado.' });
          if (r) op.aoMudar(r);
        } },
      { rotulo: 'Editar o texto', icone: 'editar', oculto: tudoEnviado || bl.expirada || !App.pode('mensagens.editar'), acao: () => TelaMensagens.editar(bl, ids, op) },
      { rotulo: umGrupo ? 'Voltar para pendente' : 'Voltar tudo para pendente', icone: 'voltar', oculto: !bl.enviados,
        acao: () => marcar(bl.ids, false, null, 'Voltou para pendente.') }
    ]);

    // Expirada: uma linha com o motivo e "Já enviei" (para quem enviou e não marcou).
    let expirada = null;
    if (bl.expirada) {
      const ja = h('button.btn.pequeno.discreto', { type: 'button', title: 'Marcar como enviada',
        'aria-label': umGrupo ? 'Já enviei: marcar como enviada' : 'Já enviei: marcar como enviada nos ' + pendentes.length + ' grupos',
        onclick: () => marcar(ids, true, ja, umGrupo ? 'Marcada como enviada.' : 'Marcadas como enviadas.') }, icone('ok'), 'Já enviei');
      expirada = h('.acoes.entre', h('p.suave.pequeno', { style: { margin: 0, flex: '1 1 200px' } }, bl.motivoExpirada + ' Não precisa enviar.'), ja);
    }

    return h('article.cartao.mensagem' + (bl.atrasado ? '.atrasada' : '') + (bl.expirada ? '.enviada.expirada' : tudoEnviado ? '.enviada' : ''),
      h('.cabeca',
        h('.titulo', h('div', h('span.hora-msg.num', F.horaMin(bl.previsto)), ' ', h('strong', bl.momento)),
          h('.sub', [op.mostrarCampanha ? bl.campanhaNome : null, bl.dinamicaNome, TelaMensagens.nomesDosGrupos(bl.envios)].filter(Boolean).join(' · '))),
        menu),
      chips.length ? h('.chips', chips) : null,
      expirada,
      recolhida ? h('details.recolher', h('summary', 'Ver a mensagem'), corpo) : corpo);
  },

  editar(bl, ids, op) {
    const texto = Comp.campo({ rotulo: 'Texto da mensagem', nome: 'texto', tipo: 'textarea', linhas: 12, valor: bl.texto,
      dica: 'Vale para ' + F.plural(ids.length, 'grupo pendente', 'grupos pendentes') + (bl.mesmoTexto ? '' : ', cada um com o próprio link') +
        '. O rodapé com a autorização volta sozinho se for apagado.' });
    const erro = h('div');
    const salvar = h('button.btn.primario', { type: 'button' }, 'Salvar texto');
    const f = Comp.folha({ titulo: 'Editar · ' + bl.momento, corpo: [erro, texto], larga: true,
      rodape: [h('button.btn', { type: 'button', onclick: () => f.fechar() }, 'Voltar'), salvar] });
    salvar.addEventListener('click', async () => {
      const r = await App.executar('mensagens.editar', { ids: ids, texto: texto.querySelector('textarea').value, original: bl.texto },
        { botao: salvar, erroEm: erro, sucesso: 'Texto salvo.' });
      if (r) { f.fechar(); op.aoMudar(); }
    });
  },

  /** Ações da campanha (cockpit): mensagem de entrega do prêmio. */
  rodape(op, d, carregar) {
    if (!op.campanha || !App.pode('mensagens.gerarEntrega')) return null;
    const c = App.campanha(op.campanha);
    if (!c || !c.sorteio || lerData(c.sorteio) > App.agora()) return null;
    const b = h('button.btn', { type: 'button', onclick: async () => {
      const r = await App.executar('mensagens.gerarEntrega', { campanha: op.campanha }, { botao: b, sucesso: 'Mensagem de entrega gerada para o próximo horário de envio.' });
      if (r) carregar();
    } }, icone('festa'), 'Gerar mensagem de entrega do prêmio');
    return h('.cartao', h('h2', 'Depois do sorteio'), h('p.suave', 'Prova de entrega com chamada para a próxima campanha, na comunidade.'), b);
  }
};
</script>
  <script>
/* =====================================================================
   Caixa: resultado, dívida da Indião com a Prime, aportes, posição por
   campanha e o Livro caixa (filtros, detalhe e ações de cada lançamento).
   Distribuição: divide o resultado de uma campanha entre as partes,
   guarda versões, registra o pagamento e gera o PDF para a Prime.
   ===================================================================== */

App.telas.caixa = {
  area: 'caixa',
  titulo: 'Caixa',
  pode: () => App.pode('caixa.resumo'),
  render(ctx) { return TelaCaixa.render(ctx); }
};

const TelaCaixa = {
  FILTROS: [['', 'Todos'], ['entradas', 'Entradas'], ['saidas', 'Saídas'], ['partes', 'Entre as partes'],
    ['comprometidos', 'A pagar'], ['semComprovante', 'Sem comprovante']],
  /** Lançamentos feitos que aparecem de cada vez no Livro caixa (o resto vem em "Mostrar mais"). */
  POR_PAGINA: 40,
  MESES: ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'],

  /** Tira as chaves vazias (o servidor trata ausente e vazio do mesmo jeito, e o cache fica estável). */
  semVazios(o) {
    const r = {};
    Object.keys(o || {}).forEach((k) => { if (o[k] !== undefined && o[k] !== null && o[k] !== '') r[k] = o[k]; });
    return r;
  },

  /** "Indião da Sorte Ltda" -> "Indião"; "Prime (sócio)" -> "Prime". */
  curto(nome) { return String(nome || '').split(/[\s(]/)[0] || String(nome || ''); },

  nomeCampanha(id) { const c = App.campanha(id); return c ? c.nome : (id || ''); },
  /** Forma do abatimento como se lê (a planilha guarda o nome da lista dela). */
  rotuloForma(f) { return (App.sessao.listas.rotulosAbatimento || {})[f] || f; },

  paramsLista(campanha, estado) {
    const f = {
      entradas: { tipo: 'Entradas' }, saidas: { tipo: 'Saídas' }, partes: { tipo: 'Partes' },
      comprometidos: { status: 'Comprometido' }, semComprovante: { semComprovante: true }
    }[estado.filtro] || {};
    return TelaCaixa.semVazios(Object.assign({ campanha: campanha, busca: estado.busca, limite: estado.limite }, f));
  },

  async render(ctx) {
    const campanha = ctx.query.campanha || '';
    const estado = {
      filtro: TelaCaixa.FILTROS.some((f) => f[0] === ctx.query.filtro) ? ctx.query.filtro : '',
      busca: '', limite: 200, mostrar: TelaCaixa.POR_PAGINA
    };
    const [d, lista] = await Promise.all([
      App.ler('caixa.resumo', TelaCaixa.semVazios({ campanha: campanha })),
      App.ler('caixa.listar', TelaCaixa.paramsLista(campanha, estado))
    ]);
    if (!ctx.ativo()) return;
    const op = { campanha: campanha, aoMudar: () => ctx.recarregar() };
    const acoes = [];
    if (App.pode('caixa.lancar')) {
      acoes.push(h('button.btn.primario', { type: 'button', onclick: () => TelaCaixa.escolher(d, op) }, icone('mais'), 'Novo lançamento'));
    }
    // Sem subtítulo: o seletor logo abaixo já diz de qual campanha (ou de todas) é o caixa.
    ctx.topo({ titulo: 'Caixa', acoes: acoes });

    const livro = TelaCaixa.livro(campanha, estado, lista, op);
    const p = d.pendencias || {};
    const linhaCamp = campanha ? (d.porCampanha || []).filter((x) => x.campanha === campanha)[0] : null;
    // Os indicadores com pendência abrem o Livro caixa já filtrado.
    const abrirLivro = (filtro) => () => { livro.filtrar(filtro); livro.el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    // Quem não anexa (sócio) só vê a lista: o convite para anexar é de quem pode.
    const podeAnexar = App.pode('caixa.anexarComprovante');
    const nPagar = p.comprometidos || 0;
    const kpis = h('.kpis',
      Comp.kpi(campanha ? 'Resultado da campanha' : 'Resultado acumulado', F.moeda(d.resultado, { compacto: true }), 'pago e recebido até hoje', F.cls(d.resultado)),
      TelaCaixa.kpiLink(Comp.kpi('A pagar', F.moeda(p.valorComprometido || 0, { compacto: true }),
        nPagar ? 'ver ' + (nPagar === 1 ? 'o lançamento' : 'os ' + F.int(nPagar) + ' lançamentos') : 'nada a pagar'),
        nPagar ? abrirLivro('comprometidos') : null, 'Ver o que ainda falta pagar'),
      TelaCaixa.kpiLink(Comp.kpi('Sem comprovante', F.int(p.semComprovante || 0),
        p.semComprovante ? (podeAnexar ? 'ver a lista para anexar' : 'ver a lista') : 'tudo anexado', p.semComprovante ? 'neg' : ''),
        p.semComprovante ? abrirLivro('semComprovante') : null, 'Ver os pagamentos sem comprovante'),
      linhaCamp ? TelaCaixa.kpiAcertoCampanha(linhaCamp, d) : null);

    const cartaoAportes = d.aportes ? TelaCaixa.cartaoAportes(d, op) : null;
    ctx.mostrar([
      Comp.seletorCampanha(campanha, (v) => App.ir('caixa' + (v ? '?campanha=' + encodeURIComponent(v) : ''), { substituir: true }), { todas: 'Todas as campanhas' }),
      kpis,
      campanha ? null : TelaCaixa.cartaoAcerto(d),
      h('.colunas' + (cartaoAportes ? '.duas' : ''), { style: { alignItems: 'start' } }, TelaCaixa.cartaoDivida(d, op), cartaoAportes),
      livro.el
    ]);
  },

  /** Indicador que abre uma lista: com ação, vira um botão com cara de link (toque, Enter ou espaço). */
  kpiLink(el, acao, titulo) {
    if (!acao) return el;
    el.classList.add('clicavel');
    Object.assign(el, { tabIndex: 0, title: titulo });
    el.setAttribute('role', 'button');
    el.addEventListener('click', acao);
    el.addEventListener('keydown', chaveTecla(acao));
    return el;
  },

  // ----- cartões do resumo -----
  /** Soma das posições de todas as campanhas (cada uma já em centavos): quanto uma parte pagaria à outra se o acerto fosse hoje. */
  acertoHoje(d) { return Math.round((d.porCampanha || []).reduce((t, x) => t + (Number(x.saldoIndiao) || 0), 0) * 100) / 100; },

  /** "Hilux dos Sonhos" -> "na Hilux dos Sonhos"; com mais de uma, "nas campanhas Ranger XLS e Hilux dos Sonhos". */
  ondeCampanhas(lista, prep) {
    const nomes = lista.map((x) => x.nome).join(', ').replace(/, ([^,]*)$/, ' e $1');
    return (lista.length > 1 ? prep + 's campanhas ' : prep + ' ') + nomes;
  },

  /** Acerto de uma campanha só (Caixa filtrado): em reais, com quem deve a quem. */
  kpiAcertoCampanha(x, d) {
    const ind = TelaCaixa.curto(d.partes.indiao), pri = TelaCaixa.curto(d.partes.prime);
    const v = Number(x.saldoIndiao) || 0;
    const parcial = x.status !== 'Encerrada';
    if (Math.abs(v) < 0.005) return Comp.kpi('Acerto nesta campanha', 'Em dia', 'nenhuma parte deve à outra');
    return Comp.kpi('Acerto nesta campanha', F.moeda(Math.abs(v)),
      (v < 0 ? 'a ' + ind + ' deve à ' + pri : 'a ' + pri + (parcial ? ' teria a repassar à ' : ' deve à ') + ind) + (parcial ? ' hoje (parcial)' : ''),
      v < 0 ? 'neg' : 'pos');
  },

  /** Acerto entre as partes: o total somado numa frase, a suposição por trás dele e a posição de cada campanha. */
  cartaoAcerto(d) {
    const ind = TelaCaixa.curto(d.partes.indiao), pri = TelaCaixa.curto(d.partes.prime);
    const linhas = (d.porCampanha || []).filter((x) => Math.abs(x.resultado) > 0.004 || Math.abs(x.saldoIndiao) > 0.004 || Math.abs(x.saldoPrime) > 0.004);
    if (!linhas.length) return null;
    const total = TelaCaixa.acertoHoje(d);
    const devendo = linhas.filter((x) => x.saldoIndiao < -0.004);
    const credito = linhas.filter((x) => x.saldoIndiao > 0.004);
    const abatidoEm = {};
    ((d.divida || {}).historico || []).forEach((a) => {
      if (a.campanhaDivida && Number(a.valor) > 0) abatidoEm[a.campanhaDivida] = (abatidoEm[a.campanhaDivida] || 0) + Number(a.valor);
    });
    const quem = (v) => Math.abs(v) < 0.005 ? null : v < 0 ? 'a ' + ind + ' deve ' + F.moeda(-v) + ' à ' + pri : 'a ' + pri + ' deve ' + F.moeda(v) + ' à ' + ind;
    let abertura = linhas.length > 1 ? 'Somando tudo, hoje: ' : 'Hoje: ', frase = quem(total) || 'nenhuma parte deve à outra', classe = F.cls(total) || 'x';
    // Dívida de um lado e crédito do outro: a frase principal é a dívida de verdade (a mesma do abatimento); o total
    // só valeria se o crédito abatesse a dívida, o que o app não faz sozinho.
    let suposicao = null;
    if (devendo.length && credito.length) {
      const somaDivida = -devendo.reduce((t, x) => t + x.saldoIndiao, 0);
      const somaCredito = credito.reduce((t, x) => t + x.saldoIndiao, 0);
      const parcial = credito.some((x) => x.status !== 'Encerrada');
      abertura = 'Hoje: ';
      frase = 'a ' + ind + ' deve ' + F.moeda(somaDivida) + ' à ' + pri + ' (dívida ' + TelaCaixa.ondeCampanhas(devendo, 'da') + ')';
      classe = 'neg';
      const onde = TelaCaixa.ondeCampanhas(credito, 'na');
      suposicao = onde.charAt(0).toUpperCase() + onde.slice(1) + ', a ' + pri + (parcial ? ' teria ' : ' tem ') + F.moeda(somaCredito) +
        ' a repassar à ' + ind + '. Se esse valor abatesse a dívida, ' +
        (Math.abs(total) < 0.005 ? 'as partes ficariam quites' : total < 0 ? 'a ' + ind + ' ficaria devendo ' + F.moeda(-total)
          : 'a ' + pri + ' ficaria devendo ' + F.moeda(total) + ' à ' + ind) +
        '. Nada é abatido automaticamente: o abatimento é decidido campanha a campanha.';
    }
    const acerto = (x) => {
      const v = x.saldoIndiao;
      if (Math.abs(v) < 0.005) return h('span.suave', 'Em dia');
      const parcial = x.status !== 'Encerrada';
      const nota = parcial ? 'parcial: muda até o encerramento' : v < 0 ? (abatidoEm[x.campanha] ? 'falta abater' : 'dívida ainda não abatida') : 'falta o repasse';
      return h('div', h('span.num.' + (v < 0 ? 'neg' : 'pos'),
        v < 0 ? 'a ' + ind + ' deve ' + F.moeda(-v) : 'a ' + pri + (parcial ? ' teria ' + F.moeda(v) + ' a repassar' : ' deve ' + F.moeda(v))),
        h('div.suave.pequeno', nota));
    };
    const podeDistribuir = App.pode('distribuicao.simular');
    const rota = (x) => 'distribuicao/' + encodeURIComponent(x.campanha);
    return h('.cartao',
      h('h2', 'Acerto entre as partes'),
      h('p', { style: { fontSize: '1.12rem', lineHeight: '1.35' } }, abertura, h('strong.' + classe, frase), '.'),
      suposicao ? h('p.suave.pequeno', { style: { marginTop: '6px' } }, suposicao) : null,
      Comp.tabela([
        { titulo: 'Campanha', valor: (x) => [x.nome, h('div.suave.pequeno', String(x.status || '').toLowerCase(),
          podeDistribuir ? [' · ', h('a.pequeno', { href: '#' + rota(x), onclick: App.cliqueNav(rota(x)) }, 'ver a distribuição')] : null)] },
        { titulo: 'Resultado', dir: true, valor: (x) => h('div', h('span.num.' + (F.cls(x.resultado) || 'x'), F.moeda(x.resultado)),
          x.aPagar > 0.004 && x.status !== 'Encerrada' ? h('div.suave.pequeno', 'sem contar ' + F.moeda(x.aPagar) + ' ainda a\u00a0pagar') : null) },
        { titulo: 'Acerto', dir: true, valor: acerto }
      ], linhas),
      h('p.suave.pequeno', 'Resultado: o que já foi pago e recebido. Acerto: quanto uma parte deve à outra, contando a parte de cada uma no resultado e o que cada uma já pagou ou recebeu.'));
  },

  cartaoDivida(d, op) {
    const dv = d.divida;
    const ind = TelaCaixa.curto(d.partes.indiao), pri = TelaCaixa.curto(d.partes.prime);
    const total = (dv.valor || 0) + (dv.abatido || 0);
    if (total < 0.005) {
      return h('.cartao', h('h2', 'Dívida entre as partes'),
        h('p.suave', { style: { margin: 0 } }, 'A ' + ind + ' não deve nada à ' + pri + '.'));
    }
    const botao = App.pode('caixa.abatimento') && dv.valor > 0.004
      ? h('button.btn.pequeno.primario', { type: 'button', onclick: () => TelaCaixa.abatimento(d, op) }, 'Registrar abatimento') : null;
    const hist = dv.historico || [];
    const historico = hist.length > 1 ? h('details.ajustes',
      h('summary', 'Histórico de abatimentos (' + (hist.length - 1) + ')'),
      h('div', { style: { marginTop: '10px' } }, Comp.tabela([
        { titulo: 'Data', valor: (a) => a.data ? F.data(a.data) : 'Início' },
        { titulo: 'Forma', valor: (a) => [TelaCaixa.rotuloForma(a.forma), a.campanhaOrigem ? h('div.suave.pequeno', 'crédito de ' + TelaCaixa.nomeCampanha(a.campanhaOrigem)) : null,
          a.comprovante ? h('div', h('a.pequeno', { href: a.comprovante, target: '_blank', rel: 'noopener' }, 'comprovante')) : null] },
        { titulo: 'Valor', dir: true, valor: (a) => F.vazio(a.valor) ? '' : h('span.num', F.moeda(a.valor)) },
        { titulo: 'Saldo devedor', dir: true, valor: (a) => h('span.num.forte', F.moeda(a.saldo)) }
      ], hist))) : null;
    // Título com a campanha de onde vem a dívida; com mais de uma, o nome geral.
    const devendo = (d.porCampanha || []).filter((x) => x.saldoIndiao < -0.004);
    const origem = devendo.length === 1 ? devendo[0] : null;
    const nadaAbatido = !(dv.abatido > 0.004);
    const titulo = (origem ? 'Dívida da ' + origem.nome : 'Dívida da ' + ind + ' com a ' + pri) + (nadaAbatido ? ' (ainda não abatida)' : '');
    let porque = '';
    if (origem && origem.status !== 'Encerrada') porque = 'A ' + origem.nome + ' ainda está no ar: o valor muda até o encerramento. ';
    else if (origem && origem.resultado < -0.004) {
      porque = 'É a parte da ' + ind + ' (' + F.pct(origem.pctIndiao) + ') no prejuízo da ' + origem.nome +
        (Number(origem.fluxoIndiao) > -0.005 ? ', que a ' + pri + ' cobriu' : '') + '. ';
    } else if (devendo.length > 1) porque = 'Vem ' + TelaCaixa.ondeCampanhas(devendo, 'da') + '. ';
    return h('.cartao',
      h('h2', titulo),
      h('.valor-grande.num' + (dv.valor > 0.004 ? '.neg' : '.pos'), F.moeda(dv.valor)),
      // Sem abatimento, o título já diz "(ainda não abatida)": nada a repetir embaixo do valor.
      nadaAbatido ? null : [
        Comp.progresso({ valor: dv.pctPago, cor: 'verde', rotulo: 'Parte da dívida já abatida' }),
        h('.legenda-progresso', h('span', F.moeda(dv.abatido) + ' abatido de ' + F.moeda(total)), h('span', F.pct(dv.pctPago, 0) + ' abatido'))],
      h('p.suave.pequeno', { style: { margin: 0 } }, porque + 'O abatimento é decidido campanha a campanha: nada é descontado automaticamente.'),
      botao ? h('.acoes', botao) : null,
      historico);
  },

  cartaoAportes(d, op) {
    const a = d.aportes;
    const c = App.campanha(a.campanha);
    const ind = TelaCaixa.curto(d.partes.indiao), pri = TelaCaixa.curto(d.partes.prime);
    const linhas = a.partes.map((x) => Object.assign({ curto: TelaCaixa.curto(x.parte) }, x));
    const posicao = (d.porCampanha || []).filter((x) => x.campanha === a.campanha)[0];
    // Quem pagou menos que a sua parte dos custos teve a diferença adiantada pela outra; o acerto da campanha já conta isso.
    const notas = [];
    linhas.filter((x) => x.diferenca < -1).forEach((x) => {
      const outra = linhas.filter((y) => y !== x && y.diferenca > 1)[0];
      notas.push(outra
        ? 'A ' + outra.curto + ' adiantou ' + F.moeda(-x.diferenca) + ' da parte da ' + x.curto + ' nos custos. Isso já entra no acerto: o aporte é opcional.'
        : 'Faltam ' + F.moeda(-x.diferenca) + ' da parte da ' + x.curto + ' nos custos. Isso já entra no acerto: o aporte é opcional.');
    });
    // Quem recebe as vendas fica com o dinheiro até o acerto: é por isso que o acerto pode sair a favor de quem aportou.
    const comVendas = linhas.filter((x) => Number(x.vendasRecebidas) > 0.004);
    if (comVendas.length === 1) {
      const v = comVendas[0];
      const favorecida = v.parte === d.partes.prime ? (posicao && posicao.saldoIndiao > 0.004 ? ind : null)
        : (posicao && posicao.saldoIndiao < -0.004 ? pri : null);
      notas.push('A ' + v.curto + ' está com as vendas recebidas (' + F.moeda(v.vendasRecebidas, { semCentavos: true }) + ')' +
        (favorecida ? '; por isso o acerto desta campanha é a favor da ' + favorecida : '') + '.');
    }
    return h('.cartao',
      h('.cabeca', h('.titulo', h('h2', 'Aportes'), h('.sub', a.nome + (c ? ' · ' + c.status.toLowerCase() : '')))),
      h('p.suave.pequeno', { style: { marginBottom: 0 } }, 'Custos de ' + F.moeda(a.necessidade, { semCentavos: true }) + ' pelo orçamento (sem a plataforma e as comissões, que saem das vendas) e ' +
        F.moeda(a.custosPagos, { semCentavos: true }) + ' já pagos. Cada parte banca a sua porcentagem; quem bancou a mais recebe a diferença de volta no acerto, no fim da apuração.'),
      h('.tabela-rolagem', h('table.tabela.aportes',
        h('thead', h('tr', h('th', h('span.so-leitor', 'Valor')), linhas.map((x) => h('th.d', x.curto + ' · ' + F.pct(x.pctAporte, 0))))),
        h('tbody',
          [['Parte no orçamento', 'devidoPeloOrcamento'], ['Parte nos custos já pagos', 'esperadoPelosCustosPagos'], ['Pagou dos custos', 'aportado']].map((r) =>
            h('tr', h('td', r[0]), linhas.map((x) => h('td.d.num', F.moeda(x[r[1]], { semCentavos: true }))))),
          h('tr.total', h('td', 'Diferença'), linhas.map((x) => h('td.d.num.forte.' + (Math.abs(x.diferenca) < 1 ? 'x' : x.diferenca < 0 ? 'neg' : 'pos'),
            Math.abs(x.diferenca) < 1 ? 'em dia' : F.moeda(x.diferenca, { semCentavos: true, sinal: true }))))))),
      notas.length ? Comp.aviso('info', notas.join(' ')) : null,
      App.pode('caixa.aporte') ? h('.acoes', h('button.btn.pequeno', { type: 'button', onclick: () => TelaCaixa.aporte(d, Object.assign({}, op, { campanha: a.campanha })) },
        icone('mais'), 'Registrar aporte')) : null);
  },

  // ----- Livro caixa -----
  /** "outubro de 2026" */
  mes(v) { const d = lerData(v); return d ? TelaCaixa.MESES[d.getMonth()] + ' de ' + d.getFullYear() : 'Sem data'; },

  livro(campanha, estado, inicial, op) {
    const corpo = h('div');
    const total = h('span.suave.pequeno');
    const filtros = h('.filtros.quebra', { role: 'group', 'aria-label': 'Filtrar lançamentos' });
    const busca = h('input', { type: 'search', placeholder: 'Buscar lançamento', 'aria-label': 'Buscar lançamentos', autocomplete: 'off' });
    let versao = 0, espera = null, atual = null;

    const desenharFiltros = () => trocar(filtros, TelaCaixa.FILTROS.map((f) => h('button.filtro', {
      type: 'button', 'aria-pressed': String(estado.filtro === f[0]),
      onclick: () => filtrar(f[0])
    }, f[1])));

    const vazio = () => {
      if (estado.busca) return Comp.vazio('Nada encontrado', 'Nenhum lançamento com "' + estado.busca + '".');
      return {
        semComprovante: Comp.vazio('Tudo com comprovante', 'Todos os pagamentos têm comprovante anexado.'),
        comprometidos: Comp.vazio('Nada a pagar', 'Não há lançamentos comprometidos.'),
        partes: Comp.vazio('Nenhuma transferência', 'Abatimentos, aportes e repasses entre as partes aparecem aqui.')
      }[estado.filtro] || Comp.vazio('Nenhum lançamento', 'Os lançamentos automáticos de vendas e taxas aparecem quando o relatório do portal é enviado.');
    };

    const carregar = async (dados) => {
      const minha = ++versao;
      let r = dados;
      if (!r) {
        corpo.style.opacity = '.55';
        try {
          r = await App.ler('caixa.listar', TelaCaixa.paramsLista(campanha, estado));
        } catch (e) {
          if (minha === versao) { corpo.style.opacity = ''; trocar(corpo, Comp.falha(e, () => carregar())); }
          return;
        }
        if (minha !== versao) return;
        corpo.style.opacity = '';
      }
      atual = r;
      desenhar();
    };

    // Primeiro o que já foi pago e recebido, por mês, do mais novo para o mais antigo. O que ainda vai ser pago
    // (contas e reservas de prêmio) fica num grupo no fim, do mais próximo para o mais distante.
    const desenhar = () => {
      const r = atual;
      desenharFiltros();
      total.textContent = r.total ? F.plural(r.total, 'lançamento', 'lançamentos') : '';
      if (!r.linhas.length) { trocar(corpo, vazio()); return; }
      const porData = (a, b) => (lerData(a.data) || 0) - (lerData(b.data) || 0);
      const aPagar = r.linhas.filter((l) => l.status === 'Comprometido').sort(porData);
      const feitos = r.linhas.filter((l) => l.status !== 'Comprometido');
      const visiveis = feitos.slice(0, estado.mostrar);
      const restantes = (r.total - r.linhas.length) + (feitos.length - visiveis.length);
      const mais = restantes > 0 ? h('.acoes', { style: { justifyContent: 'center', marginTop: '12px' } },
        h('button.btn', { type: 'button', onclick: (ev) => {
          estado.mostrar += TelaCaixa.POR_PAGINA;
          if (estado.mostrar <= feitos.length || r.total <= r.linhas.length) { desenhar(); return; }
          ev.currentTarget.classList.add('carregando');
          estado.limite += 200;
          carregar();
        } }, 'Mostrar mais (' + F.int(restantes) + ')')) : null;
      // Só contas a pagar e reservas (filtro "A pagar", ou a busca só achou essas): lista simples, da mais próxima à mais distante.
      if (!feitos.length) { trocar(corpo, [h('ul.lista.dentro.livro', aPagar.map((l) => TelaCaixa.linha(l, op))), mais]); return; }
      const itens = [];
      let mes = null;
      visiveis.forEach((l) => {
        const m = TelaCaixa.mes(l.data);
        if (m !== mes) { mes = m; itens.push(h('li.mes', m)); }
        itens.push(TelaCaixa.linha(l, op, { dataCurta: true }));
      });
      let grupo = null;
      if (aPagar.length) {
        const hoje = App.hoje();
        const aPagarValor = aPagar.reduce((t, l) => t + (l.tipo === 'Saída' ? Number(l.valor) || 0 : 0), 0);
        const passou = (l) => !!lerData(l.data) && lerData(l.data) < hoje;
        const reserva = (l) => /^dinamica:/.test(l.origem || '');
        const vencidos = aPagar.filter((l) => !reserva(l) && passou(l)).length;
        // Prêmio e IR de uma dinâmica são duas reservas, mas um prêmio só a lançar.
        const aLancar = Object.keys(aPagar.filter((l) => reserva(l) && passou(l)).reduce((o, l) => {
          o[l.dinamica || l.origem.split(':')[1]] = true;
          return o;
        }, {})).length;
        grupo = h('details.grupo-livro',
          h('summary', 'A pagar e reservas', h('span.suave', ' · ' + F.plural(aPagar.length, 'lançamento', 'lançamentos') +
            (aPagarValor > 0.004 ? ' · ' + F.moeda(aPagarValor) : '') + (vencidos ? ' · ' + F.plural(vencidos, 'vencido', 'vencidos') : '') +
            (aLancar ? ' · ' + F.plural(aLancar, 'prêmio a lançar', 'prêmios a lançar') : ''))),
          h('ul.lista.dentro.livro', aPagar.map((l) => TelaCaixa.linha(l, op))));
        grupo.open = !!estado.aPagarAberto;
        grupo.addEventListener('toggle', () => { estado.aPagarAberto = grupo.open; });
      }
      trocar(corpo, [h('ul.lista.dentro.livro', itens), mais, grupo]);
    };

    const filtrar = (filtro) => { estado.filtro = filtro; estado.limite = 200; estado.mostrar = TelaCaixa.POR_PAGINA; carregar(); };

    busca.addEventListener('input', () => {
      clearTimeout(espera);
      espera = setTimeout(() => {
        const q = busca.value.trim();
        if (q === estado.busca) return;
        estado.busca = q;
        estado.limite = 200;
        estado.mostrar = TelaCaixa.POR_PAGINA;
        carregar();
      }, 350);
    });

    const el = h('section.cartao',
      h('.cabeca', h('h2', 'Livro caixa'), total),
      filtros,
      h('.campo', busca),
      corpo);
    carregar(inicial);
    return { el: el, filtrar: filtrar };
  },

  /** Uma linha do Livro caixa. extra.dataCurta: dentro de um mês (o ano já está no cabeçalho do mês). */
  linha(l, op, extra) {
    extra = extra || {};
    const transferencia = !!l.para;
    const comprometido = l.status === 'Comprometido';
    const reserva = /^dinamica:/.test(l.origem || '');
    const data = lerData(l.data);
    const passou = !!data && data < App.hoje();
    const chips = [];
    if (comprometido) {
      // Reserva de uma dinâmica que já passou não fica parada como futura: falta lançar o prêmio.
      if (reserva) chips.push(h('span.chip.' + (passou ? 'vermelho' : 'amarelo'), passou ? 'Prêmio a lançar' : 'Reserva de dinâmica'));
      else chips.push(h('span.chip.' + (passou ? 'vermelho' : 'amarelo'), passou ? 'Vencido' : l.tipo === 'Entrada' ? 'A receber' : 'A pagar'));
    }
    if (l.semComprovante) chips.push(h('span.chip.amarelo', 'Sem comprovante'));
    // "Automático" só serve a quem edita os lançamentos (o gestor); para o sócio é rótulo interno.
    if (l.classe === 'automatico') { if (App.ehGestor()) chips.push(h('span.chip', 'Automático')); }
    else if (l.classe === 'distribuicao') chips.push(h('span.chip.azul', 'Distribuição'));
    else if (l.classe === 'compensacao') chips.push(h('span.chip.roxo', 'Compensação'));
    // A Prime opera e paga quase tudo: só o que a Indião pagou ou recebeu ganha marca (é o que vira aporte dela).
    const partes = App.sessao.partes || {};
    if (l.divisao) chips.push(h('span.chip.azul', 'Pago pelas duas · parte da ' + TelaCaixa.curto(l.parte)));
    else if (!transferencia && l.classe !== 'distribuicao' && l.classe !== 'compensacao' && partes.indiao && l.parte === partes.indiao) {
      chips.push(h('span.chip.azul', (l.tipo === 'Entrada' ? 'Recebido pela ' : 'Pago pela ') + TelaCaixa.curto(partes.indiao)));
    }
    const detalhe = [
      extra.dataCurta ? F.dataCurta(l.data) : F.data(l.data),
      transferencia ? l.tipo + ': ' + TelaCaixa.curto(l.parte) + ' → ' + TelaCaixa.curto(l.para) : l.categoria,
      op.campanha ? null : TelaCaixa.nomeCampanha(l.campanha)
    ].filter(Boolean).join(' · ');
    const valor = transferencia ? F.moeda(l.valor) : F.moeda(l.efeito, { sinal: true });
    const classe = transferencia ? 'x' : l.tipo === 'Entrada' ? 'pos' : 'neg';
    // Transferência entre as partes não mexe no saldo do livro: o dinheiro só troca de mão (e entra no acerto).
    const saldo = transferencia ? h('span.suave.pequeno', { title: 'Transferência entre as partes: entra no acerto, não no saldo' }, 'não muda o saldo')
      : F.vazio(l.saldo) ? null : h('span.suave.pequeno.num', { title: 'Saldo do livro depois deste lançamento' }, 'saldo ' + F.moeda(l.saldo));
    const abrir = () => TelaCaixa.detalhe(l, op);
    return h('li.clicavel' + (comprometido ? '.comprometido' : ''), {
      role: 'button', tabindex: '0', onclick: abrir,
      onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } }
    },
      h('.principal', h('.t', l.descricao || l.categoria), h('.d', detalhe), chips.length ? h('.chips', { style: { marginTop: '6px' } }, chips) : null),
      h('.lado', h('span.num.forte.' + classe, valor), saldo));
  },

  detalhe(l, op) {
    const gestor = App.ehGestor();
    const transferencia = !!l.para;
    const reserva = /^dinamica:/.test(l.origem || '');
    const comprometido = l.status === 'Comprometido';
    const passou = !!lerData(l.data) && lerData(l.data) < App.hoje();
    // Sem códigos internos para quem só acompanha; o código do lançamento fica para o gestor achar a linha na planilha.
    const linhas = [
      ['Data', F.data(l.data)],
      ['Campanha', TelaCaixa.nomeCampanha(l.campanha)],
      ['Tipo', l.tipo],
      transferencia ? null : ['Categoria', l.categoria],
      l.divisao ? ['Custo inteiro', F.moeda(l.divisao.total)] : null,
      [l.divisao ? 'Parte da ' + TelaCaixa.curto(l.parte) : 'Valor', F.moeda(l.valor)],
      transferencia ? ['De → para', l.parte + ' → ' + l.para]
        : l.divisao ? ['Pago por', [h('div', TelaCaixa.curto(App.sessao.partes.indiao) + ' ' + F.moeda(l.divisao.indiao)),
          h('div', TelaCaixa.curto(App.sessao.partes.prime) + ' ' + F.moeda(l.divisao.prime))]]
          : [l.tipo === 'Entrada' ? 'Recebido por' : 'Pago por', l.parte || '–'],
      l.forma ? ['Forma', TelaCaixa.rotuloForma(l.forma)] : null,
      l.campanhaOrigem ? ['Campanha ligada', TelaCaixa.nomeCampanha(l.campanhaOrigem)] : null,
      ['Situação', comprometido ? (reserva ? 'Reservado' : l.tipo === 'Entrada' ? 'A receber' : 'A pagar') : l.tipo === 'Entrada' ? 'Recebido' : 'Pago'],
      // Os automáticos são gravados como lançados pelo "App" na planilha; na tela, o mesmo nome do chip da lista.
      ['Lançado por', l.lancadoPor === 'App' ? 'Automático' : l.lancadoPor || '–'],
      gestor ? ['Código', l.id] : null
    ].filter(Boolean);
    const premio = /^premio:[^:]+$/.test(l.origem || ''), irPremio = /^premio:.+:ir$/.test(l.origem || '');
    const partes = App.sessao.partes;
    const explicacao = {
      automatico: premio
        ? 'Lançamento automático do prêmio lançado em Prêmios.' + (App.pode('premios.quemPagou') ? ' Para mudar quem pagou, use Quem pagou aqui ou o menu do prêmio na aba Prêmios.' : '')
        : irPremio
          ? 'Lançamento automático: o IR do prêmio fica com a ' + TelaCaixa.curto(partes.prime) + ', que recolhe o DARF, mesmo quando o prêmio foi pago pela ' + TelaCaixa.curto(partes.indiao) + '.'
          : 'Lançamento automático: o app mantém este valor a partir das vendas, dos links, dos prêmios ou das dinâmicas.' + (gestor ? ' Para corrigir, ajuste a origem.' : ''),
      distribuicao: 'Faz parte do pagamento de uma distribuição. Para desfazer, estorne a distribuição.',
      compensacao: 'Abatimento por compensação: tem uma ponta em cada campanha, e as duas mudam juntas.',
      pagamento: 'Pagamento de uma comissão ou de um disparo que estava comprometido.'
    }[l.classe] || (transferencia ? 'Transferência entre as partes: o dinheiro só troca de mão, então o saldo do livro não muda. Entra no acerto da campanha.'
      : l.divisao ? 'Custo pago pelas duas partes: são duas linhas no Livro caixa, uma de cada parte, e esta é a da ' + TelaCaixa.curto(l.parte) +
        '. No acerto, no fim da apuração, cada parte recebe de volta o que pagou; como o custo sai do resultado, cada uma arca com a sua porcentagem dele.' : null);
    const corpo = [
      h('p', { style: { fontSize: '1.05rem', margin: 0 } }, h('strong', l.descricao || l.categoria)),
      h('dl.valores', linhas.map((x) => [h('dt', x[0]), h('dd', x[1])])),
      l.comprovante ? h('a.btn', { href: l.comprovante, target: '_blank', rel: 'noopener' }, icone('externo'), 'Abrir o comprovante') : null,
      explicacao ? Comp.aviso('info', explicacao) : null,
      reserva && comprometido ? Comp.aviso(passou ? 'alerta' : 'info', 'Reserva do prêmio de uma dinâmica: vira pagamento quando o prêmio é lançado em Prêmios.' +
        (passou ? ' A dinâmica já passou: falta lançar o prêmio.' : '')) : null
    ];
    const manual = l.classe !== 'automatico' && l.classe !== 'distribuicao';
    const botoes = [];
    const f = Comp.folha({ titulo: 'Lançamento', corpo: corpo });
    if (App.pode('caixa.excluir') && manual) {
      const b = h('button.btn.perigo', { type: 'button', onclick: async () => {
        const r = await App.executar('caixa.excluir', { id: l.id }, { botao: b, sucesso: 'Lançamento excluído.' });
        if (r) { f.fechar(); op.aoMudar(); }
      } }, icone('lixo'), 'Excluir');
      botoes.push(b);
    }
    if (App.pode('caixa.editar') && manual) {
      botoes.push(h('button.btn', { type: 'button', onclick: () => { f.fechar(); TelaCaixa.editar(l, op); } }, icone('editar'), 'Editar'));
    }
    // Custo lançado à mão e já pago: dividir entre as partes, mudar os valores ou juntar numa parte só.
    if (App.pode('caixa.quemPagou') && l.classe === 'manual' && !transferencia && l.tipo === 'Saída' && !comprometido) {
      botoes.push(h('button.btn', { type: 'button', onclick: () => { f.fechar(); TelaCaixa.quemPagou(l, op); } }, icone('usuario'), 'Quem pagou'));
    }
    // Prêmio lançado em Prêmios (3.3.1): quem pagou também muda daqui, sem ir à aba Prêmios.
    if (App.pode('premios.quemPagou') && premio) {
      botoes.push(h('button.btn', { type: 'button', onclick: () => { f.fechar(); TelaCaixa.quemPagouPremio(l, op); } }, icone('usuario'), 'Quem pagou'));
    }
    if (App.pode('caixa.anexarComprovante') && !l.comprovante && l.classe !== 'automatico' && !(comprometido && l.tipo !== 'Entrada')) {
      botoes.push(h('button.btn' + (l.semComprovante ? '.primario' : ''), { type: 'button', onclick: () => { f.fechar(); TelaCaixa.anexar(l, op); } }, icone('upload'), 'Anexar comprovante'));
    }
    if (App.pode('caixa.pagar') && comprometido && !reserva) {
      botoes.push(h('button.btn.primario', { type: 'button', onclick: () => { f.fechar(); TelaCaixa.pagar(l, op); } }, icone('ok'), l.tipo === 'Entrada' ? 'Recebido' : 'Pagar'));
    }
    f.mostrar(corpo, botoes);
  },

  // ----- peças dos formulários -----
  campoCampanha(valor, op) {
    op = op || {};
